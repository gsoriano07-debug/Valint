    opexKeys.forEach(k => { rows += row(`<span class="muted">${ctx.esc(ctx.OPEX_LABELS[k] || k)}</span>`, y => ctx.num(y.opex[k])); });
    rows += row('Total operating expenses', y => y.opexTotal);
    rows += row('Operating income', y => y.opIncome, 'cell-main');
    rows += row('Operating margin', y => `<span class="${y.opMargin < 0 ? 'neg' : ''}">${ctx.fmtPct(y.opMargin)}</span>`);
    rows += row('End locations', y => locs(y.endLocations));
    rows += row('End ARR', y => ctx.fmtMoney(y.endArr), 'cell-main');

    const checks = [['revenue', 'Revenue', 'revenue', 'money'], ['opIncome', 'Operating income', 'opIncome', 'money'], ['locations', 'End locations', 'endLocations', 'locs'], ['arr', 'End ARR', 'endArr', 'money']];
    const anyDoc = docs.some(Boolean);
    let note = '';
    if (anyDoc) {
      rows += `<tr><th colspan="${summary.length + 1}" style="padding-top:16px">Plan doc check</th></tr>`;
      let maxClose = null, maxOp = null;
      checks.forEach(([dk, label, mk, kind]) => {
        if (!docs.some(d => d && d[dk] != null)) return;
        rows += `<tr><td>${label} · plan doc</td>${summary.map((y, i) => {
          const d = docs[i];
          if (!d || d[dk] == null) return '<td class="num">—</td>';
          const diff = pctDiff(y[mk], d[dk]);
          if (diff != null) {
            if (dk === 'opIncome') maxOp = Math.max(maxOp || 0, Math.abs(diff));
            else maxClose = Math.max(maxClose || 0, Math.abs(diff));
          }
          return `<td class="num${tone(d[dk])}">${kind === 'locs' ? locs(d[dk]) : ctx.fmtMoney(d[dk])}<div class="cell-sub">Model ${signedPct(diff)}</div></td>`;
        }).join('')}</tr>`;
      });
      if (maxClose != null || maxOp != null) {
        const closeTxt = maxClose != null ? ` and lands within ${ctx.fmtPct(maxClose)} of its revenue, end locations and end ARR` : '';
        const opTxt = maxOp != null && (maxClose == null || maxOp > maxClose)
          ? `${closeTxt ? ';' : ' and'} operating income moves more (up to ${ctx.fmtPct(maxOp)}) because it is the small amount left after costs`
          : '';
        /* Past 10% the assumptions no longer match the doc's, so say that instead of "lands within". */
        note = maxClose != null && maxClose > 0.1
          ? `<p class="note">With the current assumptions the model ends up to ${ctx.fmtPct(maxClose)} away from the plan doc’s revenue, end locations and end ARR${maxOp != null && maxOp > maxClose ? `, and up to ${ctx.fmtPct(maxOp)} away on operating income` : ''}.</p>`
          : `<p class="note">The model rebuilds the plan doc month by month${closeTxt}${opTxt}.</p>`;
      }
    } else {
      note = `<p class="note">The plan doc has no year-end figures for the ${scenLabel(scenario).toLowerCase()} scenario, so there is nothing to compare against here.</p>`;
    }
    const table = `<div class="table-wrap flat"><table class="compact"><thead><tr><th>${scenLabel(scenario)} model</th>${th}</tr></thead><tbody>${rows}</tbody></table></div>`;
    const toggle = `<button class="btn btn-sm btn-ghost" type="button" data-act="mod" data-mod="forecast" data-a="months" aria-expanded="${showMonths}"${showMonths ? ' aria-controls="forecast-months"' : ''}>${showMonths ? 'Hide months' : `Show all ${model.length} months`}</button>`;
    let monthly = '';
    if (showMonths) {
      const mrows = model.map(r => `<tr><td>${ctx.esc(ctx.monthLabel(r.ym))}</td><td class="num">${locs(r.startLocations, 1)}</td><td class="num">${locs(r.newLocations, 1)}</td><td class="num">${locs(r.churned, 1)}</td><td class="num">${locs(r.locations, 1)}</td><td class="num">${ctx.fmtMoney(r.price)}</td><td class="num">${ctx.fmtMoney(r.mrr)}</td><td class="num">${ctx.fmtMoney(r.revenue)}</td><td class="num">${ctx.fmtMoney(r.cos)}</td><td class="num">${ctx.fmtMoney(r.opexTotal)}</td><td class="num${tone(r.opIncome)}">${ctx.fmtMoney(r.opIncome)}</td></tr>`).join('');
      monthly = `<div class="table-wrap flat" id="forecast-months" style="margin-top:12px"><table class="compact"><thead><tr><th>Month</th><th class="num">Start</th><th class="num">New</th><th class="num">Churned</th><th class="num">End locations</th><th class="num">Price</th><th class="num">MRR</th><th class="num">Revenue</th><th class="num">Cost of service</th><th class="num">Opex</th><th class="num">Operating income</th></tr></thead><tbody>${mrows}</tbody></table></div>`;
    }
    return `<div class="section" id="forecast-pl">${ctx.ui.panel({ title: 'Annual P&L', sub: `${scenLabel(scenario)} model by plan year`, actions: toggle, body: table + note + monthly })}</div>`;
  }

  function planVsActualHtml(model) {
    const ts = targets(), today = ctx.todayStr();
    if (!ts.length) {
      const body = ctx.ui.empty({ title: 'No plan targets yet', text: 'Dated targets from the plan show here next to your actual locations and ARR. Add them on the Assumptions tab.', action: assumptionsBtn(true) });
      return `<div class="section" id="forecast-pva">${ctx.ui.panel({ title: 'Plan vs actual', body })}</div>`;
    }
    const ok = live();
    const nowA = ok ? actualOn(today) : null;
    const byYm = {};
    model.forEach(r => { byYm[r.ym] = r; });
    const rows = ts.map(t => {
      const tl = numOrNull(t.locations), ta = numOrNull(t.arr);
      const past = t.date <= today;
      const a = ok ? (past ? actualOn(t.date) : nowA) : null;
      const m = byYm[ctx.ymOf(t.date)];
      let chip;
      if (!past) chip = ctx.ui.chip('Not yet');
      else if (!a || (tl == null && ta == null)) chip = '—';
      else {
        const hit = (tl == null || a.locations >= tl) && (ta == null || a.arr >= ta);
        chip = ctx.ui.chip(hit ? 'Hit' : 'Missed', hit ? 'good' : 'bad');
      }
      const soFar = past ? '' : '<div class="cell-sub">so far</div>';
      const frac = a ? (tl ? a.locations / tl : ta ? a.arr / ta : null) : null;
      const progTone = past && a ? ((tl == null || a.locations >= tl) && (ta == null || a.arr >= ta) ? 'good' : 'bad') : '';
      const prog = frac == null ? '—' : `${ctx.ui.progress(frac, progTone)}<div class="cell-sub">${ctx.fmtPct(frac, frac < 0.1 ? 1 : 0)} of the ${tl ? 'location' : 'ARR'} target</div>`;
      return `<tr>
        <td><div class="cell-main">${ctx.esc(t.label || 'Target')}</div><div class="cell-sub">${ctx.esc(ctx.fmtDate(t.date))}</div></td>
        <td class="num">${locs(tl)}</td>
        <td class="num">${money(ta)}</td>
        <td class="num">${m ? `${locs(m.locations)}<div class="cell-sub">${compact(m.arr)} ARR</div>` : '—'}</td>
        <td class="num">${a ? locs(a.locations) + soFar : '—'}</td>
        <td class="num">${a ? ctx.fmtMoney(a.arr) + soFar : '—'}</td>
        <td style="min-width:140px">${prog}</td>
        <td>${chip}</td></tr>`;
    }).join('');
    const table = `<div class="table-wrap flat"><table class="compact"><thead><tr><th>Target</th><th class="num">Target locations</th><th class="num">Target ARR</th><th class="num">${scenLabel(scenario)} model</th><th class="num">Actual locations</th><th class="num">Actual ARR</th><th>Progress</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    let note;
    if (!ok) note = '<p class="note">Actual locations and ARR appear when your records load.</p>';
    else if (!ctx.subscriptions().length) note = `<p class="note">No signed customers yet. Actuals start counting when you mark a deal Won on the Pipeline. <button class="btn btn-sm" type="button" data-act="go" data-view="pipeline">Open Pipeline</button></p>`;
    else note = '<p class="note">Past targets use the locations and ARR active on that date. Future targets show your current actuals so far. Targets are the plan doc’s base case.</p>';
    return `<div class="section" id="forecast-pva">${ctx.ui.panel({ title: 'Plan vs actual', sub: 'Plan doc targets against signed subscriptions', body: table + note })}</div>`;
  }

  return {
    id: 'forecast',
    label: 'Forecast',
    group: 'Planning',
    order: 10,
    collections: [],
    render() {
      const years = ctx.planYears();
      const loading = ctx.isLoading();
      const range = years.length ? `${years[0]}–${years[years.length - 1]}` : null;
      const tb = ctx.ui.toolbar({ title: 'Forecast', count: loading ? null : range, filters: segHtml(), exportable: true });
      if (loading) return tb + ctx.ui.empty({ text: 'Loading the plan and your actuals…' });
      const model = ctx.planModel(scenario);
      if (!model.length) {
        return tb + ctx.ui.empty({ title: 'No plan years to model', text: 'The forecast needs a price for at least one plan year. Set prices, new locations per month and churn on the Assumptions tab, and the 3-year model appears here.', action: assumptionsBtn(true) });
      }
      const summary = ctx.planYearSummary(model);
      return tb
        + kpisHtml(summary)
        + assumptionsHtml(years)
        + locationsChartHtml(years)
        + arrChartHtml(model, summary)
        + plHtml(model, summary)
        + planVsActualHtml(model);
    },
    onAction(a, data) {
      if (a === 'scenario') {
        const v = data && data.v;
        if (SCEN.some(s => s[0] === v) && v !== scenario) { scenario = v; ctx.render(); }
      } else if (a === 'months') {
        showMonths = !showMonths;
        ctx.render();
      }
    },
    csv() {
      const model = ctx.planModel(scenario);
      const r2 = v => Math.round(ctx.num(v) * 100) / 100;
      return {
        name: `forecast-${scenario}`,
        rows: [['Month', 'Locations (end of month)', 'New locations', 'Churned locations', 'MRR', 'Revenue', 'Cost of service', 'Operating expenses', 'Operating income']]
          .concat(model.map(r => [r.ym, r2(r.locations), r2(r.newLocations), r2(r.churned), r2(r.mrr), r2(r.revenue), r2(r.cos), r2(r.opexTotal), r2(r.opIncome)]))
      };
    }
  };
});
</script>
<script>
/* ---- tab module: unit ---- */
(window.__dbViews = window.__dbViews || []).push(function (ctx) {
  'use strict';
  /* Unit economics: a per-location calculator seeded from the plan, a check of the plan doc's printed
     results, an LTV:CAC sensitivity grid and the same figures observed in the CRM. */

  /* The plan doc's printed unit-economics results (outputs, not inputs). Used only to check that the plan's
     inputs reproduce them. `half` is half a unit of the doc's printed precision. */
  const DOC_CHECK = {
    2027: { gp: 327, ltv: 10900, ratio: 22.8, payback: 1.5 },
    2028: { gp: 360, ltv: 12000, ratio: 12.7, payback: 2.6 },
    2029: { gp: 382, ltv: 12700, ratio: 12.2, payback: 2.7 }
  };
  const DOC_FIRST = Number(Object.keys(DOC_CHECK)[0]);
  const IN_KEYS = ['price', 'gm', 'churn', 'cac', 'setup'];
  const HEALTHY = 3;        // LTV:CAC rule of thumb
  const PRICE_STEP = 50;    // spacing of the sensitivity grid's price columns, in dollars
  const EXTRA_CHURN = [0.02, 0.05]; // grid rows added around the plan's churn cases
  const MAX_SHOWN = 1e12;   // results this large come only from typos (e.g. CAC 1e-300); shown as "Too large to show"

  const st = { year: null, inputs: null };
  const { esc, num, fmtMoney, fmtPrice, fmtPct, fmtNum, ui } = ctx;
  const x1 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const fmtX = v => x1.format(v) + 'x';
  const fmtMonths = (v, d) => fmtNum(v, d == null ? 1 : d) + (Math.abs(v - 1) < 0.05 ? ' month' : ' months');
  const pctStr = f => String(Math.round(num(f) * 10000) / 100); // 0.82 -> "82", 0.025 -> "2.5"
  const has = v => v != null && v !== '' && isFinite(Number(v));
  const round2 = v => Math.round(v * 100) / 100;

  /* ---------- plan + inputs ---------- */
  function years() { return ctx.planYears(); }
  function curYear() { const ys = years(); if (!ys.length) return null; return ys.indexOf(st.year) >= 0 ? st.year : ys[0]; }
  function planRaw(y) {
    const P = ctx.plan();
    const pick = o => (o && has(o[y]) ? Number(o[y]) : null);
    const cos = pick(P.costOfService);
    return {
      price: pick(P.prices),
      gm: cos == null ? null : 1 - cos,
      churn: P.churn && has(P.churn.base) ? Number(P.churn.base) : null,
      cac: pick(P.cac),
      setup: has(P.setupFee) ? Number(P.setupFee) : null
    };
  }
  function presetStrings(y) {
    const r = planRaw(y);
    return {
      price: r.price == null ? '' : String(r.price),
      gm: r.gm == null ? '' : pctStr(r.gm),
      churn: r.churn == null ? '' : pctStr(r.churn),
      cac: r.cac == null ? '' : String(r.cac),
      setup: r.setup == null ? '' : String(r.setup)
    };
  }
  function inputs() { return st.inputs || presetStrings(curYear()); }
  function parseIn(s) {
    const t = String(s == null ? '' : s).replace(/[$,%\s]/g, '');
    if (!t) return null;
    const n = Number(t);
    return isFinite(n) ? n : null;
  }
  function values() {
    const s = inputs(), v = {};
    IN_KEYS.forEach(k => { v[k] = parseIn(s[k]); });
    if (v.gm != null) v.gm /= 100;
    if (v.churn != null) v.churn /= 100;
    return v;
  }
  function edited() {
    if (!st.inputs) return false;
    const p = presetStrings(curYear());
    return IN_KEYS.some(k => { const a = parseIn(st.inputs[k]), b = parseIn(p[k]); return a == null || b == null ? a !== b : Math.abs(a - b) > 1e-9; });
  }

  /* ---------- math (the doc's formulas) ---------- */
  function retainedMonths(c, n) { let s = 0; for (let m = 0; m < n; m++) s += Math.pow(1 - c, m); return s; }
  function validate(v) {
    const bad = {};
    if (v.price == null || v.price < 0) bad.price = true;
    if (v.gm == null || v.gm > 1) bad.gm = true;
    if (v.churn == null || v.churn <= 0 || v.churn > 1) bad.churn = true;
    if (v.cac == null || v.cac < 0) bad.cac = true;
    if (v.setup == null || v.setup < 0) bad.setup = true;
    return bad;
  }
  /* v: {price, gm (fraction), churn (monthly fraction), cac, setup} */
  function calc(v) {
    const bad = validate(v), ok = k => !bad[k];
    const fin = x => (x != null && Math.abs(x) < MAX_SHOWN ? x : null); // extreme typed values never put Infinity or 300-digit numbers on screen
    const r = { v, bad };
    r.gp = fin(ok('price') && ok('gm') ? v.price * v.gm : null);                  // gross profit / location / month
    r.life = fin(ok('churn') ? 1 / v.churn : null);                               // average lifetime, months
    r.ltv = fin(r.gp != null && ok('churn') ? r.gp / v.churn : null);             // lifetime gross profit (setup fee excluded)
    r.ratio = fin(r.ltv != null && ok('cac') && v.cac > 0 ? r.ltv / v.cac : null); // LTV:CAC
    r.payback = fin(ok('cac') && r.gp != null && r.gp > 0 ? v.cac / r.gp : null); // months to earn back CAC
    r.retained = ok('churn') ? retainedMonths(v.churn, 12) : null;                // paid months in year one per location signed
    r.fy = fin(r.gp != null && r.retained != null ? r.gp * r.retained : null);    // first-year gross profit
    r.cover = fin(ok('setup') && ok('cac') && v.cac > 0 ? v.setup / v.cac : null); // setup fee / CAC
    r.maxCac = r.ltv != null && r.ltv > 0 ? r.ltv / HEALTHY : null;               // highest CAC that keeps 3x
    return r;
  }
  function tone(ratio) {
    if (ratio == null) return null;
    ratio = Math.round(ratio * 10) / 10; // judge the figure as shown (one decimal), so the words match the number
    if (ratio >= HEALTHY) return { t: 'good', word: 'Healthy', rule: HEALTHY + 'x or more' };
    if (ratio >= 1) return { t: 'warn', word: 'Thin', rule: 'between 1x and ' + HEALTHY + 'x' };
    return { t: 'bad', word: 'Losing money', rule: 'under 1x: each location earns back less than it cost' };
  }
  const WHY = {
    price: 'Enter a price of $0 or more',
    gm: 'Enter a gross margin of 100% or less',
    churn: 'Enter a monthly churn above 0% and up to 100%',
    cac: 'Enter a CAC of $0 or more',
    setup: 'Enter a setup fee of $0 or more'
  };
  /* When no listed input is invalid, a null result means it was too large to show (e.g. a CAC of 1e-300). */
  const need = (r, keys, dflt) => { const k = keys.find(x => r.bad[x]); return k ? WHY[k] : (dflt == null ? 'Too large to show' : dflt); };

  /* ---------- live outputs ---------- */
  function outputs(r) {
    const v = r.v, t = tone(r.ratio);
    const o = {};
    o.gp = ui.kpi({
      label: 'Gross profit / location / month',
      value: r.gp == null ? '—' : fmtMoney(r.gp),
      sub: r.gp == null ? need(r, ['price', 'gm']) : `${fmtPrice(v.price)} price × ${fmtPct(v.gm)} gross margin`
    });
    o.ltv = ui.kpi({
      label: 'Lifetime gross profit (LTV)',
      value: r.ltv == null ? '—' : fmtMoney(r.ltv),
      sub: r.ltv == null ? need(r, ['price', 'gm', 'churn'])
        : `Gross profit ÷ ${fmtPct(v.churn)} monthly churn · excludes the ${r.bad.setup ? '' : fmtMoney(v.setup) + ' '}setup fee, as the doc does`
    });
    let ratioSub;
    if (r.ratio != null) ratioSub = `${ui.chip(t.word, t.t)} ${esc(t.rule)}`;
    else if (!r.bad.cac && v.cac === 0 && r.ltv != null) ratioSub = 'CAC is $0, so there is no ratio to show';
    else ratioSub = need(r, ['price', 'gm', 'churn', 'cac']);
    o.ratio = ui.kpi({ label: 'LTV : CAC', value: r.ratio == null ? '—' : fmtX(r.ratio), tone: t ? t.t : '', sub: ratioSub });
    let pb, pbSub;
    if (r.payback != null) { pb = fmtMonths(r.payback); pbSub = `${fmtMoney(v.cac)} CAC ÷ ${fmtMoney(r.gp)} gross profit a month`; }
    else if (r.gp != null && r.gp <= 0 && !r.bad.cac && v.cac === 0) { pb = fmtMonths(0); pbSub = 'CAC is $0, so there is nothing to earn back'; }
    else if (r.gp != null && r.gp <= 0 && !r.bad.cac) { pb = 'Never'; pbSub = 'Gross profit is $0 or less a month, so CAC never pays back'; }
    else { pb = '—'; pbSub = need(r, ['price', 'gm', 'cac']); }
    o.payback = ui.kpi({ label: 'CAC payback', value: pb, sub: pbSub });

    o.life = r.life == null ? `<span class="muted">${WHY.churn}</span>` : fmtMonths(r.life);
    o.fy = r.fy == null ? `<span class="muted">${need(r, ['price', 'gm', 'churn'])}</span>` : fmtMoney(r.fy);
    o.setup = r.bad.setup ? `<span class="muted">${WHY.setup}</span>` : fmtMoney(v.setup);
    o.cover = r.cover == null ? `<span class="muted">${r.bad.setup ? WHY.setup : 'Needs a CAC above $0'}</span>`
      : `${fmtPct(r.cover, 0)}${r.cover >= 1 ? ' ' + ui.chip('Covers CAC up front', 'good') : ''}`;
    o.maxcac = r.maxCac == null ? `<span class="muted">${need(r, ['price', 'gm', 'churn'], r.ltv != null ? 'Needs gross profit above $0' : null)}</span>` : fmtMoney(r.maxCac);
    return o;
  }
  function editedHTML() {
    const y = curYear();
    if (!edited()) return `<span class="source">Matches the ${esc(y)} plan</span>`;
    return `${ui.chip('What-if', 'accent')} <button class="btn btn-sm btn-ghost" type="button" data-act="mod" data-mod="unit" data-a="reset">Reset to ${esc(y)} plan</button>`;
  }
  function refresh(el, key) {
    const r = calc(values()), o = outputs(r);
    Object.keys(o).forEach(k => { const n = document.getElementById('unit-out-' + k); if (n) n.innerHTML = o[k]; });
    const s = document.getElementById('unit-sens'); if (s) s.innerHTML = sensHTML(r);
    const e = document.getElementById('unit-edited'); if (e) e.innerHTML = editedHTML();
    if (el && key && el.setAttribute) { if (r.bad[key]) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid'); }
  }

  /* ---------- sensitivity grid ---------- */
  function sensAxes() {
    const P = ctx.plan(), y = curYear();
    const planPrice = planRaw(y).price;
    const center = planPrice != null && planPrice > 0 ? planPrice : (values().price || 0);
    const prices = center > 0 ? [center - PRICE_STEP, center, center + PRICE_STEP, center + 2 * PRICE_STEP].filter(p => p > 0) : [];
    const byKey = {};
    const add = (c, name) => { const k = Math.round(c * 100000); if (!byKey[k]) byKey[k] = { c, names: [] }; if (name) byKey[k].names.push(name); };
    EXTRA_CHURN.forEach(c => add(c));
    if (P.churn && typeof P.churn === 'object') Object.keys(P.churn).forEach(k => { const c = Number(P.churn[k]); if (isFinite(c) && c > 0 && c < 1) add(c, k); });
    const churns = Object.keys(byKey).map(k => byKey[k]).sort((a, b) => a.c - b.c);
    return { prices, churns, planPrice, year: y };
  }
  const sensVal = (p, c, r) => { if (r.bad.gm || r.bad.cac || !(r.v.cac > 0)) return null; const x = (p * r.v.gm / c) / r.v.cac; return Math.abs(x) < MAX_SHOWN ? x : null; };
  function sensChip(v) {
    if (v == null) return '<span class="muted">—</span>';
    const t = tone(v);
    return ui.chip(fmtX(v) + (t.t === 'good' ? '' : ' · ' + t.word.toLowerCase()), t.t);
  }
  function sensHTML(r) {
    const ax = sensAxes();
    if (r.bad.gm || r.bad.cac || !(r.v.cac > 0)) return `<p class="note">${r.bad.gm ? WHY.gm : 'Enter a CAC above $0'} to fill this grid.</p>`;
    if (!ax.prices.length) return '<p class="note">Enter a price above $0 to fill this grid.</p>';
    const head = `<tr><th>Monthly churn</th>${ax.prices.map(p => `<th class="num">${fmtPrice(p)}${p === ax.planPrice ? ' · plan' : ''}</th>`).join('')}</tr>`;
    const rows = ax.churns.map(row => `<tr><td><span class="cell-main">${fmtPct(row.c)}</span>${row.names.length ? ` <span class="source">${esc(row.names.join(', '))}</span>` : ''}</td>${ax.prices.map(p => `<td class="num">${sensChip(sensVal(p, row.c, r))}</td>`).join('')}</tr>`).join('');
    let mine = '';
    if (r.ratio != null) {
      const t = tone(r.ratio);
      mine = `<p class="note">Your inputs: ${fmtPrice(r.v.price)} at ${fmtPct(r.v.churn)} monthly churn gives ${fmtX(r.ratio)} LTV:CAC (${esc(t.word.toLowerCase())}).</p>`;
    }
    return `<div class="table-wrap flat"><table class="compact"><caption class="source" style="text-align:left;padding:8px 12px">LTV:CAC at ${fmtPct(r.v.gm)} gross margin and ${fmtMoney(r.v.cac)} CAC. Columns: price per location per month. Rows: monthly churn.</caption><thead>${head}</thead><tbody>${rows}</tbody></table></div>${mine}`;
  }

  /* ---------- plan check ---------- */
  const METRICS = [
    { k: 'gp', label: 'Gross profit / location / month', half: 0.5, doc: v => fmtMoney(v), calc: v => fmtPrice(round2(v)) },
    { k: 'ltv', label: 'Lifetime gross profit (LTV)', half: 50, doc: v => fmtMoney(v), calc: v => fmtMoney(v) },
    { k: 'ratio', label: 'LTV : CAC', half: 0.05, doc: v => fmtX(v), calc: v => fmtNum(v, 2) + 'x' },
    { k: 'payback', label: 'CAC payback', half: 0.05, doc: v => fmtMonths(v), calc: v => fmtMonths(v, 2) }
  ];
  function check(doc, val, half) {
    if (doc == null || val == null) return { html: '<span class="muted">—</span>', agree: false, counted: false };
    const diff = Math.abs(val - doc), rel = doc ? diff / Math.abs(doc) : (diff ? 1 : 0);
    const apart = ` <span class="source">${fmtPct(rel, 1)} apart</span>`;
    if (rel <= 0.01) return { html: ui.chip('Match', 'good') + apart, agree: true, counted: true };
    if (diff <= half + 1e-9) return { html: ui.chip('Matches when rounded', 'accent') + apart, agree: true, counted: true };
    return { html: ui.chip('Off by ' + fmtPct(rel), 'warn'), agree: false, counted: true };
  }
  function planCheck() {
    const ys = years();
    let agree = 0, counted = 0;
    const rows = ys.map(y => {
      const pr = planRaw(y), r = calc(pr), doc = DOC_CHECK[y] || null;
      const yearCell = `<td rowspan="${METRICS.length}" style="vertical-align:top"><div class="cell-main">${esc(y)}</div>
        <div class="source">${pr.price != null ? fmtPrice(pr.price) + ' price' : 'No price'} · ${pr.cac != null ? fmtMoney(pr.cac) + ' CAC' : 'no CAC'}</div>
        <div class="source">${pr.churn != null ? fmtPct(pr.churn) + ' monthly churn' : 'no churn'}</div>
        ${y === DOC_FIRST ? `<div style="margin-top:6px">${ui.chip('CAC understated', 'warn')}</div>` : ''}</td>`;
      return METRICS.map((m, i) => {
        const val = r[m.k], d = doc ? doc[m.k] : null, c = check(d, val, m.half);
        if (c.counted) { counted++; if (c.agree) agree++; }
        return `<tr>${i === 0 ? yearCell : ''}<td>${m.label}</td><td class="num">${d == null ? '<span class="muted">—</span>' : m.doc(d)}</td><td class="num">${val == null ? '<span class="muted">—</span>' : m.calc(val)}</td><td>${c.html}</td></tr>`;
      }).join('');
    }).join('');
    const table = `<div class="table-wrap flat"><table class="compact"><thead><tr><th>Year</th><th>Figure</th><th class="num">Plan doc</th><th class="num">Computed from plan</th><th>Check</th></tr></thead><tbody>${rows}</tbody></table></div>`;

    const ratios = ys.map(y => calc(planRaw(y)).ratio);
    const chartOk = ratios.some(v => v != null);
    const fmtAxis = v => (Number.isInteger(v) ? fmtNum(v) : x1.format(v)) + 'x';
    const chart = chartOk ? ctx.chart.bars({
      labels: ys.map(String), height: 180, format: fmtAxis,
      series: [{ name: 'LTV:CAC computed from plan', values: ratios, color: 'var(--viz-1)' }],
      refLine: { value: HEALTHY, label: HEALTHY + 'x healthy floor' },
      ariaLabel: 'LTV to CAC by plan year: ' + ys.map((y, i) => y + ' ' + (ratios[i] == null ? 'no figure' : fmtX(ratios[i]))).join(', ')
    }) : '';
    const caption = chartOk ? `<p class="note">LTV:CAC computed from the plan: ${ys.map((y, i) => `${esc(y)} ${ratios[i] == null ? 'no figure' : fmtX(ratios[i])}`).join(', ')}. The line marks ${HEALTHY}x, the usual healthy floor. It falls as paid sales raise CAC.</p>` : '';

    const first = calc(planRaw(DOC_FIRST));
    const flag = ys.indexOf(DOC_FIRST) >= 0
      ? `<p class="note">The plan doc flags its ${DOC_FIRST} CAC as understated because it leaves out the founder’s selling time.${first.maxCac != null ? ` There is room: ${DOC_FIRST} LTV:CAC stays at ${HEALTHY}x or better up to a CAC of ${fmtMoney(first.maxCac)} per location. Raise CAC in the calculator above to test it.` : ''}</p>`
      : '';
    const how = `<p class="note">Computed with this tab’s formulas: gross profit = price × (1 − cost of service); LTV = gross profit ÷ base monthly churn; LTV:CAC = LTV ÷ CAC; payback = CAC ÷ gross profit. Match means within 1%. “Matches when rounded” means the gap is only the doc’s rounding (it prints payback to one decimal).</p>`;
    const sub = counted ? `${agree} of ${counted} figures agree with the doc` : 'No doc figures for these years';
    return ui.panel({ title: 'Plan check', sub, body: chart + caption + table + flag + how, cls: 'section' });
  }

  /* ---------- CRM observations ---------- */
  function crm() {
    const deals = ctx.all('deals');
    const won = deals.filter(d => d.stage === 'won'), lost = deals.filter(d => d.stage === 'lost');
    if (!won.length && !lost.length) {
      return `<p class="note">Once you mark deals won or lost, this tab adds your real win rate, deal size and churn next to the plan’s. <button class="link" type="button" data-act="go" data-view="pipeline">Open the pipeline</button></p>`;
    }
    const rows = [];
    const row = (label, src, value) => `<div class="stat-row"><dt>${label}${src ? `<div class="source">${src}</div>` : ''}</dt><dd>${value}</dd></div>`;
    rows.push(row('Win rate', `won ÷ (won + lost): ${won.length} won, ${lost.length} lost`, fmtPct(won.length / (won.length + lost.length), 0)));
    const priced = won.filter(ctx.priced), locsSum = ctx.sum(priced, ctx.pricedLocs);
    rows.push(row('Average locations per won deal', priced.length ? `${locsSum} location${locsSum === 1 ? '' : 's'} across ${priced.length} won deal${priced.length === 1 ? '' : 's'}` : 'No won deal has a location count yet',
      priced.length ? fmtNum(locsSum / priced.length, 1) : '<span class="muted">—</span>'));
    if (won.length) rows.push(row('Average ARR per won deal', `${won.length} won deal${won.length === 1 ? '' : 's'}`, fmtMoney(ctx.sum(won, d => num(d.value)) / won.length)));
    if (locsSum > 0) {
      const p = round2(ctx.sum(priced, d => num(d.value)) / 12 / locsSum);
      const cur = values().price;
      const use = !(p > 0) || (cur != null && Math.abs(cur - p) < 0.005) ? '' : ` <button class="btn btn-sm btn-ghost" type="button" data-act="mod" data-mod="unit" data-a="use-price" data-v="${p}">Use in calculator</button>`;
      rows.push(row('Average price per location per month', 'ARR ÷ 12 ÷ locations, won deals', fmtPrice(p) + use));
    }
    const subs = ctx.subscriptions(), churned = subs.filter(s => ctx.isChurned(s.deal)).length;
    if (subs.length) rows.push(row('Observed churn', `${churned} of ${subs.length} subscription${subs.length === 1 ? '' : 's'} ended`, `${fmtPct(churned / subs.length, 0)} ${ui.chip('Small sample', 'warn')}`));
    const base = ctx.plan().churn && has(ctx.plan().churn.base) ? Number(ctx.plan().churn.base) : null;
    const note = subs.length
      ? `<p class="note">Observed churn is the share of all subscriptions that have ended so far, not a monthly rate. With ${subs.length} subscription${subs.length === 1 ? '' : 's'} it is a small-sample figure: keep using the plan’s ${base != null ? fmtPct(base) + ' ' : ''}monthly churn until you have many more customers.</p>`
      : '';
    return ui.panel({ title: 'From your CRM', sub: 'All closed deals to date', body: `<dl class="stat-list">${rows.join('')}</dl>${note}`, cls: 'section' });
  }

  /* ---------- page ---------- */
  function seg() {
    const y = curYear();
    return `<div class="seg" role="group" aria-label="Load a plan year">${years().map(v => `<button type="button" data-act="mod" data-mod="unit" data-a="year" data-year="${esc(v)}" aria-pressed="${v === y}">${esc(v)}</button>`).join('')}</div>`;
  }
  function field(k, label, s, hint, bad) {
    return `<div class="field"><label for="unit-in-${k}">${label}</label><input class="input mono" id="unit-in-${k}" inputmode="decimal" autocomplete="off" data-mod-input="unit" data-key="${k}" value="${esc(s)}" aria-describedby="unit-hint-${k}"${bad ? ' aria-invalid="true"' : ''}><span class="hint" id="unit-hint-${k}">${hint}</span></div>`;
  }
  function inputsPanel(r) {
    const y = curYear(), pr = planRaw(y), s = inputs(), P = ctx.plan();
    const ch = P.churn && typeof P.churn === 'object' ? P.churn : {};
    const others = Object.keys(ch).filter(k => k !== 'base' && has(ch[k])).map(k => `${esc(k)} ${fmtPct(Number(ch[k]))}`).join(', ');
    const body = `<div class="calc-grid">
      ${field('price', 'Price / location / month ($)', s.price, pr.price != null ? `${esc(y)} plan: ${fmtPrice(pr.price)}` : 'Not in the plan', r.bad.price)}
      ${field('gm', 'Gross margin (%)', s.gm, pr.gm != null ? `${esc(y)} plan: ${fmtPct(pr.gm)} (cost of service ${fmtPct(1 - pr.gm)})` : 'Not in the plan', r.bad.gm)}
      ${field('churn', 'Monthly churn (%)', s.churn, pr.churn != null ? `Plan base: ${fmtPct(pr.churn)}${others ? ` (${others})` : ''}` : 'Not in the plan', r.bad.churn)}
      ${field('cac', 'CAC per new location ($)', s.cac, pr.cac != null ? `${esc(y)} plan: ${fmtMoney(pr.cac)}` : 'Not in the plan', r.bad.cac)}
      ${field('setup', 'Setup fee, one-time ($)', s.setup, pr.setup != null ? `Plan: ${fmtMoney(pr.setup)}` : 'Not in the plan', r.bad.setup)}
    </div>
    <p class="note">Pick a year above to load its plan numbers, then change any of them to test a what-if. What-ifs stay on this page; edit the plan itself on the <button class="link" type="button" data-act="go" data-view="assumptions">Assumptions tab</button>.</p>`;
    return ui.panel({ title: 'Inputs', sub: `Loaded from the ${y} plan`, actions: `<span id="unit-edited">${editedHTML()}</span>`, body });
  }
  function morePanel(o) {
    const row = (k, label, src) => `<div class="stat-row"><dt>${label}<div class="source">${src}</div></dt><dd id="unit-out-${k}">${o[k]}</dd></div>`;
    const body = `<dl class="stat-list">
      ${row('life', 'Average customer lifetime', '1 ÷ monthly churn')}
      ${row('fy', 'First-year gross profit per location', '12 months of gross profit, less expected churn')}
      ${row('setup', 'Setup fee, one-time', 'Shown apart: not added to LTV, as in the doc')}
      ${row('cover', 'Setup fee coverage of CAC', 'Setup fee ÷ CAC')}
      ${row('maxcac', `Highest CAC that keeps ${HEALTHY}x`, `LTV ÷ ${HEALTHY}`)}
    </dl>`;
    return ui.panel({ title: 'Per location', sub: 'Updates as you type', body });
  }

  return {
    id: 'unit',
    label: 'Unit economics',
    group: 'Planning',
    order: 20,
    collections: [],
    render() {
      const loading = ctx.isLoading();
      if (loading) return ui.toolbar({ title: 'Unit economics' }) + '<div class="empty"><p>Loading your plan and deals…</p></div>';
      const ys = years();
      if (!ys.length) {
        return ui.toolbar({ title: 'Unit economics' }) + ui.empty({
          title: 'No plan prices yet',
          text: 'Unit economics start from a price per location. Add the plan’s prices on the Assumptions tab and this calculator fills in from them.',
          action: '<button class="btn btn-primary" type="button" data-act="go" data-view="assumptions">Open Assumptions</button>'
        });
      }
      const r = calc(values()), o = outputs(r);
      const wrap = k => `<div id="unit-out-${k}" style="display:contents">${o[k]}</div>`;
      const kp = `<section class="kpis" aria-label="Unit economics per location" aria-live="polite">${wrap('gp')}${wrap('ltv')}${wrap('ratio')}${wrap('payback')}</section>`;
      const top = `<div class="grid grid-2 section">${inputsPanel(r)}${morePanel(o)}</div>`;
      const sens = ui.panel({
        title: 'Sensitivity',
        sub: `LTV:CAC by price and churn · ${HEALTHY}x or more is healthy; weaker cells say thin or losing money`,
        body: `<div id="unit-sens">${sensHTML(r)}</div>`,
        cls: 'section'

      return ui.toolbar({ title: 'Unit economics', filters: seg(), exportable: true }) + kp + top + sens + planCheck() + crm();
    },
    onAction(a, data) {
      if (a === 'year') {
        const y = Number(data.year);
        if (years().indexOf(y) >= 0) { st.year = y; st.inputs = null; ctx.render(); }
      } else if (a === 'reset') {
        st.inputs = null; ctx.render();
      } else if (a === 'use-price') {
        const p = Number(data.v);

      ax.churns.forEach(row => {
        rows.push([round2(row.c * 100)].concat(ax.prices.map(p => { const v = sensVal(p, row.c, r); return v == null ? '' : Math.round(v * 10) / 10; })));
      });
      const basis = r.bad.gm || r.bad.cac || !(r.v.cac > 0) ? 'The grid is blank: it needs a gross margin and a CAC above $0'
        : `Assumes ${pctStr(r.v.gm)}% gross margin and $${round2(r.v.cac)} CAC per location (${ax.year} plan${edited() ? ', edited' : ''})`;
      rows.push([basis].concat(ax.prices.map(() => '')));
      return { name: 'unit-economics-sensitivity', rows };

<script>
/* ---- tab module: market ---- */
(window.__dbViews = window.__dbViews || []).push(function (ctx) {
  'use strict';
  /* Market tab: TAM / SAM / SOM from the user's market segments, priced at a per-location monthly price,
     and how much of the market each plan target needs. Segment doc:
     {name, count (locations, may be null), inTarget, notes, source, order, createdAt, createdBy}. */
  const ID = 'market';
  const esc = ctx.esc;

  // The two segments the business plan names. Offered only on the empty state, as a one-click start.
  const SUGGESTED = [
    { name: 'New York licensed adult-use dispensaries', count: 623, inTarget: true, notes: 'Licensed adult-use dispensaries as of Mar 31, 2026', source: 'Business plan' },
    { name: 'U.S. dispensaries', count: 15000, inTarget: false, notes: 'About 15,000 nationwide', source: 'Business plan' }
  ];

  // Closure state: what the founder typed into the calculators (null = use the plan default).
  const st = { price: null, priceRaw: null, goal: null, goalRaw: null, busy: false };

  /* ---------- data ---------- */
  const hasCount = s => !!s && s.count !== null && s.count !== undefined && s.count !== '' && isFinite(Number(s.count)) && Number(s.count) >= 0;
  const countOf = s => (hasCount(s) ? Number(s.count) : 0);
  const segName = s => String((s && s.name) || '').trim() || 'Unnamed segment';
  function segments() {
    return ctx.all('segments').slice().sort((a, b) =>
      (ctx.num(a.order) - ctx.num(b.order)) ||
      String(a.createdAt || '').localeCompare(String(b.createdAt || '')) ||
      segName(a).localeCompare(segName(b)));
  }
  const maxOrder = () => ctx.all('segments').reduce((m, s) => Math.max(m, ctx.num(s.order)), 0);
  function targets() {
    return (ctx.plan().targets || [])
      .filter(t => t && t.locations != null && isFinite(Number(t.locations)))
      .slice().sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
  }
  const planPrice = () => ctx.priceFor('2027-01-01');
  const price = () => (st.price == null ? planPrice() : st.price);
  function defaultGoal(z) {
    const last = z.last;
    return last && ctx.num(last.arr) > 0 ? ctx.num(last.arr) : Math.round(z.som);
  }
  const goal = z => (st.goal == null ? defaultGoal(z) : st.goal);

  function sizes(p) {
    const segs = segments();
    const sized = segs.filter(hasCount), unsized = segs.filter(s => !hasCount(s));
    const target = sized.filter(s => s.inTarget);
    const tamLocs = ctx.sum(sized, countOf), samLocs = ctx.sum(target, countOf);
    const ts = targets(), last = ts.length ? ts[ts.length - 1] : null;
    const somLocs = last ? ctx.num(last.locations) : 0;
    const yr = p * 12;
    return {
      segs, sized, unsized, target, ts, last, tamLocs, samLocs, somLocs,
      tam: tamLocs * yr, sam: samLocs * yr, som: somLocs * yr,
      pen: last && samLocs > 0 ? somLocs / samLocs : null
    };
  }

  /* ---------- formatting ---------- */
  const DASH = '—';
  const pct = x => (x == null || !isFinite(x) ? DASH : ctx.fmtPct(x, x > 0 && x < 0.01 ? 2 : 1));
  const share = (n, of) => (of > 0 ? n / of : null);
  const locTxt = n => ctx.fmtNum(n) + (n === 1 ? ' location' : ' locations');
  const perMo = p => ctx.fmtPrice(p) + '/mo';
  const lc = label => esc(String(label || 'final').replace(/^./, c => c.toLowerCase()));
  function parseAmount(raw) { // '' -> 'empty'; invalid -> null; else a number >= 0
    const s = String(raw == null ? '' : raw).replace(/[$,\s]/g, '');
    if (!s) return 'empty';
    const n = Number(s);
    return isFinite(n) && n >= 0 ? n : null;
  }
  // Every number that depends on the price or the goal, keyed by element id, so render() and the
  // in-place refresh can never disagree.
  function figures(p, z) {
    const g = goal(z), yr = p * 12;
    const need = yr > 0 ? Math.ceil(g / yr) : null;
    const f = {
      'market-tam': z.sized.length ? ctx.fmtCompact(z.tam) : DASH,
      'market-sam': z.target.length ? ctx.fmtCompact(z.sam) : DASH,
      'market-som': z.last ? ctx.fmtCompact(z.som) : DASH,
      'market-pen': pct(z.pen),
      'market-tam-full': ctx.fmtMoney(z.tam),
      'market-tam-row': z.sized.length ? ctx.fmtCompact(z.tam) : DASH,
      'market-sam-full': ctx.fmtMoney(z.sam),
      'market-som-full': ctx.fmtMoney(z.som),
      'market-tam-calc': `${ctx.fmtNum(z.tamLocs)} × ${ctx.fmtPrice(p)} × 12`,
      'market-sam-calc': `${ctx.fmtNum(z.samLocs)} × ${ctx.fmtPrice(p)} × 12`,
      'market-som-calc': `${ctx.fmtNum(z.somLocs)} × ${ctx.fmtPrice(p)} × 12`,
      'market-price-shown': perMo(p),
      'market-tgt-rev-h': 'Annual revenue at ' + perMo(p),

      'market-goal-tam': need == null ? DASH : pct(share(need, z.tamLocs)),
      'market-goal-vs': need == null || !z.last ? DASH
        : need === z.somLocs ? `Same as the ${lc(z.last.label)} target`
        : `${ctx.fmtNum(Math.abs(need - z.somLocs))} ${need > z.somLocs ? 'more' : 'fewer'} than the ${lc(z.last.label)} target of ${ctx.fmtNum(z.somLocs)}`
    };
    z.ts.forEach((t, i) => { f['market-tgt-' + i + '-rev'] = ctx.fmtCompact(ctx.num(t.locations) * yr); });
    f['market-tgt-now-rev'] = ctx.fmtCompact(nowLocs() * yr);
    z.segs.forEach(s => { f['market-seg-' + s.id + '-rev'] = hasCount(s) ? ctx.fmtCompact(countOf(s) * yr) : DASH; });
    return f;
  }
  const nowLocs = () => ctx.locationsOn(ctx.todayStr());
  function refresh() {

    // When the goal is the default and the last target has no ARR, the default (SOM revenue) moves with the price:
    // keep the goal field showing the number the results use.
    const gi = document.getElementById('market-goal');
    if (gi && st.goal == null && st.goalRaw == null && document.activeElement !== gi) gi.value = ctx.fmtNum(Math.round(goal(z)));
    const yrs = ctx.planYears();
    yrs.forEach(y => { const b = document.getElementById('market-py-' + y); if (b) b.setAttribute('aria-pressed', String(Math.abs(ctx.priceFor(y + '-01-01') - p) < 0.005)); });
  }

  /* ---------- writes ---------- */
  async function seed() {
    if (st.busy || !ctx.canWrite()) return;
    st.busy = true;

      const have = new Set(ctx.all('segments').map(s => String(s.name || '').trim().toLowerCase()));
      let order = maxOrder(), added = 0;
      for (const s of SUGGESTED) {
        if (have.has(s.name.toLowerCase())) continue;

        if (!id) break;
        added++;

    } finally { st.busy = false; }
  }

  }

      body:

        F.number('market-f-count', 'Number of locations', s && hasCount(s) ? countOf(s) : '', 'min="0" step="1" inputmode="numeric" placeholder="Leave empty if not known yet"') +
        F.check('market-f-target', 'In our target market (counts toward SAM)', s ? !!s.inTarget : false) +
        F.area('market-f-notes', 'Notes', s ? s.notes : '', 2) +

        if (s) return await ctx.patch('segments', s.id, Object.assign(data, { updatedAt: ctx.iso() }));

      const v = ctx.priceFor(y + '-01-01');
      return `<button type="button" id="market-py-${y}" data-act="mod" data-mod="${ID}" data-a="price" data-price="${v}" aria-pressed="${Math.abs(v - p) < 0.005}" title="Plan price for ${y}: ${ctx.fmtPrice(v)} per location per month">${y} · ${ctx.fmtPrice(v)}</button>`;

      title: 'Market',

      filters: loading || !z.segs.length ? '' : priceControls(p),

  function emptyState(z, p) {

        <td class="num">${sized ? pct(share(countOf(s), z.tamLocs)) : DASH}</td>
        <td class="num" id="market-seg-${id}-rev">${f['market-seg-' + s.id + '-rev']}</td>
        <td><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${s.inTarget ? ctx.ui.chip('In target', 'accent') : ctx.ui.chip('Outside target')}${w ? btn('toggle', s.inTarget ? 'Remove' : 'Add to target', `data-id="${id}" aria-label="${s.inTarget ? 'Remove' : 'Add'} ${esc(segName(s))} ${s.inTarget ? 'from' : 'to'} the target market"`, 'btn-ghost') : ''}</div></td>
        <td style="max-width:280px">${s.notes ? esc(s.notes) : '<span class="muted">—</span>'}</td>
        <td>${s.source ? `<span class="source">${esc(s.source)}</span>` : '<span class="muted">—</span>'}</td>
        ${w ? `<td><div class="row-actions">${btn('edit', 'Edit', `data-id="${id}" aria-label="Edit ${esc(segName(s))}"`, 'btn-ghost')}${btn('delete', 'Delete', `data-id="${id}" aria-label="Delete ${esc(segName(s))}"`, 'btn-ghost btn-danger')}</div></td>` : ''}
      </tr>`;
    };
    const cols = w ? 8 : 7;
    const bodyRows = list.length ? list.map(row).join('') : `<tr><td colspan="${cols}" class="muted">No segments match your search.</td></tr>`;
    const sizedTotal = z.sized.length ? `<tr><td><div class="cell-main">All sized segments (TAM)</div></td><td class="num">${ctx.fmtNum(z.tamLocs)}</td><td class="num">100%</td><td class="num" id="market-tam-row">${f['market-tam-row']}</td><td colspan="${cols - 4}"></td></tr>` : '';
    const body = `<div class="table-wrap flat"><table class="compact"><thead><tr><th>Segment</th><th class="num">Locations</th><th class="num">Share of TAM</th><th class="num" id="market-seg-rev-h">${f['market-seg-rev-h']}</th><th>Target market</th><th>Notes</th><th>Source</th>${w ? '<th><span class="muted" style="font-weight:400">Actions</span></th>' : ''}</tr></thead><tbody>${bodyRows}${ctx.S.q ? '' : sizedTotal}</tbody></table></div>`;
    return ctx.ui.panel({
      title: 'Segments',
      sub: `${z.sized.length} sized · ${z.unsized.length} not sized yet`,
      actions: w ? btn('new', 'Add segment') : '',
      body, cls: 'section'
    });
  }

  return {
    id: ID,
    label: 'Market',
    group: 'Planning',
    order: 30,
    collections: ['segments'],
    newItems: [{ label: 'Market segment', a: 'new' }],
    render() {
      const loading = ctx.isLoading();
      const p = price();
      const z = sizes(p);
      if (loading) return head(z, true, p) + '<div class="empty"><p>Loading market segments…</p></div>';
      if (!z.segs.length) return head(z, false, p) + emptyState(z, p);
      const f = figures(p, z);
      return head(z, false, p) +
        kpiRow(z, f) +
        unsizedNote(z) +
        `<div class="grid grid-2 section">${chartPanel(z, f, p)}${goalPanel(z, f)}</div>` +
        targetPanel(z, f) +
        segmentPanel(z, f);
    },
    onAction(a, data) {
      if (a === 'new') return openForm(null);
      if (a === 'edit') return openForm(data.id);
      if (a === 'delete') return confirmDelete(data.id);
      if (a === 'toggle') return toggleTarget(data.id);
      if (a === 'seed') return seed();
      if (a === 'price') {
        const v = Number(data.price);
        if (!isFinite(v) || v < 0) return;
        st.price = Math.abs(v - planPrice()) < 0.005 ? null : v;
        st.priceRaw = null;
        ctx.render();
      }
    },
    onInput(key, el, ev) {
      if (key !== 'price' && key !== 'goal') return;
      const v = parseAmount(el.value);
      const err = document.getElementById(key === 'price' ? 'market-price-err' : 'market-goal-err');
      if (v === null) {
        if (err) err.hidden = false;
        el.setAttribute('aria-invalid', 'true');
        return;
      }
      if (err) err.hidden = true;
      el.removeAttribute('aria-invalid');
      const committed = !!ev && ev.type === 'change';
      if (key === 'price') { st.price = v === 'empty' ? null : v; st.priceRaw = v === 'empty' && committed ? null : el.value; }
      else { st.goal = v === 'empty' ? null : v; st.goalRaw = v === 'empty' ? null : el.value; }
      refresh();
      // The chart is drawn by the core on render; redraw it once the edit is committed, not per keystroke.
      // A blur from clicking a button fires 'change' on mousedown; re-rendering at once would replace that
      // button before mouseup and swallow the click, so wait until the click has landed.
      if (committed) setTimeout(() => ctx.render(), 300);
    },
    csv() {
      const p = price(), z = sizes(p);
      const rows = [['Segment', 'Locations', 'In target market', 'Share of sized locations', 'Price per location per month', 'Annual revenue (locations x price x 12)', 'Notes', 'Source', 'Created']];
      z.segs.forEach(s => {
        const sized = hasCount(s);
        rows.push([segName(s), sized ? countOf(s) : '', s.inTarget ? 'Yes' : 'No',
          sized && z.tamLocs > 0 ? Math.round(countOf(s) / z.tamLocs * 10000) / 10000 : '',
          p, sized ? countOf(s) * p * 12 : '', String(s.notes || ''), String(s.source || ''), ctx.isoToYmd(s.createdAt) || '']);
      });
      return { name: 'market-segments', rows };
    }
  };
});
</script>
<script>
/* ---- tab module: milestones ---- */
(window.__dbViews = window.__dbViews || []).push(function (ctx) {
  'use strict';
  /* Milestones tab: company milestones with live progress against actuals. Milestone doc:
     {title, targetDate, metric:'none'|'locations'|'arr'|'mrr'|'cash', targetValue|null,
      status:'not-started'|'in-progress'|'done', doneAt|null, notes, source, order, createdAt, createdBy}.
     Metric milestones read today's paying locations, MRR, ARR (MRR x 12) or cash from the actuals. */
  const ID = 'milestones';
  const esc = ctx.esc;
  const DASH = '—';
  const SOURCE = 'Three-Year Financial Projections';
  const METRICS = [
    ['none', 'Nothing (mark it done by hand)'],
    ['locations', 'Paying locations'],
    ['arr', 'ARR'],
    ['mrr', 'MRR'],
    ['cash', 'Cash in the bank']
  ];
  const STATUSES = [['not-started', 'Not started'], ['in-progress', 'In progress'], ['done', 'Done']];
  const NOW_LABEL = { locations: 'Paying locations now', arr: 'ARR now', mrr: 'MRR now', cash: 'Cash now' };
  const TARGET_LABEL = { none: 'Target value', locations: 'Target paying locations', arr: 'Target ARR ($)', mrr: 'Target MRR ($)', cash: 'Target cash ($)' };

  // Closure state: guards the one-click plan import against double clicks.
  const st = { busy: false };

  /* ---------- data ---------- */
  const isMoney = k => k === 'arr' || k === 'mrr' || k === 'cash';
  const hasMetric = k => k === 'locations' || isMoney(k);
  const metricOf = m => (m && hasMetric(m.metric) ? m.metric : 'none');
  const statusOf = m => (m && (m.status === 'done' || m.status === 'in-progress') ? m.status : 'not-started');
  const isDone = m => statusOf(m) === 'done';
  const titleOf = m => String((m && m.title) || '').trim() || 'Untitled milestone';
  const dateOf = m => (m && ctx.parseYmd(m.targetDate) ? m.targetDate : '');
  const doneOn = m => (!m || !m.doneAt ? '' : ctx.parseYmd(m.doneAt) ? m.doneAt : ctx.isoToYmd(m.doneAt));
  const targetOf = m => { const n = Number(m && m.targetValue); return m && m.targetValue != null && m.targetValue !== '' && isFinite(n) && n > 0 ? n : null; };
  const today = () => ctx.todayStr();
  const isOverdue = (m, t) => !isDone(m) && !!dateOf(m) && dateOf(m) < t;
  function daysBetween(from, to) {
    const a = ctx.parseYmd(from), b = ctx.parseYmd(to);
    return a && b ? Math.round((b.getTime() - a.getTime()) / 864e5) : null;
  }
  const list = () => ctx.all('milestones');
  const maxOrder = () => list().reduce((mx, m) => Math.max(mx, ctx.num(m.order)), 0);
  const byTarget = (a, b) =>
    (dateOf(a) || '9999-12-31').localeCompare(dateOf(b) || '9999-12-31') ||
    (ctx.num(a.order) - ctx.num(b.order)) || titleOf(a).localeCompare(titleOf(b));
  const byDoneDesc = (a, b) => doneOn(b).localeCompare(doneOn(a)) || byTarget(b, a);

  // The actuals that metric milestones measure, read once per render.
  function snapshot(t) {
    const mrr = ctx.mrrOn(t);
    return { locations: ctx.locationsOn(t), mrr, arr: Math.round(mrr * 12 * 100) / 100, cash: ctx.cashOn(t) };
  }
  function progressOf(m, now) {
    const k = metricOf(m), target = targetOf(m);
    if (k === 'none' || target == null) return null;
    const cur = ctx.num(now[k]);
    return { k, target, cur, frac: Math.max(0, cur / target), reached: cur >= target };
  }
  function summary(t) {
    const all = list();
    const open = all.filter(m => !isDone(m)).sort(byTarget);
    return {
      all,
      done: all.filter(isDone).length,
      inProgress: all.filter(m => statusOf(m) === 'in-progress').length,
      notStarted: all.filter(m => statusOf(m) === 'not-started').length,
      overdue: open.filter(m => isOverdue(m, t)),
      next: open.find(m => dateOf(m)) || open[0] || null
    };
  }

  /* ---------- formatting ---------- */
  const fmtVal = (k, v) => (isMoney(k) ? ctx.fmtMoney(v) : ctx.fmtNum(v));
  // Never round a target that isn't reached up to 100%, or some progress down to 0%.
  const pct = f => (f > 0 && f < 0.001 ? '<0.1%' : f < 1 && f >= 0.995 ? ctx.fmtPct(Math.min(f, 0.999), 1) : ctx.fmtPct(f, f > 0 && f < 0.1 ? 1 : 0));
  const plural = (n, w) => `${ctx.fmtNum(n)} ${w}${n === 1 ? '' : 's'}`;
  function dueText(m, t) {
    const d = dateOf(m);
    if (!d) return 'No target date';
    const n = daysBetween(t, d);
    if (n === 0) return 'due today';
    if (n === 1) return 'due tomorrow';
    if (n > 1) return `${plural(n, 'day')} left`;
    return `${plural(-n, 'day')} late`;
  }
  function doneText(m) {
    const at = doneOn(m), d = dateOf(m);
    if (!at) return 'done';
    if (!d) return `done ${ctx.fmtDate(at)}`;
    const n = daysBetween(d, at);
    const rel = n === 0 ? 'on the target date' : n < 0 ? `${plural(-n, 'day')} early` : `${plural(n, 'day')} late`;
    return `done ${ctx.fmtDate(at)}, ${rel}`;
  }
  const statusChip = m => {
    const s = statusOf(m);
    return s === 'done' ? ctx.ui.chip('Done', 'good') : s === 'in-progress' ? ctx.ui.chip('In progress', 'accent') : ctx.ui.chip('Not started');
  };

  /* ---------- the plan's milestones (offered on the empty state) ---------- */
  function seeds() {
    const p = ctx.plan();
    const ts = (Array.isArray(p.targets) ? p.targets : [])
      .filter(x => x && ctx.parseYmd(x.date))
      .slice().sort((a, b) => a.date.localeCompare(b.date));
    const end = ctx.planTarget();
    const pilots = Math.max(0, Math.round(ctx.num(p.pilots)));
    const hireAt = ctx.num(p.hireSalesAtArr);
    const out = [
      { title: 'Form the LLC and open a business bank account', targetDate: '2026-11-30', metric: 'none', targetValue: null, status: 'not-started' }
    ];
    if (pilots > 0) {
      out.push({ title: `Run ${plural(pilots, 'paid pilot')}`, targetDate: '2026-12-31', metric: 'none', targetValue: null, status: 'in-progress' });
      out.push({ title: `Convert the pilots to paid at ${ctx.fmtPrice(ctx.priceFor('2027-01-01'))}/location/month`, targetDate: '2027-01-31', metric: 'locations', targetValue: pilots, status: 'not-started' });
    }
    const first = ts[0];
    if (first && ctx.num(first.locations) > 0 && first.date !== end.end) {
      out.push({ title: `Reach ${ctx.fmtNum(first.locations)} paying locations`, targetDate: first.date, metric: 'locations', targetValue: ctx.num(first.locations), status: 'not-started' });
    }
    if (end.arr > 0 && ctx.parseYmd(end.end)) {
      out.push({ title: `Reach ${ctx.fmtNum(end.locations)} locations and ${ctx.fmtCompact(end.arr)} ARR`, targetDate: end.end, metric: 'arr', targetValue: end.arr, status: 'not-started' });
    }
    if (hireAt > 0) {
      out.push({ title: `Pass ${ctx.fmtCompact(hireAt)} ARR and hire the first salesperson`, targetDate: '2028-06-30', metric: 'arr', targetValue: hireAt, status: 'not-started' });
    }
    ts.filter(x => x.date > end.end && ctx.num(x.arr) > 0).forEach(x => {
      const n = ctx.num(x.locations);
      out.push({ title: n > 0 ? `Reach ${ctx.fmtNum(n)} locations and ${ctx.fmtCompact(x.arr)} ARR` : `Reach ${ctx.fmtCompact(x.arr)} ARR`, targetDate: x.date, metric: 'arr', targetValue: ctx.num(x.arr), status: 'not-started' });
    });
    return out.map((s, i) => ({ s, i })).sort((a, b) => a.s.targetDate.localeCompare(b.s.targetDate) || a.i - b.i).map(x => x.s);
  }

  /* ---------- writes ---------- */
  async function seed() {
    if (st.busy || !ctx.canWrite()) return;
    st.busy = true;
    try {
      const have = new Set(list().map(m => titleOf(m).toLowerCase()));
      let order = maxOrder(), added = 0, failed = false;
      for (const s of seeds()) {
        if (have.has(s.title.toLowerCase())) continue;
        const id = await ctx.create('milestones', Object.assign({}, s, {
          doneAt: null, notes: '', source: SOURCE, order: ++order, createdAt: ctx.iso(), createdBy: ctx.me()
        }));
        if (!id) { failed = true; break; }
        added++;
      }
      // A failed create already showed its own error toast; don't follow it with a wrong "already added" message.
      if (added) ctx.toast(`Added ${plural(added, 'milestone')} from the ${SOURCE}`);
      else if (!failed) ctx.toast('The plan’s milestones are already on your list.');
    } finally { st.busy = false; }
  }
  async function setStatus(id, status) {
    const m = ctx.get('milestones', id);
    if (!m || !ctx.canWrite()) return;
    const wasDone = isDone(m);
    const ok = await ctx.patch('milestones', id, { status, doneAt: status === 'done' ? today() : null, updatedAt: ctx.iso() });
    if (!ok) return;
    const t = titleOf(m);
    ctx.toast(status === 'done' ? `Marked “${t}” done` : wasDone ? `Reopened “${t}”` : `Started “${t}”`);
  }
  function confirmDelete(id) {
    const m = ctx.get('milestones', id);
    if (!m || !ctx.canWrite()) return;
    ctx.openConfirm('Delete this milestone?',
      `“${titleOf(m)}” will leave your milestone list. This can’t be undone.`,
      'Delete milestone',
      async () => { if (await ctx.remove('milestones', id)) ctx.toast('Deleted ' + titleOf(m)); });
  }
  function openForm(id) {
    const m = id ? ctx.get('milestones', id) : null;
    if (id && !m) return;
    const F = ctx.F;
    const k = m ? metricOf(m) : 'none';
    const tv = m && targetOf(m) != null ? targetOf(m) : '';
    ctx.openFormModal({
      title: m ? 'Edit milestone' : 'New milestone',
      submitLabel: m ? 'Save milestone' : 'Add milestone',
      body:
        F.text('milestones-f-title', 'Milestone', m ? m.title : '', 'required maxlength="160" autocomplete="off" placeholder="e.g. Sign the first multi-location customer"') +
        `<div class="row2">${F.date('milestones-f-date', 'Target date', m ? dateOf(m) : '')}${F.select('milestones-f-status', 'Status', STATUSES, m ? statusOf(m) : 'not-started')}</div>` +
        `<div class="row2">${F.select('milestones-f-metric', 'Track progress with', METRICS, k)}<div id="milestones-f-target-wrap"${k === 'none' ? ' hidden' : ''}>${F.text('milestones-f-target', `<span id="milestones-f-target-label">${TARGET_LABEL[k]}</span>`, tv, 'inputmode="decimal" autocomplete="off"')}</div></div>` +
        '<p class="note" style="margin:0">Paying locations, MRR and ARR come from won deals; cash comes from the opening balance, paid invoices and expenses.</p>' +
        F.area('milestones-f-notes', 'Notes', m ? m.notes : '', 3),
      deleteLabel: m ? 'Delete milestone' : undefined,
      onDelete: m ? () => confirmDelete(m.id) : undefined,
      afterOpen() {
        const sel = document.getElementById('milestones-f-metric');
        if (!sel) return;
        sel.addEventListener('change', () => {
          const v = hasMetric(sel.value) ? sel.value : 'none';
          const wrap = document.getElementById('milestones-f-target-wrap');
          const lab = document.getElementById('milestones-f-target-label');
          if (wrap) wrap.hidden = v === 'none';
          if (lab) lab.textContent = TARGET_LABEL[v];
        });
      },
      onSubmit: async () => {
        const title = ctx.val('milestones-f-title');
        if (!title) return ctx.formErr('Name the milestone.', 'milestones-f-title');
        const date = ctx.val('milestones-f-date');
        if (!date) return ctx.formErr('Pick a target date.', 'milestones-f-date');
        if (!ctx.parseYmd(date)) return ctx.formErr('Enter the target date as YYYY-MM-DD.', 'milestones-f-date');
        if (date < '2000-01-01' || date > '2099-12-31') return ctx.formErr('Check the year: enter a target date between 2000 and 2099.', 'milestones-f-date');
        const kv = ctx.val('milestones-f-metric');
        const metric = hasMetric(kv) ? kv : 'none';
        let targetValue = null;
        if (metric !== 'none') {
          const raw = ctx.val('milestones-f-target').replace(/[$,\s]/g, '');
          if (!raw) return ctx.formErr(metric === 'locations' ? 'Enter how many paying locations to reach.' : 'Enter the dollar amount to reach.', 'milestones-f-target');
          const n = Number(raw);
          if (!isFinite(n) || n <= 0) return ctx.formErr(`Enter the target as a number above 0, like ${metric === 'locations' ? '25' : '250000'}.`, 'milestones-f-target');
          if (metric === 'locations' && !Number.isInteger(n)) return ctx.formErr('Enter a whole number of locations.', 'milestones-f-target');
          targetValue = metric === 'locations' ? n : Math.round(n * 100) / 100;
        }
        const sv = ctx.val('milestones-f-status');
        const status = STATUSES.some(s => s[0] === sv) ? sv : 'not-started';
        const doneAt = status === 'done' ? (m && isDone(m) && doneOn(m) ? doneOn(m) : today()) : null;
        const data = { title, targetDate: date, metric, targetValue, status, doneAt, notes: ctx.val('milestones-f-notes') };
        if (m) {
          const ok = await ctx.patch('milestones', m.id, Object.assign(data, { updatedAt: ctx.iso() }));
          if (ok) ctx.toast('Saved ' + title);
          return ok;
        }
        const newId = await ctx.create('milestones', Object.assign(data, { source: '', order: maxOrder() + 1, createdAt: ctx.iso(), createdBy: ctx.me() }));
        if (newId) ctx.toast('Added ' + title);
        return !!newId;
      }
    });
  }

  /* ---------- render pieces ---------- */
  const btn = (a, label, extra, cls) => `<button class="btn btn-sm ${cls || ''}" type="button" data-act="mod" data-mod="${ID}" data-a="${a}" ${extra || ''}>${label}</button>`;
  function head(loading, n) {
    return ctx.ui.toolbar({
      title: 'Milestones',
      count: loading ? null : plural(n, 'milestone'),
      exportable: !loading && n > 0,
      actions: ctx.canWrite() ? btn('new', 'Add milestone', '', 'btn-primary') : ''
    });
  }
  function emptyState() {
    const items = seeds();
    const last = items[items.length - 1];
    const text = `The ${SOURCE} lay out ${plural(items.length, 'milestone')}, from forming the LLC by ${ctx.fmtDate(items[0].targetDate)}` +
      (last && last.metric === 'arr' ? ` to ${ctx.fmtCompact(last.targetValue)} ARR by ${ctx.fmtDate(last.targetDate)}.` : '.') +
      ' Add them here to track each one against its date. Milestones tied to paying locations, ARR, MRR or cash show live progress from your deals, invoices and expenses.' +
      (ctx.canWrite() ? '' : ' Someone with edit access can add them.');
    const preview = `<ul class="note" style="text-align:left;margin:0;padding-left:18px;max-width:60ch">${items.map(s =>
      `<li>${esc(s.title)} <span class="mono">· ${esc(ctx.fmtDate(s.targetDate))}</span></li>`).join('')}</ul>`;
    const action = preview + (ctx.canWrite()
      ? `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn btn-primary" type="button" data-act="mod" data-mod="${ID}" data-a="seed">Add the plan’s milestones</button><button class="btn" type="button" data-act="mod" data-mod="${ID}" data-a="new">Add a different milestone</button></div>`
      : '');
    return ctx.ui.empty({ title: 'Track the milestones in your plan', text, action });
  }
  function kpiRow(z, t) {
    const ui = ctx.ui, total = z.all.length, over = z.overdue.length;
    const next = z.next;
    let nextVal = DASH, nextSub = 'Every milestone is done';
    if (next) {
      const d = dateOf(next);
      nextVal = d ? esc(ctx.fmtShort(d)) : DASH;
      nextSub = `${esc(titleOf(next))}${d ? ` · <span class="${isOverdue(next, t) ? 'neg' : ''}">${esc(dueText(next, t))}</span>` : ''}`;
    }
    const oldest = z.overdue[0];
    return `<section class="kpis">
      ${ui.kpi({ label: 'Done', value: ctx.fmtNum(z.done), sub: `of ${plural(total, 'milestone')}`, tone: z.done && z.done === total ? 'good' : '', bar: total ? `<div style="margin-top:8px">${ui.progress(z.done / total, 'good')}</div>` : '' })}
      ${ui.kpi({ label: 'In progress', value: ctx.fmtNum(z.inProgress), sub: `${ctx.fmtNum(z.notStarted)} not started yet` })}
      ${ui.kpi({ label: 'Overdue', value: ctx.fmtNum(over), tone: over ? 'bad' : '', sub: oldest ? `Oldest: ${esc(titleOf(oldest))}, ${esc(dueText(oldest, t))}` : 'Nothing past its target date' })}
      ${ui.kpi({ label: 'Next up', value: nextVal, sub: nextSub })}
    </section>`;
  }
  function row(m, t, now) {
    const w = ctx.canWrite(), id = esc(m.id), title = esc(titleOf(m));
    const s = statusOf(m), late = isOverdue(m, t), d = dateOf(m);
    const p = progressOf(m, now);
    let chips = statusChip(m);
    if (late) chips += ctx.ui.chip('Overdue', 'bad');
    if (p && p.reached && s !== 'done') chips += ctx.ui.chip('Target reached', 'good');
    const when = d
      ? `Target ${esc(ctx.fmtDate(d))} · <span class="${late ? 'neg' : ''}">${esc(s === 'done' ? doneText(m) : dueText(m, t))}</span>`
      : (s === 'done' ? esc(doneText(m).replace(/^d/, 'D')) : 'No target date');
    let prog = '';
    if (p) {
      prog = `<div style="display:grid;gap:4px;margin-top:8px;max-width:560px">
          <div style="display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:13px"><span class="muted">${NOW_LABEL[p.k]}</span><span class="mono">${fmtVal(p.k, p.cur)} of ${fmtVal(p.k, p.target)} · ${esc(pct(p.frac))}</span></div>
          ${ctx.ui.progress(Math.min(1, p.frac), p.reached ? 'good' : late ? 'bad' : '')}
        </div>`;
    } else if (metricOf(m) !== 'none') {
      prog = '<p class="note" style="margin:6px 0 0">Add a target value to track progress.</p>';
    }
    const notes = m.notes ? `<p class="note" style="margin:6px 0 0;white-space:pre-line;overflow-wrap:anywhere">${esc(m.notes)}</p>` : '';
    let acts = '';
    if (w) {
      const lab = what => `aria-label="${what} ${title}"`;
      const data = `data-id="${id}"`;
      if (s === 'not-started') acts += btn('start', 'Start', `${data} ${lab('Start')}`);
      if (s !== 'done') acts += btn('done', 'Mark done', `${data} ${lab('Mark done:')}`, p && p.reached ? 'btn-primary' : '');
      else acts += btn('reopen', 'Reopen', `${data} ${lab('Reopen')}`);
      acts += btn('edit', 'Edit', `${data} ${lab('Edit')}`, 'btn-ghost') + btn('delete', 'Delete', `${data} ${lab('Delete')}`, 'btn-ghost btn-danger');
    }
    const foot = m.source || acts
      ? `<div style="display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-top:8px">${m.source ? `<span class="source">${esc(m.source)}</span>` : ''}<span style="flex:1"></span>${acts ? `<div class="row-actions" style="flex-wrap:wrap">${acts}</div>` : ''}</div>`
      : '';
    return `<li class="task-row" style="grid-template-columns:minmax(0,1fr);gap:0;align-items:start;padding:12px 14px">
      <div style="min-width:0">
        <div style="display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap"><span class="cell-main" style="overflow-wrap:anywhere;margin-right:2px">${title}</span>${chips}</div>
        <div class="cell-sub" style="margin-top:2px">${when}</div>
        ${prog}${notes}${foot}
      </div></li>`;
  }
  function section(label, items, t, now, tone) {
    if (!items.length) return '';
    return `<section><h2 class="group-h ${tone || ''}">${label} <span class="n">${items.length}</span></h2><ul class="task-list">${items.map(m => row(m, t, now)).join('')}</ul></section>`;
  }
  function lists(z, t, now) {
    const shown = z.all.filter(m => ctx.matches(m.title, m.notes, m.source));
    if (!shown.length) return ctx.ui.empty({ title: 'No milestones match', text: 'Try another search.' });
    const open = shown.filter(m => !isDone(m)).sort(byTarget);
    const overdue = open.filter(m => isOverdue(m, t));
    const upcoming = open.filter(m => !isOverdue(m, t));
    const done = shown.filter(isDone).sort(byDoneDesc);
    let html = section('Overdue', overdue, t, now, 'bad') + section('Upcoming', upcoming, t, now) + section('Done', done, t, now);
    if (!open.length) html = `<p class="note" style="margin:0">Every milestone${ctx.S.q ? ' that matches your search' : ''} is done.${ctx.canWrite() ? ' Add the next one to keep the plan moving.' : ''}</p>` + html;
    return `<div class="groups" style="margin-bottom:18px">${html}</div>`;
  }
  // Milestones per quarter (per year when the dates span more than four years).
  function buckets(all) {
    const dated = all.filter(dateOf);
    if (!dated.length) return null;
    const qk = d => Number(d.slice(0, 4)) * 4 + Math.floor((Number(d.slice(5, 7)) - 1) / 3);
    const keys = dated.map(m => qk(dateOf(m)));
    const lo = Math.min.apply(null, keys), hi = Math.max.apply(null, keys);
    const yearly = hi - lo + 1 > 16;
    const key = d => (yearly ? Number(d.slice(0, 4)) : qk(d));
    const from = yearly ? Math.floor(lo / 4) : lo, to = yearly ? Math.floor(hi / 4) : hi;
    const rows = [];
    for (let k = from; k <= to; k++) {
      const y = yearly ? k : Math.floor(k / 4), q = yearly ? 0 : (k % 4) + 1;
      rows.push({ k, label: yearly ? String(y) : `Q${q} ’${String(y).slice(2)}`, long: yearly ? String(y) : `Q${q} ${y}`, total: 0, done: 0 });
    }
    dated.forEach(m => { const r = rows[key(dateOf(m)) - from]; if (r) { r.total++; if (isDone(m)) r.done++; } });
    return { rows, yearly };
  }
  function timelinePanel(z) {
    const b = buckets(z.all);
    if (!b) return '';
    const unit = b.yearly ? 'year' : 'quarter';
    const chart = ctx.chart.bars({
      labels: b.rows.map(r => r.label),
      series: [{ name: 'Milestones due', values: b.rows.map(r => r.total), color: 'var(--viz-1)' }],
      height: 180,
      // Counts are whole numbers: leave fractional y-axis ticks (0.25, 0.5...) unlabeled so they don't round to repeats.
      format: v => (Number.isInteger(v) ? ctx.fmtNum(v) : ''),
      ariaLabel: 'Milestones due per ' + unit + ': ' + b.rows.filter(r => r.total).map(r => `${r.long} ${r.total}`).join(', ')
    });
    const text = b.rows.filter(r => r.total).map(r => `${r.long}: ${r.total}${r.done ? ` (${r.done} done)` : ''}`).join(' · ');
    const undated = z.all.length - z.all.filter(dateOf).length;
    return ctx.ui.panel({
      title: 'Milestones by target ' + unit,
      body: `${chart}<p class="note">${esc(text)}.${undated ? ` ${plural(undated, 'milestone')} without a target date ${undated === 1 ? 'is' : 'are'} left out.` : ''}</p>`
    });
  }
  function nowPanel(now, t) {
    const r = (label, v, sub) => `<div class="stat-row"><dt>${label}${sub ? ` <span class="source">${sub}</span>` : ''}</dt><dd>${v}</dd></div>`;
    const body = `<dl class="stat-list">
        ${r('Paying locations', ctx.fmtNum(now.locations), 'active won deals')}
        ${r('MRR', ctx.fmtMoney(now.mrr), 'active won deals')}
        ${r('ARR', ctx.fmtMoney(now.arr), 'MRR × 12')}
        ${r('Cash in the bank', `<span class="${now.cash < 0 ? 'neg' : ''}">${ctx.fmtMoney(now.cash)}</span>`, 'opening balance + paid invoices − expenses')}
      </dl>
      <p class="note">Metric milestones compare these numbers to their targets. They update as you win deals, record payments and log expenses.</p>`;
    return ctx.ui.panel({ title: 'What progress is measured against', sub: 'As of ' + ctx.fmtDate(t), body });
  }

  return {
    id: ID,
    label: 'Milestones',
    group: 'Planning',
    order: 40,
    // Cash milestones read ctx.cashOn(), which sums paid invoices and expenses, so subscribe to both.
    collections: ['milestones', 'invoices', 'expenses'],
    newItems: [{ label: 'Milestone', a: 'new' }],
    badge() {
      if (ctx.isLoading()) return null;
      const t = today();
      const n = list().filter(m => isOverdue(m, t)).length;
      return n ? { text: String(n), hot: true, title: `${plural(n, 'milestone')} overdue` } : null;
    },
    render() {
      const loading = ctx.isLoading();
      if (loading) return head(true, 0) + '<div class="empty"><p>Loading milestones…</p></div>';
      const t = today();
      const z = summary(t);
      if (!z.all.length) return head(false, 0) + emptyState();
      const now = snapshot(t);
      return head(false, z.all.length) +
        kpiRow(z, t) +
        lists(z, t, now) +
        `<div class="grid grid-2 section">${timelinePanel(z)}${nowPanel(now, t)}</div>`;
    },
    onAction(a, data) {
      if (a === 'new') return openForm(null);
      if (a === 'edit') return openForm(data.id);
      if (a === 'delete') return confirmDelete(data.id);
      if (a === 'start') return setStatus(data.id, 'in-progress');
      if (a === 'done') return setStatus(data.id, 'done');
      if (a === 'reopen') return setStatus(data.id, 'in-progress');
      if (a === 'seed') return seed();
    },
    csv() {
      const t = today(), now = snapshot(t);
      const rows = [['Milestone', 'Target date', 'Status', 'Overdue', 'Days left (negative = late)', 'Done on', 'Metric', 'Target value', 'Current value', 'Progress', 'Notes', 'Source', 'Created']];
      list().slice().sort(byTarget).forEach(m => {
        const p = progressOf(m, now), d = dateOf(m), k = metricOf(m);
        const left = d && !isDone(m) ? daysBetween(t, d) : null;
        rows.push([
          titleOf(m), d, (STATUSES.find(s => s[0] === statusOf(m)) || STATUSES[0])[1], isOverdue(m, t) ? 'Yes' : 'No',
          left == null ? '' : left, isDone(m) ? doneOn(m) : '', k === 'none' ? '' : (METRICS.find(x => x[0] === k) || METRICS[0])[1],
          targetOf(m) == null ? '' : targetOf(m), p ? Math.round(p.cur * 100) / 100 : '', p ? Math.round(p.frac * 10000) / 10000 : '',
          String(m.notes || ''), String(m.source || ''), ctx.isoToYmd(m.createdAt) || ''
        ]);
      });
      return { name: 'milestones', rows };
    }
  };
});
</script>
<script>
/* ---- tab module: team ---- */
(window.__dbViews = window.__dbViews || []).push(function (ctx) {
  'use strict';
  /* Team & hiring: the headcount and payroll plan. Each role is a doc in `hires`:
     {role, name, startMonth 'YYYY-MM', endMonth 'YYYY-MM'|null (last month employed), annualSalary|null,
      status 'planned'|'open'|'hired', notes, order, createdAt, createdBy}.
     A role counts in a month when startMonth <= month and (no endMonth, or endMonth >= month), whatever its status.
     Payroll for a year = annualSalary / 12 x months employed in that year. Roles without a salary count as $0
     and are flagged, so the comparison with the plan reads as incomplete rather than as savings. */
  const ID = 'team';
  const COLL = 'hires';
  const STATUS = [['planned', 'Planned'], ['open', 'Open (recruiting)'], ['hired', 'Hired']];
  const STATUS_LABEL = { planned: 'Planned', open: 'Open', hired: 'Hired' };
  const STATUS_TONE = { planned: '', open: 'accent', hired: 'good' };
  const st = { busy: false };

  /* ---------- small helpers ---------- */
  const isYm = s => {
    const m = /^(\d{4})-(\d{2})$/.exec(String(s || ''));
    return !!m && +m[2] >= 1 && +m[2] <= 12;
  };
  function normYm(s) {
    const m = /^(\d{4})[-/](\d{1,2})(?:[-/]\d{1,2})?$/.exec(String(s || '').trim());
    if (!m || +m[2] < 1 || +m[2] > 12) return null;
    return `${m[1]}-${ctx.pad(+m[2])}`;
  }
  const curYm = () => ctx.ymOf(ctx.todayStr());
  const curYear = () => Number(curYm().slice(0, 4));
  const monthsBetween = (a, b) => (Number(b.slice(0, 4)) - Number(a.slice(0, 4))) * 12 + Number(b.slice(5, 7)) - Number(a.slice(5, 7));
  const plural = (n, w, pl) => `${ctx.fmtNum(n)} ${n === 1 ? w : (pl || w + 's')}`;
  const money = n => ctx.fmtMoney(Math.round(ctx.num(n)));
  const mLabel = ym => (isYm(ym) ? ctx.monthLabel(ym) : '');
  const btn = (a, text, extra, cls) => `<button class="btn btn-sm ${cls || ''}" type="button" data-act="mod" data-mod="${ID}" data-a="${a}" ${extra || ''}>${text}</button>`;
  function listText(names) {
    const n = names.map(x => String(x));
    if (n.length <= 1) return n.join('');
    if (n.length === 2) return `${n[0]} and ${n[1]}`;
    if (n.length <= 3) return `${n.slice(0, -1).join(', ')} and ${n[n.length - 1]}`;
    return `${n.slice(0, 3).join(', ')} and ${n.length - 3} more`;
  }

  const hasSalary = h => !!h && h.annualSalary != null && h.annualSalary !== '' && isFinite(Number(h.annualSalary)) && Number(h.annualSalary) >= 0;
  const salary = h => (hasSalary(h) ? Number(h.annualSalary) : 0);
  const statusOf = h => (h && STATUS_LABEL[h.status] ? h.status : 'planned');
  const startOf = h => (isYm(h.startMonth) ? h.startMonth : null);
  const endOf = h => (isYm(h.endMonth) ? h.endMonth : null);
  const roleName = h => String(h.role || '').trim() || 'Untitled role';
  const employedIn = (h, ym) => !!startOf(h) && h.startMonth <= ym && (!endOf(h) || h.endMonth >= ym);
  function monthsIn(h, y) {
    const s = startOf(h);
    if (!s) return 0;
    const jan = `${y}-01`, dec = `${y}-12`, e = endOf(h);
    const from = s > jan ? s : jan, to = e && e < dec ? e : dec;
    return from > to ? 0 : monthsBetween(from, to) + 1;
  }
  const payrollFor = (list, y) => ctx.sum(list, h => salary(h) / 12 * monthsIn(h, y));
  const noSalaryIn = (list, y) => list.filter(h => !hasSalary(h) && monthsIn(h, y) > 0);
  const headAt = (list, ym) => list.filter(h => employedIn(h, ym)).length;
  function planNum(v) { return v == null || v === '' || !isFinite(Number(v)) ? null : Number(v); }
  const planTeam = y => planNum((ctx.plan().team || {})[y]);
  const planPay = y => planNum(((ctx.plan().opex || {}).payroll || {})[y]);
  const salesAt = () => ctx.num(ctx.plan().hireSalesAtArr);

  function sorted(list) {
    return list.slice().sort((a, b) => {
      const sa = startOf(a) || '9999-99', sb = startOf(b) || '9999-99';
      if (sa !== sb) return sa < sb ? -1 : 1;
      return (ctx.num(a.order) - ctx.num(b.order)) || String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
    });
  }
  const hires = () => sorted(ctx.all(COLL));
  const maxOrder = () => ctx.all(COLL).reduce((m, h) => Math.max(m, ctx.num(h.order)), 0);
  const upcoming = list => list.filter(h => (statusOf(h) === 'planned' || statusOf(h) === 'open') && startOf(h));
  const pastDue = h => (statusOf(h) === 'planned' || statusOf(h) === 'open') && !!startOf(h) && h.startMonth < curYm();

  /* ---------- KPIs ---------- */
  function kpiRow(list) {
    const ym = curYm(), y = curYear(), years = ctx.planYears();
    const team = list.filter(h => statusOf(h) === 'hired' && employedIn(h, ym));
    const later = list.filter(h => statusOf(h) === 'hired' && startOf(h) && h.startMonth > ym);
    let teamSub;
    if (team.length) teamSub = ctx.esc(listText(team.map(h => h.name ? `${h.name}` : roleName(h))));
    else if (later.length) teamSub = `${plural(later.length, 'hire')} starting later, first in ${ctx.esc(mLabel(later[0].startMonth))}`;
    else teamSub = 'No one hired yet';
    const pt = planTeam(y);
    if (pt != null) teamSub += ` · plan ${ctx.fmtNum(pt)} in ${y}`;

    const open = list.filter(h => statusOf(h) === 'open').length;
    const planned = list.filter(h => statusOf(h) === 'planned').length;
    const late = list.filter(pastDue).length;

    const pay = payrollFor(list, y), missing = noSalaryIn(list, y).length;
    const pp = planPay(y);
    let paySub;
    if (pp != null) paySub = `Plan ${y}: ${money(pp)}`;
    else if (years.length && y < years[0]) paySub = `No plan payroll in ${y}. ${years[0]}: ${money(payrollFor(list, years[0]))} on your list, ${planPay(years[0]) == null ? 'no plan figure' : money(planPay(years[0])) + ' planned'}`;
    else paySub = `No plan payroll for ${y}`;
    if (missing) paySub += ` · ${plural(missing, 'salary', 'salaries')} not set`;

    const next = upcoming(list)[0];
    let nextKpi;
    if (next) {
      const away = monthsBetween(ym, next.startMonth);
      const when = away > 0 ? `in ${plural(away, 'month')}` : away === 0 ? 'this month' : `${plural(-away, 'month')} late`;
      nextKpi = ctx.ui.kpi({
        label: 'Next hire', value: ctx.esc(mLabel(next.startMonth)), tone: away < 0 ? 'warn' : '',
        sub: `${ctx.esc(roleName(next))} · ${ctx.esc(STATUS_LABEL[statusOf(next)].toLowerCase())} · ${when}`
      });
    } else nextKpi = ctx.ui.kpi({ label: 'Next hire', value: '—', sub: 'No planned or open roles with a start month' });

    return `<section class="kpis">
      ${ctx.ui.kpi({ label: 'Team today', value: ctx.fmtNum(team.length), sub: teamSub })}
      ${ctx.ui.kpi({ label: 'Planned hires', value: ctx.fmtNum(open + planned), tone: late ? 'warn' : '', sub: `${ctx.fmtNum(open)} open, ${ctx.fmtNum(planned)} planned${late ? ` · ${plural(late, 'start month')} passed` : ''}` })}
      ${ctx.ui.kpi({ label: `Payroll ${y}`, value: money(pay), sub: paySub })}
      ${nextKpi}
    </section>`;
  }

  /* ---------- plan comparison ---------- */
  function yearRows(list) {
    return ctx.planYears().map(y => {
      const pt = planTeam(y), pp = planPay(y);
      const head = headAt(list, `${y}-12`), pay = payrollFor(list, y);
      return { y, pt, pp, head, pay, missing: noSalaryIn(list, y) };
    });
  }
  function headDiff(d) {
    if (d == null) return '<td class="num muted">—</td>';
    d = Math.round(d * 10) / 10;
    if (d === 0) return '<td class="num muted">Matches</td>';
