    return `<td class="num">${d > 0 ? `${ctx.fmtNum(d, 1)} more` : `${ctx.fmtNum(-d, 1)} fewer`}</td>`;
  }
  /* partial: some roles in that period have no salary, so the list's payroll is a floor, not a total. */
  function payDiff(d, partial) {
    if (d == null) return '<td class="num muted">—</td>';
    const r = Math.round(d);
    if (r === 0) return `<td class="num muted">${partial ? 'Matches so far' : 'Matches'}</td>`;
    const amt = money(Math.abs(r));
    return `<td class="num${r > 0 ? ' neg' : ''}">${r > 0 ? `${partial ? 'At least ' : ''}${amt} over` : `${partial ? 'Up to ' : ''}${amt} under`}</td>`;
  }

  function vsPlanPanel(list, rows) {
    if (!rows.length) {
      return ctx.ui.panel({ title: 'Headcount and payroll vs plan', body: '<p class="muted" style="margin:0">No plan years are set. Add them on the Assumptions tab.</p>' });
    }
    const body = rows.map(r => `<tr>
        <td><strong>${r.y}</strong></td>
        <td class="num">${r.pt == null ? '—' : ctx.fmtNum(r.pt, 1)}</td>
        <td class="num">${ctx.fmtNum(r.head)}</td>
        ${headDiff(r.pt == null ? null : r.head - r.pt)}
        <td class="num">${r.pp == null ? '—' : money(r.pp)}</td>
        <td class="num">${money(r.pay)}${r.missing.length ? ` <span class="chip chip-warn" title="${ctx.esc(listText(r.missing.map(roleName)))}">${plural(r.missing.length, 'salary', 'salaries')} not set</span>` : ''}</td>
        ${payDiff(r.pp == null ? null : r.pay - r.pp, r.missing.length > 0)}
      </tr>`).join('');
    /* Totals compare the same years on both sides: only years that have a plan payroll figure. */
    const withPlan = rows.filter(r => r.pp != null);
    const totRows = withPlan.length ? withPlan : rows;
    const tp = withPlan.length ? ctx.sum(withPlan, r => r.pp) : null;
    const tl = ctx.sum(totRows, r => r.pay);
    const totLabel = withPlan.length && withPlan.length < rows.length ? `Payroll, ${listText(withPlan.map(r => r.y))}` : `${rows.length}-year payroll`;
    const foot = `<tr><td colspan="4"><strong>${ctx.esc(totLabel)}</strong></td><td class="num"><strong>${tp == null ? '—' : money(tp)}</strong></td><td class="num"><strong>${money(tl)}</strong></td>${payDiff(tp == null ? null : tl - tp, totRows.some(r => r.missing.length))}</tr>`;
    const head = '<tr><th>Year</th><th class="num">Plan team</th><th class="num">Your list, Dec</th><th class="num">Difference</th><th class="num">Plan payroll</th><th class="num">Your list payroll</th><th class="num">Difference</th></tr>';

    const gapYears = rows.filter(r => r.missing.length);
    const noSal = [];
    gapYears.forEach(r => r.missing.forEach(h => { if (noSal.indexOf(h) < 0) noSal.push(h); }));
    const undated = list.filter(h => !startOf(h));
    let note = '';
    if (gapYears.length) {
      note += `Roles without a salary count as $0, so payroll on your list is incomplete for ${ctx.esc(listText(gapYears.map(r => r.y)))}. Set a salary for ${ctx.esc(listText(noSal.map(roleName)))} to finish the comparison. `;
    }
    if (undated.length) note += `${plural(undated.length, 'role')} without a start month ${undated.length === 1 ? 'is' : 'are'} left out. `;
    note += `“Your list” counts every role, planned, open or hired, between its start and end months; headcount is at December. The plan’s team and payroll come from the Assumptions tab. <button class="link" type="button" data-act="go" data-view="assumptions">Change the plan</button>`;
    return ctx.ui.panel({
      title: 'Headcount and payroll vs plan', sub: 'Per plan year',
      body: `<div class="table-wrap flat"><table class="compact" style="min-width:0"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div><p class="note">${note}</p>`
    });
  }

  function chartPanel(rows) {
    if (!rows.length) return '';
    const plan = rows.map(r => (r.pp == null ? null : Math.round(r.pp)));
    const mine = rows.map(r => Math.round(r.pay));
    const chart = ctx.chart.bars({
      labels: rows.map(r => String(r.y)), height: 220, format: ctx.fmtCompact,
      ariaLabel: 'Payroll per plan year: plan compared with your list',
      series: [{ name: 'Plan', values: plan, color: 'var(--viz-plan)' }, { name: 'Your list', values: mine, color: 'var(--viz-1)' }]
    });
    const text = rows.map(r => `${r.y}: plan ${r.pp == null ? '—' : ctx.fmtCompact(r.pp)}, your list ${ctx.fmtCompact(r.pay)}`).join('; ');
    return ctx.ui.panel({ title: 'Payroll per year', sub: 'Plan vs your list', body: `${chart}<p class="note">${ctx.esc(text)}.</p>` });
  }

  /* ---------- hiring trigger ---------- */
  function triggerPanel(list) {
    const thr = salesAt();
    if (!(thr > 0)) {
      return ctx.ui.panel({ title: 'Hiring trigger', body: '<p class="muted" style="margin:0">The plan has no ARR level for hiring the first salesperson. Set one on the Assumptions tab.</p>' });
    }
    const arr = ctx.mrrOn(ctx.todayStr()) * 12;
    const frac = arr / thr, gap = thr - arr, passed = arr >= thr;
    const sales = list.filter(h => /sales/i.test(String(h.role || '')));
    const s = sales.find(h => statusOf(h) !== 'hired') || sales[0] || null;
    const cross = ctx.planModel('base').find(r => ctx.num(r.arr) >= thr);
    const lines = [];
    lines.push(`The plan says to hire the first salesperson once ARR passes ${money(thr)}.`);
    lines.push(cross ? `The base model gets there in ${ctx.esc(mLabel(cross.ym))}.` : 'The base model does not get there inside the plan years.');
    if (s) {
      const sm = startOf(s);
      const who = ctx.esc(roleName(s));
      if (statusOf(s) === 'hired') lines.push(`${who} is hired${sm ? ` from ${ctx.esc(mLabel(sm))}` : ''}.`);
      else lines.push(`Your list starts ${who} in ${sm ? ctx.esc(mLabel(sm)) : 'no set month'}${passed ? '; ARR is already past the trigger, so consider starting now' : ''}.`);
    } else lines.push(`No sales role is on your list yet.${ctx.canWrite() ? ' Add one to plan the hire.' : ''}`);
    const body = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px;font-size:13px"><span class="muted">${passed ? 'Trigger passed' : `${ctx.fmtPct(frac, 1)} of the way`}</span><span class="mono">${money(arr)} / ${money(thr)}</span></div>
      ${ctx.ui.progress(frac, passed ? 'good' : '')}
      <dl class="stat-list" style="margin-top:12px">
        <div class="stat-row"><dt>Current ARR</dt><dd id="team-arr">${money(arr)}</dd></div>
        <div class="stat-row"><dt>Hire the first salesperson at</dt><dd>${money(thr)}</dd></div>
        <div class="stat-row total"><dt>${passed ? 'Past the trigger by' : 'Gap'}</dt><dd>${money(Math.abs(gap))}</dd></div>
      </dl>
      <p class="note">${lines.join(' ')} ARR is the monthly revenue of active customers today times 12.</p>`;
    return ctx.ui.panel({ title: 'Hiring trigger', sub: 'First salesperson', body });
  }

  /* ---------- roles table ---------- */
  function rolesPanel(list) {
    const w = ctx.canWrite();
    const rows = list.filter(h => ctx.matches(h.role, h.name, h.notes, STATUS_LABEL[statusOf(h)]));
    const q = String(ctx.S.q || '').trim();
    const add = w ? btn('new', 'Add role', '', 'btn-primary') : '';
    const counts = ['hired', 'open', 'planned'].map(s => `${ctx.fmtNum(list.filter(h => statusOf(h) === s).length)} ${STATUS_LABEL[s].toLowerCase()}`).join(', ');
    if (!rows.length) {
      return ctx.ui.panel({ title: 'Roles', sub: `${plural(list.length, 'role')}: ${counts}`, actions: add, body: `<p class="muted" style="margin:0">No roles match “${ctx.esc(q)}”. Try another search.</p>` });
    }
    const body = rows.map(h => {
      const id = ctx.esc(h.id), label = ctx.esc(roleName(h));
      const s = statusOf(h);
      return `<tr>
        <td><div class="trunc"><strong>${label}</strong></div>${h.notes ? `<div class="trunc muted" style="font-size:12.5px" title="${ctx.esc(h.notes)}">${ctx.esc(h.notes)}</div>` : ''}</td>
        <td><div class="trunc">${h.name ? ctx.esc(h.name) : '<span class="muted">—</span>'}</div></td>
        <td style="white-space:nowrap">${startOf(h) ? ctx.esc(mLabel(h.startMonth)) : ctx.ui.chip('Not set', 'warn')}</td>
        <td style="white-space:nowrap">${endOf(h) ? ctx.esc(mLabel(h.endMonth)) : '<span class="muted">—</span>'}</td>
        <td class="num">${hasSalary(h) ? money(h.annualSalary) : ctx.ui.chip('Not set', 'warn')}</td>
        <td style="white-space:nowrap">${ctx.ui.chip(STATUS_LABEL[s], STATUS_TONE[s])}${pastDue(h) ? ' ' + ctx.ui.chip('Start passed', 'warn') : ''}</td>
        ${w ? `<td><div class="row-actions">${btn('edit', 'Edit', `data-id="${id}" aria-label="Edit ${label}"`, 'btn-ghost')}${btn('delete', 'Delete', `data-id="${id}" aria-label="Delete ${label}"`, 'btn-ghost btn-danger')}</div></td>` : ''}
      </tr>`;
    }).join('');
    const head = `<tr><th>Role</th><th>Name</th><th>Start</th><th>End</th><th class="num">Annual salary</th><th>Status</th>${w ? '<th aria-label="Actions"></th>' : ''}</tr>`;
    return ctx.ui.panel({
      title: 'Roles', sub: `${plural(list.length, 'role')}: ${counts}${q ? ` · ${rows.length} matching “${q}”` : ''}`, actions: add,
      body: `<div class="table-wrap flat"><table class="compact"><thead>${head}</thead><tbody>${body}</tbody></table></div>`
    });
  }

  /* ---------- empty state ---------- */
  /* The plan's team as roles: one per person the plan adds each year. Only the founder (first person) and the
     first salesperson (second) are named in the plan; the founder's salary is the first plan year's payroll
     when the plan has one person that year. */
  function planSeed() {
    const years = ctx.planYears(), out = [];
    const thr = salesAt();
    let count = 0;
    years.forEach((y, i) => {
      const t = planTeam(y);
      if (t == null) return;
      const goal = Math.min(50, Math.max(0, Math.round(t)));
      let k = 0;
      while (count < goal) {
        count++; k++;
        const base = { name: '', endMonth: null, annualSalary: null, status: 'planned', notes: '' };
        if (count === 1) {
          const pay = planPay(y);
          const solo = i === 0 && goal === 1 && pay != null;
          out.push(Object.assign(base, {
            role: 'Founder', startMonth: `${y}-01`, annualSalary: solo ? pay : null, status: 'hired',
            notes: solo ? `The plan’s ${y} payroll of ${money(pay)} is founder-only.` : ''
          }));
        } else if (count === 2) {
          out.push(Object.assign(base, { role: 'First salesperson', startMonth: `${y}-03`, notes: thr > 0 ? `Once ARR passes ${money(thr)}` : '' }));
        } else if (count === 3) {
          out.push(Object.assign(base, { role: 'Customer success', startMonth: `${y}-07`, notes: `Plan has ${ctx.fmtNum(goal)} people in ${y}; role not named in the plan` }));
        } else {
          const mm = ['01', '04', '07', '10'][(k - 1) % 4];
          out.push(Object.assign(base, { role: `Hire ${count}`, startMonth: `${y}-${mm}`, notes: `Plan has ${ctx.fmtNum(goal)} people in ${y}; role not named in the plan` }));
        }
      }
    });
    return out;
  }

  function emptyState() {
    const w = ctx.canWrite(), years = ctx.planYears();
    const parts = years.filter(y => planTeam(y) != null).map(y => `${plural(planTeam(y), 'person', 'people')} in ${y}${planPay(y) != null ? ` (${money(planPay(y))} payroll)` : ''}`);
    const seed = planSeed();
    const intro = w
      ? 'List the people on the team and the roles you plan to hire, each with a start month and salary, to see headcount and payroll against the plan.'
      : 'No roles are on the list yet. Once someone with edit access adds the team and planned hires, headcount and payroll show here against the plan.';
    const text = `${intro}${parts.length ? ` The plan has ${listText(parts)}.` : ''}${w && seed.length ? ` Start from the plan’s ${plural(seed.length, 'role')} and fill in names and salaries as you go.` : ''}`;
    const action = w ? `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${seed.length ? `<button class="btn btn-primary" type="button" data-act="mod" data-mod="${ID}" data-a="seed"${st.busy ? ' disabled' : ''}>Add the plan’s team</button>` : ''}<button class="btn${seed.length ? '' : ' btn-primary'}" type="button" data-act="mod" data-mod="${ID}" data-a="new">Add a role</button></div>` : '';
    return ctx.ui.empty({ title: 'Plan your team and payroll', text, action });
  }

  /* ---------- writes ---------- */
  async function seed() {
    if (st.busy || !ctx.canWrite()) return;
    if (ctx.all(COLL).length) { ctx.toast('Your list already has roles. Add more one at a time.'); return; }
    const list = planSeed();
    if (!list.length) return;
    st.busy = true; ctx.render();
    try {
      let order = maxOrder(), added = 0;
      for (const h of list) {
        const id = await ctx.create(COLL, Object.assign({}, h, { order: ++order, createdAt: ctx.iso(), createdBy: ctx.me() }));
        if (!id) break;
        added++;
      }
      if (added) ctx.toast(added === list.length ? `Added the plan’s team: ${plural(added, 'role')}` : `Added ${plural(added, 'role')} of ${list.length}`);
    } finally { st.busy = false; ctx.render(); }
  }

  function openForm(h) {
    const editing = !!(h && h.id), r = h || {};
    const body = `<div class="row2">${ctx.F.text('team-f-role', 'Role', r.role || '', 'maxlength="80" autocomplete="off" placeholder="e.g. Account executive" required')}${ctx.F.text('team-f-name', 'Name', r.name || '', 'maxlength="80" autocomplete="off" placeholder="Blank until someone is hired"')}</div>`
      + `<div class="row2">${ctx.F.text('team-f-start', 'Start month', isYm(r.startMonth) ? r.startMonth : ctx.addMonths(curYm(), 1), 'type="month" placeholder="YYYY-MM"')}${ctx.F.text('team-f-end', 'End month (optional)', isYm(r.endMonth) ? r.endMonth : '', 'type="month" placeholder="YYYY-MM"')}</div>`
      + `<div class="row2">${ctx.F.money('team-f-salary', 'Annual salary ($, optional)', hasSalary(r) ? r.annualSalary : '', 'placeholder="Not set"')}${ctx.F.select('team-f-status', 'Status', STATUS, statusOf(r))}</div>`
      + ctx.F.area('team-f-notes', 'Notes', r.notes || '', 2);
    ctx.openFormModal({
      title: editing ? 'Edit role' : 'Add role',
      submitLabel: editing ? 'Save changes' : 'Add role',
      body,
      deleteLabel: editing ? 'Delete' : undefined,
      onDelete: editing ? () => confirmDelete(r.id) : undefined,
      onSubmit: async () => {
        const role = ctx.val('team-f-role');
        if (!role) return ctx.formErr('Add the role, like Account executive.', 'team-f-role');
        const startMonth = normYm(ctx.val('team-f-start'));
        if (!startMonth) return ctx.formErr('Pick the start month, like 2027-03.', 'team-f-start');
        const endRaw = ctx.val('team-f-end');
        let endMonth = null;
        if (endRaw) {
          endMonth = normYm(endRaw);
          if (!endMonth) return ctx.formErr('Enter the end month like 2028-06, or leave it blank.', 'team-f-end');
          if (endMonth < startMonth) return ctx.formErr('The end month comes before the start month.', 'team-f-end');
        }
        const salRaw = ctx.val('team-f-salary');
        let annualSalary = null;
        if (salRaw) {
          annualSalary = ctx.parseMoney(salRaw);
          if (annualSalary == null) return ctx.formErr('Enter the annual salary in dollars, like 85000, or leave it blank.', 'team-f-salary');
        }
        const status = STATUS_LABEL[ctx.val('team-f-status')] ? ctx.val('team-f-status') : 'planned';
        const fields = { role, name: ctx.val('team-f-name'), startMonth, endMonth, annualSalary, status, notes: ctx.val('team-f-notes') };
        if (editing) {
          const ok = await ctx.patch(COLL, r.id, Object.assign(fields, { updatedAt: ctx.iso() }));
          if (!ok) return false;
          ctx.toast(`${role} updated`);
          return true;
        }
        const id = await ctx.create(COLL, Object.assign(fields, { order: maxOrder() + 1, createdAt: ctx.iso(), createdBy: ctx.me() }));
        if (!id) return false;
        ctx.toast(`Added ${role}, starting ${mLabel(startMonth)}`);
        return true;
      }
    });
  }

  function confirmDelete(id) {
    const h = ctx.get(COLL, id);
    if (!h) return;
    const who = roleName(h) + (h.name ? ` (${h.name})` : '');
    ctx.openConfirm('Delete this role?', `${who}${startOf(h) ? `, starting ${mLabel(h.startMonth)}` : ''}. It leaves your headcount and payroll plan. This can’t be undone.`, 'Delete role', async () => {
      if (await ctx.remove(COLL, id)) ctx.toast('Role deleted');
    });
  }

  /* ---------- module ---------- */
  return {
    id: ID,
    label: 'Team & hiring',
    group: 'Planning',
    order: 50,
    collections: [COLL],
    newItems: [{ label: 'Role', a: 'new' }],
    badge() {
      if (ctx.isLoading()) return null;
      const late = ctx.all(COLL).filter(pastDue).length;
      return late ? { text: String(late), hot: true, title: `${plural(late, 'planned role')} past ${late === 1 ? 'its' : 'their'} start month` } : null;
    },
    render() {
      const w = ctx.canWrite();
      const add = w ? btn('new', 'Add role', '', 'btn-primary') : '';
      if (ctx.isLoading()) {
        return ctx.ui.toolbar({ title: 'Team & hiring', actions: add }) + '<div class="empty"><p>Loading the team…</p></div>';
      }
      const list = hires();
      if (!list.length) {
        return ctx.ui.toolbar({ title: 'Team & hiring', count: '0 roles', actions: add, exportable: true })
          + emptyState()
          + `<div class="grid grid-2 section">${triggerPanel(list)}</div>`;
      }
      const rows = yearRows(list);
      return ctx.ui.toolbar({ title: 'Team & hiring', count: plural(list.length, 'role'), actions: add, exportable: true })
        + kpiRow(list)
        + `<div class="section">${vsPlanPanel(list, rows)}</div>`
        + `<div class="grid grid-2 section">${chartPanel(rows)}${triggerPanel(list)}</div>`
        + `<div class="section">${rolesPanel(list)}</div>`;
    },
    onAction(a, d) {
      if (a === 'new') return openForm(null);
      if (a === 'edit') { const h = ctx.get(COLL, d.id); if (h) openForm(h); else ctx.toast('That role no longer exists.', 'bad'); return; }
      if (a === 'delete') return confirmDelete(d.id);
      if (a === 'seed') return seed();
    },
    csv() {
      const rows = [['Role', 'Name', 'Status', 'Start month', 'End month', 'Annual salary', 'Notes', 'Created']];
      hires().forEach(h => {
        rows.push([roleName(h), h.name || '', STATUS_LABEL[statusOf(h)], startOf(h) || '', endOf(h) || '', hasSalary(h) ? Number(h.annualSalary) : '', h.notes || '', ctx.isoToYmd(h.createdAt)]);
      });
      return { name: 'team', rows };
    }
  };
});
</script>
<script>
/* ---- tab module: assumptions ---- */
(window.__dbViews = window.__dbViews || []).push(function (ctx) {
  'use strict';
  /* Assumptions: the plan every other tab reads (settings/plan). The founder edits a draft copy here, watches the
     base case move in a live preview, then saves it for everyone. Also sets the cash starting point (settings/finance).
     Every number shown comes from ctx.plan(), ctx.PLAN_DEFAULTS (the projections doc) or ctx.finance(). */
  const ID = 'assumptions';
  const { esc, num, fmtMoney, fmtCompact, fmtPrice, fmtPct, fmtNum, ui } = ctx;
  const SCEN_ORDER = ['conservative', 'base', 'upside'];
  const SCEN_LABEL = { conservative: 'Conservative', base: 'Base', upside: 'Upside' };
  /* [field, column title, kind] for each number a target can carry */
  const TARGET_COLS = [['locations', 'Locations', 'count'], ['arr', 'ARR', 'money'], ['revenue', 'Revenue', 'money'], ['opIncome', 'Operating income', 'smoney']];

  /* draft: deep copy of the saved plan being edited; base: the saved plan it was copied from;
     text: what the founder typed, per key; bad: per-key parse/range message (the draft keeps the last valid number). */
  const st = { draft: null, base: null, fields: [], byKey: {}, text: {}, bad: {}, conflict: false, saving: false };

  /* ---------- small helpers ---------- */
  const clone = o => JSON.parse(JSON.stringify(o == null ? null : o));
  const isNum = v => typeof v === 'number' && isFinite(v);
  const keyOf = path => path.join('.');
  const domId = key => ID + '-f-' + String(key).replace(/[^A-Za-z0-9]/g, '-');
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
  const round2 = v => Math.round(v * 100) / 100;
  const pctStr = f => String(Math.round(num(f) * 1e6) / 1e4); // 0.18 -> "18", 0.025 -> "2.5"
  function getPath(o, path) {
    let c = o;
    for (let i = 0; i < path.length; i++) { if (c == null || typeof c !== 'object') return undefined; c = c[path[i]]; }
    return c;
  }
  function setPath(o, path, v) {
    let c = o;
    for (let i = 0; i < path.length - 1; i++) {
      const p = path[i];
      if (c[p] == null || typeof c[p] !== 'object') c[p] = typeof path[i + 1] === 'number' ? [] : {};
      c = c[p];
    }
    c[path[path.length - 1]] = v;
  }
  function asNum(v) {
    if (v == null || v === '' || typeof v === 'boolean') return null;
    const n = Number(v);
    return isFinite(n) ? n : null;
  }
  function same(a, b) {
    const x = asNum(a), y = asNum(b);
    if (x != null && y != null) return Math.abs(x - y) < 1e-9;
    const ae = a == null || a === '', be = b == null || b === '';
    if (ae || be) return ae && be;
    return a === b || JSON.stringify(a) === JSON.stringify(b);
  }
  function longDate(ymd) {
    const d = ctx.parseYmd(ymd);
    return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : String(ymd || '');
  }
  function yearsOf(P) {
    return Object.keys((P && P.prices) || {}).map(Number).filter(n => isFinite(n)).sort((a, b) => a - b);
  }
  function scenariosOf(P) {
    const ks = Object.keys((P && P.churn) || {}).concat(Object.keys((P && P.newMultiplier) || {}));
    const uniq = ks.filter((k, i) => ks.indexOf(k) === i);
    return SCEN_ORDER.filter(k => uniq.indexOf(k) >= 0).concat(uniq.filter(k => SCEN_ORDER.indexOf(k) < 0));
  }
  const scenLabel = k => SCEN_LABEL[k] || (String(k).charAt(0).toUpperCase() + String(k).slice(1));
  function opexKeys(P) {
    const known = Object.keys(ctx.OPEX_LABELS), have = Object.keys((P && P.opex) || {});
    return known.filter(k => have.indexOf(k) >= 0).concat(have.filter(k => known.indexOf(k) < 0));
  }
  const opexLabel = k => ctx.OPEX_LABELS[k] || String(k);

  /* ---------- the editable fields (built from the draft's own shape: its years, scenarios, cost lines, targets) ---------- */
  function buildFields(P) {
    const ys = yearsOf(P), out = [];
    const add = (path, kind, aria, extra) => { out.push(Object.assign({ path, key: keyOf(path), kind, aria }, extra || {})); };
    ys.forEach(y => add(['prices', String(y)], 'price', `Price per location per month, ${y}`));
    add(['setupFee'], 'money', 'Setup fee');
    add(['pilotFee'], 'money', 'Pilot fee');
    add(['pilots'], 'whole', 'Pilot locations');
    ys.forEach(y => [0, 1].forEach(i => add(['newPerMonth', String(y), i], 'count', `New locations a month, ${i ? 'high' : 'low'}, ${y}`,
      { pair: [['newPerMonth', String(y), 0], ['newPerMonth', String(y), 1]], side: i })));
    scenariosOf(P).forEach(k => {
      add(['churn', k], 'pct', `${scenLabel(k)} case monthly churn, percent`);
      add(['newMultiplier', k], 'mult', `${scenLabel(k)} case new-location multiplier`);
    });
    ys.forEach(y => add(['costOfService', String(y)], 'pct', `Cost of service, percent of revenue, ${y}`));
    opexKeys(P).forEach(k => ys.forEach(y => add(['opex', k, String(y)], 'money', `${opexLabel(k)}, annual, ${y}`)));
    ys.forEach(y => add(['team', String(y)], 'count', `Team size, ${y}`));
    ys.forEach(y => add(['cac', String(y)], 'money', `CAC per new location, ${y}`));
    add(['hireSalesAtArr'], 'money', 'Hire a salesperson at ARR of');
    add(['startupCosts'], 'money', 'Startup costs');
    (Array.isArray(P && P.targets) ? P.targets : []).forEach((t, i) => {
      if (!t || typeof t !== 'object') return;
      TARGET_COLS.forEach(([k, title, kind]) => { if (t[k] != null && t[k] !== '') add(['targets', i, k], kind, `${t.label || 'Target'} ${title.toLowerCase()}`); });
    });
    return out;
  }

  /* ---------- parsing and validation ---------- */
  function rangeErr(f, v) {
    if (!isNum(v)) return 'Enter a number';
    switch (f.kind) {
      case 'price': return v > 0 ? '' : 'Enter a price above $0';
      case 'pct': return v >= 0 && v < 1 ? '' : 'Enter 0 to under 100';
      case 'smoney': return '';
      case 'whole': return v >= 0 && Number.isInteger(v) ? '' : 'Enter a whole number, 0 or more';
      case 'mult': return v >= 0 ? '' : 'Enter 0 or more, like 1.5';
      case 'count': return v >= 0 ? '' : 'Enter 0 or more';
      default: return v >= 0 ? '' : 'Enter $0 or more';
    }
  }
  function parseIn(f, raw) {
    const t = String(raw == null ? '' : raw).replace(/[$,\s%×]/g, '').replace(/−/g, '-').replace(/x$/i, '');
    if (!t) return { msg: 'Enter a number' };
    if (!/^-?(\d+\.?\d*|\.\d+)$/.test(t)) return { msg: 'Enter a number' };
    let v = Number(t);
    if (f.kind === 'pct') v = Math.round(v * 1e6) / 1e8;
    else if (f.kind === 'price' || f.kind === 'money' || f.kind === 'smoney') v = round2(v);
    const e = rangeErr(f, v);
    return e ? { msg: e } : { v };
  }
  function pairErr(f) {
    if (!f.pair || !st.draft) return '';
    const lo = getPath(st.draft, f.pair[0]), hi = getPath(st.draft, f.pair[1]);
    if (!isNum(lo) || !isNum(hi) || lo <= hi) return '';
    return f.side ? 'High is below low' : 'Low is above high';
  }
  function errFor(f) { return st.bad[f.key] || rangeErr(f, getPath(st.draft, f.path)) || pairErr(f); }
  const badFields = () => st.fields.filter(f => errFor(f));
  function changesVs(P) { return P ? st.fields.filter(f => !same(getPath(st.draft, f.path), getPath(P, f.path))).length : 0; }
  function docDiffs(P) { return st.fields.filter(f => !same(getPath(P, f.path), getPath(ctx.PLAN_DEFAULTS, f.path))).length; }

  /* ---------- draft lifecycle ---------- */
  function build(P) {
    const d = clone(P) || {};
    const fields = buildFields(d);
    fields.forEach(f => { const v = getPath(d, f.path); if (typeof v === 'string' && asNum(v) != null) setPath(d, f.path, asNum(v)); });
    st.draft = d; st.base = P; st.fields = fields;
    st.byKey = {}; fields.forEach(f => { st.byKey[f.key] = f; });
    st.text = {}; st.bad = {}; st.conflict = false;
  }
  function dropDraft() { st.draft = null; st.base = null; st.fields = []; st.byKey = {}; st.text = {}; st.bad = {}; st.conflict = false; }
  /* Rebuild the draft when the saved plan changed and nothing is being edited; flag a conflict when something is. */
  function ensureDraft() {
    const P = ctx.plan();
    if (!st.draft) { build(P); return; }
    /* Read-only (including after write access is lost mid-edit): always show the saved plan, never leftover draft edits. */
    if (!ctx.canWrite()) { if (P !== st.base || Object.keys(st.bad).length || changesVs(P)) build(P); return; }
    if (P === st.base) return;
    if (JSON.stringify(P) === JSON.stringify(st.base)) { st.base = P; return; }
    if (st.saving) return; // our own save or reset is landing; the draft is rebuilt once it resolves
    const dirty = Object.keys(st.bad).length > 0 || changesVs(st.base) > 0;
    if (!dirty) { build(P); return; }
    st.base = P; st.conflict = true;
  }

  /* ---------- formatting ---------- */
  function fmtInput(f, v) {
    if (!isNum(v)) return v == null || typeof v === 'object' ? '' : String(v);
    if (f.kind === 'pct') return pctStr(v);
    if (f.kind === 'mult') return String(v);
    return fmtNum(v, 2);
  }
  function fmtText(f, v) {
    if (!isNum(v)) return '—';
    switch (f.kind) {
      case 'price': return fmtPrice(v);
      case 'pct': return fmtPct(v, 2);
      case 'mult': return fmtNum(v, 2) + '×';
      case 'count': case 'whole': return fmtNum(v, 2);
      default: return fmtMoney(v);
    }
  }
  function chgHTML(f) {
    const v = getPath(st.draft, f.path), d = getPath(ctx.PLAN_DEFAULTS, f.path);
    if (same(v, d)) return '';
    return `${ui.chip('Changed from doc', 'accent')} <span>doc ${isNum(d) ? fmtText(f, d) : 'has none'}</span>`;
  }

  /* ---------- controls ---------- */
  function control(f, wide) {
    const v = getPath(st.draft, f.path), id = domId(f.key);
    const note = `<div class="source" id="${id}-note"${wide ? '' : ' style="margin-top:4px"'}>${chgHTML(f)}</div>`;
    if (!ctx.canWrite()) return `<span class="mono">${fmtText(f, v)}</span>${note}`;
    const err = errFor(f), txt = st.text[f.key] != null ? st.text[f.key] : fmtInput(f, v);
    const style = wide ? '' : ' style="width:8em;text-align:right"';
    const mode = f.kind === 'smoney' ? '' : ' inputmode="decimal"'; // the decimal keypad has no minus sign
    const label = wide ? '' : ` aria-label="${esc(f.aria)}"`;
    const hint = wide ? ` ${id}-hint` : '';
    return `<input class="input mono" id="${id}" type="text"${mode} autocomplete="off"${style}${label} data-mod-input="${ID}" data-key="${esc(f.key)}" value="${esc(txt)}" aria-describedby="${id}-note ${id}-err${hint}"${err ? ' aria-invalid="true"' : ''}>`
      + note + `<div id="${id}-err" style="color:var(--bad);font-size:12px;margin-top:2px"${err ? '' : ' hidden'}>${esc(err)}</div>`;
  }
  function cell(key) {
    const f = st.byKey[key];
    if (!f) return '<td class="num" style="vertical-align:top"><span class="muted">—</span></td>';
    return `<td style="text-align:right;vertical-align:top">${control(f, false)}</td>`;
  }
  function scalar(key, label, hint) {
    const f = st.byKey[key];
    if (!f) return '';
    const id = domId(key);
    const hintHTML = `<span class="hint" id="${id}-hint">${esc(hint)}</span>`;
    const lab = ctx.canWrite() ? `<label for="${id}">${esc(label)}</label>` : `<span style="font-size:13px;font-weight:600">${esc(label)}</span>`;
    return `<div class="field">${lab}${control(f, true)}${hintHTML}</div>`;
  }
  function table(head, rows) {
    return `<div class="table-wrap flat"><table class="compact"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
  }
  const yearHead = (first, ys) => `<tr><th>${esc(first)}</th>${ys.map(y => `<th class="num">${esc(y)}</th>`).join('')}</tr>`;
  function rowHTML(label, sub, cells) {
    return `<tr><td style="vertical-align:top;padding-top:14px"><div class="cell-main">${esc(label)}</div>${sub ? `<div class="cell-sub">${esc(sub)}</div>` : ''}</td>${cells.join('')}</tr>`;
  }

  /* ---------- computed rows inside the sections ---------- */
  function avgText(y) {
    const r = getPath(st.draft, ['newPerMonth', String(y)]) || [];
    return isNum(r[0]) && isNum(r[1]) ? fmtNum((r[0] + r[1]) / 2, 2) : '—';
  }
  function opexText(y) {
    const tot = ctx.sum(opexKeys(st.draft), k => num(getPath(st.draft, ['opex', k, String(y)])));
    return `${fmtMoney(tot)}<div class="cell-sub">${fmtMoney(tot / 12)} a month</div>`;
  }

  /* ---------- the model (same math as ctx.planModel, run on any plan object) ---------- */
  function summaryOf(P) {
    const mRaw = (P.newMultiplier || {}).base, mult = mRaw == null ? 1 : num(mRaw), churn = num((P.churn || {}).base);
    let L = num(P.pilots);
    return yearsOf(P).map(y => {
      const r = (P.newPerMonth || {})[y] || [0, 0], add = (num(r[0]) + num(r[1])) / 2 * mult;
      const price = num((P.prices || {})[y]), cosPct = num((P.costOfService || {})[y]);
      const opexMonth = ctx.sum(Object.keys(P.opex || {}), k => num((P.opex[k] || {})[y]) / 12);
      let revenue = 0, opIncome = 0;
      for (let m = 1; m <= 12; m++) {
        const start = L, rev = start * price;
        L = start - start * churn + add;
        revenue += rev; opIncome += rev - rev * cosPct - opexMonth;
      }
      return { year: y, endLocations: L, endArr: L * price * 12, revenue, opIncome };
    });
  }
  function savedSummary() {
    return ctx.planYearSummary(ctx.planModel('base')).map(r => ({ year: r.year, endLocations: r.endLocations, endArr: r.endArr, revenue: r.revenue, opIncome: r.opIncome }));
  }
  function targetRef(y, k) {
    const ts = Array.isArray(st.draft.targets) ? st.draft.targets : [];
    const t = ts.find(x => x && x.date === `${y}-12-31`);
    if (!t || asNum(t[k]) == null) return null;
    const dt = (ctx.PLAN_DEFAULTS.targets || []).find(x => x && x.date === t.date);
    return { label: dt && same(dt[k], t[k]) ? 'Plan doc' : 'Your target', v: asNum(t[k]) };
  }
  const fmtLoc = v => fmtNum(v, 1);
  function deltaChip(d, fmt) { return ui.chip(`${d >= 0 ? '+' : '−'}${fmt(Math.abs(d))}`, 'accent'); }

  function previewHTML() {
    const D = summaryOf(st.draft), SV = savedSummary(), edit = ctx.canWrite();
    if (!D.length) return '<p class="note" style="margin-top:0">Add a price for at least one year to see the model.</p>';
    const d0 = D[0], y = d0.year, s0 = SV.find(r => r.year === y) || null;
    const kpi = (label, k, tKey, fmt) => {
      const dv = d0[k], sv = s0 ? s0[k] : null, lines = [];
      if (!edit) lines.push('Base case');
      else if (sv == null) lines.push('Not in the saved plan');
      else if (fmt(dv) === fmt(sv)) lines.push('Same as the saved plan');
      else lines.push(`${deltaChip(dv - sv, fmt)} vs saved plan ${fmt(sv)}`);
      const t = targetRef(y, tKey);
      if (t) lines.push(`${esc(t.label)}: ${fmt(t.v)}`);
      return ui.kpi({ label, value: fmt(dv), sub: lines.join('<br>'), tone: dv < 0 ? 'bad' : '' });
    };
    const kp = `<section class="kpis" aria-label="Base case for ${esc(y)}">${kpi(`Model locations · Dec ${y}`, 'endLocations', 'locations', fmtLoc)}${kpi(`Model ARR · Dec ${y}`, 'endArr', 'arr', fmtCompact)}${kpi(`Model revenue · ${y}`, 'revenue', 'revenue', fmtCompact)}${kpi(`Model operating income · ${y}`, 'opIncome', 'opIncome', fmtCompact)}</section>`;
    const rows = D.map(r => {
      const s = SV.find(x => x.year === r.year) || null;
      const c = (k, fmt) => `<td class="num">${fmt(r[k])}${edit && s && fmt(r[k]) !== fmt(s[k]) ? `<div class="source">saved ${fmt(s[k])}</div>` : ''}</td>`;
      return `<tr><td><span class="cell-main">${esc(r.year)}</span></td>${c('endLocations', fmtLoc)}${c('endArr', fmtMoney)}${c('revenue', fmtMoney)}${c('opIncome', fmtMoney)}</tr>`;
    }).join('');
    const tbl = table(`<tr><th>Year</th><th class="num">Locations, Dec</th><th class="num">ARR, Dec</th><th class="num">Revenue, year</th><th class="num">Operating income, year</th></tr>`, rows);
    const P = st.draft, churn = num((P.churn || {}).base), mRaw = (P.newMultiplier || {}).base, mult = mRaw == null ? 1 : num(mRaw);
    const r0 = (P.newPerMonth || {})[y] || [0, 0], avg = (num(r0[0]) + num(r0[1])) / 2;
    const how = `<p class="note">${edit ? 'Model of your draft' : 'Model of the saved plan'}, base case: it starts with ${fmtNum(num(P.pilots), 2)} paying pilot location${num(P.pilots) === 1 ? '' : 's'} in Jan ${esc(y)}. Each month the locations at the start of the month pay that year’s price, then ${fmtPct(churn, 2)} churn leaves and the year’s average new locations arrive (${fmtNum(avg * mult, 2)} a month in ${esc(y)}${Math.abs(mult - 1) > 1e-9 ? `, after the ${fmtNum(mult, 2)}× multiplier` : ''}). Every tab uses the same math.${edit ? ' Where your draft changes a figure, the saved plan’s model figure shows under it.' : ''}</p>`;
    return kp + tbl + how;
  }

  /* ---------- status text ---------- */
  function unsavedText() {
    const n = changesVs(ctx.plan()), b = badFields().length;
    const parts = [n ? plural(n, 'unsaved change') : 'No unsaved changes'];
    if (b) parts.push(`${plural(b, 'field needs', 'fields need')} a fix`);
    return parts.join(' · ');
  }
  function barText() {
    const D = summaryOf(st.draft), SV = savedSummary();
    if (!D.length) return esc(unsavedText());
    const d0 = D[0], s0 = SV.find(r => r.year === d0.year);
    return `<strong>${esc(unsavedText())}</strong> · Base case, Dec ${esc(d0.year)}: ${fmtLoc(d0.endLocations)} locations, ${fmtCompact(d0.endArr)} ARR${s0 ? ` <span class="muted">(saved plan: ${fmtLoc(s0.endLocations)}, ${fmtCompact(s0.endArr)})</span>` : ''}`;
  }
  function resetDisabled() { return docDiffs(ctx.plan()) === 0 && changesVs(ctx.plan()) === 0 && badFields().length === 0; }

  /* Update every live part of the page in place (no re-render, so the field being typed in keeps focus). */
  function refresh() {
    if (!st.draft) return;
    const n = changesVs(ctx.plan()), dirty = n > 0 || badFields().length > 0;
    st.fields.forEach(f => {
      const id = domId(f.key), err = errFor(f);
      const inp = document.getElementById(id);
      if (inp && inp.setAttribute) { if (err) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid'); }
      const e = document.getElementById(id + '-err'); if (e) { e.textContent = err; e.hidden = !err; }
      const c = document.getElementById(id + '-note'); if (c) c.innerHTML = chgHTML(f);
    });
    yearsOf(st.draft).forEach(y => {
      const a = document.getElementById(`${ID}-avg-${y}`); if (a) a.innerHTML = avgText(y);
      const o = document.getElementById(`${ID}-opex-${y}`); if (o) o.innerHTML = opexText(y);
    });
    const u = document.getElementById(`${ID}-unsaved`); if (u) u.textContent = unsavedText();
    const bt = document.getElementById(`${ID}-bar-text`); if (bt) bt.innerHTML = barText();
    const bar = document.getElementById(`${ID}-bar`); if (bar) bar.hidden = !dirty;
    [`${ID}-save`, `${ID}-bar-save`].forEach(s => { const b = document.getElementById(s); if (b) b.disabled = !n || st.saving; });
    const r = document.getElementById(`${ID}-reset`); if (r) r.disabled = resetDisabled() || st.saving;
    const p = document.getElementById(`${ID}-preview`); if (p) p.innerHTML = previewHTML();
  }

  /* ---------- sections ---------- */
  function pricingPanel(ys) {
    const body = table(yearHead('Price', ys), rowHTML('Price per location per month', 'ARR = locations × price × 12', ys.map(y => cell('prices.' + y))))
      + `<div class="calc-grid" style="margin-top:14px">`
      + scalar('setupFee', 'Setup fee, one-time ($)', 'Charged once at signing. Not part of ARR.')
      + scalar('pilotFee', '30-day pilot fee ($)', 'Charged once per paid pilot.')
      + scalar('pilots', 'Pilot locations', ys.length ? `The model starts with these paying in Jan ${ys[0]}.` : 'The model starts with these paying.')
      + `</div>`;
    return ui.panel({ title: 'Pricing', sub: 'What each location pays', body, cls: 'section' });
  }
  function growthPanel(ys) {
    const rows = rowHTML('New locations a month, low', 'A slow month', ys.map(y => cell(`newPerMonth.${y}.0`)))
      + rowHTML('New locations a month, high', 'A strong month', ys.map(y => cell(`newPerMonth.${y}.1`)))
      + `<tr><td><div class="cell-sub">Average a month: (low + high) ÷ 2, before the scenario multiplier</div></td>${ys.map(y => `<td class="num" id="${ID}-avg-${esc(y)}">${avgText(y)}</td>`).join('')}</tr>`;
    const srows = scenariosOf(st.draft).map(k => rowHTML(scenLabel(k), k === 'base' ? 'Drives every tab’s plan numbers' : 'Alternative case on Forecast', [cell('churn.' + k), cell('newMultiplier.' + k)])).join('');
    const body = table(yearHead('New locations', ys), rows)
      + `<div style="margin-top:14px">${table('<tr><th>Scenario</th><th class="num">Monthly churn (%)</th><th class="num">New-location multiplier (×)</th></tr>', srows)}</div>`
      + '<p class="note">Each scenario multiplies the average new locations a month by its multiplier, and loses its churn share of locations every month.</p>';
    return ui.panel({ title: 'Growth', sub: 'New locations and churn', body, cls: 'section' });
  }
  function costsPanel(ys) {
    const rows = rowHTML('Cost of service (%)', 'Share of revenue', ys.map(y => cell('costOfService.' + y)))
      + opexKeys(st.draft).map(k => rowHTML(`${opexLabel(k)} ($)`, 'Annual', ys.map(y => cell(`opex.${k}.${y}`)))).join('')
      + `<tr><td><div class="cell-main">Operating expenses, total</div><div class="cell-sub">Annual, then per month</div></td>${ys.map(y => `<td class="num" id="${ID}-opex-${esc(y)}">${opexText(y)}</td>`).join('')}</tr>`;
    return ui.panel({ title: 'Costs', sub: 'Cost of service and operating expenses by year', body: table(yearHead('Line', ys), rows), cls: 'section' });
  }
  function teamPanel(ys) {
    const rows = rowHTML('Team size', 'People', ys.map(y => cell('team.' + y)))
      + rowHTML('CAC per new location ($)', 'Cost to win one location', ys.map(y => cell('cac.' + y)));
    const body = table(yearHead('Line', ys), rows)
      + `<div class="calc-grid" style="margin-top:14px">`
      + scalar('hireSalesAtArr', 'Hire a salesperson at ARR of ($)', 'The first sales hire comes once ARR reaches this.')
      + scalar('startupCosts', 'Startup costs ($)', 'Founder-funded spending before revenue.')
      + `</div>`;
    return ui.panel({ title: 'Team & CAC', sub: 'People and the cost to win a location', body, cls: 'section' });
  }
  function targetsPanel() {
    const ts = Array.isArray(st.draft.targets) ? st.draft.targets : [];
    if (!ts.length) return ui.panel({ title: 'Targets', body: '<p class="note" style="margin-top:0">The plan has no dated targets. Reset to the projections doc to bring its targets back.</p>', cls: 'section' });
    const head = `<tr><th>Target</th><th>Date</th>${TARGET_COLS.map(c => `<th class="num">${esc(c[1])}</th>`).join('')}</tr>`;
    const rows = ts.map((t, i) => {
      const tt = t && typeof t === 'object' ? t : {};
      return `<tr><td style="vertical-align:top;padding-top:14px"><span class="cell-main">${esc(tt.label || 'Target')}</span></td><td style="vertical-align:top;padding-top:14px">${esc(ctx.fmtDate(tt.date) || tt.date || '')}</td>${TARGET_COLS.map(c => cell(`targets.${i}.${c[0]}`)).join('')}</tr>`;
    }).join('');
    return ui.panel({
      title: 'Targets', sub: 'Goals the other tabs measure against',
      body: table(head, rows) + '<p class="note">Labels and dates come from the projections doc. Revenue and operating income are totals for the calendar year that ends on the date.</p>',
      cls: 'section'
    });
  }
  function cashPanel() {
    const F = ctx.finance(), raw = ctx.get('settings', 'finance'), sc = asNum(ctx.plan().startupCosts);
    const row = (label, value, src) => `<div class="stat-row"><dt>${label}${src ? `<div class="source">${src}</div>` : ''}</dt><dd>${value}</dd></div>`;
    const rows = row('Opening cash', fmtPrice(round2(num(F.openingCash))))
      + row('As of', esc(longDate(F.openingDate)))
      + (F.note ? row('Note', esc(F.note)) : '');
    const notes = [];
    if (!raw) notes.push('Not set yet, so every tab uses this default.');
    if (sc != null && !same(sc, F.openingCash)) notes.push(`The plan’s startup costs are ${fmtMoney(sc)}.`);
    notes.push('Cash on every tab counts from this date: paid invoices in, expenses out. Expenses dated earlier are left out.');
    const body = `<dl class="stat-list">${rows}</dl><p class="note">${notes.join(' ')} <button class="link" type="button" data-act="go" data-view="cash">See today’s balance on Cash</button></p>`;
    const actions = ctx.canWrite() ? `<button class="btn btn-sm" type="button" data-act="mod" data-mod="${ID}" data-a="edit-cash">Edit</button>` : '';
    return ui.panel({ title: 'Cash starting point', sub: 'Where the cash balance starts', actions, body, cls: 'section' });
  }

  /* ---------- actions ---------- */
  /* Fields of the saved settings/plan doc that are not plan keys (setDoc replaces the whole doc, so keep them). */
  function savedRest() {
    const cur = Object.assign({}, ctx.get('settings', 'plan') || {});
    delete cur.id;
    Object.keys(ctx.PLAN_DEFAULTS).forEach(k => { delete cur[k]; });
    return cur;
  }
  async function save() {
    if (!ctx.canWrite() || st.saving || !st.draft) return;
    if (!changesVs(ctx.plan())) return;
    const bad = badFields();
    if (bad.length) {
      refresh();
      ctx.toast(`Fix ${plural(bad.length, 'field')} marked in red before saving.`, 'bad');
      const el = document.getElementById(domId(bad[0].key));
      if (el && el.focus) el.focus();
      return;
    }
    st.saving = true; refresh();
    const data = Object.assign(savedRest(), clone(st.draft), {
      source: `Edited in Dealbook on ${longDate(ctx.todayStr())} (based on the projections doc)`,
      updatedAt: ctx.iso(), updatedBy: ctx.me() || null
    });
    const ok = await ctx.setDoc('settings', 'plan', data);
    st.saving = false;
    if (ok) { ctx.toast('Assumptions saved'); dropDraft(); ctx.render(); }
    else refresh();
  }
  function reset() {
    if (!ctx.canWrite() || st.saving) return;
    const P = ctx.plan(), n = st.draft ? docDiffs(P) : 0, u = st.draft ? changesVs(P) : 0;
    let body = `Every tab goes back to the numbers in “${ctx.PLAN_DEFAULTS.source}”.`;
    if (n) body += ` This replaces ${plural(n, 'saved value')} that differ from the doc.`;
    if (u) body += ` Your ${plural(u, 'unsaved change')} will be discarded too.`;
    ctx.openConfirm('Reset the plan to the projections doc?', body, 'Reset to the doc', async () => {
      st.saving = true;
      const ok = await ctx.setDoc('settings', 'plan', Object.assign(savedRest(), clone(ctx.PLAN_DEFAULTS), { updatedAt: ctx.iso(), updatedBy: ctx.me() || null }));
      st.saving = false;
      if (ok) { ctx.toast('Plan reset to the projections doc'); dropDraft(); }
      ctx.render();
    });
  }
  function editCash() {
    if (!ctx.canWrite()) return;
    const F = ctx.finance();
    ctx.openFormModal({
      title: 'Cash starting point',
      body: `<div class="row2">${ctx.F.money(`${ID}-cash-amount`, 'Opening cash ($)', round2(num(F.openingCash)))}${ctx.F.date(`${ID}-cash-date`, 'As of', F.openingDate)}</div>
        <p class="note">The cash you had in the bank on that date. Cash, Overview and runway count paid invoices and expenses from here.</p>`,
      submitLabel: 'Save',
      onSubmit: async () => {
        const rawAmt = ctx.val(`${ID}-cash-amount`);
        if (!rawAmt) return ctx.formErr('Enter the opening cash, like 3500.', `${ID}-cash-amount`);
        const openingCash = ctx.parseMoney(rawAmt);
        if (openingCash === null) return ctx.formErr('Enter the opening cash as dollars, like 3500.', `${ID}-cash-amount`);
        const openingDate = ctx.val(`${ID}-cash-date`);
        if (!ctx.parseYmd(openingDate)) return ctx.formErr('Pick the date that balance was in the bank.', `${ID}-cash-date`);
        const cur = Object.assign({}, ctx.get('settings', 'finance') || {});
        delete cur.id;
        const ok = await ctx.setDoc('settings', 'finance', Object.assign(cur, { openingCash, openingDate, updatedAt: ctx.iso() }));
        if (ok) ctx.toast('Cash starting point saved');
        return ok;
      }
    });
  }

  /* ---------- module ---------- */
  return {
    id: ID,
    label: 'Assumptions',
    group: 'Planning',
    order: 60,
    collections: [],
    badge() {
      if (!st.draft || !ctx.canWrite()) return null;
      ensureDraft();
      const n = changesVs(ctx.plan());
      return n ? { text: String(n), title: `${plural(n, 'unsaved change')} to the plan` } : null;
    },
    render() {
      if (ctx.isLoading()) return ui.toolbar({ title: 'Assumptions' }) + '<div class="empty"><p>Loading your plan…</p></div>';
      ensureDraft();
      const P = ctx.plan(), edit = ctx.canWrite(), ys = yearsOf(st.draft);
      const n = changesVs(P), dirty = n > 0 || badFields().length > 0;
      const actions = edit
        ? `<button class="btn btn-sm" type="button" id="${ID}-reset" data-act="mod" data-mod="${ID}" data-a="reset"${resetDisabled() || st.saving ? ' disabled' : ''}>Reset to the projections doc</button>`
          + `<button class="btn btn-sm btn-primary" type="button" id="${ID}-save" data-act="mod" data-mod="${ID}" data-a="save"${!n || st.saving ? ' disabled' : ''}>Save changes</button>`
        : '';
      const head = ui.toolbar({ title: 'Assumptions', exportable: true, actions });

      const diffs = docDiffs(P), saved = ctx.get('settings', 'plan');
      let savedLine = '';
      if (saved && saved.updatedAt) savedLine = ` Last saved ${esc(ctx.relTime(saved.updatedAt))}${saved.updatedBy ? ` by ${esc(ctx.personName(saved.updatedBy))}` : ''}.`;
      else if (!saved) savedLine = ' Nothing has been saved here yet.';
      const status = `<div class="section">
        <p class="note" style="margin-top:0">Source: <strong>${esc(P.source || 'Not named')}</strong>. ${diffs ? `${ui.chip('Edited', 'accent')} ${plural(diffs, 'value differs', 'values differ')} from the projections doc.` : `${ui.chip('Matches the doc', 'good')} Every value matches the projections doc.`}${savedLine}</p>
        <p class="note">${edit ? `<span id="${ID}-unsaved" aria-live="polite">${esc(unsavedText())}</span> · Edits stay in this draft until you save. Every tab then uses the new plan.` : 'You can view the plan but not change it.'}</p>
      </div>`;
      const conflict = st.conflict && edit
        ? `<div class="notice warn" style="margin-bottom:14px"><span><strong>The saved plan changed while you were editing.</strong> Saving now replaces it with your draft.</span><span class="spacer"></span><button class="btn btn-sm" type="button" data-act="mod" data-mod="${ID}" data-a="discard">Load the saved plan</button></div>`
        : '';
      if (!ys.length) {
        return head + status + ui.empty({
          title: 'No plan years to edit',
          text: 'The plan has no prices by year, so there is nothing to model. Reset to the projections doc to load its three years.',
          action: edit ? `<button class="btn btn-primary" type="button" data-act="mod" data-mod="${ID}" data-a="reset">Reset to the projections doc</button>` : ''
        }) + cashPanel();
      }
      const preview = ui.panel({
        title: 'Live preview',
        sub: edit ? 'Base case model from your draft, next to the saved plan' : 'Base case model from the saved plan',
        body: `<div id="${ID}-preview">${previewHTML()}</div>`,
        cls: 'section'
      });
      const bar = edit
        ? `<div id="${ID}-bar" style="position:sticky;bottom:12px;z-index:5"${dirty ? '' : ' hidden'}><div class="panel" style="display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;box-shadow:var(--shadow)">
            <span id="${ID}-bar-text" style="font-size:14px;min-width:0">${barText()}</span><span style="flex:1"></span>
            <button class="btn btn-sm" type="button" data-act="mod" data-mod="${ID}" data-a="discard">Discard edits</button>
            <button class="btn btn-sm btn-primary" type="button" id="${ID}-bar-save" data-act="mod" data-mod="${ID}" data-a="save"${!n || st.saving ? ' disabled' : ''}>Save changes</button>
          </div></div>`
        : '';
      const editor = `<div>${preview}${pricingPanel(ys)}${growthPanel(ys)}${costsPanel(ys)}${teamPanel(ys)}${targetsPanel()}${bar}</div>`;
      return head + status + conflict + editor + cashPanel();
    },
    onAction(a) {
      if (a === 'save') save();
      else if (a === 'reset') reset();
      else if (a === 'discard') { dropDraft(); ctx.render(); }
      else if (a === 'edit-cash') editCash();
    },
    onInput(key, el) {
      if (!ctx.canWrite() || !st.draft || !el) return;
      const f = st.byKey[key];
      if (!f) return;
      const raw = String(el.value == null ? '' : el.value);
      st.text[key] = raw;
      const r = parseIn(f, raw);
      if (r.msg) st.bad[key] = r.msg;
      else { delete st.bad[key]; setPath(st.draft, f.path, r.v); }
      refresh();
    },
    csv() {
      const P = ctx.plan(), D = ctx.PLAN_DEFAULTS, rows = [['Key', 'Value', 'Plan doc value']], seen = {};
      const cellOf = v => (v == null || typeof v === 'object' ? '' : typeof v === 'number' ? (isFinite(v) ? v : '') : typeof v === 'boolean' ? String(v) : String(v));
      const walk = (o, path, fn) => {
        if (o != null && typeof o === 'object') (Array.isArray(o) ? o.map((_, i) => i) : Object.keys(o)).forEach(k => walk(o[k], path.concat([k]), fn));
        else fn(path, o);
      };
      walk(P, [], (path, v) => { const k = keyOf(path); seen[k] = true; rows.push([k, cellOf(v), cellOf(getPath(D, path))]); });
      walk(D, [], (path, v) => { const k = keyOf(path); if (!seen[k]) rows.push([k, '', cellOf(v)]); });
      const F = ctx.finance(), FD = ctx.FIN_DEFAULTS || {};
      rows.push(['finance.openingCash', num(F.openingCash), cellOf(FD.openingCash)]);
      rows.push(['finance.openingDate', String(F.openingDate || ''), cellOf(FD.openingDate)]);
      return { name: 'plan-assumptions', rows };
    }
  };
});

const fmtPrice=n=>Number.isInteger(n)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n):new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(n);

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v);return isFinite(n)?n:0;};
const sum=(arr,f)=>arr.reduce((a,x)=>a+f(x),0);
const moneyFmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});

const fmtMoney=n=>moneyFmt.format(num(n));

/* fmtPct(0.034) -> "3.4%"; fmtNum(1234.5,1) -> "1,234.5" */
const fmtPct=(x,d)=>`${new Intl.NumberFormat('en-US',{maximumFractionDigits:d==null?1:d}).format(num(x)*100)}%`;

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>ymd(new Date());
const parseYmd=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const fmtDate=s=>{const d=parseYmd(s);if(!d)return '';const o={month:'short',day:'numeric'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString('en-US',o);};
const fmtShort=s=>{const d=parseYmd(s);if(!d)return '';const t=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});return d.getFullYear()===new Date().getFullYear()?t:t+' ’'+String(d.getFullYear()).slice(2);};
const isoToYmd=s=>{const t=Date.parse(s);return isNaN(t)?'':ymd(new Date(t));};

const relTime=s=>{const t=Date.parse(s);if(isNaN(t))return '';const x=(Date.now()-t)/1000;if(x<60)return 'just now';if(x<3600)return Math.floor(x/60)+'m ago';if(x<86400)return Math.floor(x/3600)+'h ago';if(x<604800)return Math.floor(x/86400)+'d ago';return fmtDate(ymd(new Date(t)));};

/* ---------- state ---------- */

/* ---------- capabilities ---------- */
function use(name){

/* ---------- writes ---------- */
async function write(fn){
  try{await fn();return true;}
  catch(e){
    let err=e;

/* ---------- pipeline ---------- */
function kpis(list){
  const open=list.filter(isOpen);
  const won=list.filter(d=>d.stage==='won'&&!isChurned(d));
  const cut=Date.now()-90*864e5;
  const closed=list.filter(d=>(d.stage==='won'||d.stage==='lost')&&closedTime(d)>=cut);

  return {
    openCount:open.length,openVal:sum(open,d=>num(d.value)),openLocs:sum(open,pricedLocs),

  const kp=`<section class="kpis" aria-label="Pipeline summary">
    <div class="kpi"><div class="kpi-label">Open pipeline · ARR</div><div class="kpi-value">${dash(fmtMoney(k.openVal))}</div>
      <div class="stackbar" role="img" aria-label="Open ARR by stage: ${esc(k.byStage.map(s=>STAGE[s.id].name+' '+fmtCompact(s.v)).join(', '))}">${segs}</div>
      <div class="kpi-sub">${dash(`${k.openCount} open deal${k.openCount===1?'':'s'} · ${k.openLocs} location${k.openLocs===1?'':'s'}`)}</div></div>
    <div class="kpi"><div class="kpi-label">Weighted forecast · ARR</div><div class="kpi-value">${dash(fmtMoney(k.weighted))}</div><div class="kpi-sub">Each deal's ARR × its stage probability</div></div>
    <div class="kpi"><div class="kpi-label">Signed ARR${S.mine?' · whole team':''}</div><div class="kpi-value">${dash(fmtMoney(team.wonArr))}</div>
      <div class="stackbar" role="img" aria-label="${tLocs} of ${TARGET.locations} locations signed toward the ${TARGET.label} goal">${tLocs?`<span style="flex-grow:${Math.min(tLocs,TARGET.locations)};background:var(--s-won)"></span>`:''}<span style="flex-grow:${Math.max(TARGET.locations-tLocs,0)};min-width:0"></span></div>
      <div class="kpi-sub">${loading?'—':`${tLocs} of ${TARGET.locations} locations signed · goal ${fmtCompact(TARGET.arr)} ARR by ${TARGET.label}${team.winRate!=null?` · ${team.winRate}% win rate (90 days)`:''}`}</div></div>
    <div class="kpi"><div class="kpi-label">Follow-ups</div><div class="kpi-value ${k.overdue?'bad':''}">${dash(k.overdue)} <span class="kpi-unit">overdue</span></div><div class="kpi-sub">${loading?'—':`${k.today} due today · <a class="link" href="#tasks">Open tasks</a>`}</div></div>
  </section>`;
  const meBtn=me()?`<div class="seg" role="group" aria-label="Filter deals"><button type="button" data-act="mine" data-v="0" aria-pressed="${!S.mine}">All deals</button><button type="button" data-act="mine" data-v="1" aria-pressed="${S.mine}">My deals</button></div>`:'';
  const tb=`<div class="toolbar"><h1 class="view-title">Pipeline</h1>${meBtn}<span class="spacer"></span>
    ${S.downloads?'<button class="btn btn-sm" type="button" data-act="export">Export CSV</button>':''}
    ${S.canWrite?'<button class="btn btn-sm" type="button" data-act="new" data-kind="deal">New deal</button>':''}</div>`;
  let emptyMsg='';
  if(!loading&&S.status==='ok'&&!all('deals').length){
    emptyMsg=`<div class="empty"><h2>Your pipeline is empty</h2><p>Deals appear here in columns by stage, from first lead to signed. Add a deal, then drag it right as it moves forward.</p>${S.canWrite?'<button class="btn btn-primary" type="button" data-act="new" data-kind="deal">Add your first deal</button>':''}</div>`;
  }else if(!loading&&S.q.trim()&&!shown.length){
    emptyMsg=`<div class="empty"><h2>No deals match “${esc(S.q.trim())}”</h2><p>Try a company or contact name, or clear the search.</p></div>`;
  }
  const cols=STAGES.map(s=>{
    let ds=shown.filter(d=>(STAGE[d.stage]?d.stage:'lead')===s.id);
    const total=sum(ds,d=>num(d.value));
    const closed=s.id==='won'||s.id==='lost';
    if(closed)ds.sort((a,b)=>(closedTime(b)||0)-(closedTime(a)||0));
    else ds.sort((a,b)=>(a.closeDate||'9999').localeCompare(b.closeDate||'9999'));
    const cap=closed?12:200;const extra=ds.length-cap;
    const body=loading?'<div class="col-empty">Loading…</div>':ds.length?ds.slice(0,cap).map(cardHTML).join('')+(extra>0?`<div class="col-more">+${extra} more</div>`:''):`<div class="col-empty">${S.canWrite?'Drop a deal here':'No deals'}</div>`;
    return `<section class="col" data-drop="${s.id}" style="--stage:var(${s.c})" aria-label="${s.name}">
      <header class="col-head"><span class="dot"></span><h2>${s.name}</h2><span class="col-count">${loading?'·':ds.length}</span><span class="col-p" title="Win probability">${Math.round(s.p*100)}%</span></header>
      <div class="col-sum"><span class="money">${loading?'—':fmtCompact(total)}</span>${loading?'':`<span class="wt">ARR${closed?'':` · ${fmtCompact(total*s.p)} weighted`}</span>`}</div>
      <div class="col-body">${body}</div>
      ${S.canWrite&&!closed?`<button class="btn btn-sm col-add" type="button" data-act="new" data-kind="deal" data-stage="${s.id}">+ Add deal</button>`:''}
    </section>`;
  }).join('');
  return kp+tb+emptyMsg+`<div class="board-scroll"><div class="board">${cols}</div></div>`;
}
function cardHTML(d){
  const co=company(d.companyId);const chips=[];const t=todayStr();
  let when='';
  if(isOpen(d)){
    if(d.closeDate&&d.closeDate<t)chips.push('<span class="chip chip-bad">Close date passed</span>');
    const idle=daysSince(lastTouch(d));if(idle!=null&&idle>=STALE_DAYS)chips.push(`<span class="chip chip-warn">${idle}d no activity</span>`);
    when=d.closeDate?'Closes '+fmtShort(d.closeDate):'No close date';
  }else{
    const ct=closedTime(d);when=isNaN(ct)?'':fmtShort(ymd(new Date(ct)));
  }
  const n=locs(d);
  return `<article class="card" id="card-${esc(d.id)}" data-open="deal" data-id="${esc(d.id)}" ${S.canWrite?'draggable="true"':''} tabindex="0">
    <div class="card-co">${esc(co?co.name:'No company')} · ${priced(d)?`${n} location${n===1?'':'s'}`:'locations not set'}</div>
    <h3 class="card-title">${esc(d.name||'Untitled deal')}</h3>
    ${chips.length?`<div class="card-chips">${chips.join('')}</div>`:''}
    <div class="card-meta"><span class="money">${fmtMoney(d.value)}</span><span class="when">${esc(when)}</span>${avatar(d.ownerId)}</div>
  </article>`;
}

/* ---------- tables ---------- */
function sortRows(rows,view,keys){
  const [k,dir]=S.sort[view];const f=keys[k]||keys.name;
  return rows.sort((a,b)=>{
    const x=f(a),y=f(b);
    const xe=x==null||x==='',ye=y==null||y==='';
    if(xe&&ye)return 0;if(xe)return 1;if(ye)return -1;
    return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),undefined,{sensitivity:'base'}))*dir;
  });
}
function th(view,key,label,cls){
  const [k,dir]=S.sort[view];const on=k===key;
  return `<th class="${cls||''}" aria-sort="${on?(dir>0?'ascending':'descending'):'none'}"><button type="button" data-act="sort" data-view="${view}" data-key="${key}">${label}<span aria-hidden="true">${on?(dir>0?'↑':'↓'):''}</span></button></th>`;
}
function viewToolbar(title,count,kind,label){
  return `<div class="toolbar"><h1 class="view-title">${title}</h1><span class="view-count">${count}</span><span class="spacer"></span>
    ${S.downloads?'<button class="btn btn-sm" type="button" data-act="export">Export CSV</button>':''}
    ${S.canWrite?`<button class="btn btn-sm" type="button" data-act="new" data-kind="${kind}">${label}</button>`:''}</div>`;
}
function emptyBlock(loading,anyAtAll,what,addKind,addLabel,desc){
  if(loading)return `<div class="empty"><p>Loading ${what}…</p></div>`;
  if(!anyAtAll)return `<div class="empty"><h2>No ${what} yet</h2><p>${desc}</p>${S.canWrite&&S.status==='ok'?`<button class="btn btn-primary" type="button" data-act="new" data-kind="${addKind}">${addLabel}</button>`:''}</div>`;
  return `<div class="empty"><h2>No ${what} match “${esc(S.q.trim())}”</h2><p>Try another name, email or tag.</p></div>`;
}

/* ---------- tasks ---------- */
function dueChip(a){
  if(a.done)return '<span class="chip chip-good">Done</span>';
  if(!a.dueAt)return '<span class="chip">No date</span>';
  const t=todayStr();
  if(a.dueAt<t)return `<span class="chip chip-bad">Overdue · ${esc(fmtDate(a.dueAt))}</span>`;
  if(a.dueAt===t)return '<span class="chip chip-warn">Due today</span>';
  if(a.dueAt===addDays(t,1))return '<span class="chip chip-accent">Tomorrow</span>';
  return `<span class="chip">${esc(fmtDate(a.dueAt))}</span>`;
}
function relLinks(a){
  const out=[];const d=deal(a.dealId),c=contact(a.contactId),co=company(a.companyId||(d&&d.companyId)||(c&&c.companyId));
  if(d)out.push(`<button class="link" type="button" data-act="open" data-kind="deal" data-id="${esc(d.id)}">${esc(d.name)}</button>`);
  if(c)out.push(`<button class="link" type="button" data-act="open" data-kind="contact" data-id="${esc(c.id)}">${esc(contactName(c))}</button>`);
  if(co&&!d)out.push(`<button class="link" type="button" data-act="open" data-kind="company" data-id="${esc(co.id)}">${esc(co.name)}</button>`);
  else if(co)out.push(`<span>${esc(co.name)}</span>`);
  return out.join('');
}
function viewTasks(){
  const loading=isLoading();const t=todayStr(),wk=addDays(t,7);
  const list=tasks().filter(a=>(!S.mine||a.ownerId===me())&&matches(a.subject,a.body,(deal(a.dealId)||{}).name,contactName(contact(a.contactId))));
  const open=list.filter(a=>!a.done).sort((a,b)=>(a.dueAt||'9999').localeCompare(b.dueAt||'9999'));
  const done=list.filter(a=>a.done).sort((a,b)=>String(b.doneAt||'').localeCompare(String(a.doneAt||'')));
  const groups=[
    ['Overdue',open.filter(a=>a.dueAt&&a.dueAt<t),'bad'],
    ['Today',open.filter(a=>a.dueAt===t)],
    ['Next 7 days',open.filter(a=>a.dueAt&&a.dueAt>t&&a.dueAt<=wk)],
    ['Later',open.filter(a=>a.dueAt&&a.dueAt>wk)],
    ['No due date',open.filter(a=>!a.dueAt)]
  ];
  const meBtn=me()?`<div class="seg" role="group" aria-label="Filter tasks"><button type="button" data-act="mine" data-v="0" aria-pressed="${!S.mine}">Everyone</button><button type="button" data-act="mine" data-v="1" aria-pressed="${S.mine}">Mine</button></div>`:'';
  const head=`<div class="toolbar"><h1 class="view-title">Tasks</h1><span class="view-count">${loading?'':open.length+' open'}</span>${meBtn}<span class="spacer"></span>
    ${S.downloads?'<button class="btn btn-sm" type="button" data-act="export">Export CSV</button>':''}
    ${S.canWrite?'<button class="btn btn-sm" type="button" data-act="new" data-kind="task">New task</button>':''}</div>`;
  if(loading)return head+'<div class="empty"><p>Loading tasks…</p></div>';
  if(!list.length)return head+(tasks().length?`<div class="empty"><h2>No tasks match</h2><p>Try another search${S.mine?', or show everyone’s tasks':''}.</p></div>`:`<div class="empty"><h2>No follow-ups scheduled</h2><p>Tasks keep deals moving: a call to return, a proposal to send. Add one here or from any deal or contact.</p>${S.canWrite&&S.status==='ok'?'<button class="btn btn-primary" type="button" data-act="new" data-kind="task">Add a task</button>':''}</div>`);
  const row=a=>`<li class="task-row ${a.done?'is-done':''}">
      <input type="checkbox" id="tk-${esc(a.id)}" data-toggle-task="${esc(a.id)}" ${a.done?'checked':''} ${S.canWrite?'':'disabled'} aria-label="Mark “${esc(a.subject)}” ${a.done?'not done':'done'}">
      <div style="min-width:0">${S.canWrite?`<button class="task-subj" type="button" data-act="edit" data-kind="task" data-id="${esc(a.id)}">${esc(a.subject||'Untitled task')}</button>`:`<span class="task-subj">${esc(a.subject||'Untitled task')}</span>`}
        <div class="task-rel">${relLinks(a)}</div></div>
      ${dueChip(a)}${avatar(a.ownerId)}</li>`;
  let html=groups.filter(g=>g[1].length).map(g=>`<section><h2 class="group-h ${g[2]||''}">${g[0]} <span class="n">${g[1].length}</span></h2><ul class="task-list">${g[1].map(row).join('')}</ul></section>`).join('');
  if(!open.length)html+=`<div class="empty" style="margin:0"><h2>All caught up</h2><p>No open follow-ups${S.mine?' assigned to you':''}.</p></div>`;
  if(done.length){
    const shown=S.showDone?done:done.slice(0,5);
    html+=`<section><h2 class="group-h">Completed <span class="n">${done.length}</span></h2><ul class="task-list">${shown.map(row).join('')}</ul>${done.length>5?`<p style="margin:8px 0 0"><button class="link" type="button" data-act="show-done">${S.showDone?'Show fewer':'Show all '+done.length+' completed'}</button></p>`:''}</section>`;
  }
  return head+`<div class="groups">${html}</div>`;
}

/* ---------- drawer ---------- */
function openDrawer(kind,id,push){
  if(push&&S.drawer&&!(S.drawer.kind===kind&&S.drawer.id===id))S.dstack.push(S.drawer);else if(!push)S.dstack=[];
  const was=!$('#drawer').hidden;
  S.drawer={kind,id};
  $('#drawer').hidden=false;$('#drawer-scrim').hidden=false;
  buildComposer();renderDrawer();
  $('#drawer-scroll').scrollTop=0;
  if(!was){S.lastFocus=document.activeElement;$('#drawer-close').focus();}
}
function closeDrawer(){
  S.drawer=null;S.dstack=[];
  $('#drawer').hidden=true;$('#drawer-scrim').hidden=true;
  if(S.lastFocus&&document.contains(S.lastFocus))S.lastFocus.focus({preventScroll:true});
}
function backDrawer(){
  const prev=S.dstack.pop();if(!prev)return;
  S.drawer=prev;buildComposer();renderDrawer();$('#drawer-scroll').scrollTop=0;
}
function renderDrawer(){
  const {kind,id}=S.drawer;const rec=S.data[COLL[kind]].get(id);
  if(!rec){if(allLoaded()){if(S.dstack.length)backDrawer();else closeDrawer();}return;}
  $('#drawer-back').hidden=!S.dstack.length;
  $('#drawer-kind').textContent=LABEL[kind]+(rec.sample?' · Example':'');
  $('#drawer-body').innerHTML=kind==='deal'?drDeal(rec):kind==='contact'?drContact(rec):drCompany(rec);
}
function openLink(kind,rec,label){
  if(!rec)return '<span class="muted">—</span>';
  return `<button class="link" type="button" data-act="open" data-kind="${kind}" data-id="${esc(rec.id)}">${esc(label)}</button>`;
}
function editButtons(kind,id,extra){
  if(!S.canWrite)return '';
  return `<div class="dr-actions"><button class="btn btn-sm" type="button" data-act="edit" data-kind="${kind}" data-id="${esc(id)}">Edit</button>${extra||''}<button class="btn btn-sm btn-danger" type="button" data-act="delete" data-kind="${kind}" data-id="${esc(id)}">Delete</button></div>`;
}
function stepper(d){
  const cur=OPEN.indexOf(d.stage);const closed=d.stage==='won'||d.stage==='lost';
  const steps=OPEN.map((sid,i)=>{
    const s=STAGE[sid];const on=closed||i<=cur;
    const c=d.stage==='won'?'var(--s-won)':d.stage==='lost'?'var(--s-lost)':`var(${s.c})`;
    const attrs=S.canWrite?`data-act="stage" data-id="${esc(d.id)}" data-stage="${sid}"`:'disabled';
    return `<button type="button" class="step ${on?'on':''} ${sid===d.stage?'cur':''}" style="--c:${c}" ${attrs} aria-pressed="${sid===d.stage}" title="Move to ${s.name}"><span class="step-bar"></span><span class="step-l">${s.name}</span><span class="step-p">${Math.round(s.p*100)}%</span></button>`;
  }).join('');
  let out='';
  if(d.stage==='won')out+='<span class="chip chip-good">Won</span>';
  if(d.stage==='lost')out+='<span class="chip">Lost</span>';
  if(S.canWrite){
    if(d.stage!=='won')out+=`<button class="btn btn-sm" type="button" data-act="stage" data-id="${esc(d.id)}" data-stage="won">Mark won</button>`;
    if(d.stage!=='lost')out+=`<button class="btn btn-sm" type="button" data-act="stage" data-id="${esc(d.id)}" data-stage="lost">Mark lost</button>`;
  }
  return `<div class="stage-box"><div class="stepper">${steps}</div>${out?`<div class="outcome">${out}</div>`:''}</div>`;
}
function drDeal(d){
  const st=stageOf(d);const co=company(d.companyId),ct=contact(d.contactId);const t=todayStr();

  const idle=daysSince(lastTouch(d));
  const acts=all('activities').filter(a=>a.dealId===d.id);
  return `<div class="dr-eyebrow">${co?esc(co.name):'No company'}</div>
    <h2 class="dr-title">${esc(d.name||'Untitled deal')}</h2>
    ${stepper(d)}
    <dl class="facts">
      <dt>ARR</dt><dd class="mono">${fmtMoney(d.value)}</dd>
      <dt>Locations</dt>${priced(d)
        ?`<dd>${locs(d)} × <span class="mono">${fmtPrice(effPrice(d))}</span>/month${Math.abs(effPrice(d)-priceFor(d.closeDate))>0.005?`<span class="muted">list price ${fmtMoney(priceFor(d.closeDate))}</span>`:''}</dd>`
        :`<dd><span class="chip chip-warn">Not set</span><span class="muted">Edit the deal to price it per location.</span></dd>`}
      <dt>Setup fee</dt><dd><span class="mono">${fmtMoney(d.setupFee!=null&&d.setupFee!==''?d.setupFee:setupFee())}</span><span class="muted">one-time, not in ARR</span></dd>
      <dt>Weighted</dt><dd><span class="mono">${fmtMoney(num(d.value)*st.p)}</span><span class="muted">at ${Math.round(st.p*100)}%</span></dd>
      <dt>${isOpen(d)?'Expected close':'Closed'}</dt><dd>${isOpen(d)?(d.closeDate?esc(fmtDate(d.closeDate))+closeChip:'<span class="muted">Not set</span>'):esc(fmtDate(isoToYmd(d.closedAt)||d.closeDate)||'—')}</dd>
      <dt>Company</dt><dd>${openLink('company',co,co&&co.name)}</dd>
      <dt>Contact</dt><dd>${openLink('contact',ct,contactName(ct))}</dd>
      <dt>Owner</dt><dd>${person(d.ownerId)}</dd>
      ${isOpen(d)?`<dt>In stage</dt><dd>${inStage==null?'—':inStage+' day'+(inStage===1?'':'s')}${idle!=null&&idle>=STALE_DAYS?` <span class="chip chip-warn">${idle}d no activity</span>`:''}</dd>`:''}
    </dl>
    ${d.notes?`<div class="notes">${esc(d.notes)}</div>`:''}
    ${editButtons('deal',d.id)}

function copyable(v){
  if(!v)return '<span class="muted">—</span>';

function safeUrl(u){

function timeline(acts,ctx){
  if(!acts.length)return `<p class="mini-empty">Nothing logged yet.${S.canWrite?' Use the box below to add a note, call, email, meeting or task.':''}</p>`;
  acts=acts.slice().sort((a,b)=>{
    const ao=a.type==='task'&&!a.done,bo=b.type==='task'&&!b.done;
    if(ao!==bo)return ao?-1:1;
    if(ao&&bo)return (a.dueAt||'9999').localeCompare(b.dueAt||'9999');
    return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
  });
  return `<ul class="tl">${acts.map(a=>{
    const isTask=a.type==='task';const who=a.createdBy?personName(a.createdBy):'';
    let rel='';
    if(ctx==='company'||ctx==='contact'){const d=deal(a.dealId);if(d&&ctx!=='deal')rel=`<div class="tl-rel">on ${openLink('deal',d,d.name)}</div>`;}
    if(ctx==='deal'||ctx==='company'){const c=contact(a.contactId);if(c&&ctx==='company'&&!rel)rel=`<div class="tl-rel">with ${openLink('contact',c,contactName(c))}</div>`;}
    const main=isTask
      ?`<label class="tl-task"><input type="checkbox" id="tl-${esc(a.id)}" data-toggle-task="${esc(a.id)}" ${a.done?'checked':''} ${S.canWrite?'':'disabled'}><span>${esc(a.subject||'Untitled task')}</span></label><div class="tl-meta">${dueChip(a)}${a.ownerId?`<span class="chip">${esc(personName(a.ownerId))}</span>`:''}</div>`
      :`<p class="tl-body">${esc(a.body||a.subject||'')}</p>`;
    return `<li class="tl-item ${isTask&&a.done?'is-done':''}">
      <span class="tl-ico ${isTask?'t-task':''}">${ICON[a.type]||ICON.note}</span>
      <div style="min-width:0"><div class="tl-head"><span class="tl-type">${ACT[a.type]||'Note'}</span><span class="tl-time">${esc(relTime(a.createdAt))}${who&&a.createdBy?' · '+esc(who):''}</span></div>${main}${rel}</div>
      ${S.canWrite&&a.type!=='stage'?`<button class="icon-btn" type="button" data-act="del-activity" data-id="${esc(a.id)}" aria-label="Delete this ${esc((ACT[a.type]||'note').toLowerCase())}" title="Delete">×</button>`:'<span></span>'}
    </li>`;}).join('')}</ul>`;
}

/* ---------- composer ---------- */
const CT=[['note','Note','Add a note…','Save note'],['call','Call','What was discussed on the call?','Log call'],['email','Email','Summarize the email…','Log email'],['meeting','Meeting','Who attended, what was decided?','Log meeting'],['task','Task','What needs to happen next?','Add task']];
function buildComposer(){
  const box=$('#drawer-composer');
  if(!S.canWrite||!S.drawer){box.innerHTML='';return;}
  S.ctype='note';
  box.innerHTML=`<form class="composer" id="composer" novalidate>
    <div class="seg" role="group" aria-label="Activity type">${CT.map(c=>`<button type="button" data-ctype="${c[0]}" aria-pressed="${c[0]==='note'}">${c[1]}</button>`).join('')}</div>
    <textarea class="input" id="c-body" rows="2" placeholder="${CT[0][2]}" aria-label="Activity details"></textarea>
    <div class="composer-foot"><input class="input" type="date" id="c-due" aria-label="Due date" hidden><span class="spacer"></span><button class="btn btn-primary btn-sm" type="submit" id="c-save">${CT[0][3]}</button></div>
  </form>`;
  const f=$('#composer');
  f.querySelectorAll('[data-ctype]').forEach(b=>b.addEventListener('click',()=>{
    S.ctype=b.dataset.ctype;const c=CT.find(x=>x[0]===S.ctype);
    f.querySelectorAll('[data-ctype]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#c-body').placeholder=c[2];$('#c-save').textContent=c[3];
    const due=$('#c-due');due.hidden=S.ctype!=='task';if(S.ctype==='task'&&!due.value)due.value=addDays(todayStr(),1);
    $('#c-body').focus();
  }));
  $('#c-body').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();f.requestSubmit();}});
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=$('#c-save');if(btn.disabled)return;
    const text=$('#c-body').value.trim();if(!text){$('#c-body').focus();return;}
    const {kind,id}=S.drawer;const rec=S.data[COLL[kind]].get(id);if(!rec)return;
    const links={dealId:null,contactId:null,companyId:null};
    if(kind==='deal'){links.dealId=id;links.contactId=rec.contactId||null;links.companyId=rec.companyId||null;}
    if(kind==='contact'){links.contactId=id;links.companyId=rec.companyId||null;}
    if(kind==='company'){links.companyId=id;}
    const now=iso();const type=S.ctype;
    const a=Object.assign({type,subject:'',body:text,ownerId:me(),createdBy:me(),createdAt:now},links);
    if(type==='task'){a.subject=text.split('\n')[0].slice(0,160);a.body=text.includes('\n')?text:'';a.dueAt=$('#c-due').value||null;a.done=false;a.doneAt=null;}
    btn.disabled=true;
    const ok=await create('activities',a);
    if(ok){
      $('#c-body').value='';
      if(type!=='task'){
        if(links.dealId)await patch('deals',links.dealId,{lastActivityAt:now});
        if(links.contactId&&type!=='note')await patch('contacts',links.contactId,{lastContactAt:now});
      }
      toast(type==='task'?'Task added':ACT[type]+' logged');
    }
    btn.disabled=false;
  });
}

function wireOwner(){

    list.hidden=false;inp.setAttribute('aria-expanded','true');
