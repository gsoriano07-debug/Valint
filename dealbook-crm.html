    const tone = used == null ? '' : spent > budget ? 'bad' : used >= 0.9 ? 'warn' : 'good';
    let budgetSub;
    if (b.kind === 'none') budgetSub = 'No plan years set. Add them on Assumptions.';
    else if (b.kind === 'startup') {
      budgetSub = b.beforeOpen ? `Before cash opens in ${ctx.esc(longMonth(b.openYm))}`
        : `Startup costs of ${money(b.startup)} over ${plural(b.months.length, 'month')}`;
    } else budgetSub = b.clamped ? `Plan ends in ${b.last}, so ${b.year} values apply` : `${b.year} plan; cost of service from the model`;
    const diffVal = diff > 0 ? `${money(diff)}<span class="kpi-unit"> over</span>`
      : diff < 0 ? `${money(-diff)}<span class="kpi-unit"> under</span>` : '$0';
    const rec = recurringLatest(list, ctx.monthEnd(f.ym));
    const recTotal = ctx.sum(rec, x => ctx.num(x.amount));
    return `<section class="kpis">
      ${ctx.ui.kpi({ label: 'Spent', value: money(spent), sub: `${plural(f.rows.length, 'expense')} in ${ctx.esc(longMonth(f.ym))}`, bar: used != null ? ctx.ui.progress(used, tone) : '' })}
      ${ctx.ui.kpi({ label: b.kind === 'startup' ? 'Startup budget' : 'Plan budget', value: b.kind === 'none' ? '—' : money(budget), sub: budgetSub })}
      ${ctx.ui.kpi({ label: 'Over / under budget', value: diffVal, tone: diff > 0 ? 'bad' : (budget > 0 ? 'good' : ''), sub: used != null ? `${ctx.fmtPct(used, 0)} of the budget used` : (spent > 0 ? 'No budget for this month' : 'Nothing spent or budgeted') })}
      ${ctx.ui.kpi({ label: 'Recurring monthly', value: money(recTotal), sub: rec.length ? `${plural(rec.length, 'recurring cost')}, latest amount of each` : list.some(x => x.recurring) ? `None logged by the end of ${ctx.esc(longMonth(f.ym))}` : 'Mark an expense as recurring to track this' })}
    </section>`;
  }

  function diffCell(actual, budget) {
    const d = round2(actual - budget);
    if (d > 0) return `<td class="num neg">${money(d)} over</td>`;
    if (d < 0) return `<td class="num">${money(-d)} under</td>`;
    return '<td class="num muted">On budget</td>';
  }

  function vsBudgetPanel(f) {
    const b = f.budget;
    const labels = CATS.map(c => c.label), actual = CATS.map(c => round2(f.byCat[c.id]));
    if (f.other > 0) { labels.push('Uncategorized'); actual.push(round2(f.other)); }
    let chart, detail;
    if (b.kind === 'plan') {
      const budget = CATS.map(c => round2(b.by[c.id]));
      if (f.other > 0) budget.push(null);
      chart = ctx.chart.bars({
        labels, height: 220, ariaLabel: `Actual spending and plan budget by category, ${longMonth(f.ym)}`,
        series: [{ name: 'Actual', values: actual, color: 'var(--viz-1)' }, { name: 'Plan budget', values: budget, color: 'var(--viz-plan)' }]
      });
      const rows = CATS.map(c => `<tr><td>${ctx.esc(c.label)}${c.id === 'cos' ? ' <span class="muted">(model)</span>' : ''}</td><td class="num">${money(f.byCat[c.id])}</td><td class="num">${money(b.by[c.id])}</td>${diffCell(f.byCat[c.id], b.by[c.id])}</tr>`).join('')
        + (f.other > 0 ? `<tr><td>Uncategorized</td><td class="num">${money(f.other)}</td><td class="num muted">—</td>${diffCell(f.other, 0)}</tr>` : '');
      detail = `<div class="table-wrap flat" style="margin-top:12px"><table class="compact" style="min-width:0"><thead><tr><th>Category</th><th class="num">Actual</th><th class="num">Budget</th><th class="num">Difference</th></tr></thead>
        <tbody>${rows}<tr><td><strong>Total</strong></td><td class="num"><strong>${money(f.spent)}</strong></td><td class="num"><strong>${money(b.total)}</strong></td>${diffCell(f.spent, b.total)}</tr></tbody></table></div>`;
    } else {
      chart = ctx.chart.bars({
        labels, height: 220, ariaLabel: `Spending by category, ${longMonth(f.ym)}`,
        series: [{ name: 'Spent', values: actual, color: 'var(--viz-1)' }]
      });
      const d = round2(f.spent - b.total);
      const lines = labels.map((l, i) => `<div class="stat-row"><dt>${ctx.esc(l)}</dt><dd>${money(actual[i])}</dd></div>`).join('');
      let note = '';
      if (b.kind === 'startup') {
        note = b.inRange
          ? `Before the ${b.firstYear} plan year, the plan budgets ${money(b.startup)} of startup costs with no category split, spread evenly over ${ctx.esc(longMonth(b.months[0]))} to ${ctx.esc(longMonth(b.months[b.months.length - 1]))} (${plural(b.months.length, 'month')}): ${money(b.total)} a month.`
          : `This month is before the cash opening month (${ctx.esc(longMonth(b.openYm))}), so it has no startup budget.`;
      } else note = 'Add plan years on the Assumptions tab to get a budget.';
      detail = `<dl class="stat-list" style="margin-top:12px">${lines}
          <div class="stat-row total"><dt>Total spent</dt><dd>${money(f.spent)}</dd></div>
          <div class="stat-row"><dt>Startup budget</dt><dd>${money(b.total)}</dd></div>
          <div class="stat-row"><dt>${d > 0 ? 'Over budget' : 'Under budget'}</dt><dd class="${d > 0 ? 'neg' : ''}">${money(Math.abs(d))}</dd></div>
        </dl><p class="note">${note}</p>`;
    }
    return ctx.ui.panel({ title: 'Spend vs budget', sub: longMonth(f.ym), body: chart + detail });
  }

  function trendPanel(list, modelByYm) {
    const cur = curYm(), openYm = ctx.ymOf(ctx.finance().openingDate);
    let from = ctx.addMonths(cur, -11);
    if (openYm > from) from = openYm;
    if (from > cur) from = cur;
    const months = ctx.monthRange(from, cur).map(ym => monthFigures(list, ym, modelByYm));
    const chart = ctx.chart.bars({
      labels: months.map(m => ctx.monthLabel(m.ym)), height: 220, ariaLabel: 'Total spending per month',
      series: [{ name: 'Spent', values: months.map(m => round2(m.spent)), color: 'var(--viz-1)' }]
    });
    const sel = selYm();
    const rows = months.slice().reverse().map(m => `<tr><td><button class="link" type="button" data-act="mod" data-mod="${ID}" data-a="pick" data-ym="${ctx.esc(m.ym)}"${m.ym === sel && !st.all ? ' aria-current="true"' : ''}>${ctx.esc(longMonth(m.ym))}</button></td><td class="num">${money(m.spent)}</td><td class="num">${m.budget.kind === 'none' ? '—' : money(m.budget.total)}</td>${diffCell(m.spent, m.budget.total)}</tr>`).join('');
    const total = ctx.sum(months, m => m.spent);
    const body = chart + `<div class="table-wrap flat" style="margin-top:12px"><table class="compact" style="min-width:0"><thead><tr><th>Month</th><th class="num">Spent</th><th class="num">Budget</th><th class="num">Difference</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note">${plural(months.length, 'month')} since ${ctx.esc(longMonth(from))}: ${money(total)} spent, ${money(total / Math.max(1, months.length))} a month on average. Pick a month to see its breakdown.</p>`;
    return ctx.ui.panel({ title: 'Monthly spend', sub: months.length >= 12 ? 'Last 12 months' : from === openYm ? `Since the ${longMonth(openYm)} cash opening` : `Cash opens in ${longMonth(openYm)}`, body });
  }

  function tablePanel(list) {
    const ym = selYm(), w = ctx.canWrite();
    const base = st.all ? list : list.filter(x => inMonth(x, ym));
    const rows = base.filter(x => ctx.matches(x.vendor, x.description, catLabel(x.category))).sort(newestFirst);
    const q = String(ctx.S.q || '').trim();
    const openDate = ctx.finance().openingDate;
    const title = st.all ? 'All expenses' : `Expenses in ${longMonth(ym)}`;
    const add = w ? btn('new', 'Add expense', '', 'btn-primary') : '';
    if (!rows.length) {
      const msg = q && base.length ? `No expenses match “${ctx.esc(q)}”${st.all ? '' : ' this month'}. Try another search.`
        : st.all ? 'No expenses logged yet.' : `Nothing logged for ${ctx.esc(longMonth(ym))} yet.`;
      return ctx.ui.panel({ title, body: `<p class="muted" style="margin:0">${msg}</p>`, actions: add });
    }
    const total = ctx.sum(rows, x => ctx.num(x.amount));
    const body = rows.map(x => {
      const early = x.date && x.date < openDate ? ' <span class="chip chip-warn" title="Dated before the cash opening date, so cash does not count it">Before opening</span>' : '';
      return `<tr>
        <td style="white-space:nowrap">${ctx.esc(ctx.fmtDate(x.date) || '—')}${early}</td>
        <td><div class="trunc">${ctx.esc(x.vendor || '—')}</div></td>
        <td><div class="trunc">${ctx.esc(x.description || '')}</div>${x.notes ? `<div class="trunc muted" style="font-size:12.5px">${ctx.esc(x.notes)}</div>` : ''}</td>
        <td style="white-space:nowrap">${ctx.esc(catLabel(x.category))}</td>
        <td class="num">${money(x.amount)}</td>
        <td>${x.recurring ? ctx.ui.chip('Monthly', 'accent') : '<span class="muted">—</span>'}</td>
        ${w ? `<td><div class="row-actions">${btn('edit', 'Edit', `data-id="${ctx.esc(x.id)}" aria-label="Edit ${ctx.esc(x.vendor || x.description || 'expense')}"`, 'btn-ghost')}${btn('delete', 'Delete', `data-id="${ctx.esc(x.id)}" aria-label="Delete ${ctx.esc(x.vendor || x.description || 'expense')}"`, 'btn-ghost btn-danger')}</div></td>` : ''}
      </tr>`;
    }).join('');
    const head = `<tr><th>Date</th><th>Vendor</th><th>Description</th><th>Category</th><th class="num">Amount</th><th>Recurring</th>${w ? '<th aria-label="Actions"></th>' : ''}</tr>`;
    const foot = `<tr><td colspan="4"><strong>Total</strong> <span class="muted">${plural(rows.length, 'expense')}</span></td><td class="num"><strong>${money(total)}</strong></td><td colspan="${w ? 2 : 1}"></td></tr>`;
    return ctx.ui.panel({
      title, sub: `${plural(rows.length, 'expense')}, ${money(total)}${q ? ` matching “${q}”` : ''}`, actions: add,
      body: `<div class="table-wrap flat"><table class="compact"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>`
    });
  }

  function recurringPanel(list) {
    const ym = selYm();
    const rec = recurringLatest(list, ctx.monthEnd(ym));
    const due = recurringDue(list, ym);
    const total = ctx.sum(rec, x => ctx.num(x.amount));
    const dueTotal = ctx.sum(due, x => ctx.num(x.amount));
    const action = ctx.canWrite() && due.length ? btn('log-recurring', `Log ${plural(due.length, 'cost')} for ${ctx.esc(longMonth(ym))}`) : '';
    let body;
    if (!rec.length && list.some(x => x.recurring)) body = `<p class="muted" style="margin:0">No recurring costs were logged by the end of ${ctx.esc(longMonth(ym))}. Pick a later month to see your run-rate.</p>`;
    else if (!rec.length) body = '<p class="muted" style="margin:0">No recurring costs yet. Tick “Recurring every month” on an expense, such as hosting or a software seat, to track your monthly run-rate here.</p>';
    else {
      const dueKeys = new Set(due.map(recKey));
      body = `<dl class="stat-list">${rec.map(x => `<div class="stat-row"><dt>${ctx.esc(x.vendor || x.description || 'Expense')}${x.vendor && x.description ? ` <span class="source">${ctx.esc(x.description)}</span>` : ''}<br><span class="source">${ctx.esc(catLabel(x.category))} · last ${ctx.esc(ctx.fmtDate(x.date))}${dueKeys.has(recKey(x)) ? ' · not logged this month' : ''}</span></dt><dd>${money(x.amount)}</dd></div>`).join('')}
        <div class="stat-row total"><dt>Per month</dt><dd>${money(total)}</dd></div><div class="stat-row"><dt>Per year</dt><dd>${money(total * 12)}</dd></div></dl>
        <p class="note">Each recurring cost counts once, at its latest amount up to the end of ${ctx.esc(longMonth(ym))}.${due.length ? ` ${plural(due.length, 'cost')} (${money(dueTotal)}) not logged for ${ctx.esc(longMonth(ym))} yet.` : ''}</p>`;
    }
    return ctx.ui.panel({ title: 'Recurring costs', sub: `As of ${longMonth(ym)}`, actions: action, body });
  }

  function planPanel(modelByYm) {
    const P = ctx.plan(), years = ctx.planYears();
    if (!years.length) return ctx.ui.panel({ title: 'Monthly budget by plan year', body: '<p class="muted" style="margin:0">No plan years are set. Add them on the Assumptions tab.</p>' });
    const summary = ctx.planYearSummary(Object.keys(modelByYm).map(k => modelByYm[k]));
    const sumBy = {};
    summary.forEach(s => { sumBy[s.year] = s; });
    const cell = (c, y) => c.id === 'cos' ? ctx.num((sumBy[y] || {}).cos) / 12 : ctx.num(((P.opex || {})[c.id] || {})[y]) / 12;
    const rows = CATS.map(c => `<tr><td>${ctx.esc(c.label)}${c.id === 'cos' ? ' <span class="muted">(model avg.)</span>' : ''}</td>${years.map(y => `<td class="num">${money(cell(c, y))}</td>`).join('')}</tr>`).join('');
    const totals = years.map(y => `<td class="num"><strong>${money(ctx.sum(CATS, c => cell(c, y)))}</strong></td>`).join('');
    const first = budgetFor(`${years[0] - 1}-12`, modelByYm);
    const note = first.kind === 'startup' && first.months.length
      ? `Before ${years[0]}: ${money(first.startup)} of startup costs over ${plural(first.months.length, 'month')} (${ctx.esc(longMonth(first.months[0]))} to ${ctx.esc(longMonth(first.endYm))}) = ${money(first.total)} a month. `
      : '';
    return ctx.ui.panel({
      title: 'Monthly budget by plan year', sub: 'Operating lines are the annual plan divided by 12',
      body: `<div class="table-wrap flat"><table class="compact" style="min-width:0"><thead><tr><th>Category</th>${years.map(y => `<th class="num">${y}</th>`).join('')}</tr></thead><tbody>${rows}<tr><td><strong>Total per month</strong></td>${totals}</tr></tbody></table></div>
        <p class="note">${note}Cost of service follows the plan model’s revenue, so its monthly budget grows as locations grow. <button class="link" type="button" data-act="go" data-view="assumptions">Change the plan on Assumptions</button></p>`
    });
  }

  /* ---------- form + actions ---------- */
  function moveTo(date) {
    if (!st.all && ctx.ymOf(date) !== selYm()) { st.ym = ctx.ymOf(date); ctx.render(); }
  }

  function openForm(x) {
    const editing = !!(x && x.id);
    const r = x || {};
    const body = `<div class="row2">${ctx.F.date('expenses-f-date', 'Date paid', r.date || ctx.todayStr())}${ctx.F.text('expenses-f-vendor', 'Vendor', r.vendor || '', 'maxlength="120" autocomplete="off" placeholder="Who you paid"')}</div>`
      + ctx.F.text('expenses-f-desc', 'Description', r.description || '', 'maxlength="200" placeholder="What it was for"')
      + `<div class="row2">${ctx.F.select('expenses-f-cat', 'Category', CATS.map(c => [c.id, c.label]), CAT_LABEL[r.category] ? r.category : st.lastCat)}${ctx.F.money('expenses-f-amount', 'Amount ($)', r.amount != null && r.amount !== '' ? r.amount : '', 'placeholder="0.00"')}</div>`
      + ctx.F.check('expenses-f-recurring', 'Recurring every month', !!r.recurring)
      + ctx.F.area('expenses-f-notes', 'Notes', r.notes || '', 2);
    ctx.openFormModal({
      title: editing ? 'Edit expense' : 'Add expense',
      submitLabel: editing ? 'Save changes' : 'Add expense',
      body,
      deleteLabel: editing ? 'Delete' : undefined,
      onDelete: editing ? () => confirmDelete(r.id) : undefined,
      onSubmit: async () => {
        const date = ctx.val('expenses-f-date');
        if (!ctx.parseYmd(date)) return ctx.formErr('Pick the date you paid.', 'expenses-f-date');
        const vendor = ctx.val('expenses-f-vendor'), description = ctx.val('expenses-f-desc');
        if (!vendor && !description) return ctx.formErr('Add who you paid or what it was for.', 'expenses-f-vendor');
        const category = ctx.val('expenses-f-cat');
        if (!CAT_LABEL[category]) return ctx.formErr('Pick a category.', 'expenses-f-cat');
        const amount = ctx.parseMoney(ctx.val('expenses-f-amount'));
        if (amount == null || !(amount > 0)) return ctx.formErr('Enter an amount above $0, like 49 or 240.50.', 'expenses-f-amount');
        const recEl = document.getElementById('expenses-f-recurring');
        const fields = { date, vendor, description, category, amount, recurring: !!(recEl && recEl.checked), notes: ctx.val('expenses-f-notes') };
        st.lastCat = category;
        if (editing) {
          const ok = await ctx.patch('expenses', r.id, Object.assign(fields, { updatedAt: ctx.iso() }));
          if (!ok) return false;
          moveTo(date); ctx.toast('Expense updated');
          return true;
        }
        const id = await ctx.create('expenses', Object.assign(fields, { createdAt: ctx.iso(), createdBy: ctx.me() }));
        if (!id) return false;
        moveTo(date); ctx.toast(`Added ${money(amount)} to ${longMonth(ctx.ymOf(date))}`);
        return true;
      }
    });
  }

  function confirmDelete(id) {
    const x = ctx.get('expenses', id);
    if (!x) return;
    const what = [x.vendor, x.description].filter(Boolean).join(', ') || 'This expense';
    ctx.openConfirm('Delete this expense?', `${what}: ${money(x.amount)} on ${ctx.fmtDate(x.date) || 'no date'}. This can’t be undone.`, 'Delete expense', async () => {
      if (await ctx.remove('expenses', id)) ctx.toast('Expense deleted');
    });
  }

  function confirmLogRecurring() {
    const ym = selYm(), due = recurringDue(expenses(), ym);
    if (!due.length) { ctx.toast(`Every recurring cost is already logged for ${longMonth(ym)}.`); return; }
    const total = ctx.sum(due, x => ctx.num(x.amount));
    ctx.openConfirm(`Log recurring costs for ${longMonth(ym)}?`,
      `Adds ${plural(due.length, 'expense')} totaling ${money(total)} (${due.map(x => x.vendor || x.description || 'Expense').join(', ')}), each on the same day of the month as last time at its latest amount. Edit any of them afterwards if the amount changed.`,
      `Log ${plural(due.length, 'expense')}`, async () => {
        let made = 0;
        for (const x of due) {
          const id = await ctx.create('expenses', {
            date: sameDayIn(ym, x.date), vendor: x.vendor || '', description: x.description || '', category: CAT_LABEL[x.category] ? x.category : 'ga',
            amount: round2(x.amount), recurring: true, notes: '', createdAt: ctx.iso(), createdBy: ctx.me()
          });
          if (!id) break;
          made++;
        }
        if (made) ctx.toast(`Logged ${plural(made, 'recurring cost')} for ${longMonth(ym)}`);
      });
  }

  /* ---------- module ---------- */
  return {
    id: ID,
    label: 'Expenses',
    group: 'Finance',
    order: 20,
    collections: ['expenses'],
    newItems: [{ label: 'Expense', a: 'new' }],
    badge() {
      const list = expenses();
      if (!list.length) return null;
      const f = monthFigures(list, curYm(), modelIndex());
      if (!(f.budget.total > 0) || f.spent <= f.budget.total) return null;
      return { text: 'Over', hot: true, title: `${longMonth(f.ym)} spending is ${money(f.spent - f.budget.total)} over the plan budget` };
    },
    render() {
      const loading = ctx.isLoading(), w = ctx.canWrite();
      const list = loading ? [] : expenses();
      const add = w ? btn('new', 'Add expense', '', 'btn-primary') : '';
      if (loading) {
        return ctx.ui.toolbar({ title: 'Expenses', actions: add }) + '<div class="empty"><p>Loading expenses…</p></div>';
      }
      const modelByYm = modelIndex();
      if (!list.length) {
        const b = budgetFor(selYm(), modelByYm);
        const lines = CATS.map(c => c.label.toLowerCase());
        const budgetText = b.total > 0 ? ` Your plan budget for ${longMonth(selYm())} is ${money(b.total)}.` : '';
        return ctx.ui.toolbar({ title: 'Expenses', count: '0 logged', actions: add, exportable: true }) + ctx.ui.empty({
          title: 'No expenses logged yet',
          text: `Log each payment to see spending against the plan budget, month by month.${budgetText} Categories match the plan’s income statement lines: ${lines.slice(0, -1).join(', ')} and ${lines[lines.length - 1]}. Mark hosting, seats and other monthly bills as recurring to track your run-rate.`,
          action: w ? `<button class="btn btn-primary" type="button" data-act="mod" data-mod="${ID}" data-a="new">Add your first expense</button>` : ''
        });
      }
      const f = monthFigures(list, selYm(), modelByYm);
      return ctx.ui.toolbar({ title: 'Expenses', count: `${list.length} logged`, filters: monthPicker(), actions: add, exportable: true })
        + kpiRow(f, list)
        + `<div class="grid grid-2 section">${vsBudgetPanel(f)}${trendPanel(list, modelByYm)}</div>`
        + `<div class="section">${tablePanel(list)}</div>`
        + `<div class="grid grid-2 section">${recurringPanel(list)}${planPanel(modelByYm)}</div>`;
    },
    onAction(a, d) {
      if (a === 'prev' || a === 'next') { st.ym = ctx.addMonths(selYm(), a === 'prev' ? -1 : 1); st.all = false; ctx.render(); }
      else if (a === 'month') { if (st.all) st.all = false; else st.ym = curYm(); ctx.render(); }
      else if (a === 'all') { st.all = !st.all; ctx.render(); }
      else if (a === 'pick') { if (/^\d{4}-\d{2}$/.test(d.ym || '')) { st.ym = d.ym; st.all = false; ctx.render(); } }
      else if (a === 'new') openForm(null);
      else if (a === 'edit') { const x = ctx.get('expenses', d.id); if (x) openForm(x); else ctx.toast('That expense no longer exists.', 'bad'); }
      else if (a === 'delete') confirmDelete(d.id);
      else if (a === 'log-recurring') confirmLogRecurring();
    },
    csv() {
      const rows = [['Date', 'Vendor', 'Description', 'Category', 'Amount', 'Recurring monthly', 'Notes', 'Created']];
      expenses().slice().sort((a, b) => -newestFirst(a, b)).forEach(x => {
        rows.push([x.date || '', x.vendor || '', x.description || '', catLabel(x.category), round2(x.amount), x.recurring ? 'Yes' : 'No', x.notes || '', ctx.isoToYmd(x.createdAt)]);
      });
      return { name: 'expenses', rows };
    }
  };
});
</script>
<script>
/* ---- tab module: invoices ---- */
/* Invoices tab: a record of what each customer was billed, what they still owe and what has been paid.
   These are records only; the founder sends the actual invoice from email or a billing tool. */
(window.__dbViews = window.__dbViews || []).push(function (ctx) {
  'use strict';
  const ID = 'invoices';
  const esc = ctx.esc;
  const TERMS_DAYS = 14;      // default payment terms: due 14 days after the issue date
  const MAX_LINES = 5;        // line rows shown in the form
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const FILTERS = [['all', 'All'], ['draft', 'Draft'], ['sent', 'Sent'], ['overdue', 'Overdue'], ['paid', 'Paid'], ['void', 'Void']];
  const BUCKETS = [
    { label: 'Not yet due', short: 'Not due', test: d => d <= 0 },
    { label: '1–30 days', short: '1–30', test: d => d >= 1 && d <= 30 },
    { label: '31–60 days', short: '31–60', test: d => d >= 31 && d <= 60 },
    { label: '61–90 days', short: '61–90', test: d => d >= 61 && d <= 90 },
    { label: '90+ days', short: '90+', test: d => d > 90 }
  ];
  const LINE_GRID = 'display:grid;grid-template-columns:minmax(0,1fr) 64px 100px;gap:8px;align-items:center';

  const state = { filter: 'all' };
  /* Per-form state for the invoice modal that is open right now. */
  let form = { rows: MAX_LINES, dueEdited: false };

  /* ---------- helpers ---------- */
  const s = n => (n === 1 ? '' : 's');
  const round2 = n => Math.round(ctx.num(n) * 100) / 100;
  const money = n => ctx.fmtPrice(round2(n));
  const invoices = () => ctx.all('invoices');
  const total = inv => ctx.invoiceTotal(inv);
  const coName = inv => { const c = ctx.company(inv.companyId); return c ? (c.name || 'Unnamed company') : ''; };
  const dealName = inv => { const d = ctx.deal(inv.dealId); return d ? (d.name || 'Untitled deal') : ''; };
  const byName = (a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' });
  function daysBetween(from, to) {
    const a = ctx.parseYmd(from), b = ctx.parseYmd(to);
    if (!a || !b) return null;
    return Math.round((b.getTime() - a.getTime()) / 864e5);
  }
  /* Days past the due date as of today (0 or less = not yet due; no due date = not yet due). */
  function daysPastDue(inv, today) { const d = daysBetween(inv.dueDate, today); return d == null ? 0 : d; }
  function monYear(ymd) {
    const d = ctx.parseYmd(ymd) || ctx.parseYmd(ctx.todayStr());
    return MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }
  function monthLong(ym) {
    const m = Number(String(ym).slice(5, 7)), y = String(ym).slice(0, 4);
    return (MONTHS_LONG[m - 1] || '') + ' ' + y;
  }
  function nextNumber() {
    let max = 0;
    invoices().forEach(i => { const m = /(\d+)\s*$/.exec(String(i.number || '')); if (m) max = Math.max(max, parseInt(m[1], 10)); });
    return 'INV-' + String(max + 1).padStart(4, '0');
  }
  const byIssueDesc = (a, b) => String(b.issueDate || '').localeCompare(String(a.issueDate || '')) || String(b.number || '').localeCompare(String(a.number || ''));
  function actBtn(a, label, inv, cls) {
    return `<button class="btn btn-sm ${cls || ''}" type="button" data-act="mod" data-mod="${ID}" data-a="${a}" data-id="${esc(inv.id)}" aria-label="${esc(label + ' ' + (inv.number || 'invoice'))}">${esc(label)}</button>`;
  }
  function statusChip(inv, st, today) {
    if (st === 'overdue') { const n = daysPastDue(inv, today); return ctx.ui.chip(`Overdue · ${n} day${s(n)}`, 'bad'); }
    if (st === 'sent') return ctx.ui.chip('Sent', 'accent');
    if (st === 'paid') return ctx.ui.chip(inv.paidDate ? 'Paid · ' + ctx.fmtShort(inv.paidDate) : 'Paid', 'good');
    if (st === 'void') return ctx.ui.chip('Void');
    if (st === 'draft') return ctx.ui.chip('Draft');
    return ctx.ui.chip(String(st));
  }

  /* ---------- numbers ---------- */
  function summary(list, today) {
    const sent = list.filter(i => i.status === 'sent');                       // includes overdue
    const overdue = sent.filter(i => ctx.invoiceStatus(i) === 'overdue');
    const ym = ctx.ymOf(today);
    const paidMonth = list.filter(i => i.status === 'paid' && i.paidDate && ctx.ymOf(i.paidDate) === ym);
    const drafts = list.filter(i => ctx.invoiceStatus(i) === 'draft');
    const aging = BUCKETS.map(b => {
      const inB = sent.filter(i => b.test(daysPastDue(i, today)));
      return { label: b.label, short: b.short, count: inB.length, amount: round2(ctx.sum(inB, total)) };
    });
    return {
      sent, overdue, paidMonth, drafts, aging, ym,
      outAmt: round2(ctx.sum(sent, total)),
      odAmt: round2(ctx.sum(overdue, total)),
      odOldest: overdue.reduce((m, i) => Math.max(m, daysPastDue(i, today)), 0),
      paidAmt: round2(ctx.sum(paidMonth, total)),
      draftAmt: round2(ctx.sum(drafts, total))
    };
  }

  /* ---------- render ---------- */
  function newButton(primary, label) {
    return `<button class="btn ${primary ? 'btn-primary' : 'btn-sm'}" type="button" data-act="mod" data-mod="${ID}" data-a="new">${esc(label)}</button>`;
  }

  function kpisHtml(k) {
    return `<section class="kpis" aria-label="Invoice summary">${[
      ctx.ui.kpi({
        label: 'Outstanding', value: money(k.outAmt),
        sub: k.sent.length ? `${k.sent.length} sent invoice${s(k.sent.length)} awaiting payment` : 'No sent invoices awaiting payment'
      }),
      ctx.ui.kpi({
        label: 'Overdue', value: money(k.odAmt), tone: k.overdue.length || k.odAmt > 0 ? 'bad' : '',
        sub: k.overdue.length ? `${k.overdue.length} invoice${s(k.overdue.length)} past due · oldest ${k.odOldest} day${s(k.odOldest)}` : 'Nothing past due'
      }),
      ctx.ui.kpi({
        label: 'Paid this month', value: money(k.paidAmt),
        sub: k.paidMonth.length ? `${k.paidMonth.length} payment${s(k.paidMonth.length)} in ${esc(monthLong(k.ym))}` : `No payments yet in ${esc(monthLong(k.ym))}`
      }),
      ctx.ui.kpi({
        label: 'Drafts', value: String(k.drafts.length),
        sub: k.drafts.length ? `${money(k.draftAmt)} not sent yet` : 'Nothing waiting to send'
      })
    ].join('')}</section>`;
  }

  function agingHtml(k, today) {
    const sub = `Sent, unpaid invoices by days past due, as of ${ctx.fmtDate(today)}`;
    if (!k.sent.length) {
      return `<div class="section">${ctx.ui.panel({
        title: 'Receivables aging', sub,
        body: '<p class="note" style="margin:0">Nothing is owed right now. When you mark an invoice sent, it shows here by how late it is until you record the payment.</p>'
      })}</div>`;
    }
    const rows = k.aging.map(b => `<tr><td>${esc(b.label)}</td><td class="num">${b.count}</td><td class="num">${money(b.amount)}</td><td class="num">${k.outAmt > 0 ? ctx.fmtPct(b.amount / k.outAmt, 0) : '—'}</td></tr>`).join('');
    const table = `<table class="compact" style="min-width:0"><thead><tr><th>Days past due</th><th class="num">Invoices</th><th class="num">Owed</th><th class="num">Share</th></tr></thead>
      <tbody>${rows}<tr style="font-weight:600"><td>Total</td><td class="num">${k.sent.length}</td><td class="num">${money(k.outAmt)}</td><td class="num">${k.outAmt > 0 ? '100%' : '—'}</td></tr></tbody></table>`;
    const chart = ctx.chart.bars({
      labels: k.aging.map(b => b.short),
      series: [{ name: 'Owed', values: k.aging.map(b => b.amount), color: 'var(--viz-1)' }],
      height: 200, format: ctx.fmtCompact,
      ariaLabel: 'Amount owed by days past due: ' + k.aging.map(b => `${b.label} ${money(b.amount)}`).join(', ')
    });
    return `<div class="section">${ctx.ui.panel({
      title: 'Receivables aging', sub,
      body: `<div class="grid grid-2" style="align-items:start"><div style="overflow-x:auto">${table}</div><div>${chart}</div></div>`
    })}</div>`;
  }

  function rowHtml(inv, can, today) {
    const st = ctx.invoiceStatus(inv);
    const co = ctx.company(inv.companyId);
    const dn = dealName(inv);
    const cust = co
      ? `<button class="link" type="button" data-act="mod" data-mod="${ID}" data-a="open-co" data-id="${esc(co.id)}">${esc(co.name || 'Unnamed company')}</button>`
      : '<span class="muted">No customer</span>';
    let acts = '';
    if (can) {
      if (st === 'draft') acts += actBtn('send', 'Mark sent', inv);
      if (st === 'sent' || st === 'overdue') acts += actBtn('pay', 'Record payment', inv);
      if (st === 'paid') acts += actBtn('unpay', 'Undo payment', inv, 'btn-ghost');
      acts += actBtn('edit', 'Edit', inv, 'btn-ghost');
      if (st === 'draft' || st === 'sent' || st === 'overdue') acts += actBtn('void', 'Void', inv, 'btn-ghost');
      acts += actBtn('delete', 'Delete', inv, 'btn-ghost btn-danger');
    }
    return `<tr id="${ID}-row-${esc(inv.id)}">
      <td class="mono" style="white-space:nowrap">${esc(inv.number || '—')}</td>
      <td><div class="trunc">${cust}</div>${dn ? `<div class="cell-sub trunc">${esc(dn)}</div>` : ''}</td>
      <td style="white-space:nowrap">${esc(ctx.fmtDate(inv.issueDate)) || '<span class="muted">—</span>'}</td>
      <td style="white-space:nowrap">${esc(ctx.fmtDate(inv.dueDate)) || '<span class="muted">—</span>'}</td>
      <td class="num">${money(total(inv))}</td>
      <td>${statusChip(inv, st, today)}</td>
      ${can ? `<td><div class="row-actions">${acts}</div></td>` : ''}
    </tr>`;
  }

  function render() {
    const loading = ctx.isLoading();
    const can = ctx.canWrite();
    const list = invoices();
    const today = ctx.todayStr();
    if (loading) {
      return ctx.ui.toolbar({ title: 'Invoices' }) + '<div class="empty"><p>Loading invoices…</p></div>';
    }
    if (!list.length) {
      return ctx.ui.toolbar({ title: 'Invoices', count: '0', actions: can ? newButton(false, 'New invoice') : '' }) + ctx.ui.empty({
        title: 'No invoices yet',
        text: 'Record each invoice you bill: customer, line items and due date. This tab then shows what customers owe, what is overdue and what has been paid. Invoices here are records only; send the invoice itself from email or your billing tool.',
        action: can ? newButton(true, 'Record your first invoice') : ''
      });
    }

    const searched = list.filter(i => ctx.matches(i.number, coName(i)));
    const counts = { all: searched.length };
    searched.forEach(i => { const st = ctx.invoiceStatus(i); counts[st] = (counts[st] || 0) + 1; });
    const seg = `<div class="seg" role="group" aria-label="Filter invoices by status" style="max-width:100%;overflow-x:auto;white-space:nowrap">${FILTERS.map(f =>
      `<button type="button" data-act="mod" data-mod="${ID}" data-a="filter" data-v="${f[0]}" aria-pressed="${state.filter === f[0]}">${f[1]} <span style="opacity:.7;font-weight:500">${counts[f[0]] || 0}</span></button>`).join('')}</div>`;
    const head = ctx.ui.toolbar({
      title: 'Invoices', count: String(list.length), filters: seg, exportable: true,
      actions: can ? newButton(false, 'New invoice') : ''
    });

    const k = summary(list, today);
    const shown = searched.filter(i => state.filter === 'all' || ctx.invoiceStatus(i) === state.filter).sort(byIssueDesc);

    let table;
    if (!shown.length) {
      const q = String(ctx.S.q || '').trim();
      const fl = (FILTERS.find(f => f[0] === state.filter) || FILTERS[0])[1].toLowerCase();
      const clear = state.filter !== 'all' ? `<button class="btn btn-sm" type="button" data-act="mod" data-mod="${ID}" data-a="filter" data-v="all">Show all invoices</button>` : '';
      table = q
        ? `<div class="empty"><h2>No ${state.filter === 'all' ? '' : esc(fl) + ' '}invoices match “${esc(q)}”</h2><p>Search by invoice number or customer name, or clear the search.</p>${clear}</div>`
        : `<div class="empty"><h2>No ${esc(fl)} invoices</h2><p>${state.filter === 'overdue' ? 'Every sent invoice is still within its due date.' : 'Invoices with this status will appear here.'}</p>${clear}</div>`;
    } else {
      table = `<div class="table-wrap" style="margin-bottom:8px"><table class="compact" id="${ID}-table">
        <thead><tr><th>Number</th><th>Customer</th><th>Issued</th><th>Due</th><th class="num">Total</th><th>Status</th>${can ? '<th class="num"><span class="muted" style="font-weight:600">Actions</span></th>' : ''}</tr></thead>
        <tbody>${shown.map(i => rowHtml(i, can, today)).join('')}</tbody></table></div>
        <p class="note" style="margin-bottom:28px">${shown.length} of ${list.length} invoice${s(list.length)} shown. Invoices here are records of what you billed: send the invoice itself from email or your billing tool, then mark it sent here so it counts as owed.</p>`;
    }
    return head + kpisHtml(k) + agingHtml(k, today) + table;
  }

  /* ---------- invoice form ---------- */
  function dealOpts(companyId) {
    const ds = companyId ? ctx.all('deals').filter(d => d.companyId === companyId).sort(byName) : [];
    const first = ds.length ? 'No deal' : (companyId ? 'No deals for this customer' : 'Choose a customer first');
    return [['', first]].concat(ds.map(d => [d.id, `${d.name || 'Untitled deal'} · ${ctx.stageOf(d).name}${ctx.priced(d) ? ` · ${ctx.locs(d)} location${s(ctx.locs(d))}` : ''}`]));
  }
  const optsHtml = (opts, sel) => opts.map(o => `<option value="${esc(o[0])}"${String(o[0]) === String(sel || '') ? ' selected' : ''}>${esc(o[1])}</option>`).join('');

  /* Reads the line rows. Blank rows are skipped; a blank quantity counts as 1.
     The running total covers every complete line, even after an earlier line has an error. */
  function readLines() {
    const lines = [];
    let running = 0, err = null;
    for (let n = 1; n <= form.rows; n++) {
      const d = ctx.val(`inv-line-${n}-desc`), q = ctx.val(`inv-line-${n}-qty`), p = ctx.val(`inv-line-${n}-price`);
      if (!d && !q && !p) continue;
      const qty = q === '' ? 1 : round2(Number(q.replace(/,/g, '')));   // rounded as saved, so 0.001 does not pass as > 0
      const price = p === '' ? null : ctx.parseMoney(p);
      if (qty > 0 && price != null) running += qty * price;
      if (err) continue;
      if (!d) err = { error: `Describe line ${n}, like “Setup fee”.`, focus: `inv-line-${n}-desc` };
      else if (!(qty > 0)) err = { error: `Enter a quantity above 0 on line ${n}.`, focus: `inv-line-${n}-qty` };
      else if (price == null) err = { error: `Enter a unit price of 0 or more on line ${n}, like ${ctx.priceFor(ctx.val(`${ID}-issue`) || ctx.todayStr())}.`, focus: `inv-line-${n}-price` };
      else lines.push({ description: d, qty, unitPrice: price });
    }
    return err ? Object.assign(err, { running }) : { lines, running };
  }

  function formBody(inv, number) {
    const t = ctx.todayStr();
    const issue = inv && ctx.parseYmd(inv.issueDate) ? inv.issueDate : t;
    const due = (inv && inv.dueDate) || ctx.addDays(issue, TERMS_DAYS);
    const coId = inv && ctx.company(inv.companyId) ? inv.companyId : '';
    const coOpts = [['', 'Choose a customer']].concat(ctx.all('companies').slice().sort(byName).map(c => [c.id, c.name || 'Unnamed company']));
    const lines = inv && Array.isArray(inv.lines) ? inv.lines : [];
    let rows = '';
    for (let n = 1; n <= form.rows; n++) {
      const l = lines[n - 1] || {};
      rows += `<div style="${LINE_GRID}">
        <input class="input" id="inv-line-${n}-desc" aria-label="Line ${n} description" value="${esc(l.description == null ? '' : l.description)}">
        <input class="input mono" id="inv-line-${n}-qty" inputmode="decimal" placeholder="1" aria-label="Line ${n} quantity" value="${esc(l.qty == null ? '' : l.qty)}">
        <input class="input mono" id="inv-line-${n}-price" inputmode="decimal" aria-label="Line ${n} unit price in dollars" value="${esc(l.unitPrice == null ? '' : l.unitPrice)}">
      </div>`;
    }
    const p = ctx.plan();
    const quick = `<div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span class="muted" style="font-size:13px">Quick add</span>
      <button class="btn btn-sm" type="button" id="${ID}-add-setup" title="One-time setup fee, ${esc(money(ctx.setupFee()))}">Setup fee</button>
      <button class="btn btn-sm" type="button" id="${ID}-add-sub" title="One month per location at the plan price for the issue date's year">Monthly subscription</button>
      <button class="btn btn-sm" type="button" id="${ID}-add-pilot" title="30-day paid pilot, ${esc(money(ctx.num(p.pilotFee)))}">Paid pilot (30 days)</button></div>`;
    return `<p class="note" style="margin:0">Number ${esc(number)}. This saves a record of the invoice; send the invoice itself from email or your billing tool.</p>
      <div class="row2">${ctx.F.select(`${ID}-company`, 'Customer', coOpts, coId)}${ctx.F.select(`${ID}-deal`, 'Deal (optional)', dealOpts(coId), inv && inv.dealId ? inv.dealId : '')}</div>
      <div class="row2">${ctx.F.date(`${ID}-issue`, 'Issue date', issue)}${ctx.F.date(`${ID}-due`, `Due date <span class="muted" style="font-weight:400">(${TERMS_DAYS} days after issue unless you change it)</span>`, due)}</div>
      <div class="field" role="group" aria-labelledby="${ID}-lines-label"><span id="${ID}-lines-label" style="font-size:13px;font-weight:600">Line items</span>
        <div style="${LINE_GRID};font-size:12px;color:var(--muted)"><span>Description</span><span>Qty</span><span>Unit price</span></div>
        ${rows}
      </div>
      ${quick}
      <dl class="stat-list"><div class="stat-row total"><dt>Total</dt><dd id="${ID}-form-total">${money(ctx.invoiceTotal({ lines }))}</dd></div></dl>
      ${ctx.F.area(`${ID}-notes`, 'Notes (optional)', (inv && inv.notes) || '', 2)}`;
  }

  function updateTotal() {
    const el = document.getElementById(`${ID}-form-total`);
    if (el) el.textContent = money(readLines().running);
  }

  function fillLine(description, qty, unitPrice) {
    for (let n = 1; n <= form.rows; n++) {
      const d = document.getElementById(`inv-line-${n}-desc`), q = document.getElementById(`inv-line-${n}-qty`), p = document.getElementById(`inv-line-${n}-price`);
      if (!d || !q || !p) continue;
      if (String(d.value || '').trim() || String(q.value || '').trim() || String(p.value || '').trim()) continue;
      d.value = description; q.value = String(qty); p.value = String(round2(unitPrice));
      const err = document.getElementById('form-err'); if (err) err.hidden = true;
      updateTotal();
      return;
    }
    ctx.formErr(`All ${form.rows} lines are in use. Clear a line to add another.`);
  }

  function wireForm() {
    const g = id => document.getElementById(id);
    const co = g(`${ID}-company`), dealSel = g(`${ID}-deal`), issue = g(`${ID}-issue`), due = g(`${ID}-due`);
    if (co && dealSel) co.addEventListener('change', () => { dealSel.innerHTML = optsHtml(dealOpts(co.value), ''); });
    if (issue && due) {
      const onIssue = () => { if (!form.dueEdited && ctx.parseYmd(issue.value)) due.value = ctx.addDays(issue.value, TERMS_DAYS); };
      issue.addEventListener('input', onIssue); issue.addEventListener('change', onIssue);
      const onDue = () => { form.dueEdited = String(due.value || '') !== ''; };
      due.addEventListener('input', onDue); due.addEventListener('change', onDue);
    }
    for (let n = 1; n <= form.rows; n++) {
      ['desc', 'qty', 'price'].forEach(f => { const el = g(`inv-line-${n}-${f}`); if (el) el.addEventListener('input', updateTotal); });
    }
    const add = (id, fn) => { const b = g(id); if (b) b.addEventListener('click', e => { if (e && e.preventDefault) e.preventDefault(); fn(); }); };
    add(`${ID}-add-setup`, () => fillLine('Setup fee', 1, ctx.setupFee()));
    add(`${ID}-add-sub`, () => {
      const issueDate = ctx.val(`${ID}-issue`) || ctx.todayStr();
      const d = ctx.deal(ctx.val(`${ID}-deal`));
      fillLine(`Subscription, ${monYear(issueDate)}`, d ? ctx.locs(d) : 1, ctx.priceFor(issueDate));
    });
    add(`${ID}-add-pilot`, () => fillLine('Paid pilot (30 days)', 1, ctx.num(ctx.plan().pilotFee)));
  }

  function openForm(inv) {
    if (!ctx.canWrite()) { ctx.toast('You can view invoices but not change them.', 'bad'); return; }
    if (!inv && !ctx.all('companies').length) { ctx.toast('Add the customer as a company first, then record the invoice.', 'bad'); return; }
    const lines = inv && Array.isArray(inv.lines) ? inv.lines : [];
    const issue0 = inv && ctx.parseYmd(inv.issueDate) ? inv.issueDate : ctx.todayStr();
    form = {
      rows: Math.max(MAX_LINES, lines.length),
      dueEdited: !!(inv && inv.dueDate && inv.dueDate !== ctx.addDays(issue0, TERMS_DAYS))
    };
    const number = inv ? (inv.number || 'Invoice') : nextNumber();
    ctx.openFormModal({
      title: inv ? `Edit ${number}` : 'New invoice',
      body: formBody(inv, number),
      submitLabel: inv ? 'Save invoice' : 'Save as draft',
      afterOpen: wireForm,
      onSubmit: () => submitForm(inv ? inv.id : null)
    });
  }

  async function submitForm(id) {
    const cur = id ? ctx.get('invoices', id) : null;
    if (id && !cur) return ctx.formErr('This invoice was deleted. Close this form to see the current list.');
    const companyId = ctx.val(`${ID}-company`);
    if (!companyId || !ctx.company(companyId)) return ctx.formErr('Choose the customer for this invoice.', `${ID}-company`);
    let dealId = ctx.val(`${ID}-deal`) || null;
    if (dealId) { const d = ctx.deal(dealId); if (!d || d.companyId !== companyId) return ctx.formErr('Choose a deal for this customer, or No deal.', `${ID}-deal`); }
    const issueDate = ctx.val(`${ID}-issue`);
    if (!ctx.parseYmd(issueDate)) return ctx.formErr('Enter the issue date.', `${ID}-issue`);
    const dueDate = ctx.val(`${ID}-due`);
    if (!ctx.parseYmd(dueDate)) return ctx.formErr('Enter the due date.', `${ID}-due`);
    if (dueDate < issueDate) return ctx.formErr(`The due date can’t be before the issue date, ${ctx.fmtDate(issueDate)}.`, `${ID}-due`);
    const r = readLines();
    if (r.error) return ctx.formErr(r.error, r.focus);
    if (!r.lines.length) return ctx.formErr('Add at least one line with a description, quantity and unit price. The quick-add buttons fill one in.', 'inv-line-1-desc');
    if (cur && cur.status === 'paid' && cur.paidDate && cur.paidDate < issueDate) return ctx.formErr(`This invoice was paid on ${ctx.fmtDate(cur.paidDate)}, so the issue date can’t be later than that.`, `${ID}-issue`);
    const notes = ctx.val(`${ID}-notes`);
    if (cur) {
      const ok = await ctx.patch('invoices', cur.id, { companyId, dealId, issueDate, dueDate, lines: r.lines, notes, updatedAt: ctx.iso() });
      if (ok) ctx.toast(`Saved ${cur.number || 'invoice'}`);
      return ok;
    }
    const number = nextNumber();
    const newId = await ctx.create('invoices', {
      number, companyId, dealId, issueDate, dueDate, lines: r.lines, status: 'draft', paidDate: null, notes,
      createdAt: ctx.iso(), createdBy: ctx.me()
    });
    if (newId) {
      if (state.filter !== 'all' && state.filter !== 'draft') state.filter = 'all';
      ctx.toast(`${number} saved as a draft for ${money(ctx.invoiceTotal({ lines: r.lines }))}`);
    }
    return !!newId;
  }

  /* ---------- row actions ---------- */
  function openPay(inv) {
    const t = ctx.todayStr();
    const def = inv.issueDate && inv.issueDate > t ? inv.issueDate : t;
    const amt = money(total(inv));
    const open = ctx.finance().openingDate;   // cash flows only count payments from this date on
    const pre = inv.issueDate && open && inv.issueDate < open ? ` A payment dated before ${ctx.fmtDate(open)}, when your cash balance starts, stays out of cash.` : '';
    ctx.openFormModal({
      title: `Record payment · ${inv.number || 'Invoice'}`,
      body: `<dl class="stat-list">
          <div class="stat-row"><dt>Customer</dt><dd style="font-family:inherit">${esc(coName(inv) || 'No customer')}</dd></div>
          <div class="stat-row"><dt>Issued</dt><dd>${esc(ctx.fmtDate(inv.issueDate) || '—')}</dd></div>
          <div class="stat-row"><dt>Due</dt><dd>${esc(ctx.fmtDate(inv.dueDate) || '—')}</dd></div>
          <div class="stat-row total"><dt>Amount</dt><dd>${amt}</dd></div></dl>
        ${ctx.F.date(`${ID}-pay-date`, 'Payment date', def)}
        <p class="note" style="margin:0">This marks the full ${amt} as paid. Cash on hand counts it from the payment date.${esc(pre)}</p>`,
      submitLabel: 'Record payment',
      onSubmit: async () => {
        const cur = ctx.get('invoices', inv.id);
        if (!cur) return ctx.formErr('This invoice was deleted.');
        const d = ctx.val(`${ID}-pay-date`);
        if (!ctx.parseYmd(d)) return ctx.formErr('Enter the date the payment arrived.', `${ID}-pay-date`);
        if (cur.issueDate && d < cur.issueDate) return ctx.formErr(`The payment date can’t be before the issue date, ${ctx.fmtDate(cur.issueDate)}.`, `${ID}-pay-date`);
        const ok = await ctx.patch('invoices', cur.id, { status: 'paid', paidDate: d, updatedAt: ctx.iso() });
        if (ok) ctx.toast(`${cur.number || 'Invoice'} marked paid on ${ctx.fmtDate(d)}`);
        return ok;
      }
    });
  }

  async function onAction(a, data) {
    if (a === 'filter') { state.filter = FILTERS.some(f => f[0] === data.v) ? data.v : 'all'; ctx.render(); return; }
    if (a === 'open-co') { if (data.id && ctx.company(data.id)) ctx.openDrawer('company', data.id); return; }
    if (a === 'new') { openForm(null); return; }
    const inv = data.id ? ctx.get('invoices', data.id) : null;
    if (!inv) return;
    if (!ctx.canWrite()) { ctx.toast('You can view invoices but not change them.', 'bad'); return; }
    const label = inv.number || 'this invoice';
    switch (a) {
      case 'edit': openForm(inv); break;
      case 'send':
        if (await ctx.patch('invoices', inv.id, { status: 'sent', updatedAt: ctx.iso() })) ctx.toast(`${label} marked sent${inv.dueDate ? ' · due ' + ctx.fmtDate(inv.dueDate) : ''}`);
        break;
      case 'pay': openPay(inv); break;
      case 'unpay':
        if (await ctx.patch('invoices', inv.id, { status: 'sent', paidDate: null, updatedAt: ctx.iso() })) ctx.toast(`${label} is unpaid again`);
        break;
      case 'void':
        ctx.openConfirm(`Void ${label}?`, `${coName(inv) || 'No customer'} · ${money(total(inv))}. The invoice stays on record as void and no longer counts as owed.`, 'Void invoice', async () => {
          if (await ctx.patch('invoices', inv.id, { status: 'void', updatedAt: ctx.iso() })) ctx.toast(`${label} voided`);
        });
        break;
      case 'delete':
        ctx.openConfirm(`Delete ${label}?`, 'This removes the invoice record for good and can’t be undone. To keep a record, void it instead.', 'Delete', async () => {
          if (await ctx.remove('invoices', inv.id)) ctx.toast(`Deleted ${label}`);
        });
        break;
    }
  }

  /* ---------- export ---------- */
  function csv() {
    const today = ctx.todayStr();
    const rows = [['Number', 'Customer', 'Deal', 'Issue date', 'Due date', 'Status', 'Total', 'Paid date', 'Days past due', 'Lines', 'Notes']];
    invoices().slice().sort((a, b) => String(a.number || '').localeCompare(String(b.number || ''))).forEach(i => {
      const st = ctx.invoiceStatus(i);
      const lines = (Array.isArray(i.lines) ? i.lines : []).map(l => `${l.description || ''} (${ctx.num(l.qty)} x ${ctx.fmtPrice(round2(l.unitPrice))})`).join('; ');
      rows.push([String(i.number || ''), coName(i), dealName(i), String(i.issueDate || ''), String(i.dueDate || ''), st, total(i),
        String(i.paidDate || ''), st === 'overdue' ? daysPastDue(i, today) : '', lines, String(i.notes || '')]);
    });
    return { name: 'invoices', rows };
  }

  return {
    id: ID,
    label: 'Invoices',
    group: 'Finance',
    order: 30,
    collections: ['invoices'],
    newItems: [{ label: 'Invoice', a: 'new' }],
    badge() {
      const n = invoices().filter(i => ctx.invoiceStatus(i) === 'overdue').length;
      return n ? { text: String(n), hot: true, title: `${n} overdue invoice${s(n)}` } : null;
    },
    render,
    onAction(a, data) {
      onAction(a, data || {}).catch(err => { console.error(err); ctx.toast('Something went wrong in Invoices.', 'bad'); });
    },
    csv
  };
});
</script>
<script>
/* ---- tab module: cash ---- */
(window.__dbViews = window.__dbViews || []).push(function (ctx) {
  'use strict';

  /* What-if inputs, kept as typed so the next render shows them. */
  var whatIf = { extraSpend: '', extraIncome: '' };
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var PROJECT_MONTHS = 12;

  function round2(n) { return (Math.round(ctx.num(n) * 100) / 100) || 0; }
  /* Exact dollars and cents for recorded cash; whole dollars for estimates. */
  function money(n) { return ctx.fmtPrice(round2(n)); }
  function signed(n) { var v = round2(n); return (v > 0 ? '+' : '') + money(v); }
  function monYear(ym) { var p = String(ym).split('-'); return (MONTHS[Number(p[1]) - 1] || '') + ' ' + p[0]; }
  function negCls(n) { return round2(n) < 0 ? ' neg' : ''; }

  /* Everything the tab shows, computed once per render from the shared finance helpers. */
  function model() {
    var F = ctx.finance();
    var today = ctx.todayStr();
    var cur = ctx.ymOf(today);
    var openYm = ctx.ymOf(F.openingDate);
    var first = openYm <= cur ? openYm : cur;
    var rows = ctx.cashByMonth(first, cur);
    var flows = ctx.cashFlows(ctx.monthEnd(cur));
    var burn = ctx.burnRate();
    var cash = ctx.cashOn(today);
    var curRow = rows[rows.length - 1] || { ym: cur, cashIn: 0, cashOut: 0, net: 0, end: cash };
    var proj = [];
    for (var k = 1; k <= PROJECT_MONTHS; k++) {
      proj.push({ ym: ctx.addMonths(cur, k), change: -burn.monthly, end: curRow.end - burn.monthly * k });
    }
    var todayFlows = ctx.cashFlows(today);
    return {
      F: F, today: today, cur: cur, rows: rows, burn: burn, cash: cash, curRow: curRow, proj: proj,
      runway: ctx.runwayMonths(), hasFlows: flows.ins.length + flows.outs.length > 0,
      inToDate: ctx.sum(todayFlows.ins, function (x) { return x.amount; }),
      outToDate: ctx.sum(todayFlows.outs, function (x) { return x.amount; })
    };
  }

  /* Runway text for a given cash balance and monthly net burn. */
  function runwayInfo(cash, burnMonthly, today) {
    if (!(burnMonthly > 0)) return { months: Infinity, text: 'Not burning cash', until: burnMonthly < 0 ? 'Cash in covers cash out' : 'No net cash going out', tone: 'good' };
    var r = Math.max(0, cash / burnMonthly);
    var tone = r < 6 ? 'bad' : r < 12 ? 'warn' : '';
    if (r <= 0) return { months: 0, text: '0 months', until: 'Cash is at or below zero', tone: 'bad' };
    if (r >= 120) return { months: r, text: 'Over 10 years', until: 'At this burn rate', tone: tone };
    var end = ctx.addDays(today, Math.round(r * 30.4375));
    return { months: r, text: ctx.fmtNum(r, 1) + ' months', until: 'until ' + monYear(ctx.ymOf(end)), tone: tone };
  }

  function whatIfNumbers(m) {
    var spend = ctx.parseMoney(whatIf.extraSpend), income = ctx.parseMoney(whatIf.extraIncome);
    var bad = spend == null || income == null;
    var b = m.burn.monthly + (spend || 0) - (income || 0);
    return { burn: b, run: runwayInfo(m.cash, b, m.today), bad: bad };
  }
  function burnText(b) {
    var v = Math.round(b);
    if (v > 0) return ctx.fmtMoney(v) + ' a month';
    return v < 0 ? 'Cash-flow positive (' + ctx.fmtMoney(-v) + ' a month in)' : 'Break-even ($0 a month)';
  }
  function runText(run) { return run.months === Infinity ? run.text : run.text + ', ' + run.until.replace(/^Cash/, 'cash').replace(/^At/, 'at'); }

  function kpis(m) {
    var b = m.burn.monthly;
    var basis = String(m.burn.basis || '');
    basis = basis.charAt(0).toUpperCase() + basis.slice(1);
    var run = runwayInfo(m.cash, b, m.today);
    return '<section class="kpis">' +
      ctx.ui.kpi({ label: 'Cash on hand', value: money(m.cash), tone: m.cash < 0 ? 'bad' : '',
        sub: money(m.F.openingCash) + ' opening + ' + money(m.inToDate) + ' in &minus; ' + money(m.outToDate) + ' out' }) +
      (m.hasFlows
        ? ctx.ui.kpi({ label: 'Net burn / month', value: b > 0 ? ctx.fmtMoney(b) : 'Cash-flow positive', tone: b > 0 ? '' : 'good',
          sub: ctx.esc(basis) + (Math.round(b) < 0 ? ' (' + ctx.fmtMoney(-b) + ' a month in)' : '') })
        /* Nothing recorded yet: do not claim the company is cash-flow positive. */
        : ctx.ui.kpi({ label: 'Net burn / month', value: ctx.fmtMoney(0), sub: 'Nothing recorded since ' + ctx.esc(ctx.fmtDate(m.F.openingDate)) })) +
      ctx.ui.kpi({ label: 'Runway', value: ctx.esc(run.text), tone: run.tone === 'good' ? 'good' : run.tone, sub: ctx.esc(run.until) }) +
      ctx.ui.kpi({ label: 'This month in / out', value: money(m.curRow.cashIn) + ' / ' + money(m.curRow.cashOut),
        sub: 'Net ' + signed(m.curRow.net) + ' in ' + monYear(m.cur) }) +
      '</section>';
  }

  function charts(m) {
    var labels = m.rows.map(function (r) { return ctx.monthLabel(r.ym); }).concat(m.proj.map(function (p) { return ctx.monthLabel(p.ym); }));
    var n = m.rows.length;
    var actual = m.rows.map(function (r) { return round2(r.end); }).concat(m.proj.map(function () { return null; }));
    var projected = m.rows.map(function (r, i) { return i === n - 1 ? round2(r.end) : null; }).concat(m.proj.map(function (p) { return round2(p.end); }));
    var zero = null;
    for (var i = 0; i < m.proj.length; i++) { if (m.proj[i].end < 0) { zero = m.proj[i].ym; break; } }
    var b = m.burn.monthly;
    var lineNote = 'With what is recorded so far, ' + monYear(m.cur) + ' ends at ' + money(m.curRow.end) + '. ' +
      (b > 0
        ? 'At ' + ctx.fmtMoney(b) + ' a month net burn, ' + (round2(m.curRow.end) < 0 ? 'the balance is already below zero and keeps falling.' : zero ? 'the balance drops below zero in ' + monYear(zero) + '.' : 'it stays above zero for the next ' + PROJECT_MONTHS + ' months.')
        : 'Cash in covers cash out, so the projection does not fall.');
    var line = ctx.ui.panel({
      title: 'Month-end cash', sub: 'actual, then ' + PROJECT_MONTHS + ' months at the current burn',
      body: ctx.chart.line({
        labels: labels, height: 240, refLine: { value: 0, label: 'Zero cash' },
        ariaLabel: 'Month-end cash from ' + monYear(m.rows[0].ym) + ' to ' + monYear(m.cur) + ', projected to ' + monYear(m.proj[m.proj.length - 1].ym),
        series: [
          { name: 'Actual', values: actual, color: 'var(--viz-1)' },
          { name: 'Projected at current burn', values: projected, color: 'var(--viz-plan)', dashed: true }
        ]
      }) + '<p class="note">' + lineNote + '</p>'
    });
    var bars = ctx.ui.panel({
      title: 'Cash in and out', sub: 'by month',
      body: ctx.chart.bars({
        labels: m.rows.map(function (r) { return ctx.monthLabel(r.ym); }), height: 240,
        ariaLabel: 'Cash in and cash out by month',
        series: [
          { name: 'Cash in', values: m.rows.map(function (r) { return round2(r.cashIn); }), color: 'var(--viz-3)' },
          { name: 'Cash out', values: m.rows.map(function (r) { return round2(r.cashOut); }), color: 'var(--viz-2)' }
        ]
      }) + '<p class="note">Cash in is paid invoices; cash out is recorded expenses. The table below has the same numbers.</p>'
    });
    return '<div class="grid grid-2 section">' + line + bars + '</div>';
  }

  function tables(m) {
    var tIn = ctx.sum(m.rows, function (r) { return r.cashIn; }), tOut = ctx.sum(m.rows, function (r) { return r.cashOut; });
    var body = m.rows.slice().reverse().map(function (r) {
      return '<tr><td>' + monYear(r.ym) + (r.ym === m.cur ? ' <span class="muted">so far</span>' : '') + '</td>' +
        '<td class="num">' + money(r.cashIn) + '</td><td class="num">' + money(r.cashOut) + '</td>' +
        '<td class="num' + negCls(r.net) + '">' + signed(r.net) + '</td>' +
        '<td class="num' + negCls(r.end) + '">' + money(r.end) + '</td></tr>';
    }).join('');
    var total = m.rows.length > 1
      ? '<tr><td><strong>Total</strong></td><td class="num"><strong>' + money(tIn) + '</strong></td><td class="num"><strong>' + money(tOut) + '</strong></td>' +
        '<td class="num' + negCls(tIn - tOut) + '"><strong>' + signed(tIn - tOut) + '</strong></td><td></td></tr>'
      : '';
    var monthly = ctx.ui.panel({
      title: 'Monthly cash', sub: 'since ' + ctx.fmtDate(m.F.openingDate),
      body: '<div class="table-wrap flat"><table class="compact"><thead><tr><th>Month</th><th class="num">Cash in</th><th class="num">Cash out</th><th class="num">Net</th><th class="num">End balance</th></tr></thead><tbody>' +
        body + total + '</tbody></table></div>' +
        '<p class="note">Starts from the ' + money(m.F.openingCash) + ' opening balance on ' + ctx.fmtDate(m.F.openingDate) + '.</p>'
    });
    var projRows = m.proj.map(function (p) {
      return '<tr><td>' + monYear(p.ym) + '</td><td class="num' + negCls(p.change) + '">' + (p.change > 0 ? '+' : '') + ctx.fmtMoney(p.change) + '</td>' +
        '<td class="num' + negCls(p.end) + '">' + ctx.fmtMoney(p.end) + '</td></tr>';
    }).join('');
    var proj = ctx.ui.panel({
      title: 'Projection', sub: 'at ' + (m.burn.monthly > 0 ? ctx.fmtMoney(m.burn.monthly) + ' a month net burn' : 'the current net cash flow'),
      body: '<div class="table-wrap flat"><table class="compact" style="min-width:0"><thead><tr><th>Month</th><th class="num">Change</th><th class="num">Month-end cash</th></tr></thead><tbody>' +
        projRows + '</tbody></table></div>' +
        '<p class="note">Starts from ' + monYear(m.cur) + '’s ' + money(m.curRow.end) + ' and applies the current net burn (' + ctx.esc(String(m.burn.basis || '')) + ') every month. New customers and hires are not included.</p>'
    });
    return '<div class="grid grid-2 section">' + monthly + proj + '</div>';
  }

  function openingPanel(m) {
    var doc = ctx.get('settings', 'finance');
    var isDefault = !doc || doc.openingCash == null || doc.openingCash === '';
    var startup = ctx.num(ctx.plan().startupCosts);
    /* finance() falls back to FIN_DEFAULTS, which can differ from the plan's startupCosts once the plan is edited. */
    var def = ctx.FIN_DEFAULTS && ctx.FIN_DEFAULTS.openingCash != null ? ctx.num(ctx.FIN_DEFAULTS.openingCash) : startup;
    var before = ctx.all('expenses').filter(function (x) { return x.date && x.date < m.F.openingDate; });
    var beforeAmt = ctx.sum(before, function (x) { return ctx.num(x.amount); });
    var body = '<dl class="stat-list">' +
      '<div class="stat-row"><dt>Opening balance</dt><dd>' + money(m.F.openingCash) + '</dd></div>' +
      '<div class="stat-row"><dt>As of</dt><dd>' + ctx.esc(ctx.fmtDate(m.F.openingDate)) + '</dd></div>' +
      (m.F.note ? '<div class="stat-row"><dt>Note</dt><dd style="font-family:inherit">' + ctx.esc(m.F.note) + '</dd></div>' : '') +
      '</dl>' +
      '<p class="note">' + (isDefault ? 'This is still the default: ' : 'The default is ') + ctx.fmtMoney(def) +
      ', the plan’s founder-funded startup costs' + (Math.round(startup) !== Math.round(def) ? ' (the plan now lists ' + ctx.fmtMoney(startup) + ')' : '') + '. Replace it with your real bank balance on the day you start tracking; cash on hand adds paid invoices and subtracts expenses from that date.</p>' +
      (before.length ? '<p class="note">' + before.length + ' expense' + (before.length === 1 ? '' : 's') + ' (' + money(beforeAmt) + ') dated before ' + ctx.fmtDate(m.F.openingDate) +
        (before.length === 1 ? ' is' : ' are') + ' not counted, since the opening balance already reflects ' + (before.length === 1 ? 'it' : 'them') + '.</p>' : '');
    return ctx.ui.panel({
      title: 'Opening balance', sub: isDefault ? 'plan default' : '',
      actions: ctx.canWrite() ? '<button class="btn btn-sm" type="button" data-act="mod" data-mod="cash" data-a="edit-opening">Edit</button>' : '',
      body: body
    });
  }

  function whatIfPanel(m) {
    var w = whatIfNumbers(m);
    var inputs = '<div class="row2">' +
      ctx.F.money('cash-whatif-spend', 'Extra spend per month', whatIf.extraSpend, 'placeholder="0" data-mod-input="cash" data-key="extraSpend"') +
      ctx.F.money('cash-whatif-income', 'Extra income per month', whatIf.extraIncome, 'placeholder="0" data-mod-input="cash" data-key="extraIncome"') +
      '</div>';
    var out = '<dl class="stat-list" style="margin-top:14px">' +
      '<div class="stat-row"><dt>Net burn</dt><dd id="cash-whatif-burn">' + ctx.esc(burnText(w.burn)) + '</dd></div>' +
      '<div class="stat-row total"><dt>Runway</dt><dd id="cash-whatif-runway">' + ctx.esc(runText(w.run)) + '</dd></div>' +
      '</dl>' +
      '<p class="note" id="cash-whatif-msg"' + (w.bad ? '' : ' hidden') + '>Use plain dollar amounts, like 500. Anything else counts as $0.</p>' +
      '<p class="note">Try a hire, a new tool or a few more paying locations. Nothing here is saved.</p>';
    return ctx.ui.panel({ title: 'What if', sub: 'from ' + money(m.cash) + ' on hand', body: inputs + out });
  }

  function planPanel() {
    var P = ctx.plan();
    var years = ctx.planYears();
    var sumRows = ctx.planYearSummary(ctx.planModel('base'));
    var byYear = {};
    sumRows.forEach(function (r) { byYear[r.year] = r; });
    var targets = Array.isArray(P.targets) ? P.targets : [];
    function docOp(y) {
      var t = null;
      targets.forEach(function (x) { if (x && String(x.date || '').slice(0, 4) === String(y) && x.opIncome != null && x.opIncome !== '') t = x; });
      return t ? ctx.num(t.opIncome) : null;
    }
    var firstDoc = null, firstModel = null;
    var rows = years.map(function (y) {
      var mo = byYear[y] ? byYear[y].opIncome : null, d = docOp(y);
      if (firstDoc == null && d != null && d > 0) firstDoc = y;
      if (firstModel == null && mo != null && mo > 0) firstModel = y;
      return '<tr><td>' + y + '</td>' +
        '<td class="num' + (mo != null ? negCls(mo) : '') + '">' + (mo == null ? '—' : ctx.fmtMoney(mo)) + '</td>' +
        '<td class="num' + (d != null ? negCls(d) : '') + '">' + (d == null ? '—' : ctx.fmtMoney(d)) + '</td></tr>';
    }).join('');
    var y1 = firstDoc != null ? firstDoc : firstModel;
    var line = y1 != null
      ? 'The plan expects Valint to be cash-flow positive in ' + y1 + ', so today’s burn should end as paid locations ramp up.'
      : 'Neither the plan doc nor the model shows positive operating income in the plan years.';
    return ctx.ui.panel({
      title: 'Plan check', sub: 'operating income, base case',
      body: '<div class="table-wrap flat"><table class="compact" style="min-width:0"><thead><tr><th>Year</th><th class="num">Model</th><th class="num">Plan doc</th></tr></thead><tbody>' +
        rows + '</tbody></table></div><p class="note">' + ctx.esc(line) + '</p>' +
        '<p class="source">Model: month-by-month plan model. Plan doc: the projections document. Edit either on the Assumptions tab.</p>'
    });
  }

  function emptyBlock(m) {
    return '<div class="section">' + ctx.ui.empty({
      title: 'No cash in or out yet',
      text: 'Paid invoices and expenses dated ' + ctx.fmtDate(m.F.openingDate) + ' or later appear here month by month, with a chart of month-end cash and a 12-month projection. Record your first expense or mark an invoice paid to start.',
      action: '<div class="row-actions" style="justify-content:center"><button class="btn btn-sm" type="button" data-act="go" data-view="expenses">Go to Expenses</button><button class="btn btn-sm" type="button" data-act="go" data-view="invoices">Go to Invoices</button></div>'
    }) + '</div>';
  }

  function openEdit() {
    var F = ctx.finance();
    ctx.openFormModal({
      title: 'Opening balance',
      submitLabel: 'Save balance',
      body: '<div class="row2">' + ctx.F.money('cash-open-amount', 'Bank balance', F.openingCash) + ctx.F.date('cash-open-date', 'As of', F.openingDate) + '</div>' +
        ctx.F.text('cash-open-note', 'Note', F.note, 'placeholder="e.g. Business checking, from the bank statement"') +
        '<p class="note">Cash on hand starts here, then adds paid invoices and subtracts expenses dated on or after this day.</p>',
      onSubmit: async function () {
        var amt = ctx.parseMoney(ctx.val('cash-open-amount'));
        if (amt == null) return ctx.formErr('Enter the balance in dollars, like 12500.', 'cash-open-amount');
        var date = ctx.val('cash-open-date');
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !ctx.parseYmd(date)) return ctx.formErr('Pick the date of that balance.', 'cash-open-date');
        var cur = Object.assign({}, ctx.get('settings', 'finance') || {});
        delete cur.id; /* the record's id is not a stored field */
        var ok = await ctx.setDoc('settings', 'finance', Object.assign(cur, {
          openingCash: amt, openingDate: date, note: ctx.val('cash-open-note'), updatedAt: ctx.iso()
        }));
        if (ok) ctx.toast('Opening balance saved');
        return !!ok;
      }
    });
  }

  return {
    id: 'cash',
    label: 'Cash & runway',
    group: 'Finance',
    order: 40,
    collections: ['invoices', 'expenses'],

    render: function () {
      var loading = ctx.isLoading();
      if (loading) {
        return ctx.ui.toolbar({ title: 'Cash & runway' }) + '<div class="empty"><p>Loading cash…</p></div>';
      }
      var m = model();
      var head = ctx.ui.toolbar({ title: 'Cash & runway', count: 'since ' + ctx.fmtDate(m.F.openingDate), exportable: true });
      var body = m.hasFlows ? charts(m) + tables(m) : emptyBlock(m);
      return head + kpis(m) + body +
        '<div class="grid grid-3 section">' + openingPanel(m) + whatIfPanel(m) + planPanel() + '</div>';
    },

    onAction: function (a) {
      if (a === 'edit-opening') openEdit();
    },

    onInput: function (key, el) {
      if (key !== 'extraSpend' && key !== 'extraIncome') return;
      whatIf[key] = el ? String(el.value || '') : '';
      var w = whatIfNumbers(model());
      var b = document.getElementById('cash-whatif-burn');
      if (b) b.textContent = burnText(w.burn);
      var r = document.getElementById('cash-whatif-runway');
      if (r) r.textContent = runText(w.run);
      var msg = document.getElementById('cash-whatif-msg');
      if (msg) msg.hidden = !w.bad;
    },

    csv: function () {
      var m = model();
      return {
        name: 'cash',
        rows: [['Month', 'Cash in', 'Cash out', 'Net', 'End balance']].concat(m.rows.map(function (r) {
          return [r.ym, round2(r.cashIn), round2(r.cashOut), round2(r.net), round2(r.end)];
        }))
      };
    }
  };
});
</script>
<script>
/* ---- tab module: forecast ---- */
(window.__dbViews = window.__dbViews || []).push(function (ctx) {
  'use strict';
  /* Forecast: the 3-year plan model by scenario, model vs plan doc, and plan targets vs actuals.
     Every plan number comes from ctx.plan() / ctx.planModel(); actuals come from signed subscriptions. */
  const SCEN = [['conservative', 'Conservative'], ['base', 'Base'], ['upside', 'Upside']];
  const SCEN_COLOR = { conservative: 'var(--viz-2)', base: 'var(--viz-1)', upside: 'var(--viz-3)' };
  let scenario = 'base';
  let showMonths = false;

  const scenLabel = s => (SCEN.find(x => x[0] === s) || [s, s])[1];
  const numOrNull = v => (v == null || v === '' || !isFinite(Number(v)) ? null : Number(v));
  const money = v => (v == null ? '—' : ctx.fmtMoney(v));
  /* Two decimals in millions so $1.85M (model) and $1.88M (plan doc) stay distinguishable. */
  const compact = v => (v == null ? '—' : Math.abs(v) >= 1e6 ? `${v < 0 ? '-' : ''}$${(Math.abs(v) / 1e6).toFixed(2)}M` : ctx.fmtCompact(v));
  const locs = (v, d) => (v == null ? '—' : ctx.fmtNum(v, d || 0));
  const plural = (n, word) => `${word}${Math.round(n) === 1 ? '' : 's'}`;
  const tone = v => (v < 0 ? ' neg' : '');
  const monthLong = ym => { const [y, m] = String(ym).split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); };
  const pctDiff = (model, doc) => (model == null || doc == null || !doc ? null : (model - doc) / Math.abs(doc));
  function signedPct(x) {
    if (x == null) return '—';
    const r = Math.round(Math.abs(x) * 1000) / 1000;
    if (!r) return '0%';
    return (x > 0 ? '+' : '−') + ctx.fmtPct(r);
  }

  /* Plan doc figures for a scenario's year end: base uses the dated targets; 2029 also has a figure per scenario. */
  function docFor(scen, year) {
    const P = ctx.plan(), out = {};
    const keys = ['locations', 'arr', 'revenue', 'opIncome'];
    if (scen === 'base') {
      const t = (Array.isArray(P.targets) ? P.targets : []).find(x => x && String(x.date || '').slice(0, 7) === `${year}-12`);
      if (t) keys.forEach(k => { const v = numOrNull(t[k]); if (v != null) out[k] = v; });
    }
    if (year === 2029) {
      const s = (P.scenarios2029 || {})[scen];
      if (s) keys.forEach(k => { const v = numOrNull(s[k]); if (v != null && out[k] == null) out[k] = v; });
    }
    return Object.keys(out).length ? out : null;
  }

  function targets() {
    const P = ctx.plan();
    return (Array.isArray(P.targets) ? P.targets : [])
      .filter(t => t && /^\d{4}-\d{2}-\d{2}$/.test(String(t.date || '')))
      .slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  }

  const live = () => ctx.S.status === 'ok';
  function actualOn(day) { return { locations: ctx.locationsOn(day), arr: ctx.mrrOn(day) * 12 }; }

  function segHtml() {
    return `<div class="seg" role="group" aria-label="Scenario">${SCEN.map(([id, l]) =>
      `<button type="button" data-act="mod" data-mod="forecast" data-a="scenario" data-v="${id}" aria-pressed="${scenario === id}">${l}</button>`).join('')}</div>`;
  }
  function assumptionsBtn(primary) {
    return `<button class="btn btn-sm${primary ? ' btn-primary' : ''}" type="button" data-act="go" data-view="assumptions">${ctx.canWrite() ? 'Edit assumptions' : 'View assumptions'}</button>`;
  }

  /* ---------- sections ---------- */
  function kpisHtml(summary) {
    const tiles = summary.map(y => {
      const d = docFor(scenario, y.year);
      const docParts = d ? [d.locations != null ? `${locs(d.locations)} ${plural(d.locations, 'location')}` : '', d.arr != null ? `${compact(d.arr)} ARR` : ''].filter(Boolean) : [];
      return ctx.ui.kpi({
        label: `Dec ${y.year} · ${scenLabel(scenario)} model`,
        value: `${compact(y.endArr)} <span class="kpi-unit">ARR</span>`,
        sub: `${locs(y.endLocations)} ${plural(y.endLocations, 'location')}${docParts.length ? `<br>Plan doc: ${docParts.join(' · ')}` : `<br>No plan doc figure for Dec ${y.year}`}`
      });
    });
    const today = ctx.todayStr();
    /* Same past/future split as the Plan vs actual table: a target dated today is already judged there. */
    const next = targets().find(t => t.date > today && numOrNull(t.locations) != null);
    let nowTile;
    if (live()) {
      const a = actualOn(today);
      const nl = next ? numOrNull(next.locations) : null;
      const nextTxt = next && nl != null ? `<br>Next target: ${locs(nl)} by ${ctx.esc(ctx.fmtDate(next.date))} (${locs(Math.max(0, nl - a.locations))} to go)` : '';
      nowTile = ctx.ui.kpi({ label: 'Today · actual', value: `${ctx.fmtMoney(a.arr)} <span class="kpi-unit">ARR</span>`, sub: `${locs(a.locations)} active ${plural(a.locations, 'location')}${nextTxt}` });
    } else {
      nowTile = ctx.ui.kpi({ label: 'Today · actual', value: '—', sub: 'Actuals appear when your records load.' });
    }
    return `<section class="kpis" id="forecast-kpis" aria-label="${ctx.esc(scenLabel(scenario))} scenario at each year end">${tiles.join('')}${nowTile}</section>`;
  }

  function assumptionsHtml(years) {
    const P = ctx.plan();
    const mRaw = (P.newMultiplier || {})[scenario];
    const mult = mRaw == null ? 1 : ctx.num(mRaw);
    const churn = ctx.num((P.churn || {})[scenario]);
    const prices = years.map(y => `${ctx.fmtMoney(ctx.num(P.prices[y]))} in ${y}`).join(', ');
    const ranges = years.map(y => { const r = (P.newPerMonth || {})[y] || [0, 0]; return `${ctx.fmtNum(ctx.num(r[0]), 1)}–${ctx.fmtNum(ctx.num(r[1]), 1)} in ${y}`; }).join(', ');
    const avgs = years.map(y => { const r = (P.newPerMonth || {})[y] || [0, 0]; return ctx.fmtNum((ctx.num(r[0]) + ctx.num(r[1])) / 2 * mult, 1); }).join(' / ');
    const multTxt = mult === 1 ? `the model adds the midpoint (${avgs} a month)` : `this scenario adds ${ctx.fmtNum(mult, 2)}× the midpoint (${avgs} a month)`;
    const body = `<p class="note" style="margin:0">Price ${prices} per location per month · ${ranges} new locations a month; ${multTxt} · ${ctx.fmtPct(churn)} monthly churn · starts from ${ctx.fmtNum(ctx.num(P.pilots))} pilot ${plural(ctx.num(P.pilots), 'location')} converting in Jan ${years[0]}.</p>`;
    return `<div class="section" id="forecast-assumptions">${ctx.ui.panel({ title: `${scenLabel(scenario)} assumptions`, actions: assumptionsBtn(false), body })}</div>`;
  }

  function locationsChartHtml(years) {
    const models = {};
    SCEN.forEach(([id]) => { models[id] = ctx.planModel(id); });
    const base = models[scenario] || models.base;
    const labels = base.map(r => ctx.monthLabel(r.ym));
    const chart = ctx.chart.line({
      labels,
      series: SCEN.map(([id, l]) => ({ name: l, values: models[id].map(r => r.locations), color: SCEN_COLOR[id] })),
      height: 240,
      format: v => ctx.fmtNum(v),
      ariaLabel: `End-of-month locations for the conservative, base and upside scenarios, ${labels[0]} to ${labels[labels.length - 1]}`
    });
    /* Same numbers as the chart at each half-year checkpoint. */
    const checkpoints = [];
    years.forEach(y => { [6, 12].forEach(m => { const ym = `${y}-${ctx.pad(m)}`; if (base.some(r => r.ym === ym)) checkpoints.push(ym); }); });
    const lastYear = years[years.length - 1];
    const hasDoc = SCEN.some(([id]) => { const d = docFor(id, lastYear); return d && d.locations != null; });
    const head = `<tr><th>Scenario</th>${checkpoints.map(ym => `<th class="num">${ctx.esc(ctx.monthLabel(ym))}</th>`).join('')}${hasDoc ? `<th class="num">Plan doc Dec ${lastYear}</th>` : ''}</tr>`;
    const rows = SCEN.map(([id, l]) => {
      const m = models[id];
      const cells = checkpoints.map(ym => { const r = m.find(x => x.ym === ym); return `<td class="num">${locs(r ? r.locations : null)}</td>`; }).join('');
      let docCell = '';
      if (hasDoc) {
        const d = docFor(id, lastYear), endRow = m[m.length - 1];
        docCell = d && d.locations != null
          ? `<td class="num">${locs(d.locations)}<div class="cell-sub">Model ${signedPct(pctDiff(endRow ? endRow.locations : null, d.locations))}</div></td>`
          : '<td class="num">—</td>';
      }
      const sel = id === scenario;
      return `<tr><td><span class="${sel ? 'cell-main' : ''}">${l}</span>${sel ? ' <span class="cell-sub">selected</span>' : ''}</td>${cells}${docCell}</tr>`;
    }).join('');
    const table = `<div class="table-wrap flat" style="margin-top:12px"><table class="compact"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
    return `<div class="section" id="forecast-locations">${ctx.ui.panel({ title: 'Locations by scenario', sub: 'Model, end of each month', body: chart + table })}</div>`;
  }

  function arrChartHtml(model, summary) {
    const today = ctx.todayStr(), curYm = ctx.ymOf(today);
    const first = model[0].ym, lastYm = model[model.length - 1].ym;
    const subs = live() ? ctx.subscriptions() : [];
    /* Start the axis early enough to show actual history before the model's first month (at most 12 months back). */
    let start = first;
    const earliest = subs.map(s => ctx.ymOf(s.start)).filter(ym => /^\d{4}-\d{2}$/.test(ym)).sort()[0];
    [curYm, earliest].forEach(ym => { if (ym && ym < start) start = ym; });
    const floor = ctx.addMonths(first, -12);
    if (start < floor) start = floor;
    const months = ctx.monthRange(start, lastYm);
    const byYm = {};
    model.forEach(r => { byYm[r.ym] = r; });
    const actual = months.map(ym => {
      if (!live() || ym > curYm) return null;
      const day = ym === curYm ? today : ctx.monthEnd(ym);
      return ctx.mrrOn(day) * 12;
    });
    const name = `${scenLabel(scenario)} model ARR`;
    const chart = ctx.chart.line({
      labels: months.map(ctx.monthLabel),
      series: [
        { name: 'Actual ARR', values: actual, color: 'var(--viz-1)' },
        { name, values: months.map(ym => (byYm[ym] ? byYm[ym].arr : null)), color: 'var(--viz-plan)', dashed: true }
      ],
      height: 240,
      ariaLabel: `Actual ARR against the ${scenLabel(scenario).toLowerCase()} model ARR, ${ctx.monthLabel(start)} to ${ctx.monthLabel(lastYm)}`
    });
    let nowTxt;
    if (live()) {
      const a = actualOn(today);
      nowTxt = `Actual ARR today: ${ctx.fmtMoney(a.arr)} from ${locs(a.locations)} active ${plural(a.locations, 'location')}.`;
    } else {
      nowTxt = 'Actual ARR appears when your records load.';
    }
    const modelTxt = `${scenLabel(scenario)} model ARR: ${summary.map(y => `${compact(y.endArr)} at Dec ${y.year}`).join(', ')}.`;
    const body = chart + `<p class="note">${nowTxt} ${modelTxt} Actual counts won deals active at each month end (today for this month); the model starts in ${ctx.esc(monthLong(first))}.</p>`;
    return `<div class="section" id="forecast-arr">${ctx.ui.panel({ title: 'ARR: model vs actual', sub: `${scenLabel(scenario)} scenario`, body })}</div>`;
  }

  function plHtml(model, summary) {
    const opexKeys = summary.length ? Object.keys(summary[0].opex) : [];
    const docs = summary.map(y => docFor(scenario, y.year));
    const th = summary.map(y => `<th class="num">${y.year}</th>`).join('');
    const row = (label, fn, cls) => `<tr><td${cls ? ` class="${cls}"` : ''}>${label}</td>${summary.map(y => { const v = fn(y); return `<td class="num${cls ? ' ' + cls : ''}${typeof v === 'number' ? tone(v) : ''}">${typeof v === 'number' ? ctx.fmtMoney(v) : v}</td>`; }).join('')}</tr>`;
    let rows = '';
    rows += row('Revenue', y => y.revenue, 'cell-main');
    rows += row('Cost of service', y => y.cos);
    rows += row('Gross profit', y => y.grossProfit, 'cell-main');
    rows += row('Gross margin', y => ctx.fmtPct(y.grossMargin));
