<title>Dealbook CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar with view tabs; Pipeline is a horizontally scrolling board of stage columns under a summary strip; any record opens in a right-hand drawer with its activity log. */
:root{
  --bg:#F1F4F5; --surface:#FFFFFF; --surface-2:#E8EEF0; --line:#D4DDE0; --line-strong:#B5C3C8;
  --fg:#12232A; --muted:#566A71; --faint:#86979D;
  --accent:#155E75; --accent-hover:#0E4C5F; --accent-fg:#FFFFFF; --accent-soft:#DAEAF0;
  --good:#2B7845; --good-soft:#DDEFE3; --warn:#94580A; --warn-soft:#F8EAD2; --bad:#B0372B; --bad-soft:#F6DFDB; --on-bad:#FFFFFF;
  --s-lead:#A3C6D0; --s-qualified:#64A0B2; --s-proposal:#2F7D94; --s-pilot:#155E75; --s-won:#2B7845; --s-lost:#9AA7AB;
  --viz-1:#2a78d6; --viz-2:#eb6834; --viz-3:#1baf7a; --viz-plan:#7c8d93;
  --scrim:rgba(10,22,27,.40);
  --shadow:0 1px 2px rgba(18,35,42,.06),0 8px 24px rgba(18,35,42,.08);
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:6px; --r-md:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1417; --surface:#141D21; --surface-2:#1B262B; --line:#27353B; --line-strong:#3A4C53;
    --fg:#E3ECEE; --muted:#93A5AB; --faint:#677A80;
    --accent:#5BB8CD; --accent-hover:#7CC9DA; --accent-fg:#06232A; --accent-soft:#16363F;
    --good:#62C283; --good-soft:#15301E; --warn:#E3A853; --warn-soft:#382812; --bad:#F07F72; --bad-soft:#3B1815; --on-bad:#2A0B08;
    --s-lead:#36606B; --s-qualified:#468799; --s-proposal:#5AAAC0; --s-pilot:#8AD2E2; --s-won:#62C283; --s-lost:#5C6C71;
    --viz-1:#3987e5; --viz-2:#d95926; --viz-3:#199e70; --viz-plan:#7d8f95;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1417; --surface:#141D21; --surface-2:#1B262B; --line:#27353B; --line-strong:#3A4C53;
  --fg:#E3ECEE; --muted:#93A5AB; --faint:#677A80;
  --accent:#5BB8CD; --accent-hover:#7CC9DA; --accent-fg:#06232A; --accent-soft:#16363F;
  --good:#62C283; --good-soft:#15301E; --warn:#E3A853; --warn-soft:#382812; --bad:#F07F72; --bad-soft:#3B1815; --on-bad:#2A0B08;
  --s-lead:#36606B; --s-qualified:#468799; --s-proposal:#5AAAC0; --s-pilot:#8AD2E2; --s-won:#62C283; --s-lost:#5C6C71;
  --viz-1:#3987e5; --viz-2:#d95926; --viz-3:#199e70; --viz-plan:#7d8f95;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1640px;margin-inline:auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{text-wrap:balance}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:10px 22px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font:700 20px/1 var(--f-display);letter-spacing:-.015em;color:var(--fg);text-decoration:none}
.ws-chip{font:600 12px/1 var(--f-body);letter-spacing:0;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:5px 9px;white-space:nowrap}
@media (max-width:520px){.ws-chip{display:none}}
/* Shell: sticky top bar, grouped side navigation, content column */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);gap:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1760px;margin-inline:auto}
.sidenav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);align-self:start;max-height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow-y:auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.nav-group{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:16px 10px 6px}
.nav-group:first-child{padding-top:4px}
.nav-link{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.nav-link:hover{background:var(--surface-2);color:var(--fg)}
.nav-link[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-link .tab-badge{margin-left:auto}
.content{min-width:0;padding-bottom:40px}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .sidenav{position:static;max-height:none;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;padding-block:8px;gap:4px;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
  .nav-group{padding:0 4px 0 12px;margin-left:6px;border-left:1px solid var(--line);white-space:nowrap}
  .nav-group:first-child{padding-left:0;margin-left:0;border-left:0}
  .nav-link{padding:6px 10px}
}

/* Shared building blocks for tab modules */
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:minmax(0,1fr)}}
.section{margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;margin:0 0 12px}
.panel-h h2{font:600 15px/1.3 var(--f-body);margin:0}
.panel-h .sub{font-size:12.5px;color:var(--muted)}
.panel-h .spacer{flex:1}
.stat-list{display:grid;gap:8px;margin:0}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.stat-row dt{color:var(--muted)}
.stat-row dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.stat-row.total{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress>span{display:block;height:100%;border-radius:4px;background:var(--accent)}
.progress.good>span{background:var(--good)}
.progress.warn>span{background:var(--warn)}
.progress.bad>span{background:var(--bad)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--good)}
.neg{color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0;max-width:72ch}
.source{font-size:12px;color:var(--faint)}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.table-wrap.flat{margin-bottom:0}
table.compact{min-width:560px}
table.compact td,table.compact th{padding:8px 12px}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.kpi-value.good{color:var(--good)}
.kpi-value.warn{color:var(--warn)}

/* Charts (palette: the dataviz skill's validated categorical slots 1-3) */
.viz{display:block;width:100%;height:auto;overflow:visible}
.viz text{font:500 11px var(--f-mono);fill:var(--muted)}
.viz .grid-line{stroke:var(--line);stroke-width:1}
.viz .base-line{stroke:var(--line-strong);stroke-width:1}
.viz .ref-line{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 4}
.viz .hit{fill:transparent}
.viz .hit:hover{fill:var(--fg);fill-opacity:.04}
.viz-legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.viz-legend span{display:inline-flex;align-items:center;gap:6px}
.viz-legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.viz-legend i.line{width:16px;height:2px;border-radius:1px}
.viz-legend i.dash{width:16px;height:2px;background:repeating-linear-gradient(90deg,var(--viz-plan) 0 4px,transparent 4px 7px)!important}
.viz-tip{position:fixed;z-index:80;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;line-height:1.45;padding:7px 10px;border-radius:6px;box-shadow:var(--shadow);max-width:280px;white-space:pre-line;font-variant-numeric:tabular-nums}
.tab-badge{font:500 11px/1 var(--f-mono);padding:3px 6px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tab-badge.hot{background:var(--bad-soft);color:var(--bad)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.search{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-sm);padding:0 10px;height:36px;width:280px;max-width:100%;min-width:0;color:var(--muted)}
.search:focus-within{border-color:var(--accent);background:var(--surface)}
.search input{border:0;background:none;font:inherit;font-size:14.5px;color:var(--fg);width:100%;min-width:0;outline:none;height:100%}
.ro-chip{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.new-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);padding:6px;min-width:190px;display:grid;z-index:25}
.menu button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:var(--r-sm);padding:8px 10px;font:inherit;font-size:14.5px;color:var(--fg);cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2)}
.menu kbd{margin-left:auto;font:500 11px var(--f-mono);color:var(--faint)}
@media (max-width:820px){
  .top-actions{flex:1 1 0}
  .search{flex:1 1 auto;width:auto}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:14px;line-height:1.2;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-danger{color:var(--bad)}
.btn-danger-solid{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn-danger-solid:hover{background:var(--bad);filter:brightness(1.08)}
.btn-sm{padding:5px 10px;font-size:13px}
.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-align:left;text-decoration:none}
.link:hover{text-decoration:underline}
.icon-btn{display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-sm);border:0;background:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}

/* Notices */
#notice{display:grid;gap:8px}
#notice:not(:empty){padding-top:14px}
.notice{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r-md);background:var(--accent-soft);font-size:14px}
.notice.warn{background:var(--warn-soft)}
.notice .spacer{flex:1}

/* Toolbar + KPIs */
.toolbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-block:20px 14px}
.view-title{font:700 26px/1.1 var(--f-display);letter-spacing:-.02em;margin:0}
.view-count{font:500 13px var(--f-mono);color:var(--muted)}
.toolbar .spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:6px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px 13px;min-width:0}
.kpi-label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi-value{font:500 27px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-top:6px;overflow-wrap:anywhere}
.kpi-value.bad{color:var(--bad)}
.kpi-unit{font:600 14px var(--f-body);letter-spacing:0;color:var(--muted)}
.kpi-sub{font-size:13px;color:var(--muted);margin-top:3px}
.stackbar{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2);margin:9px 0 2px}
.stackbar span{flex-basis:0;min-width:4px}
@media (max-width:480px){.kpi{padding:12px}.kpi-value{font-size:21px}}

/* Board */
.board-scroll{overflow-x:auto;padding-bottom:6px;scrollbar-color:var(--line-strong) transparent}
.board{display:grid;grid-template-columns:repeat(4,minmax(236px,1fr)) repeat(2,minmax(204px,.82fr));gap:12px;min-width:min-content;padding-bottom:18px}
.col{background:var(--surface-2);border-radius:var(--r-md);display:flex;flex-direction:column;min-width:0;min-height:340px;transition:box-shadow .12s}
.col.over{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.col-head{display:flex;align-items:center;gap:8px;padding:12px 12px 0}
.col-head h2{font:600 14.5px/1.2 var(--f-body);margin:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--stage);flex:none}
.col-count{font:500 11.5px/1 var(--f-mono);color:var(--muted);background:var(--surface);border-radius:999px;padding:3px 7px}
.col-p{margin-left:auto;font:500 11.5px var(--f-mono);color:var(--faint)}
.col-sum{display:flex;align-items:baseline;gap:8px;padding:3px 12px 10px;font-variant-numeric:tabular-nums}
.col-sum .money{font:500 15px var(--f-mono)}
.col-sum .wt{font-size:12px;color:var(--muted)}
.col-body{flex:1;display:flex;flex-direction:column;gap:8px;padding:0 8px 8px}
.col-empty{border:1px dashed var(--line-strong);border-radius:8px;padding:18px 10px;text-align:center;font-size:13px;color:var(--faint)}
.col-more{font-size:12.5px;color:var(--muted);text-align:center;padding:4px}
.col-add{margin:0 8px 8px;justify-content:flex-start;background:transparent;border-color:transparent;color:var(--muted);font-weight:600}
.col-add:hover{background:var(--surface);color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px 11px;cursor:pointer;display:grid;gap:3px}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.45}
.card-co{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{font:600 14.5px/1.3 var(--f-body);margin:0 0 4px;overflow-wrap:anywhere}
.card-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.card-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}
.card-meta .money{font:500 13.5px var(--f-mono);color:var(--fg)}
.card-meta .when{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card-meta .av{margin-left:auto}

/* Chips + avatars */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;line-height:1.3;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-bad{background:var(--bad-soft);color:var(--bad)}
.chip-good{background:var(--good-soft);color:var(--good)}
.chip-accent{background:var(--accent-soft);color:var(--accent)}
.av{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 10px/1 var(--f-body);object-fit:cover}
.av-sm{width:22px;height:22px}
.av-md{width:30px;height:30px;font-size:11.5px}
.av-none{background:var(--surface-2);color:var(--faint)}
.person{display:inline-flex;align-items:center;gap:7px;min-width:0}

/* Tables */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:28px}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px}
th button:hover{color:var(--fg)}
th.num,td.num{text-align:right}
th.num button{flex-direction:row-reverse}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover{background:var(--surface-2)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell-main{font-weight:600}
.cell-sub{font-size:12.5px;color:var(--muted)}
.namecell{display:flex;align-items:center;gap:10px;min-width:0}
.trunc{max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Tasks */
.groups{display:grid;gap:22px;margin-bottom:32px;max-width:980px}
.group-h{display:flex;align-items:center;gap:8px;font:600 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.group-h .n{font:500 11.5px var(--f-mono);background:var(--surface-2);padding:2px 7px;border-radius:999px;letter-spacing:0}
.group-h.bad{color:var(--bad)}
.task-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.task-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.task-row:last-child{border-bottom:0}
.task-row input[type="checkbox"],.tl-task input{width:18px;height:18px;accent-color:var(--accent);margin:0;cursor:pointer}
.task-subj{font-weight:600;color:var(--fg);background:none;border:0;padding:0;font:inherit;font-weight:600;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.task-subj:hover{color:var(--accent)}
.task-rel{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.is-done .task-subj,.is-done .tl-task span{color:var(--faint);text-decoration:line-through}
@media (max-width:520px){.task-row{grid-template-columns:auto minmax(0,1fr) auto}.task-row .av{display:none}}

/* Empty */
.empty{border:1px dashed var(--line-strong);border-radius:var(--r-md);padding:34px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center;margin-bottom:28px;background:var(--surface)}
.empty h2{font:700 19px var(--f-display);color:var(--fg);margin:0}
.empty p{margin:0;max-width:46ch}

/* Drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@media (prefers-reduced-motion:no-preference){.drawer:not([hidden]){animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.4}}}
.drawer-head{display:flex;align-items:center;gap:6px;padding:10px 14px 10px 20px;border-bottom:1px solid var(--line);flex:none}
.drawer-kind{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.drawer-scroll{flex:1;overflow-y:auto;padding:20px}
.dr-eyebrow{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dr-title{font:700 25px/1.15 var(--f-display);letter-spacing:-.02em;margin:4px 0 16px;overflow-wrap:anywhere}
.dr-h{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px;display:flex;align-items:center;gap:8px}
.dr-h .spacer{flex:1}
.dr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:9px 18px;margin:16px 0 0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.notes{white-space:pre-wrap;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;font-size:14px;margin-top:16px;overflow-wrap:anywhere}
.stage-box{display:grid;gap:10px;background:var(--surface-2);border-radius:var(--r-md);padding:12px}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.step{display:grid;gap:4px;text-align:left;background:none;border:0;padding:0;font:inherit;color:var(--muted);cursor:pointer;border-radius:4px}
.step:disabled{cursor:default}
.step-bar{height:6px;border-radius:3px;background:var(--line)}
.step.on .step-bar{background:var(--c)}
.step:not(:disabled):hover .step-bar{box-shadow:0 0 0 1px var(--line-strong)}
.step-l{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.cur .step-l{color:var(--fg)}
.step-p{font:500 11px var(--f-mono);color:var(--faint)}
.outcome{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r-sm)}
.mini li+li{border-top:1px solid var(--line)}
.mini-row{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;background:none;border:0;font:inherit;font-size:14px;color:var(--fg);cursor:pointer;text-align:left}
.mini-row:hover{background:var(--surface-2)}
.mini-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-empty{font-size:13.5px;color:var(--faint);margin:0}
.copyable{display:inline-flex;align-items:center;gap:6px;min-width:0}
.copyable span{user-select:all;overflow-wrap:anywhere}
.copy-btn{font:600 11.5px var(--f-body);color:var(--muted);background:var(--surface-2);border:0;border-radius:4px;padding:2px 7px;cursor:pointer}
.copy-btn:hover{color:var(--fg)}

/* Timeline */
.tl{list-style:none;margin:0;padding:0}
.tl-item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:11px 0;border-top:1px solid var(--line)}

.t-task .tl-ico,.tl-ico.t-task{color:var(--accent)}
.tl-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px}
.tl-type{font-weight:700;color:var(--fg)}
.tl-time{color:var(--faint)}
.tl-body{margin:3px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.tl-task{display:flex;align-items:flex-start;gap:8px;margin-top:4px;font-size:14px;cursor:pointer}
.tl-task input{margin-top:1px}
.tl-rel{font-size:12.5px;color:var(--muted);margin-top:3px}
.tl-meta{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}

/* Composer */
.composer{flex:none;border-top:1px solid var(--line);padding:12px 20px 14px;display:grid;gap:8px;background:var(--surface)}
.composer textarea{resize:vertical;min-height:58px}
.composer-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.composer-foot .spacer{flex:1}
.composer-foot input[type="date"]{width:auto}

/* Modal + forms */
.modal-scrim{z-index:50}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100% - 32px));max-height:calc(100% - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}

.modal-head h2{font:700 21px var(--f-display);letter-spacing:-.015em;margin:0;flex:1}
.form{display:grid;gap:14px;padding:16px 20px 18px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.row2{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}

.input{width:100%;font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--fg);min-width:0}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea.input{resize:vertical;line-height:1.45}
.form-err{margin:0 20px;padding:8px 12px;border-radius:var(--r-sm);background:var(--bad-soft);color:var(--bad);font-size:13.5px;font-weight:600}
.form-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.confirm{padding:20px 20px 0}
.confirm h2{font:700 20px var(--f-display);margin:0 0 8px}
.confirm p{margin:0 0 18px;color:var(--muted)}
.confirm + .form-foot{border-top:0}
.pick{position:relative}
.pick-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow);max-height:210px;overflow-y:auto;z-index:5;padding:4px}
.pick-opt{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border:0;background:none;border-radius:4px;font:inherit;font-size:14px;color:var(--fg);cursor:pointer;text-align:left}
.pick-opt:hover,.pick-opt:focus-visible{background:var(--surface-2)}

/* Toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;display:grid;gap:8px;justify-items:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.toast{background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:var(--shadow)}

<script>
/* ---- tab module: overview ---- */
/* Overview: the company at a glance. Read-only: it reads deals, tasks, invoices, expenses, milestones,
   settings and the plan, and never writes. Every figure comes from the shared finance helpers or ctx.plan(). */
(window.__dbViews = window.__dbViews || []).push(function (ctx) {
  'use strict';
  const ID = 'overview';
  const ui = ctx.ui, esc = ctx.esc, num = ctx.num, sum = ctx.sum;
  const OPEN_STAGES = ctx.STAGES.filter(s => s.id !== 'won' && s.id !== 'lost');
  const STALE_DAYS = 14;
  const METRIC_LABEL = { locations: 'locations', arr: 'ARR', mrr: 'MRR', cash: 'cash' };
  const STATUS_CHIP = {
    'done': ['Done', 'good'], 'in-progress': ['In progress', 'accent'], 'not-started': ['Not started', ''],
    'at-risk': ['At risk', 'warn'], 'blocked': ['Blocked', 'bad'], 'missed': ['Missed', 'bad']
  };

  /* ---------- small formatting helpers ---------- */
  const cents = n => Math.round(num(n) * 100) / 100 || 0; /* `|| 0` turns -0 into 0, so float noise never shows "-$0" */
  const MAX_RUNWAY = 1200; /* months (100 years): past this, a run-out month is meaningless and Date math overflows */
  const lcFirst = s => String(s || '').replace(/^./, ch => ch.toLowerCase()); /* "End of 2028" reads "by end of 2028" mid-sentence */
  const tDate = m => (m && ctx.parseYmd(m.targetDate) ? m.targetDate : ''); /* a malformed or non-string date counts as no date */
  /* Small balances show cents (cash is often a few hundred dollars here); large ones round to dollars. */
  const money = n => { const v = cents(n); return Math.abs(v) >= 10000 ? ctx.fmtMoney(v) : ctx.fmtPrice(v); };
  const plural = (n, one, many) => (n === 1 ? one : (many || one + 's'));
  const longMonth = ym => { const p = String(ym || '').split('-').map(Number); return p.length === 2 && p[0] && p[1] ? new Date(p[0], p[1] - 1, 1).toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : ''; };
  const daysBetween = (a, b) => { const x = ctx.parseYmd(a), y = ctx.parseYmd(b); return x && y ? Math.round((y - x) / 864e5) : null; };
  const goBtn = (view, label) => `<button class="btn btn-sm" type="button" data-act="go" data-view="${esc(view)}">${esc(label)}</button>`;
  const lastTouch = d => d.lastActivityAt || d.stageChangedAt || d.updatedAt || d.createdAt;
  const isDone = m => m.status === 'done';
  const coName = id => { const c = ctx.company(id); return c && c.name ? c.name : ''; };

  function nextTarget(today) {
    const ts = (ctx.plan().targets || []).filter(t => t && /^\d{4}-\d{2}-\d{2}$/.test(t.date || '') && t.date > today && t.locations != null && t.locations !== '');
    ts.sort((a, b) => a.date.localeCompare(b.date));
    return ts[0] || null;
  }
  function metricNow(metric, today) {
    if (metric === 'locations') return ctx.locationsOn(today);
    if (metric === 'arr') return ctx.mrrOn(today) * 12;
    if (metric === 'mrr') return ctx.mrrOn(today);
    if (metric === 'cash') return ctx.cashOn(today);
    return null;
  }
  const metricFmt = (metric, v) => (metric === 'locations' ? ctx.fmtNum(v) : ctx.fmtCompact(v));

  /* ---------- the numbers (shared by render and csv) ---------- */
  function compute() {
    const today = ctx.todayStr(), cur = ctx.ymOf(today), F = ctx.finance();
    const subs = ctx.subscriptions().filter(s => s.start <= today && (!s.end || s.end > today));
    const mrr = ctx.mrrOn(today);
    const locations = ctx.locationsOn(today);
    const target = nextTarget(today);
    const cash = ctx.cashOn(today);
    const burn = ctx.burnRate();
    /* A burn that rounds to $0.00 is float noise (cash in matching cash out to the cent): treat it as not burning,
       or runway would show something like 46236956174337097728.0 months. */
    const runway = cents(burn.monthly) > 0 ? ctx.runwayMonths() : Infinity;
    let runsOut = null;
    if (isFinite(runway) && runway <= MAX_RUNWAY) {
      /* Months counted from the start of this month: the part of this month already gone plus the runway. */
      const p = ctx.parseYmd(today), dim = new Date(p.getFullYear(), p.getMonth() + 1, 0).getDate();
      runsOut = ctx.addMonths(cur, Math.floor((p.getDate() - 1) / dim + runway));
    }
    const open = ctx.all('deals').filter(ctx.isOpen);
    const openArr = sum(open, d => num(d.value));
    const weighted = sum(open, d => num(d.value) * ctx.stageOf(d).p);
    const overdueInv = ctx.all('invoices').filter(i => ctx.invoiceStatus(i) === 'overdue')
      .sort((a, b) => String(a.dueDate || '').localeCompare(String(b.dueDate || '')));
    const overdueAmt = sum(overdueInv, i => ctx.invoiceTotal(i));
    const overdueTasks = ctx.tasks().filter(a => !a.done && a.dueAt && a.dueAt < today)
      .sort((a, b) => String(a.dueAt).localeCompare(String(b.dueAt)));
    const stale = open.map(d => ({ d, days: ctx.daysSince(lastTouch(d)) }))
      .filter(x => x.days != null && x.days >= STALE_DAYS).sort((a, b) => b.days - a.days);
    return { today, cur, F, subs, mrr, arr: mrr * 12, locations, target, cash, burn, runway, runsOut,
      open, openArr, weighted, overdueInv, overdueAmt, overdueTasks, stale };
  }

  /* ---------- KPI tiles ---------- */
  function kpiRow(c) {
    const T = ctx.planTarget();
    const tiles = [];
    tiles.push(ui.kpi({ label: 'MRR now', value: ctx.fmtMoney(c.mrr),
      sub: `${c.subs.length} active ${plural(c.subs.length, 'subscription')}` }));
    tiles.push(ui.kpi({ label: 'ARR', value: ctx.fmtMoney(c.arr),
      bar: T.arr > 0 ? ui.progress(c.arr / T.arr) : '',
      sub: T.arr > 0 ? `MRR × 12 · goal ${ctx.fmtCompact(T.arr)} by ${esc(T.label || ctx.fmtDate(T.end))}` : 'MRR × 12, setup fees excluded' }));
    const tg = c.target, goal = tg ? num(tg.locations) : 0;
    tiles.push(ui.kpi({ label: 'Paying locations', value: ctx.fmtNum(c.locations),
      bar: goal > 0 ? ui.progress(c.locations / goal) : '',
      sub: tg ? `goal ${ctx.fmtNum(goal)} by ${esc(lcFirst(tg.label) || ctx.fmtDate(tg.date))}` : 'no later location target in the plan' }));
    tiles.push(ui.kpi({ label: 'Cash on hand', value: money(c.cash), tone: c.cash < 0 ? 'bad' : '',
      sub: `as of today, from ${money(c.F.openingCash)} on ${esc(ctx.fmtDate(c.F.openingDate))}` }));
    const b = cents(c.burn.monthly); /* same rounding as the runway test in compute(), so the two tiles agree */
    tiles.push(b > 0
      ? ui.kpi({ label: 'Net burn / month', value: b < 1 ? ctx.fmtPrice(b) : ctx.fmtMoney(b), sub: esc(c.burn.basis) })
      : ui.kpi({ label: 'Net burn / month', value: 'Cash-flow positive', tone: b < 0 ? 'good' : '',
        sub: `${b < 0 ? ctx.fmtMoney(-b) + ' a month net in' : 'no net cash out'} · ${esc(c.burn.basis)}` }));
    if (!isFinite(c.runway)) {
      tiles.push(ui.kpi({ label: 'Runway', value: 'Not burning cash', tone: 'good', sub: 'cash in covers cash out' }));
    } else {
      const r = c.runway;
      tiles.push(ui.kpi({ label: 'Runway', value: `${r.toFixed(1)}<span class="kpi-unit"> ${r.toFixed(1) === '1.0' ? 'month' : 'months'}</span>`,
        tone: r < 6 ? 'bad' : r < 12 ? 'warn' : '',
        sub: r <= 0 ? 'cash on hand is used up' : c.runsOut ? `cash runs out around ${esc(longMonth(c.runsOut))}` : 'more than 100 years at this burn' }));
    }
    tiles.push(ui.kpi({ label: 'Open pipeline ARR', value: ctx.fmtMoney(c.openArr),
      sub: `${ctx.fmtMoney(c.weighted)} weighted · ${c.open.length} open ${plural(c.open.length, 'deal')}` }));
    const ni = c.overdueInv.length, nt = c.overdueTasks.length;
    tiles.push(ui.kpi({ label: 'Overdue', value: `${money(c.overdueAmt)}<span class="kpi-unit"> in ${ni} ${plural(ni, 'invoice')}</span>`,
      tone: ni || nt ? 'bad' : '',
      sub: `${nt} ${plural(nt, 'task')} overdue` }));
    return `<section class="kpis" aria-label="Company summary">${tiles.join('')}</section>`;
  }

  /* ---------- MRR chart: actual vs plan ---------- */
  function chartData(c) {
    const openYm = ctx.ymOf(c.F.openingDate), endYm = ctx.ymOf(ctx.planTarget().end) || c.cur;
    const from = openYm && openYm < c.cur ? openYm : c.cur;
    const to = endYm > c.cur ? endYm : c.cur;
    const months = ctx.monthRange(from, to);
    const model = {};
    ctx.planModel('base').forEach(r => { model[r.ym] = r; });
    /* Past months use the month's last day; this month uses today, so the last point equals "MRR now". */
    const actual = months.map(ym => (ym > c.cur ? null : ctx.mrrOn(ym === c.cur ? c.today : ctx.monthEnd(ym))));
    const planned = months.map(ym => (model[ym] ? model[ym].mrr : null));
    return { months, actual, planned, model };
  }
  function chartPanel(c, cd) {
    const P = ctx.plan();
    const chart = ctx.chart.line({
      labels: cd.months.map(ctx.monthLabel),
      series: [
        { name: 'Actual MRR', values: cd.actual, color: 'var(--viz-1)' },
        { name: 'Plan MRR (model, base case)', values: cd.planned, color: 'var(--viz-plan)', dashed: true }
      ],
      height: 240, format: ctx.fmtCompact,
      ariaLabel: `MRR by month from ${longMonth(cd.months[0])} to ${longMonth(cd.months[cd.months.length - 1])}, actual against the base-case plan`
    });
    const lastA = cd.actual.reduce((acc, v, i) => (v == null ? acc : i), -1);
    const planIdx = cd.planned.map((v, i) => (v == null ? -1 : i)).filter(i => i >= 0);
    const bits = [];
    if (lastA >= 0) bits.push(`Actual MRR is ${ctx.fmtMoney(cd.actual[lastA])} in ${esc(longMonth(cd.months[lastA]))}.`);
    if (planIdx.length) {
      const f = planIdx[0], l = planIdx[planIdx.length - 1];
      bits.push(`The plan model starts at ${ctx.fmtMoney(cd.planned[f])} in ${esc(longMonth(cd.months[f]))}` +
        (l !== f ? ` and reaches ${ctx.fmtMoney(cd.planned[l])} (${ctx.fmtNum(cd.model[cd.months[l]].locations, 1)} locations) in ${esc(longMonth(cd.months[l]))}.` : '.'));
    }
    const rows = cd.months.map((ym, i) => `<tr><td>${esc(longMonth(ym))}</td><td class="num">${cd.actual[i] == null ? '—' : ctx.fmtMoney(cd.actual[i])}</td><td class="num">${cd.planned[i] == null ? '—' : ctx.fmtMoney(cd.planned[i])}</td></tr>`).join('');
    const body = chart +
      `<p class="note">${bits.join(' ')}</p>` +
      `<p class="source">Plan line: the monthly plan model built from ${esc(P.source || 'the plan')}. Change its inputs on the Assumptions tab.</p>` +
      `<details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:13px">Monthly numbers</summary>` +
      `<div class="table-wrap flat" style="margin-top:8px"><table class="compact" style="min-width:0"><thead><tr><th>Month</th><th class="num">Actual MRR</th><th class="num">Plan MRR (model)</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
    return `<div class="section">${ui.panel({ title: 'MRR by month', sub: 'Actual vs plan', body })}</div>`;
  }

  /* ---------- panels ---------- */
  function milestonesPanel(c) {
    const list = ctx.all('milestones').filter(m => !isDone(m))
      .sort((a, b) => (tDate(a) || '9999').localeCompare(tDate(b) || '9999') || num(a.order) - num(b.order)).slice(0, 3);
    const link = goBtn('milestones', 'All milestones');
    if (!list.length) {
      const any = ctx.all('milestones').length;
      return ui.panel({ title: 'Next milestones', actions: link,
        body: `<p class="note" style="margin:0">${any ? 'Every milestone is done. Add the next one on the Milestones tab.' : 'No milestones yet. Set dated goals, such as 25 paying locations, on the Milestones tab and the next three show here.'}</p>` });
    }
    const items = list.map((m, i) => {
      const st = STATUS_CHIP[m.status] || [String(m.status || 'Not started').replace(/-/g, ' ').replace(/^./, x => x.toUpperCase()), ''];
      const td = tDate(m), d = td ? daysBetween(c.today, td) : null;
      const late = d != null && d < 0;
      const when = !td ? 'No target date' : `Target ${esc(ctx.fmtDate(td))} · ${d === 0 ? 'today' : late ? `${-d} ${plural(-d, 'day')} past` : `in ${d} ${plural(d, 'day')}`}`;
      let prog = '';
      const tv = num(m.targetValue), now = metricNow(m.metric, c.today);
      if (now != null && tv > 0) {
        const frac = now / tv;
        prog = `<div class="muted" style="font-size:13px">${metricFmt(m.metric, now)} of ${metricFmt(m.metric, tv)} ${METRIC_LABEL[m.metric]} · ${ctx.fmtPct(Math.max(0, frac), 0)}</div>${ui.progress(frac, frac >= 1 ? 'good' : '')}`;
      }
      return `<div style="display:grid;gap:6px;padding:10px 0;${i ? 'border-top:1px solid var(--line)' : 'padding-top:0'}">
        <div style="display:flex;gap:8px;align-items:baseline;justify-content:space-between"><strong style="overflow-wrap:anywhere">${esc(m.title || 'Untitled milestone')}</strong><span style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${late ? ui.chip('Past target', 'bad') : ''}${ui.chip(st[0], st[1])}</span></div>
        <div class="muted" style="font-size:13px">${when}</div>${prog}</div>`;
    }).join('');
    return ui.panel({ title: 'Next milestones', sub: 'by target date', actions: link, body: items });
  }

  function attentionPanel(c) {
    const items = [];
    const add = (tone, label, text, action) => items.push({ tone, label, text, action });
    if (isFinite(c.runway) && c.runway < 6) {
      add('bad', 'Runway', `${c.runway.toFixed(1)} months of cash left at ${ctx.fmtMoney(c.burn.monthly)} a month net burn${c.runway > 0 ? `; it runs out around ${esc(longMonth(c.runsOut))}` : ''}.`, goBtn('cash', 'Cash'));
    }
    c.overdueInv.slice(0, 4).forEach(inv => {
      const late = inv.dueDate ? daysBetween(inv.dueDate, c.today) : null;
      const who = coName(inv.companyId);
      add('bad', 'Invoice', `${esc(inv.number || 'Invoice')}${who ? ' · ' + esc(who) : ''}: ${money(ctx.invoiceTotal(inv))} was due ${esc(ctx.fmtDate(inv.dueDate))}${late ? ` (${late} ${plural(late, 'day')} late)` : ''}.`, goBtn('invoices', 'Invoices'));
    });
    if (c.overdueInv.length > 4) add('bad', 'Invoice', `${c.overdueInv.length - 4} more overdue ${plural(c.overdueInv.length - 4, 'invoice')}.`, goBtn('invoices', 'Invoices'));
    if (c.overdueTasks.length) {
      const n = c.overdueTasks.length;
      const names = c.overdueTasks.slice(0, 3).map(a => `${esc(a.subject || 'Untitled task')} (due ${esc(ctx.fmtDate(a.dueAt))})`).join(', ');
      add('bad', 'Tasks', `${n} overdue ${plural(n, 'task')}: ${names}${n > 3 ? `, and ${n - 3} more` : ''}.`, goBtn('tasks', 'Tasks'));
    }
    ctx.all('milestones').filter(m => !isDone(m) && tDate(m) && tDate(m) < c.today).forEach(m => {
      add('warn', 'Milestone', `${esc(m.title || 'Untitled milestone')} was due ${esc(ctx.fmtDate(m.targetDate))}.`, goBtn('milestones', 'Milestones'));
    });
    c.stale.slice(0, 4).forEach(x => {
      const who = coName(x.d.companyId);
      add('warn', 'Deal', `${esc(x.d.name || 'Untitled deal')}${who ? ' · ' + esc(who) : ''}: no activity for ${x.days} days.`,
        `<button class="btn btn-sm" type="button" data-act="mod" data-mod="${ID}" data-a="open-deal" data-id="${esc(x.d.id)}">Open</button>`);
    });
    if (c.stale.length > 4) add('warn', 'Deal', `${c.stale.length - 4} more open ${plural(c.stale.length - 4, 'deal')} with no activity for ${STALE_DAYS}+ days.`, goBtn('pipeline', 'Pipeline'));
    const li = (x, i) => `<li style="display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;${i ? 'border-top:1px solid var(--line)' : 'padding-top:0'}"><span style="min-width:0">${ui.chip(x.label, x.tone)} <span style="overflow-wrap:anywhere">${x.text}</span></span>${x.action || ''}</li>`;
    const body = items.length
      ? `<ul style="list-style:none;margin:0;padding:0">${items.map(li).join('')}</ul>`
      : `<p class="note" style="margin:0">Nothing needs attention. No overdue invoices or tasks, no open deal has gone ${STALE_DAYS} days without activity, and runway is ${isFinite(c.runway) ? c.runway.toFixed(1) + ' months' : 'not a concern while cash in covers cash out'}.</p>`;
    return ui.panel({ title: 'Needs attention', sub: items.length ? `${items.length} ${plural(items.length, 'item')}` : '', body });
  }

  function monthPanel(c, cd) {
    const row = ctx.cashByMonth(c.cur, c.cur)[0] || { cashIn: 0, cashOut: 0, net: 0 };
    const P = ctx.plan(), year = Number(c.cur.slice(0, 4)), years = ctx.planYears(), inPlan = years.indexOf(year) >= 0;
    const mrow = cd.model[c.cur];
    const ex = ctx.all('expenses').filter(x => ctx.ymOf(x.date) === c.cur);
    const cats = ctx.EXPENSE_CATEGORIES.map(k => ({
      label: k.label,
      spent: sum(ex.filter(x => x.category === k.id), x => num(x.amount)),
      /* Opex lines: the plan's annual budget / 12. Cost of service has no opex line: use the model's cost of service for the month. */
      budget: !inPlan ? 0 : k.id === 'cos' ? (mrow ? num(mrow.cos) : 0) : num(((P.opex || {})[k.id] || {})[year]) / 12
    }));
    const known = ctx.EXPENSE_CATEGORIES.map(k => k.id);
    const other = ex.filter(x => known.indexOf(x.category) < 0);
    if (other.length) cats.push({ label: 'Other', spent: sum(other, x => num(x.amount)), budget: 0 });
    const tSpent = sum(cats, x => x.spent), tBudget = sum(cats, x => x.budget);
    const left = x => (x.budget > 0 ? `<span class="${x.budget - x.spent < 0 ? 'neg' : ''}">${money(x.budget - x.spent)}</span>` : '—');
    const trs = cats.map(x => `<tr><td>${esc(x.label)}</td><td class="num">${money(x.spent)}</td><td class="num">${money(x.budget)}</td><td class="num">${left(x)}</td></tr>`).join('') +
      `<tr><td><strong>Total</strong></td><td class="num"><strong>${money(tSpent)}</strong></td><td class="num"><strong>${money(tBudget)}</strong></td><td class="num"><strong>${left({ spent: tSpent, budget: tBudget })}</strong></td></tr>`;
    const budgetNote = inPlan
      ? `Budget: the plan’s ${year} operating expenses ÷ 12; cost of service is the plan model’s ${ctx.fmtPct(num((P.costOfService || {})[year]), 0)} of revenue for the month.`
      : years.length
        ? (year < years[0]
          ? `The plan’s monthly budgets start in ${esc(longMonth(years[0] + '-01'))}, so ${esc(longMonth(c.cur))} has a $0 budget.`
          : `The plan’s monthly budgets end in ${esc(longMonth(years[years.length - 1] + '-12'))}, so ${esc(longMonth(c.cur))} has a $0 budget.`)
        : 'The plan has no budget years set.';
    /* Expenses dated before the cash opening date are in Spent but not in cash out (opening cash already reflects them). */
    const preOpen = ex.filter(x => String(x.date || '') < c.F.openingDate);
    const preNote = preOpen.length
      ? ` ${money(sum(preOpen, x => num(x.amount)))} of this month’s spending is dated before the cash opening date (${esc(ctx.fmtDate(c.F.openingDate))}), so it is in Spent but not in cash out.`
      : '';
    const net = cents(row.net);
    const body = `<dl class="stat-list">
        <div class="stat-row"><dt>Cash in</dt><dd>${money(row.cashIn)}</dd></div>
        <div class="stat-row"><dt>Cash out</dt><dd>${money(row.cashOut)}</dd></div>
        <div class="stat-row total"><dt>Net</dt><dd class="${net < 0 ? 'neg' : net > 0 ? 'pos' : ''}">${money(net)}</dd></div>
      </dl>
      <div class="table-wrap flat" style="margin-top:14px"><table class="compact" style="min-width:0"><thead><tr><th>Expenses</th><th class="num">Spent</th><th class="num">Plan budget</th><th class="num">Left</th></tr></thead><tbody>${trs}</tbody></table></div>
      <p class="note">${ex.length ? '' : 'No expenses logged this month yet. '}Cash in counts invoices marked paid this month; cash out counts expenses dated this month.${preNote} ${budgetNote}</p>`;
    return ui.panel({ title: 'This month', sub: longMonth(c.cur), actions: goBtn('expenses', 'Expenses'), body });
  }

  function pipelinePanel(c) {
    const link = goBtn('pipeline', 'Open pipeline');
    if (!c.open.length) {
      return ui.panel({ title: 'Pipeline', actions: link,
        body: `<p class="note" style="margin:0">No open deals. Deals in Lead through Pilot show here by stage with their ARR and weighted ARR.</p>` });
    }
    const stageId = d => ctx.stageOf(d).id;
    const rows = OPEN_STAGES.map(s => {
      const ds = c.open.filter(d => stageId(d) === s.id);
      return { s, n: ds.length, locs: sum(ds, ctx.pricedLocs), arr: sum(ds, d => num(d.value)), w: sum(ds, d => num(d.value)) * s.p };
    });
    const tr = r => `<tr><td>${esc(r.s.name)} <span class="muted">${Math.round(r.s.p * 100)}%</span></td><td class="num">${r.n}</td><td class="num">${ctx.fmtNum(r.locs)}</td><td class="num">${ctx.fmtMoney(r.arr)}</td><td class="num">${ctx.fmtMoney(r.w)}</td></tr>`;
    const tot = `<tr><td><strong>Total</strong></td><td class="num"><strong>${c.open.length}</strong></td><td class="num"><strong>${ctx.fmtNum(sum(rows, r => r.locs))}</strong></td><td class="num"><strong>${ctx.fmtMoney(c.openArr)}</strong></td><td class="num"><strong>${ctx.fmtMoney(c.weighted)}</strong></td></tr>`;
    const unpriced = c.open.filter(d => !ctx.priced(d)).length;
    const body = `<div class="table-wrap flat"><table class="compact" style="min-width:0"><thead><tr><th>Stage</th><th class="num">Deals</th><th class="num">Locations</th><th class="num">ARR</th><th class="num">Weighted</th></tr></thead><tbody>${rows.map(tr).join('')}${tot}</tbody></table></div>
      <p class="note">Weighted = each deal’s ARR × its stage probability.${unpriced ? ` ${unpriced} ${plural(unpriced, 'deal has', 'deals have')} no location count and ${unpriced === 1 ? 'adds' : 'add'} 0 locations.` : ''}</p>`;
    return ui.panel({ title: 'Pipeline', sub: 'open ARR by stage', actions: link, body });
  }

  function gettingStarted() {
    const anything = ['deals', 'invoices', 'expenses', 'milestones'].some(k => ctx.all(k).length);
    if (anything || ctx.S.status !== 'ok') return '';
    const text = ctx.canWrite()
      ? 'Revenue, cash, runway and the pipeline fill in from your records. Add a deal on the Pipeline tab, log what you spend on Expenses, and record payments on Invoices.'
      : 'Revenue, cash, runway and the pipeline fill in once someone with edit access adds deals, expenses and invoices.';
    return `<div class="section">${ui.empty({ title: 'Your company overview fills in as you work', text,
      action: `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${goBtn('pipeline', 'Pipeline')}${goBtn('expenses', 'Expenses')}${goBtn('invoices', 'Invoices')}</div>` })}</div>`;
  }

  function todayLine() {
    const d = ctx.parseYmd(ctx.todayStr());
    return d ? d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : '';
  }

  return {
    id: ID,
    label: 'Overview',
    group: 'Company',
    order: 10,
    collections: ['invoices', 'expenses', 'milestones'],
    render() {
      const head = ui.toolbar({ title: 'Overview', count: todayLine(), exportable: !ctx.isLoading() });
      if (ctx.isLoading()) return head + '<div class="empty"><p>Loading your company overview…</p></div>';
      const c = compute(), cd = chartData(c);
      return head + kpiRow(c) + gettingStarted() + chartPanel(c, cd) +
        `<div class="grid grid-2 section">${milestonesPanel(c)}${attentionPanel(c)}${monthPanel(c, cd)}${pipelinePanel(c)}</div>`;
    },
    onAction(a, data) {
      if (a === 'open-deal' && data && data.id && ctx.deal(data.id)) ctx.openDrawer('deal', data.id);
    },
    csv() {
      const c = compute(), T = ctx.planTarget(), tg = c.target;
      const rows = [['Metric', 'Value']];
      rows.push(['As of', c.today]);
      rows.push(['MRR', cents(c.mrr)]);
      rows.push(['ARR', cents(c.arr)]);
      rows.push(['ARR goal (' + T.label + ')', num(T.arr)]);
      rows.push(['Paying locations', c.locations]);
      rows.push(['Next location goal', tg ? `${num(tg.locations)} by ${tg.label || tg.date} (${tg.date})` : 'none']);
      rows.push(['Cash on hand', cents(c.cash)]);
      rows.push(['Opening cash (' + c.F.openingDate + ')', cents(c.F.openingCash)]);
      rows.push(['Net burn per month', cents(c.burn.monthly)]);
      rows.push(['Net burn basis', c.burn.basis]);
      rows.push(['Runway (months)', isFinite(c.runway) ? Math.round(c.runway * 10) / 10 : 'Not burning cash']);
      rows.push(['Cash runs out (month)', c.runsOut || (isFinite(c.runway) ? 'More than 100 years' : 'Not burning cash')]);
      rows.push(['Open pipeline ARR', cents(c.openArr)]);
      rows.push(['Weighted pipeline ARR', cents(c.weighted)]);
      rows.push(['Open deals', c.open.length]);
      rows.push(['Overdue invoices', c.overdueInv.length]);
      rows.push(['Overdue invoice amount', cents(c.overdueAmt)]);
      rows.push(['Overdue tasks', c.overdueTasks.length]);
      rows.push([`Open deals with no activity for ${STALE_DAYS}+ days`, c.stale.length]);
      return { name: 'overview', rows };
    }
  };
});
</script>
<script>
/* ---- tab module: revenue ---- */
(window.__dbViews = window.__dbViews || []).push(function (ctx) {
  'use strict';
  /* Revenue: subscription MRR from won deals. A subscription starts on the deal's close date and stops
     counting on churnedAt (the same rule ctx.mrrOn uses), so every figure here matches the other tabs. */
  const ID = 'revenue';
  const esc = ctx.esc, money = ctx.fmtMoney, compact = ctx.fmtCompact;
  const plural = (n, one, many) => `${ctx.fmtNum(n, 1)} ${Math.abs(n - 1) < 1e-9 ? one : (many || one + 's')}`;
  const signed = n => (n > 0.004 ? '+' : n < -0.004 ? '−' : '') + money(Math.abs(n));
  const round2 = n => Math.round(ctx.num(n) * 100) / 100;
  /* "Nov 2026" for prose and labels: monthLabel's "Nov 26" reads like a day next to dates such as "Nov 22". */
  const monthLong = ym => { const d = ctx.parseYmd(String(ym || '') + '-01'); return d ? d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }) : ''; };

  /* ---------- data ---------- */
  const activeOn = (s, day) => s.start <= day && (!s.end || s.end > day);
  /* A churn date before the start date means the subscription never ran: core never counts it, neither do we. */
  const ran = s => !s.end || s.end >= s.start;
  const mrrAt = (list, day) => ctx.sum(list.filter(s => activeOn(s, day)), s => s.mrr);
  const locsAt = (list, day) => ctx.sum(list.filter(s => activeOn(s, day)), s => s.locations);

  function statusOf(s, t) {
    if (s.end && s.end <= t) return { rank: 3, text: 'Churned ' + ctx.fmtDate(s.end), tone: 'bad', csv: 'Churned' };
    if (s.start > t) return { rank: 2, text: 'Starts ' + ctx.fmtDate(s.start), tone: 'accent', csv: 'Starts later' };
    if (s.end) return { rank: 1, text: 'Ends ' + ctx.fmtDate(s.end), tone: 'warn', csv: 'Ending' };
    return { rank: 0, text: 'Active', tone: 'good', csv: 'Active' };
  }
  function sortedSubs(t) {
    return ctx.subscriptions().map(s => Object.assign({}, s, { st: statusOf(s, t) }))
      .sort((a, b) => (a.st.rank - b.st.rank) || (b.mrr - a.mrr) || String(a.name).localeCompare(String(b.name)));
  }
  const dealName = s => (s.deal && s.deal.name) || '';

  /* Months the chart covers: from the first subscription start (or the cash opening month) to December of the
     first plan year (or of this year, once the plan's first year has passed), capped to the last 24 months. */
  function monthWindow(subs, t) {
    const cur = ctx.ymOf(t);
    const years = ctx.planYears();
    const thisYear = Number(cur.slice(0, 4));
    const endYear = Math.max(thisYear, years.length ? years[0] : thisYear);
    const end = endYear + '-12';
    let start = cur;
    subs.forEach(s => { const m = ctx.ymOf(s.start); if (/^\d{4}-\d{2}$/.test(m) && m < start) start = m; });
    const open = ctx.ymOf(ctx.finance().openingDate);
    if (/^\d{4}-\d{2}$/.test(open) && open < start) start = open;
    let months = ctx.monthRange(start, end);
    if (months.length > 24) months = months.slice(-24);
    return { cur, end, months };
  }

  /* MRR movement: Ending = Starting + New − Churned, chained month to month. The current month runs to today,
     so its ending MRR equals the MRR tile. */
  function movement(subs, months, t) {
    const cur = ctx.ymOf(t);
    const list = subs.filter(ran);
    let shown = months.filter(m => m <= cur);
    if (!shown.length) shown = [cur];
    let starting = mrrAt(list, ctx.addDays(shown[0] + '-01', -1));
    return shown.map(m => {
      const periodEnd = m === cur ? t : ctx.monthEnd(m);
      const added = list.filter(s => ctx.ymOf(s.start) === m && s.start <= periodEnd);
      const lost = list.filter(s => s.end && ctx.ymOf(s.end) === m && s.end <= periodEnd);
      const newMrr = ctx.sum(added, s => s.mrr), churnMrr = ctx.sum(lost, s => s.mrr);
      const row = { ym: m, toDate: m === cur, periodEnd, starting, newMrr, newCount: added.length, churnMrr, churnCount: lost.length,
        ending: starting + newMrr - churnMrr, locations: locsAt(list, periodEnd) };
      starting = row.ending;
      return row;
    });
  }

  function planRows() { return ctx.planModel('base'); }
  function firstYearPath(model) {
    const years = ctx.planYears();
    const y = years.length ? years[0] : null;
    const rows = model.filter(r => r.year === y);
    if (!rows.length) return null;
    const P = ctx.plan();
    const targets = (P.targets || []).filter(x => String(x.date || '').slice(0, 4) === String(y));
    return { year: y, jan: rows[0], dec: rows[rows.length - 1], rows, targets, pilots: ctx.num(P.pilots) };
  }

  function invoicePayments(t) {
    const y = t.slice(0, 4);
    const paid = ctx.all('invoices').filter(i => ctx.invoiceStatus(i) === 'paid' && /^\d{4}-\d{2}-\d{2}$/.test(i.paidDate || '') && i.paidDate.slice(0, 4) === y && i.paidDate <= t);
    return { year: y, count: paid.length, total: ctx.sum(paid, i => ctx.invoiceTotal(i)) };
  }

  /* ---------- pieces ---------- */
  function chartBlock(months, rows, model, cur, t) {
    const byYm = {}; rows.forEach(r => { byYm[r.ym] = r; });
    const planBy = {}; model.forEach(r => { planBy[r.ym] = r; });
    const actual = months.map(m => (m <= cur && byYm[m] ? round2(byYm[m].ending) : null));
    const planned = months.map(m => (planBy[m] ? round2(planBy[m].mrr) : null));
    const hasPlan = planned.some(v => v != null);
    const series = [{ name: 'Actual MRR', values: actual, color: 'var(--viz-1)' }];
    if (hasPlan) series.push({ name: 'Plan MRR · Model, base case', values: planned, color: 'var(--viz-plan)', dashed: true });
    const chart = ctx.chart.line({
      labels: months.map(ctx.monthLabel), series, height: 240, format: compact,
      ariaLabel: `MRR by month, ${monthLong(months[0])} to ${monthLong(months[months.length - 1])}: actual through ${monthLong(cur)}${hasPlan ? ', plan from the model' : ''}`
    });
    const body = months.map(m => {
      const a = m <= cur && byYm[m] ? byYm[m] : null, p = planBy[m];
      return `<tr><td>${esc(ctx.monthLabel(m))}${a && a.toDate ? ' <span class="muted">to date</span>' : ''}</td>
        <td class="num">${a ? money(a.ending) : '<span class="muted">—</span>'}</td>
        <td class="num">${p ? money(p.mrr) : '<span class="muted">—</span>'}</td>
        <td class="num">${p ? ctx.fmtNum(p.locations, 1) : '<span class="muted">—</span>'}</td></tr>`;
    }).join('');
    const note = `<p class="note">Actual MRR is measured at each month end; ${esc(monthLong(cur))} is as of today, ${esc(ctx.fmtDate(t))}.${hasPlan ? ' The dashed line is the plan model (base case), which starts when the pilots convert to paid.' : ''}</p>`;
    const table = `<details style="margin-top:10px"><summary class="link" style="font-size:13px;font-weight:600">Show the numbers</summary>
      <div class="table-wrap flat" style="margin-top:8px"><table class="compact"><thead><tr><th>Month</th><th class="num">Actual MRR</th><th class="num">Plan MRR · Model</th><th class="num">Plan locations · Model</th></tr></thead><tbody>${body}</tbody></table></div></details>`;
    return chart + note + table;
  }

  function movementTable(rows) {
    const body = rows.map(r => `<tr>
      <td style="white-space:nowrap">${esc(ctx.monthLabel(r.ym))}${r.toDate ? ' <span class="muted">to date</span>' : ''}</td>
      <td class="num">${money(r.starting)}</td>
      <td class="num">${r.newCount ? `<span class="pos">+${money(r.newMrr)}</span> <span class="muted">(${r.newCount})</span>` : '<span class="muted">$0</span>'}</td>
      <td class="num">${r.churnCount ? `<span class="neg">−${money(r.churnMrr)}</span> <span class="muted">(${r.churnCount})</span>` : '<span class="muted">$0</span>'}</td>
      <td class="num"><strong>${money(r.ending)}</strong></td>
      <td class="num">${ctx.fmtNum(r.locations)}</td></tr>`).join('');
    const first = rows[0], last = rows[rows.length - 1];
    const totNew = ctx.sum(rows, r => r.newMrr), totChurn = ctx.sum(rows, r => r.churnMrr);
    const total = rows.length > 1 ? `<tr style="font-weight:600"><td>All ${rows.length} months</td><td class="num">${money(first.starting)}</td>
      <td class="num">+${money(totNew)}</td><td class="num">−${money(totChurn)}</td><td class="num">${money(last.ending)}</td><td class="num">${ctx.fmtNum(last.locations)}</td></tr>` : '';
    return `<div class="table-wrap flat"><table class="compact"><thead><tr><th>Month</th><th class="num">Starting MRR</th><th class="num">New</th><th class="num">Churned</th><th class="num">Ending MRR</th><th class="num">Locations</th></tr></thead><tbody>${body}${total}</tbody></table></div>
      <p class="note">Ending MRR = Starting + New − Churned. New counts subscriptions that started that month; Churned counts those whose churn date fell in it. Counts in brackets.</p>`;
  }

  function pathPanel(path, nowMrr, nowLocs, t, pre) {
    if (!path) return ctx.ui.panel({ title: 'Plan path', body: '<p class="note">The plan has no years set. Add them on the Assumptions tab.</p>' });
    const tg = ctx.planTarget();
    const rows = [
      `<div class="stat-row"><dt>Jan ${path.year} MRR · Model</dt><dd>${money(path.jan.mrr)}</dd></div>`,
      `<div class="stat-row"><dt>Jan ${path.year} locations · Model</dt><dd>${ctx.fmtNum(path.jan.locations, 1)}</dd></div>`,
      `<div class="stat-row"><dt>Dec ${path.year} MRR · Model</dt><dd>${money(path.dec.mrr)}</dd></div>`,
      `<div class="stat-row"><dt>Dec ${path.year} locations · Model</dt><dd>${ctx.fmtNum(path.dec.locations, 1)}</dd></div>`,
      `<div class="stat-row total"><dt>Dec ${path.year} ARR · Model</dt><dd>${money(path.dec.arr)}</dd></div>`
    ];
    path.targets.forEach(x => {
      const bits = [];
      if (x.locations) bits.push(plural(ctx.num(x.locations), 'location'));
      if (x.arr) bits.push(compact(x.arr) + ' ARR');
      if (bits.length) rows.push(`<div class="stat-row"><dt>${esc(x.label || ctx.fmtDate(x.date))} · Plan doc</dt><dd>${esc(bits.join(' · '))}</dd></div>`);
    });
    let lead;
    if (pre) {
      lead = `<p class="note" style="margin:0 0 12px">The plan starts in Jan ${path.year} with ${plural(path.pilots, 'pilot location')} converting to paid, then adds about ${ctx.fmtNum(path.jan.newLocations, 1)} new locations a month while ${ctx.fmtPct(ctx.num((ctx.plan().churn || {}).base), 1)} churn each month.</p>`;
    } else {
      const curYm = ctx.ymOf(t);
      const ref = path.rows.find(r => r.ym === curYm) || (curYm < path.jan.ym ? path.jan : null);
      const tgtYm = ctx.ymOf(tg.end);
      const left = tgtYm > curYm ? ctx.monthRange(ctx.addMonths(curYm, 1), tgtYm).length : 0;
      const need = Math.max(0, tg.locations - nowLocs);
      lead = (ref ? `<div style="margin-bottom:6px;font-size:14px">${money(nowMrr)} today vs ${money(ref.mrr)} planned for ${esc(monthLong(ref.ym))} · Model</div>${ctx.ui.progress(ref.mrr ? nowMrr / ref.mrr : 0, nowMrr >= ref.mrr ? 'good' : '')}` : '') +
        (left && need > 0 ? `<p class="note" style="margin:8px 0 12px">To reach ${plural(tg.locations, 'location')} by ${esc(tg.label)}, add about ${ctx.fmtNum(need / left, 1)} net new locations a month for the next ${left} months.</p>` : '<div style="height:12px"></div>');
    }
    return ctx.ui.panel({ title: `Plan path · ${path.year}`, sub: 'Model = month-by-month rebuild · Plan doc = the projections', body: lead + `<dl class="stat-list">${rows.join('')}</dl>` });
  }

  function subsTable(list, t, canWrite) {
    const shown = list.filter(s => ctx.matches(s.name, dealName(s)));
    const q = String(ctx.S.q || '').trim();
    const cols = canWrite ? 7 : 6;
    const body = shown.length ? shown.map(s => {
      const dn = dealName(s);
      const act = !canWrite ? '' : `<td><div class="row-actions">${s.end
        ? `<button class="btn btn-sm btn-ghost" type="button" data-act="mod" data-mod="${ID}" data-a="unchurn" data-id="${esc(s.id)}">Undo churn</button>`
        : `<button class="btn btn-sm" type="button" data-act="mod" data-mod="${ID}" data-a="churn" data-id="${esc(s.id)}">Mark churned</button>`}</div></td>`;
      return `<tr id="revenue-row-${esc(s.id)}">
        <td><button class="link cell-main" type="button" data-act="mod" data-mod="${ID}" data-a="open" data-id="${esc(s.id)}">${esc(s.name)}</button>${dn && dn !== s.name ? `<div class="cell-sub trunc">${esc(dn)}</div>` : ''}</td>
        <td class="num">${ctx.fmtNum(s.locations)}</td>
        <td class="num">${money(s.mrr)}</td>
        <td class="num">${money(s.arr)}</td>
        <td style="white-space:nowrap">${esc(ctx.fmtDate(s.start))}</td>
        <td>${ctx.ui.chip(s.st.text, s.st.tone)}</td>${act}</tr>`;
    }).join('') : `<tr><td colspan="${cols}" class="muted" style="text-align:center;padding:18px">No subscriptions match “${esc(q)}”.</td></tr>`;
    return `<div class="table-wrap flat"><table class="compact"><thead><tr><th>Customer</th><th class="num">Locations</th><th class="num">MRR</th><th class="num">ARR</th><th>Start</th><th>Status</th>${canWrite ? '<th><span class="muted" style="font-weight:400">Actions</span></th>' : ''}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  /* ---------- views ---------- */
  function renderEmpty(t) {
    const model = planRows(), path = firstYearPath(model);
    const pay = invoicePayments(t);
    let planChart = '';
    if (path) {
      planChart = ctx.ui.panel({
        title: `Plan MRR · ${path.year}`, sub: 'Model, base case',
        body: ctx.chart.line({ labels: path.rows.map(r => ctx.monthLabel(r.ym)), series: [{ name: 'Plan MRR · Model', values: path.rows.map(r => round2(r.mrr)), color: 'var(--viz-plan)', dashed: true }], height: 220, format: compact, ariaLabel: `Plan MRR for ${path.year}, from ${money(path.jan.mrr)} in January to ${money(path.dec.mrr)} in December` }) +
          `<p class="note">From ${money(path.jan.mrr)} MRR in Jan ${path.year} to ${money(path.dec.mrr)} in Dec ${path.year} (${compact(path.dec.arr)} ARR).</p>` +
          `<details style="margin-top:10px"><summary class="link" style="font-size:13px;font-weight:600">Show the numbers</summary><div class="table-wrap flat" style="margin-top:8px"><table class="compact"><thead><tr><th>Month</th><th class="num">Plan MRR · Model</th><th class="num">Plan locations · Model</th></tr></thead><tbody>${path.rows.map(r => `<tr><td>${esc(ctx.monthLabel(r.ym))}</td><td class="num">${money(r.mrr)}</td><td class="num">${ctx.fmtNum(r.locations, 1)}</td></tr>`).join('')}</tbody></table></div></details>`
      });
    }
    const payNote = `<p class="note">Invoice payments in ${esc(pay.year)} so far: ${money(pay.total)} from ${pay.count} paid invoice${pay.count === 1 ? '' : 's'}. Pilot and setup fees count there, not in MRR.</p>`;
    return ctx.ui.empty({
      title: 'No subscriptions yet',
      text: 'When you move a deal to Won in the Pipeline, it becomes a subscription here. Its MRR starts on the close date and counts until you mark it churned.',
      action: '<button class="btn btn-primary" type="button" data-act="go" data-view="pipeline">Go to Pipeline</button>'
    }) + `<div class="grid grid-2 section">${planChart}${pathPanel(path, 0, 0, t, true)}</div>` + payNote;
  }

  function renderFull(t) {
    const subs = sortedSubs(t);
    const canWrite = ctx.canWrite();
    const win = monthWindow(subs, t);
    const rows = movement(subs, win.months, t);
    const model = planRows();
    const path = firstYearPath(model);
    const active = subs.filter(s => activeOn(s, t));
    const mrr = ctx.mrrOn(t), arr = mrr * 12, locs = ctx.locationsOn(t);
    const since = ctx.addDays(t, -90);
    const churned90 = subs.filter(s => s.end && s.end >= since && s.end <= t && ran(s));
    const churnMrr = ctx.sum(churned90, s => s.mrr);
    const later = subs.filter(s => s.start > t && ran(s));
    const pay = invoicePayments(t);
    const thisMonth = rows[rows.length - 1];
    const tg = ctx.planTarget();
    const curPlan = model.find(r => r.ym === win.cur) || (model.length && win.cur < model[0].ym ? model[0] : null);

    const k1 = [
      ctx.ui.kpi({ label: 'MRR · today', value: money(mrr), sub: curPlan ? `Plan ${esc(monthLong(curPlan.ym))}: ${money(curPlan.mrr)} · Model` : `${plural(locs, 'location')} paying` }),
      ctx.ui.kpi({ label: 'ARR', value: money(arr), bar: tg.arr ? `<div style="margin:9px 0 2px">${ctx.ui.progress(arr / tg.arr, arr >= tg.arr ? 'good' : '')}</div>` : '', sub: tg.arr ? `${ctx.fmtPct(arr / tg.arr, 1)} of the ${compact(tg.arr)} goal for ${esc(tg.label)}` : 'MRR × 12' }),
      ctx.ui.kpi({ label: 'Active customers', value: `${active.length}`, sub: `${plural(locs, 'location')} active today` }),
      ctx.ui.kpi({ label: 'ARPA', value: active.length ? money(mrr / active.length) : '—', sub: active.length ? 'MRR per active customer' : 'No active customers yet' })
    ].join('');
    const k2 = [
      ctx.ui.kpi({ label: 'Churned MRR · 90 days', value: money(churnMrr), tone: churnMrr > 0 ? 'bad' : '', sub: churned90.length ? `${churned90.length} customer${churned90.length === 1 ? '' : 's'}, ${plural(ctx.sum(churned90, s => s.locations), 'location')} since ${esc(ctx.fmtDate(since))}` : `None since ${esc(ctx.fmtDate(since))}` }),
      ctx.ui.kpi({ label: `Net new MRR · ${monthLong(win.cur)}`, value: signed(thisMonth.newMrr - thisMonth.churnMrr), tone: thisMonth.newMrr - thisMonth.churnMrr < -0.004 ? 'bad' : thisMonth.newMrr - thisMonth.churnMrr > 0.004 ? 'good' : '', sub: `+${money(thisMonth.newMrr)} new · −${money(thisMonth.churnMrr)} churned, to date` }),
      ctx.ui.kpi({ label: 'Starts later', value: money(ctx.sum(later, s => s.mrr)), sub: later.length ? `${later.length} won deal${later.length === 1 ? '' : 's'} with a future start date` : 'No won deals start after today' }),
      ctx.ui.kpi({ label: `Invoice payments · ${pay.year}`, value: money(pay.total), sub: `${pay.count} paid invoice${pay.count === 1 ? '' : 's'}; setup, pilot and subscription lines all count` })
    ].join('');

    const chartPanel = ctx.ui.panel({ title: 'MRR by month', sub: `${monthLong(win.months[0])} – ${monthLong(win.months[win.months.length - 1])}`, body: chartBlock(win.months, rows, model, win.cur, t) });
    const movePanel = ctx.ui.panel({ title: 'MRR movement', sub: 'By month, through today', body: movementTable(rows) });
    const subsPanel = ctx.ui.panel({
      title: 'Subscriptions', sub: `${active.length} active · ${subs.length} total · from won deals`,
      actions: '<button class="btn btn-sm btn-ghost" type="button" data-act="go" data-view="pipeline">Open Pipeline</button>',
      body: subsTable(subs, t, canWrite) + (canWrite ? '<p class="note">Mark a customer churned on the day they stop paying; their MRR stops counting from that date. Undo it if they come back on the same terms.</p>' : '')
    });

    return `<section class="kpis" aria-label="Revenue summary">${k1}</section><section class="kpis" aria-label="Revenue changes">${k2}</section>
      <div class="section">${chartPanel}</div>
      <div class="grid grid-2 section">${movePanel}${pathPanel(path, mrr, locs, t, false)}</div>
      <div class="section" id="revenue-subscriptions">${subsPanel}</div>`;
  }

  /* ---------- actions ---------- */
  function subById(id) { return ctx.subscriptions().find(s => s.id === id) || null; }
  function markChurned(s) {
    const t = ctx.todayStr();
    const def = s.start > t ? s.start : t;
    ctx.openFormModal({
      title: `Mark ${s.name} churned`,
      body: ctx.F.date('revenue-churn-date', 'Churn date', def) +
        `<p class="note">From this date ${esc(s.name)} stops counting toward MRR: ${money(s.mrr)} MRR, ${money(s.arr)} ARR, ${plural(s.locations, 'location')}. It can’t be before the start date, ${esc(ctx.fmtDate(s.start))}.</p>`,
      submitLabel: 'Mark churned',
      onSubmit: async () => {
        const v = ctx.val('revenue-churn-date');
        if (!ctx.parseYmd(v)) return ctx.formErr('Enter the churn date.', 'revenue-churn-date');
        if (v < s.start) return ctx.formErr(`The churn date can’t be before the start date, ${ctx.fmtDate(s.start)}.`, 'revenue-churn-date');
        const ok = await ctx.patch('deals', s.id, { churnedAt: v, updatedAt: ctx.iso() });
        if (ok) ctx.toast(`${s.name} marked churned on ${ctx.fmtDate(v)}`);
        return ok;
      }
    });
  }
  function undoChurn(s) {
    const t = ctx.todayStr();
    ctx.openConfirm(`Undo churn for ${s.name}?`,
      s.end > t
        ? `This removes the churn date of ${ctx.fmtDate(s.end)}, so ${s.name}’s ${money(s.mrr)} MRR keeps counting after it.`
        : `${s.name} becomes an active subscription again, and its ${money(s.mrr)} MRR counts from ${ctx.fmtDate(s.start)} onward.`,
      'Undo churn',
      async () => { if (await ctx.patch('deals', s.id, { churnedAt: null, updatedAt: ctx.iso() })) ctx.toast(`Churn undone for ${s.name}`); });
  }

  return {
    id: ID,
    label: 'Revenue',
    group: 'Finance',
    order: 10,
    collections: ['invoices'],
    render() {
      const loading = ctx.isLoading();
      const t = ctx.todayStr();
      const count = loading ? null : ctx.subscriptions().length;
      const head = ctx.ui.toolbar({ title: 'Revenue', count: count == null ? null : `${count} subscription${count === 1 ? '' : 's'}`, exportable: !loading });
      if (loading) return head + '<div class="empty"><p>Loading revenue…</p></div>';
      if (!count) return head + renderEmpty(t);
      return head + renderFull(t);
    },
    onAction(a, data) {
      if (a === 'open') { if (data.id) ctx.openDrawer('deal', data.id); return; }
      if (!ctx.canWrite()) { ctx.toast('You can view this CRM but not change it.', 'bad'); return; }
      const s = subById(data.id);
      if (!s) { ctx.toast('That subscription is no longer here.', 'bad'); return; }
      if (a === 'churn') markChurned(s);
      else if (a === 'unchurn') undoChurn(s);
    },
    csv() {
      const t = ctx.todayStr();
      const rows = [['Customer', 'Deal', 'Locations', 'MRR', 'ARR', 'Start', 'Churn date', 'Status']];
      sortedSubs(t).forEach(s => rows.push([s.name || '', dealName(s), s.locations, round2(s.mrr), round2(s.arr), s.start || '', s.end || '', s.st.csv]));
      return { name: 'subscriptions', rows };
    }
  };
});
</script>
<script>
/* ---- tab module: expenses ---- */
(window.__dbViews = window.__dbViews || []).push(function (ctx) {
  'use strict';
  /* Expenses: log spending by income-statement line and compare each month with the plan budget.
     Budget for a plan year = opex[line][year] / 12 for each operating line, plus the plan model's cost of
     service for that month. Before the first plan year the plan's startup costs are spread evenly from the
     cash opening month through December of the prior year. After the last plan year the last year's values apply. */
  const ID = 'expenses';
  const CATS = ctx.EXPENSE_CATEGORIES;
  const CAT_LABEL = Object.create(null); // no prototype, so a stored category like 'constructor' reads as unknown
  CATS.forEach(c => { CAT_LABEL[c.id] = c.label; });
  const st = { ym: null, all: false, lastCat: 'ga' };

  /* ---------- small helpers ---------- */
  const curYm = () => ctx.ymOf(ctx.todayStr());
  const selYm = () => st.ym || curYm();
  const round2 = n => (Math.round(ctx.num(n) * 100) / 100) || 0;
  const money = n => ctx.fmtPrice(round2(n));
  const catLabel = id => CAT_LABEL[id] || 'Uncategorized';
  const norm = s => String(s == null ? '' : s).trim().toLowerCase();
  function longMonth(ym) {
    const p = String(ym || '').split('-').map(Number);
    if (!p[0] || !p[1]) return String(ym || '');
    return new Date(p[0], p[1] - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const btn = (a, text, extra, cls) => `<button class="btn btn-sm ${cls || ''}" type="button" data-act="mod" data-mod="${ID}" data-a="${a}" ${extra || ''}>${text}</button>`;
  const expenses = () => ctx.all('expenses');
  const inMonth = (x, ym) => ctx.ymOf(x.date) === ym;
  const newer = (a, b) => {
    const da = String(a.date || ''), db = String(b.date || '');
    if (da !== db) return da > db;
    return String(a.createdAt || '') > String(b.createdAt || '');
  };
  const newestFirst = (a, b) => (newer(a, b) ? -1 : newer(b, a) ? 1 : 0);

  function modelIndex() {
    const by = {};
    ctx.planModel('base').forEach(r => { by[r.ym] = r; });
    return by;
  }

  /* ---------- budget ---------- */
  function budgetFor(ym, modelByYm) {
    const P = ctx.plan(), years = ctx.planYears();
    if (!years.length) return { kind: 'none', total: 0 };
    const y = Number(String(ym).slice(0, 4)), first = years[0], last = years[years.length - 1];
    if (y < first) {
      const openYm = ctx.ymOf(ctx.finance().openingDate), endYm = `${first - 1}-12`;
      const months = openYm <= endYm ? ctx.monthRange(openYm, endYm) : [];
      const startup = ctx.num(P.startupCosts);
      const inRange = months.indexOf(ym) >= 0;
      return {
        kind: 'startup', total: inRange && months.length ? startup / months.length : 0,
        startup, months, inRange, openYm, endYm, beforeOpen: ym < openYm, firstYear: first
      };
    }
    const yy = years.filter(v => v <= y).pop();
    const row = modelByYm[`${yy}-${String(ym).slice(5, 7)}`];
    const by = {};
    CATS.forEach(c => {
      by[c.id] = c.id === 'cos' ? (row ? ctx.num(row.cos) : 0) : ctx.num(((P.opex || {})[c.id] || {})[yy]) / 12;
    });
    return { kind: 'plan', total: ctx.sum(Object.keys(by), k => by[k]), by, year: yy, clamped: y > last, last };
  }

  /* ---------- recurring costs ---------- */
  const recKey = x => norm(x.vendor) + '|' + norm(x.description);
  /* Latest entry of each recurring expense (by vendor + description) dated on or before `endDay`. */
  function recurringLatest(list, endDay) {
    const by = new Map();
    list.forEach(x => {
      if (!x.recurring || !x.date || x.date > endDay) return;
      const k = recKey(x), cur = by.get(k);
      if (!cur || newer(x, cur)) by.set(k, x);
    });
    return [...by.values()].sort((a, b) => ctx.num(b.amount) - ctx.num(a.amount));
  }
  /* Recurring costs last logged before `ym` that have no entry in `ym` yet. */
  function recurringDue(list, ym) {
    const start = ym + '-01';
    const prior = recurringLatest(list, ctx.addDays(start, -1));
    const logged = new Set(list.filter(x => inMonth(x, ym)).map(recKey));
    return prior.filter(x => !logged.has(recKey(x)));
  }
  function sameDayIn(ym, dateStr) {
    const day = Math.max(1, Number(String(dateStr || '').slice(8, 10)) || 1);
    const end = ctx.monthEnd(ym);
    return `${ym}-${ctx.pad(Math.min(day, Number(end.slice(8, 10))))}`;
  }

  /* ---------- per-month figures ---------- */
  function monthFigures(list, ym, modelByYm) {
    const rows = list.filter(x => inMonth(x, ym));
    const byCat = Object.create(null);
    CATS.forEach(c => { byCat[c.id] = 0; });
    let other = 0;
    rows.forEach(x => { if (byCat[x.category] != null) byCat[x.category] += ctx.num(x.amount); else other += ctx.num(x.amount); });
    const spent = ctx.sum(rows, x => ctx.num(x.amount));
    return { ym, rows, byCat, other, spent, budget: budgetFor(ym, modelByYm) };
  }

  /* ---------- pieces of the page ---------- */
  function monthPicker() {
    const ym = selYm();
    const here = ym === curYm();
    return `<div class="seg" role="group" aria-label="Month">
      <button type="button" data-act="mod" data-mod="${ID}" data-a="prev" aria-label="Previous month" title="Previous month">&lsaquo;</button>
      <button type="button" data-act="mod" data-mod="${ID}" data-a="month" aria-pressed="${!st.all}" title="${st.all ? 'Show this month only' : here ? 'This month' : 'Back to this month'}">${ctx.esc(longMonth(ym))}</button>
      <button type="button" data-act="mod" data-mod="${ID}" data-a="next" aria-label="Next month" title="Next month">&rsaquo;</button>
      <button type="button" data-act="mod" data-mod="${ID}" data-a="all" aria-pressed="${st.all}" title="List every expense">All</button>
    </div>`;
  }

  function kpiRow(f, list) {
    const b = f.budget, spent = f.spent, budget = b.total;
    const used = budget > 0 ? spent / budget : null;
    const diff = round2(spent - budget);
