/* ---------- company finance (shared by every tab, so figures agree everywhere) ---------- */
function finance(){
  const f=(S.data.settings&&S.data.settings.get('finance'))||{};
  return {
    openingCash:f.openingCash!=null&&f.openingCash!==''?num(f.openingCash):FIN_DEFAULTS.openingCash,
    openingDate:/^\d{4}-\d{2}-\d{2}$/.test(f.openingDate||'')?f.openingDate:FIN_DEFAULTS.openingDate,
    budgets:f.budgets&&typeof f.budgets==='object'?f.budgets:null,
    note:f.note||''
  };
}
const ymOf=s=>String(s||'').slice(0,7);
function monthEnd(ym){const [y,m]=ym.split('-').map(Number);return ymd(new Date(y,m,0));}
function addMonths(ym,n){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;}
function monthRange(fromYm,toYm){const out=[];let c=fromYm,guard=0;while(c<=toYm&&guard++<600){out.push(c);c=addMonths(c,1);}return out;}
/* "Mar ’28": the apostrophe keeps a 2-digit year from reading as a day of the month. */
function monthLabel(ym){const [y,m]=String(ym||'').split('-').map(Number);if(!y||!m)return '';return `${new Date(y,m-1,1).toLocaleDateString('en-US',{month:'short'})} ’${String(y).slice(2)}`;}

/* Subscriptions are won deals: each starts on its close date (set to the day it was marked Won) and stops on churnedAt, if set. */
function subscriptions(){
  return all('deals').filter(d=>d.stage==='won').map(d=>{
    const co=company(d.companyId);
    return {id:d.id,deal:d,companyId:d.companyId||null,name:co?co.name:(d.name||'Customer'),locations:pricedLocs(d)||1,
      mrr:num(d.value)/12,arr:num(d.value),start:d.closeDate||isoToYmd(d.closedAt)||todayStr(),end:d.churnedAt||null};
  });
}
const subActiveOn=(s,day)=>s.start<=day&&(!s.end||s.end>day);
function mrrOn(day){return sum(subscriptions().filter(s=>subActiveOn(s,day)),s=>s.mrr);}
function locationsOn(day){return sum(subscriptions().filter(s=>subActiveOn(s,day)),s=>s.locations);}

function invoiceTotal(inv){return Math.round(sum(Array.isArray(inv&&inv.lines)?inv.lines:[],l=>num(l.qty)*num(l.unitPrice))*100)/100;}
function invoiceStatus(inv){if(!inv)return 'draft';if(inv.status==='sent'&&inv.dueDate&&inv.dueDate<todayStr())return 'overdue';return inv.status||'draft';}

/* Cash = opening balance + invoice payments received - expenses paid, counted from the opening date. */
function cashFlows(toDay){
  const F=finance(),end=toDay||todayStr();
  const ins=(S.data.invoices?all('invoices'):[]).filter(i=>i.status==='paid'&&i.paidDate&&i.paidDate>=F.openingDate&&i.paidDate<=end).map(i=>({date:i.paidDate,amount:invoiceTotal(i),ref:i}));
  const outs=(S.data.expenses?all('expenses'):[]).filter(x=>x.date&&x.date>=F.openingDate&&x.date<=end).map(x=>({date:x.date,amount:num(x.amount),ref:x}));
  return {ins,outs};
}
function cashOn(day){const F=finance();const {ins,outs}=cashFlows(day);return F.openingCash+sum(ins,x=>x.amount)-sum(outs,x=>x.amount);}
function cashByMonth(fromYm,toYm){
  const F=finance();const {ins,outs}=cashFlows(monthEnd(toYm));
  let bal=F.openingCash+sum(ins.filter(x=>ymOf(x.date)<fromYm),x=>x.amount)-sum(outs.filter(x=>ymOf(x.date)<fromYm),x=>x.amount);
  return monthRange(fromYm,toYm).map(ym=>{
    const i=sum(ins.filter(x=>ymOf(x.date)===ym),x=>x.amount),o=sum(outs.filter(x=>ymOf(x.date)===ym),x=>x.amount);
    bal+=i-o;return {ym,cashIn:i,cashOut:o,net:i-o,end:bal};
  });
}
/* Monthly net burn (cash out minus cash in): average of the last n full months since the opening date,
   or, before a full month has passed, this month so far scaled to a whole month. */
function burnRate(n){
  n=n||3;const F=finance(),now=new Date(),t=todayStr(),cur=ymOf(t),open=ymOf(F.openingDate);
  const full=open<cur?monthRange(open,addMonths(cur,-1)).slice(-n):[];
  if(full.length){const rows=cashByMonth(full[0],full[full.length-1]);return {monthly:sum(rows,r=>-r.net)/rows.length,basis:`average of the last ${rows.length} full month${rows.length===1?'':'s'}`};}
  const row=cashByMonth(cur,cur)[0];const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const startDay=open===cur?Number(F.openingDate.slice(8)):1;const elapsed=Math.max(1,now.getDate()-startDay+1);
  return {monthly:-row.net*dim/elapsed,basis:'this month so far, scaled to a full month'};
}
function runwayMonths(){const cash=cashOn(todayStr()),b=burnRate().monthly;if(b<=0)return Infinity;return Math.max(0,cash/b);}

/* The plan model rebuilds the projections month by month: locations at the start of a month pay that month's price,
   then churn % leaves and the year's average new locations arrive. Base case: 3 pilots, 4/month in 2027, 3% churn -> ~42 locations at Dec 2027. */
function planModel(scenario){
  scenario=scenario||'base';
  const P=plan(),years=planYears();
  const mRaw=(P.newMultiplier||{})[scenario];const mult=mRaw==null?1:num(mRaw);const churn=num((P.churn||{})[scenario]);
  let L=num(P.pilots);const out=[];
  years.forEach(y=>{
    const r=(P.newPerMonth||{})[y]||[0,0];const add=(num(r[0])+num(r[1]))/2*mult;
    const price=num(P.prices[y]),cosPct=num((P.costOfService||{})[y]);
    const opex={};Object.keys(P.opex||{}).forEach(k=>{opex[k]=num((P.opex[k]||{})[y])/12;});
    const opexTotal=sum(Object.values(opex),v=>v);
    for(let m=1;m<=12;m++){
      const start=L,revenue=start*price,churned=start*churn;L=start-churned+add;
      const cos=revenue*cosPct,gp=revenue-cos;
      out.push({ym:`${y}-${pad(m)}`,year:y,month:m,startLocations:start,newLocations:add,churned,locations:L,price,
        mrr:L*price,arr:L*price*12,revenue,cos,grossProfit:gp,opex:Object.assign({},opex),opexTotal,opIncome:gp-opexTotal});
    }
  });
  return out;
}
function planYearSummary(model){
  const by={};
  model.forEach(r=>{
    const y=by[r.year]||(by[r.year]={year:r.year,revenue:0,cos:0,grossProfit:0,opex:{},opexTotal:0,opIncome:0,newLocations:0,churned:0});
    y.revenue+=r.revenue;y.cos+=r.cos;y.grossProfit+=r.grossProfit;y.opexTotal+=r.opexTotal;y.opIncome+=r.opIncome;y.newLocations+=r.newLocations;y.churned+=r.churned;
    Object.keys(r.opex).forEach(k=>{y.opex[k]=(y.opex[k]||0)+r.opex[k];});
    y.endLocations=r.locations;y.endMrr=r.mrr;y.endArr=r.arr;
  });
  return Object.values(by).sort((a,b)=>a.year-b.year).map(y=>Object.assign(y,{grossMargin:y.revenue?y.grossProfit/y.revenue:0,opMargin:y.revenue?y.opIncome/y.revenue:0}));
}

/* ---------- charts: SVG drawn at the slot's real width (dataviz marks: <=24px bars, 4px rounded data ends, 2px lines) ---------- */
const chartSpecs=new Map();let chartSeq=0;
function chartSlot(kind,o){const id='c'+(++chartSeq);chartSpecs.set(id,{kind,o:o||{}});return `<div class="chart-slot" data-chart="${id}" style="min-height:${(o&&o.height)||220}px"></div>`;}
function drawCharts(root){
  root.querySelectorAll('[data-chart]').forEach(el=>{
    const spec=chartSpecs.get(el.dataset.chart);if(!spec)return;
    const w=Math.max(260,Math.round(el.clientWidth||640));
    try{el.innerHTML=spec.kind==='line'?drawLine(spec.o,w):drawBars(spec.o,w);el.style.minHeight='';}catch(err){console.error(err);el.textContent='Chart unavailable.';}
  });
}
function niceStep(span){if(!(span>0))return 1;const raw=span/4,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function yScale(vals){
  let lo=Math.min(0,...vals),hi=Math.max(0,...vals);if(lo===hi)hi=lo+1;
  const st=niceStep(hi-lo);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
  const ticks=[];for(let v=lo;v<=hi+st/2;v+=st)ticks.push(Math.round(v*1e6)/1e6);
  return {lo,hi,ticks};
}
function barPath(x,y0,y1,w){
  const h=Math.abs(y1-y0);if(h<0.5)return '';const r=Math.min(4,w/2,h);
  return y1<y0
    ?`M${x},${y0}V${y1+r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1+r}V${y0}Z`
    :`M${x},${y0}V${y1-r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1-r}V${y0}Z`;
}
function chartLegend(series){
  if(series.length<2)return '';
  return `<div class="viz-legend">${series.map(s=>`<span><i class="${s.dashed?'dash':s.line?'line':''}" style="${s.dashed?'':`background:${s.color||'var(--viz-1)'}`}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
/* Wrap a category label onto at most two lines of maxCh characters (an ellipsis marks anything cut). */
function wrapLabel(lab,maxCh){
  lab=String(lab==null?'':lab);if(lab.length<=maxCh)return [lab];
  const lines=[''];
  lab.split(' ').forEach(w=>{const cur=lines[lines.length-1],next=cur?cur+' '+w:w;if(next.length<=maxCh||!cur)lines[lines.length-1]=next;else lines.push(w);});
  const out=lines.slice(0,2);if(lines.length>2)out[1]+='…';
  return out.map(l=>l.length>maxCh?l.slice(0,Math.max(1,maxCh-1))+'…':l);
}
function chartFrame(o,series,W,labels){
  const H=o.height||220,ml=60,mr=16,mt=14,mb=o._mb||26,pw=W-ml-mr,ph=H-mt-mb,fmt=o.format||fmtCompact;
  const vals=[];series.forEach(s=>s.values.forEach(v=>{if(v!=null&&isFinite(v))vals.push(+v);}));
  if(o.refLine&&isFinite(o.refLine.value))vals.push(+o.refLine.value);
  const sc=yScale(vals.length?vals:[0]);const Y=v=>mt+ph-(v-sc.lo)/(sc.hi-sc.lo)*ph;
  let g='';sc.ticks.forEach(t=>{const y=Y(t).toFixed(1);g+=`<line class="${t===0?'base-line':'grid-line'}" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text x="${ml-8}" y="${(+y+4).toFixed(1)}" text-anchor="end">${esc(fmt(t))}</text>`;});
  let ref='';if(o.refLine&&isFinite(o.refLine.value)){const y=Y(+o.refLine.value).toFixed(1);ref=`<line class="ref-line" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text x="${W-mr}" y="${(+y-5).toFixed(1)}" text-anchor="end">${esc(o.refLine.label||'')}</text>`;}
  const every=Math.max(1,Math.ceil(labels.length/Math.max(1,Math.floor(pw/58))));
  return {H,ml,mr,mt,mb,pw,ph,fmt,Y,g,ref,every};
}
function drawBars(o,W){
  const labels=o.labels||[],series=(o.series||[]).filter(s=>s&&Array.isArray(s.values));
  const maxCh=Math.max(4,Math.floor(((W-76)/Math.max(1,labels.length)-6)/6.6));
  const wrapped=labels.map(l=>wrapLabel(l,maxCh));const twoLines=wrapped.some(w=>w.length>1);
  const f=chartFrame(twoLines?Object.assign({},o,{_mb:40}):o,series,W,labels);const n=Math.max(1,labels.length),band=f.pw/n,k=Math.max(1,series.length);
  const bw=Math.max(2,Math.min(24,(band*0.72-(k-1)*2)/k)),groupW=bw*k+(k-1)*2;
  let marks='',hits='',xl='';
  labels.forEach((lab,i)=>{
    const x0=f.ml+band*i+(band-groupW)/2;
    series.forEach((s,j)=>{const v=s.values[i];if(v==null||!isFinite(v))return;const p=barPath(+(x0+j*(bw+2)).toFixed(1),+f.Y(0).toFixed(1),+f.Y(+v).toFixed(1),bw);if(p)marks+=`<path d="${p}" fill="${s.color||'var(--viz-1)'}"/>`;});
    const tip=[lab].concat(series.map(s=>`${s.name}: ${s.values[i]==null||!isFinite(s.values[i])?'—':f.fmt(s.values[i])}`)).join('\n');
    hits+=`<rect class="hit" x="${(f.ml+band*i).toFixed(1)}" y="${f.mt}" width="${band.toFixed(1)}" height="${f.ph}" data-tip="${esc(tip)}"/>`;
    if(i%f.every===0){const cx=(f.ml+band*i+band/2).toFixed(1),y0=f.mt+f.ph+16;xl+=`<text x="${cx}" y="${y0}" text-anchor="middle">${wrapped[i].map((ln,li)=>`<tspan x="${cx}" dy="${li?13:0}">${esc(ln)}</tspan>`).join('')}</text>`;}
  });
  return `<svg class="viz" viewBox="0 0 ${W} ${f.H}" width="${W}" height="${f.H}" role="img" aria-label="${esc(o.ariaLabel||o.title||'Bar chart')}">${f.g}${xl}${marks}${f.ref}${hits}</svg>${chartLegend(series)}`;
}
function drawLine(o,W){
  const labels=o.labels||[],series=(o.series||[]).filter(s=>s&&Array.isArray(s.values));
  const f=chartFrame(o,series,W,labels);const n=labels.length;const X=i=>f.ml+(n<=1?f.pw/2:f.pw*i/(n-1));
  let lines='',ends='',hits='',xl='';
  series.forEach(s=>{
    let d='',pen=false,last=null;
    s.values.forEach((v,i)=>{if(v==null||!isFinite(v)){pen=false;return;}d+=`${pen?'L':'M'}${X(i).toFixed(1)},${f.Y(+v).toFixed(1)}`;pen=true;last=i;});
    if(d)lines+=`<path d="${d}" fill="none" stroke="${s.color||'var(--viz-1)'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dashed?' stroke-dasharray="5 4"':''}/>`;
    if(last!=null&&!s.dashed)ends+=`<circle cx="${X(last).toFixed(1)}" cy="${f.Y(+s.values[last]).toFixed(1)}" r="4" fill="${s.color||'var(--viz-1)'}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  const bandW=n<=1?f.pw:f.pw/(n-1);
  labels.forEach((lab,i)=>{
    const tip=[lab].concat(series.map(s=>`${s.name}: ${s.values[i]==null||!isFinite(s.values[i])?'—':f.fmt(s.values[i])}`)).join('\n');
    const x=Math.max(f.ml,X(i)-bandW/2),w=Math.min(bandW,f.ml+f.pw-x);
    hits+=`<rect class="hit" x="${x.toFixed(1)}" y="${f.mt}" width="${Math.max(1,w).toFixed(1)}" height="${f.ph}" data-tip="${esc(tip)}"/>`;
    if(i%f.every===0)xl+=`<text x="${X(i).toFixed(1)}" y="${f.H-8}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return `<svg class="viz" viewBox="0 0 ${W} ${f.H}" width="${W}" height="${f.H}" role="img" aria-label="${esc(o.ariaLabel||o.title||'Line chart')}">${f.g}${xl}${lines}${f.ref}${ends}${hits}</svg>${chartLegend(series)}`;
}

  renderNav();buildNewMenu();
}
function renderNav(){
  let html='',grp=null;
  VIEWS.forEach(v=>{
    if(v.group!==grp){grp=v.group;html+=`<div class="nav-group">${esc(grp)}</div>`;}
    html+=`<a class="nav-link" href="#${esc(v.id)}" data-tab="${esc(v.id)}">${esc(v.label)}<span class="tab-badge" data-badge="${esc(v.id)}" hidden></span></a>`;
  });
  $('#sidenav').innerHTML=html;
}
function buildNewMenu(){
  let html=['deal','contact','company','task'].map(k=>`<button type="button" role="menuitem" data-act="new" data-kind="${k}">${LABEL[k]}</button>`).join('');
  VIEWS.forEach(v=>{if(MODS[v.id]&&Array.isArray(v.newItems))v.newItems.forEach(it=>{html+=`<button type="button" role="menuitem" data-act="mod" data-mod="${esc(v.id)}" data-a="${esc(it.a||'new')}">${esc(it.label)}</button>`;});});
  $('#new-menu').innerHTML=html;
}
function modInput(e){
  const t=e.target.closest&&e.target.closest('[data-mod-input]');if(!t)return;
  const m=MODS[t.dataset.modInput];if(m&&m.onInput){try{m.onInput(t.dataset.key,t,e);}catch(err){console.error(err);}}
}

/* ---------- events ---------- */
document.addEventListener('input',modInput);
document.addEventListener('change',modInput);
const tipEl=$('#viz-tip');
function placeTip(e){const r=tipEl.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;tipEl.style.left=Math.max(4,x)+'px';tipEl.style.top=Math.max(4,y)+'px';}
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tipEl.hidden=true;return;}tipEl.textContent=t.getAttribute('data-tip');tipEl.hidden=false;placeTip(e);});
document.addEventListener('mousemove',e=>{if(!tipEl.hidden)placeTip(e);});
window.addEventListener('scroll',()=>{tipEl.hidden=true;},{passive:true});
document.addEventListener('click',e=>{
  if(!e.target.closest('#new-wrap'))closeMenu();
  const a=e.target.closest('[data-act]');
  if(a){
    const d=a.dataset,inDrawer=!!a.closest('#drawer');
    switch(d.act){
      case 'toggle-menu':{const m=$('#new-menu');m.hidden=!m.hidden;a.setAttribute('aria-expanded',String(!m.hidden));if(!m.hidden)m.querySelector('button').focus();break;}
      case 'new':openForm(d.kind,null,{companyId:d.company||null,contactId:d.contact||null,stage:d.stage||'lead',dealId:d.deal||null});break;
      case 'edit':openForm(d.kind,d.id);break;
      case 'delete':closeModal();confirmDelete(d.kind,d.id);break;
      case 'del-activity':{const r=S.data.activities.get(d.id);if(r)openConfirm('Delete this '+(ACT[r.type]||'note').toLowerCase()+'?','This can’t be undone.','Delete',async()=>{if(await remove('activities',d.id))toast('Deleted');});break;}
      case 'open':openDrawer(d.kind,d.id,inDrawer);break;
      case 'stage':moveDeal(d.id,d.stage);break;
      case 'mine':S.mine=d.v==='1';render();break;
      case 'sort':{const s=S.sort[d.view];if(s[0]===d.key)s[1]*=-1;else{s[0]=d.key;s[1]=(d.key==='last'||d.key==='value'||d.key==='open'||d.key==='won'||d.key==='people')?-1:1;}render();break;}
      case 'export':exportCSV();break;
      case 'clear-samples':confirmClearSamples();break;
      case 'show-done':S.showDone=!S.showDone;render();break;
      case 'close-drawer':closeDrawer();break;
      case 'back-drawer':backDrawer();break;
      case 'close-modal':closeModal();break;
      case 'copy':copy(d.copy,a);break;
      case 'go':location.hash=d.view;break;
      case 'mod':{
        closeMenu();const m=MODS[d.mod];
        if(m&&m.onAction){try{m.onAction(d.a,d,a,e);}catch(err){console.error(err);toast(`Something went wrong in ${m.label}.`,'bad');}}
        break;
      }
    }
    return;
  }
  const o=e.target.closest('[data-open]');
  if(o)openDrawer(o.dataset.open,o.dataset.id,!!o.closest('#drawer'));
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-toggle-task]');
  if(t)toggleTask(t.dataset.toggleTask,t.checked);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('#modal').hidden){closeModal();return;}
    if(!$('#new-menu').hidden){closeMenu();$('#new-btn').focus();return;}
    if(S.drawer){closeDrawer();return;}
  }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-open]')){e.preventDefault();openDrawer(e.target.dataset.open,e.target.dataset.id,false);}
  if(e.key==='/'&&!e.target.closest('input,textarea,select')&&$('#modal').hidden){e.preventDefault();$('#q').focus();}
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;scheduleRender();});
window.addEventListener('hashchange',()=>{route();S.q=S.q;render();window.scrollTo(0,0);});

const main=$('#main');
main.addEventListener('dragstart',e=>{
  const c=e.target.closest&&e.target.closest('.card[data-id]');if(!c||!S.canWrite)return;
  S.dragging=c.dataset.id;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',c.dataset.id);}catch(x){}
  requestAnimationFrame(()=>c.classList.add('dragging'));
});
main.addEventListener('dragend',()=>{
  S.dragging=null;
  main.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
  main.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));
  if(S.pendingRender){S.pendingRender=false;scheduleRender();}
});
main.addEventListener('dragover',e=>{
  const z=e.target.closest&&e.target.closest('[data-drop]');if(!z||!S.dragging)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  if(!z.classList.contains('over')){main.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));z.classList.add('over');}
});
main.addEventListener('dragleave',e=>{
  const z=e.target.closest&&e.target.closest('[data-drop]');
  if(z&&!z.contains(e.relatedTarget))z.classList.remove('over');
});
main.addEventListener('drop',e=>{
  const z=e.target.closest&&e.target.closest('[data-drop]');if(!z||!S.dragging)return;
  e.preventDefault();const id=S.dragging;z.classList.remove('over');
  S.dragging=null;S.pendingRender=true;
  moveDeal(id,z.dataset.drop);
});

boot();
})();
</script>
