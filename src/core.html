<title>Dealbook CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar with view tabs; Pipeline is a horizontally scrolling board of stage columns under a summary strip; any record opens in a right-hand drawer with its activity log. */
:root{
  --bg:#F1F4F5; --surface:#FFFFFF; --surface-2:#E8EEF0; --line:#D4DDE0; --line-strong:#B5C3C8;
  --fg:#12232A; --muted:#566A71; --faint:#86979D;
  --accent:#155E75; --accent-hover:#0E4C5F; --accent-fg:#FFFFFF; --accent-soft:#DAEAF0;
  --good:#2B7845; --good-soft:#DDEFE3; --warn:#94580A; --warn-soft:#F8EAD2; --bad:#B0372B; --bad-soft:#F6DFDB; --on-bad:#FFFFFF;
  --s-lead:#A3C6D0; --s-qualified:#64A0B2; --s-proposal:#2F7D94; --s-pilot:#155E75; --s-won:#2B7845; --s-lost:#9AA7AB;
  --viz-1:#2a78d6; --viz-2:#eb6834; --viz-3:#1baf7a; --viz-plan:#7c8d93;
  --scrim:rgba(10,22,27,.40);
  --shadow:0 1px 2px rgba(18,35,42,.06),0 8px 24px rgba(18,35,42,.08);
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-sm:6px; --r-md:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1417; --surface:#141D21; --surface-2:#1B262B; --line:#27353B; --line-strong:#3A4C53;
    --fg:#E3ECEE; --muted:#93A5AB; --faint:#677A80;
    --accent:#5BB8CD; --accent-hover:#7CC9DA; --accent-fg:#06232A; --accent-soft:#16363F;
    --good:#62C283; --good-soft:#15301E; --warn:#E3A853; --warn-soft:#382812; --bad:#F07F72; --bad-soft:#3B1815; --on-bad:#2A0B08;
    --s-lead:#36606B; --s-qualified:#468799; --s-proposal:#5AAAC0; --s-pilot:#8AD2E2; --s-won:#62C283; --s-lost:#5C6C71;
    --viz-1:#3987e5; --viz-2:#d95926; --viz-3:#199e70; --viz-plan:#7d8f95;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1417; --surface:#141D21; --surface-2:#1B262B; --line:#27353B; --line-strong:#3A4C53;
  --fg:#E3ECEE; --muted:#93A5AB; --faint:#677A80;
  --accent:#5BB8CD; --accent-hover:#7CC9DA; --accent-fg:#06232A; --accent-soft:#16363F;
  --good:#62C283; --good-soft:#15301E; --warn:#E3A853; --warn-soft:#382812; --bad:#F07F72; --bad-soft:#3B1815; --on-bad:#2A0B08;
  --s-lead:#36606B; --s-qualified:#468799; --s-proposal:#5AAAC0; --s-pilot:#8AD2E2; --s-won:#62C283; --s-lost:#5C6C71;
  --viz-1:#3987e5; --viz-2:#d95926; --viz-3:#199e70; --viz-plan:#7d8f95;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1640px;margin-inline:auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{text-wrap:balance}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:10px 22px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font:700 20px/1 var(--f-display);letter-spacing:-.015em;color:var(--fg);text-decoration:none}
.ws-chip{font:600 12px/1 var(--f-body);letter-spacing:0;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:5px 9px;white-space:nowrap}
@media (max-width:520px){.ws-chip{display:none}}
/* Shell: sticky top bar, grouped side navigation, content column */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);gap:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1760px;margin-inline:auto}
.sidenav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);align-self:start;max-height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow-y:auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.nav-group{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:16px 10px 6px}
.nav-group:first-child{padding-top:4px}
.nav-link{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.nav-link:hover{background:var(--surface-2);color:var(--fg)}
.nav-link[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-link .tab-badge{margin-left:auto}
.content{min-width:0;padding-bottom:40px}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .sidenav{position:static;max-height:none;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;padding-block:8px;gap:4px;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
  .nav-group{padding:0 4px 0 12px;margin-left:6px;border-left:1px solid var(--line);white-space:nowrap}
  .nav-group:first-child{padding-left:0;margin-left:0;border-left:0}
  .nav-link{padding:6px 10px}
}

/* Shared building blocks for tab modules */
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:minmax(0,1fr)}}
.section{margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;margin:0 0 12px}
.panel-h h2{font:600 15px/1.3 var(--f-body);margin:0}
.panel-h .sub{font-size:12.5px;color:var(--muted)}
.panel-h .spacer{flex:1}
.stat-list{display:grid;gap:8px;margin:0}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.stat-row dt{color:var(--muted)}
.stat-row dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.stat-row.total{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progress>span{display:block;height:100%;border-radius:4px;background:var(--accent)}
.progress.good>span{background:var(--good)}
.progress.warn>span{background:var(--warn)}
.progress.bad>span{background:var(--bad)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--good)}
.neg{color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0;max-width:72ch}
.source{font-size:12px;color:var(--faint)}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.table-wrap.flat{margin-bottom:0}
table.compact{min-width:560px}
table.compact td,table.compact th{padding:8px 12px}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.kpi-value.good{color:var(--good)}
.kpi-value.warn{color:var(--warn)}

/* Charts (palette: the dataviz skill's validated categorical slots 1-3) */
.viz{display:block;width:100%;height:auto;overflow:visible}
.viz text{font:500 11px var(--f-mono);fill:var(--muted)}
.viz .grid-line{stroke:var(--line);stroke-width:1}
.viz .base-line{stroke:var(--line-strong);stroke-width:1}
.viz .ref-line{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 4}
.viz .hit{fill:transparent}
.viz .hit:hover{fill:var(--fg);fill-opacity:.04}
.viz-legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.viz-legend span{display:inline-flex;align-items:center;gap:6px}
.viz-legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.viz-legend i.line{width:16px;height:2px;border-radius:1px}
.viz-legend i.dash{width:16px;height:2px;background:repeating-linear-gradient(90deg,var(--viz-plan) 0 4px,transparent 4px 7px)!important}
.viz-tip{position:fixed;z-index:80;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;line-height:1.45;padding:7px 10px;border-radius:6px;box-shadow:var(--shadow);max-width:280px;white-space:pre-line;font-variant-numeric:tabular-nums}
.tab-badge{font:500 11px/1 var(--f-mono);padding:3px 6px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tab-badge.hot{background:var(--bad-soft);color:var(--bad)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.search{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-sm);padding:0 10px;height:36px;width:280px;max-width:100%;min-width:0;color:var(--muted)}
.search:focus-within{border-color:var(--accent);background:var(--surface)}
.search input{border:0;background:none;font:inherit;font-size:14.5px;color:var(--fg);width:100%;min-width:0;outline:none;height:100%}
.ro-chip{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.new-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);padding:6px;min-width:190px;display:grid;z-index:25}
.menu button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:var(--r-sm);padding:8px 10px;font:inherit;font-size:14.5px;color:var(--fg);cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--surface-2)}
.menu kbd{margin-left:auto;font:500 11px var(--f-mono);color:var(--faint)}
@media (max-width:820px){
  .top-actions{flex:1 1 0}
  .search{flex:1 1 auto;width:auto}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:14px;line-height:1.2;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-danger{color:var(--bad)}
.btn-danger-solid{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn-danger-solid:hover{background:var(--bad);filter:brightness(1.08)}
.btn-sm{padding:5px 10px;font-size:13px}
.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-align:left;text-decoration:none}
.link:hover{text-decoration:underline}
.icon-btn{display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-sm);border:0;background:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}

/* Notices */
#notice{display:grid;gap:8px}
#notice:not(:empty){padding-top:14px}
.notice{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r-md);background:var(--accent-soft);font-size:14px}
.notice.warn{background:var(--warn-soft)}
.notice .spacer{flex:1}

/* Toolbar + KPIs */
.toolbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-block:20px 14px}
.view-title{font:700 26px/1.1 var(--f-display);letter-spacing:-.02em;margin:0}
.view-count{font:500 13px var(--f-mono);color:var(--muted)}
.toolbar .spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:6px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px 13px;min-width:0}
.kpi-label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi-value{font:500 27px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-top:6px;overflow-wrap:anywhere}
.kpi-value.bad{color:var(--bad)}
.kpi-unit{font:600 14px var(--f-body);letter-spacing:0;color:var(--muted)}
.kpi-sub{font-size:13px;color:var(--muted);margin-top:3px}
.stackbar{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2);margin:9px 0 2px}
.stackbar span{flex-basis:0;min-width:4px}
@media (max-width:480px){.kpi{padding:12px}.kpi-value{font-size:21px}}

/* Board */
.board-scroll{overflow-x:auto;padding-bottom:6px;scrollbar-color:var(--line-strong) transparent}
.board{display:grid;grid-template-columns:repeat(4,minmax(236px,1fr)) repeat(2,minmax(204px,.82fr));gap:12px;min-width:min-content;padding-bottom:18px}
.col{background:var(--surface-2);border-radius:var(--r-md);display:flex;flex-direction:column;min-width:0;min-height:340px;transition:box-shadow .12s}
.col.over{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.col-head{display:flex;align-items:center;gap:8px;padding:12px 12px 0}
.col-head h2{font:600 14.5px/1.2 var(--f-body);margin:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--stage);flex:none}
.col-count{font:500 11.5px/1 var(--f-mono);color:var(--muted);background:var(--surface);border-radius:999px;padding:3px 7px}
.col-p{margin-left:auto;font:500 11.5px var(--f-mono);color:var(--faint)}
.col-sum{display:flex;align-items:baseline;gap:8px;padding:3px 12px 10px;font-variant-numeric:tabular-nums}
.col-sum .money{font:500 15px var(--f-mono)}
.col-sum .wt{font-size:12px;color:var(--muted)}
.col-body{flex:1;display:flex;flex-direction:column;gap:8px;padding:0 8px 8px}
.col-empty{border:1px dashed var(--line-strong);border-radius:8px;padding:18px 10px;text-align:center;font-size:13px;color:var(--faint)}
.col-more{font-size:12.5px;color:var(--muted);text-align:center;padding:4px}
.col-add{margin:0 8px 8px;justify-content:flex-start;background:transparent;border-color:transparent;color:var(--muted);font-weight:600}
.col-add:hover{background:var(--surface);color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px 11px;cursor:pointer;display:grid;gap:3px}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.45}
.card-co{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{font:600 14.5px/1.3 var(--f-body);margin:0 0 4px;overflow-wrap:anywhere}
.card-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.card-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}
.card-meta .money{font:500 13.5px var(--f-mono);color:var(--fg)}
.card-meta .when{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card-meta .av{margin-left:auto}

/* Chips + avatars */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;line-height:1.3;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-bad{background:var(--bad-soft);color:var(--bad)}
.chip-good{background:var(--good-soft);color:var(--good)}
.chip-accent{background:var(--accent-soft);color:var(--accent)}
.av{display:inline-grid;place-items:center;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 10px/1 var(--f-body);object-fit:cover}
.av-sm{width:22px;height:22px}
.av-md{width:30px;height:30px;font-size:11.5px}
.av-none{background:var(--surface-2);color:var(--faint)}
.person{display:inline-flex;align-items:center;gap:7px;min-width:0}

/* Tables */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:28px}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px}
th button:hover{color:var(--fg)}
th.num,td.num{text-align:right}
th.num button{flex-direction:row-reverse}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover{background:var(--surface-2)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell-main{font-weight:600}
.cell-sub{font-size:12.5px;color:var(--muted)}
.namecell{display:flex;align-items:center;gap:10px;min-width:0}
.trunc{max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Tasks */
.groups{display:grid;gap:22px;margin-bottom:32px;max-width:980px}
.group-h{display:flex;align-items:center;gap:8px;font:600 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.group-h .n{font:500 11.5px var(--f-mono);background:var(--surface-2);padding:2px 7px;border-radius:999px;letter-spacing:0}
.group-h.bad{color:var(--bad)}
.task-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.task-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.task-row:last-child{border-bottom:0}
.task-row input[type="checkbox"],.tl-task input{width:18px;height:18px;accent-color:var(--accent);margin:0;cursor:pointer}
.task-subj{font-weight:600;color:var(--fg);background:none;border:0;padding:0;font:inherit;font-weight:600;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.task-subj:hover{color:var(--accent)}

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const STAGES=[
  {id:'lead',name:'Lead',p:.10,c:'--s-lead'},
  {id:'qualified',name:'Qualified',p:.25,c:'--s-qualified'},
  {id:'proposal',name:'Proposal',p:.50,c:'--s-proposal'},
  {id:'pilot',name:'Pilot',p:.75,c:'--s-pilot'},
  {id:'won',name:'Won',p:1,c:'--s-won'},
  {id:'lost',name:'Lost',p:0,c:'--s-lost'}
];
const STAGE=Object.fromEntries(STAGES.map(s=>[s.id,s]));
const OPEN=['lead','qualified','proposal','pilot'];
const COLS=['companies','contacts','deals','activities','settings'];
const COLL={deal:'deals',contact:'contacts',company:'companies',task:'activities'};
const LABEL={deal:'Deal',contact:'Contact',company:'Company',task:'Task'};
const ACT={note:'Note',call:'Call',email:'Email',meeting:'Meeting',task:'Task',stage:'Stage change'};
const SIZES=['1–10','11–50','51–200','201–1,000','1,000+'];
const STALE_DAYS=14;
/* Valint's plan, from "Valient AI — Three-Year Financial Projections" (Oct 30, 2026, base case).
   These are defaults; the Assumptions tab saves overrides to the settings/plan document.
   A deal's ARR = locations x monthly price for the year its contract starts x 12. Setup fees are one-time and stay out of ARR. */
const PLAN_DEFAULTS={
  source:'Valient AI — Three-Year Financial Projections (Oct 30, 2026), base case',
  prices:{2027:399,2028:429,2029:449},
  setupFee:750,pilotFee:250,pilots:3,
  newPerMonth:{2027:[2,6],2028:[8,14],2029:[18,30]},
  churn:{base:0.03,conservative:0.04,upside:0.025},
  newMultiplier:{base:1,conservative:0.5,upside:1.5},
  costOfService:{2027:0.18,2028:0.16,2029:0.15},
  opex:{
    payroll:{2027:36000,2028:160000,2029:480000},
    sales:{2027:22000,2028:70000,2029:180000},
    software:{2027:8000,2028:18000,2029:40000},
    ga:{2027:10500,2028:25400,2029:70000}
  },
  team:{2027:1,2028:3,2029:6},
  cac:{2027:478,2028:947,2029:1042},
  hireSalesAtArr:250000,
  startupCosts:3500,
  targets:[
    {date:'2027-06-30',label:'Mid-2027',locations:25},
    {date:'2027-12-31',label:'End of 2027',locations:42,arr:203000,revenue:103000,opIncome:8000},
    {date:'2028-12-31',label:'End of 2028',locations:144,arr:742000,revenue:479000,opIncome:129000},
    {date:'2029-12-31',label:'End of 2029',locations:350,arr:1883000,revenue:1327000,opIncome:358000}
  ],
  scenarios2029:{
    conservative:{locations:161,arr:865000,revenue:615000},
    base:{locations:350,arr:1883000,revenue:1327000},
    upside:{locations:548,arr:2952000,revenue:2072000}
  }
};
const OPEX_LABELS={payroll:'Payroll',sales:'Sales & marketing',software:'Software & tools',ga:'General & admin'};
/* Expense categories match the plan's income statement lines: cost of service plus the four operating-expense lines. */
const EXPENSE_CATEGORIES=[{id:'cos',label:'Cost of service'},{id:'payroll',label:'Payroll'},{id:'sales',label:'Sales & marketing'},{id:'software',label:'Software & tools'},{id:'ga',label:'General & admin'}];
const FIN_DEFAULTS={openingCash:3500,openingDate:'2026-11-01'};
let planCache=null,planSrc;
function plan(){
  const s=(S.data.settings&&S.data.settings.get('plan'))||null;
  if(planCache&&s===planSrc)return planCache;
  const out={};
  for(const k of Object.keys(PLAN_DEFAULTS)){
    const d=PLAN_DEFAULTS[k],v=s?s[k]:null;
    if(v==null)out[k]=d;
    else if(d&&typeof d==='object'&&!Array.isArray(d)&&v&&typeof v==='object'&&!Array.isArray(v))out[k]=Object.assign({},d,v);
    else out[k]=v;
  }
  planSrc=s;planCache=out;return out;
}
function planYears(){return Object.keys(plan().prices).map(Number).filter(n=>isFinite(n)).sort((a,b)=>a-b);}
function priceFor(dateStr){
  const ys=planYears();if(!ys.length)return 0;
  const y=parseInt(String(dateStr||'').slice(0,4),10)||new Date().getFullYear();
  return num(plan().prices[Math.min(Math.max(y,ys[0]),ys[ys.length-1])]);
}
function setupFee(){return num(plan().setupFee);}
function planTarget(){
  const ts=plan().targets||[];
  const t=ts.find(x=>x.date==='2027-12-31')||ts.find(x=>x.arr)||{date:'2027-12-31',label:'End of 2027',locations:42,arr:203000};
  return {end:t.date,label:String(t.label||'').replace(/^./,c=>c.toLowerCase()),locations:num(t.locations),arr:num(t.arr)};
}
const locs=d=>Math.max(1,Math.round(Number(d&&d.locations)||1));
const autoArr=(n,dateStr)=>Math.max(1,Math.round(Number(n)||1))*priceFor(dateStr)*12;
/* A deal saved before per-location pricing has no locations field: it is not counted in location totals. */
const priced=d=>!!d&&d.locations!=null&&d.locations!=='';
const pricedLocs=d=>priced(d)?locs(d):0;
/* Effective price per location per month, so locations x price x 12 always equals the ARR shown. */
const effPrice=d=>Math.round(Number(d.value||0)/(locs(d)*12)*100)/100;
const fmtPrice=n=>Number.isInteger(n)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n):new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const ICON={
  note:'<svg viewBox="0 0 17 17"><path d="M4 2.5h6l3 3v9H4z"/><path d="M10 2.5v3h3M6.5 9h4M6.5 11.5h3"/></svg>',
  call:'<svg viewBox="0 0 17 17"><path d="M5 2.5h2.2l1 3.2-1.6 1.1a8.5 8.5 0 0 0 3.6 3.6l1.1-1.6 3.2 1v2.2a1.5 1.5 0 0 1-1.6 1.5A11.5 11.5 0 0 1 3.5 4.1 1.5 1.5 0 0 1 5 2.5z"/></svg>',
  email:'<svg viewBox="0 0 17 17"><rect x="2.5" y="4" width="12" height="9" rx="1.5"/><path d="M3 5.2l5.5 4.3L14 5.2"/></svg>',
  meeting:'<svg viewBox="0 0 17 17"><rect x="2.5" y="3.5" width="12" height="11" rx="1.5"/><path d="M2.5 7h12M6 2v3M11 2v3"/></svg>',
  task:'<svg viewBox="0 0 17 17"><rect x="2.5" y="2.5" width="12" height="12" rx="2.5"/><path d="M5.6 8.6l2 2 3.9-4.3"/></svg>',
  stage:'<svg viewBox="0 0 17 17"><path d="M3 8.5h10M9.5 5l3.5 3.5L9.5 12"/></svg>'
};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=Number(v);return isFinite(n)?n:0;};
const sum=(arr,f)=>arr.reduce((a,x)=>a+f(x),0);
const moneyFmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
const compactFmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',notation:'compact',maximumFractionDigits:1});
const fmtMoney=n=>moneyFmt.format(num(n));
const fmtCompact=n=>Math.abs(num(n))<10000?fmtMoney(n):compactFmt.format(num(n));
/* fmtPct(0.034) -> "3.4%"; fmtNum(1234.5,1) -> "1,234.5" */
const fmtPct=(x,d)=>`${new Intl.NumberFormat('en-US',{maximumFractionDigits:d==null?1:d}).format(num(x)*100)}%`;
const fmtNum=(n,d)=>new Intl.NumberFormat('en-US',{maximumFractionDigits:d==null?0:d}).format(num(n));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>ymd(new Date());
const parseYmd=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const fmtDate=s=>{const d=parseYmd(s);if(!d)return '';const o={month:'short',day:'numeric'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString('en-US',o);};
const fmtShort=s=>{const d=parseYmd(s);if(!d)return '';const t=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});return d.getFullYear()===new Date().getFullYear()?t:t+' ’'+String(d.getFullYear()).slice(2);};
const isoToYmd=s=>{const t=Date.parse(s);return isNaN(t)?'':ymd(new Date(t));};
const iso=()=>new Date().toISOString();
const daysSince=s=>{const t=Date.parse(s);if(!s||isNaN(t))return null;return Math.max(0,Math.floor((Date.now()-t)/864e5));};
const relTime=s=>{const t=Date.parse(s);if(isNaN(t))return '';const x=(Date.now()-t)/1000;if(x<60)return 'just now';if(x<3600)return Math.floor(x/60)+'m ago';if(x<86400)return Math.floor(x/3600)+'h ago';if(x<604800)return Math.floor(x/86400)+'d ago';return fmtDate(ymd(new Date(t)));};
const norm=s=>String(s||'').toLowerCase();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const initials=n=>String(n||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';

/* ---------- state ---------- */
const S={
  db:null,user:null,downloads:null,me:null,
  canWrite:true,canWriteUnknown:false,status:'connecting',
  data:{companies:new Map(),contacts:new Map(),deals:new Map(),activities:new Map(),settings:new Map()},
  loaded:{companies:false,contacts:false,deals:false,activities:false,settings:false},
  view:'overview',q:'',mine:false,showDone:false,
  sort:{contacts:['name',1],companies:['name',1]},
  drawer:null,dstack:[],lastFocus:null,ctype:'note',
  profiles:{},dragging:null,pendingRender:false
};
const all=k=>S.data[k]?[...S.data[k].values()]:[];
/* A won deal with a churnedAt on or before today is a former customer: it no longer counts as signed. */
const isChurned=d=>!!(d&&d.churnedAt&&d.churnedAt<=todayStr());
const company=id=>id?S.data.companies.get(id)||null:null;
const contact=id=>id?S.data.contacts.get(id)||null:null;
const deal=id=>id?S.data.deals.get(id)||null:null;
const contactName=c=>c?([c.firstName,c.lastName].filter(Boolean).join(' ')||c.email||'Unnamed contact'):'';
const isOpen=d=>OPEN.includes(d.stage)||!STAGE[d.stage];
const stageOf=d=>STAGE[d.stage]||STAGE.lead;
const lastTouch=d=>d.lastActivityAt||d.stageChangedAt||d.updatedAt||d.createdAt;
const allLoaded=()=>COLS.every(c=>S.loaded[c]);
const isLoading=()=>!allLoaded()&&(S.status==='connecting'||S.status==='slow');
const hasSamples=()=>COLS.some(c=>all(c).some(r=>r.sample));
const tasks=()=>all('activities').filter(a=>a.type==='task');
const matches=(...f)=>{const q=norm(S.q).trim();if(!q)return true;return f.some(x=>norm(x).includes(q));};
const closedTime=d=>{const t=d.closedAt?Date.parse(d.closedAt):NaN;if(!isNaN(t))return t;const cd=parseYmd(d.closeDate);return cd?cd.getTime():NaN;};

function personName(id){
  if(!id)return 'Unassigned';
  const p=S.profiles[id];
  if(S.me&&S.me.id===id)return (p&&p.name)||S.me.name||'You';
  return (p&&p.name)||'Teammate';
}
function avatar(id,size){
  size=size||'sm';
  if(!id)return `<span class="av av-${size} av-none" title="Unassigned">–</span>`;
  const p=S.profiles[id];const n=personName(id);
  const url=(p&&p.avatarUrl)||(S.me&&S.me.id===id&&S.me.avatarUrl)||'';
  if(url)return `<img class="av av-${size}" src="${esc(url)}" alt="" title="${esc(n)}">`;
  return `<span class="av av-${size}" title="${esc(n)}">${esc(initials(n))}</span>`;
}
const person=id=>`<span class="person">${avatar(id)}<span>${esc(personName(id))}</span></span>`;

/* ---------- capabilities ---------- */
function use(name){
  try{if(window.claude&&typeof window.claude.use==='function')return Promise.resolve(window.claude.use(name)).catch(()=>null);}catch(e){}
  return Promise.resolve(null);
}
async function boot(){
  registerViews();
  window.__dbDebug={S,MODS,VIEWS,VIEW_BY_ID,ctx};
  route();render();
  if(typeof ResizeObserver==='function'){let lastW=0;new ResizeObserver(()=>{const w=$('#main').clientWidth;if(Math.abs(w-lastW)>8){lastW=w;requestAnimationFrame(()=>drawCharts($('#main')));}}).observe($('#main'));}
  const [db,user,dl]=await Promise.all([use('db'),use('user'),use('downloads')]);
  S.user=user;S.downloads=dl;
  if(user){
    try{S.me=await user.me();}catch(e){}
    try{const c=await user.can('data.write');if(c===false)S.canWrite=false;else if(c==null)S.canWriteUnknown=true;}catch(e){S.canWriteUnknown=true;}
  }else S.canWriteUnknown=true;
  if(!db){S.status='nodb';S.canWrite=false;render();return;}
  S.db=db;subscribe();render();
}
function subscribe(){
  const timer=setTimeout(()=>{if(!allLoaded()&&S.status==='connecting'){S.status='slow';scheduleRender();}},10000);
  COLS.forEach(name=>{
    S.db.collection(name).onSnapshot(snap=>{
      const m=new Map();snap.docs.forEach(d=>{const v=d.data();if(!v)return;const r=Object.assign({},v,{id:d.id});if(r.stage==='negotiation')r.stage='pilot';m.set(d.id,r);});
      S.data[name]=m;
      if(!snap.metadata.fromCache)S.loaded[name]=true;
      if(allLoaded()&&S.status!=='error'){clearTimeout(timer);S.status='ok';}
      scheduleRender();
    },err=>{
      clearTimeout(timer);S.status='error';S.canWrite=false;scheduleRender();
    });
  });
}

/* ---------- writes ---------- */
async function write(fn){
  try{await fn();return true;}
  catch(e){
    let err=e;
    if(e&&e.code==='unavailable'){await sleep(300+Math.random()*600);try{await fn();return true;}catch(e2){err=e2;}}
    writeError(err);return false;
  }
}
function writeError(e){
  const code=e&&e.code;
  if(code==='invalid_argument'&&S.canWriteUnknown){S.canWrite=false;S.canWriteUnknown=false;closeModal();render();toast('You can view this CRM but not change it.','bad');return;}
  if(code==='quota_exceeded')toast('Storage is full. Delete old records, then try again.','bad');
  else if(code==='resource_exhausted')toast('Too many changes at once. Wait a moment, then try again.','bad');
  else if(code==='revoked'){S.canWrite=false;render();toast('Your access to this CRM changed.','bad');}
  else toast("That change didn't save. Check your connection and try again.",'bad');
}
async function create(coll,data){
  const ref=S.db.collection(coll).doc();
  const ok=await write(()=>ref.set(data));
  return ok?ref.id:null;
}
const patch=(coll,id,data)=>write(()=>S.db.doc(coll+'/'+id).update(data));
const remove=(coll,id)=>write(()=>S.db.doc(coll+'/'+id).delete());
const me=()=>(S.me&&S.me.id)||null;

/* A won deal bills from its close date. Marking a deal Won sets that date to today and keeps the
   old expected date in expectedCloseDate; moving it back out of Won puts the expected date back. */
function wonDates(d,stage){
  const was=!!d&&d.stage==='won';
  if(stage==='won'&&!was)return {closeDate:todayStr(),expectedCloseDate:(d&&d.closeDate)||null};
  if(stage!=='won'&&was&&d.expectedCloseDate!==undefined)return {closeDate:d.expectedCloseDate||null,expectedCloseDate:null};
  return {};
}
const closeLabel=s=>s==='won'?'Won on · billing starts':s==='lost'?'Close date':'Expected close';
async function moveDeal(id,stage){
  const d=deal(id);if(!d||d.stage===stage||!S.canWrite)return;
  const now=iso();
  const p=Object.assign({stage,stageChangedAt:now,updatedAt:now,lastActivityAt:now,closedAt:(stage==='won'||stage==='lost')?now:null},wonDates(d,stage));
  if(!(await patch('deals',id,p)))return;
  toast(stage==='won'?`${d.name||'Deal'} won. Billing starts today.`:`${d.name||'Deal'} moved to ${STAGE[stage].name}`);
  await create('activities',{type:'stage',subject:'Moved to '+STAGE[stage].name,body:'',dealId:id,contactId:d.contactId||null,companyId:d.companyId||null,ownerId:me(),createdBy:me(),createdAt:now});
}
async function toggleTask(id,done){
  if(!S.canWrite)return;
  await patch('activities',id,{done,doneAt:done?iso():null});
}

/* ---------- render ---------- */
let rq=false;
function scheduleRender(){
  if(S.dragging){S.pendingRender=true;return;}
  if(rq)return;rq=true;requestAnimationFrame(render);
}
function render(){
  rq=false;
  chrome();notices();
  const main=$('#main');
  const fid=document.activeElement&&document.activeElement.id;
  const bs=main.querySelector('.board-scroll');const sl=bs?bs.scrollLeft:0;
  const v=VIEW_BY_ID[S.view]||CORE_VIEWS[0];
  chartSpecs.clear();
  let html;
  try{html=v.render();}catch(err){console.error(err);html=uiEmpty({title:`${v.label} couldn’t load`,text:String(err&&err.message||err)});}
  main.innerHTML=html;
  drawCharts(main);
  if(v.afterRender){try{v.afterRender(main);}catch(err){console.error(err);}}
  const nb=main.querySelector('.board-scroll');if(nb)nb.scrollLeft=sl;
  if(fid&&main.querySelector('#'+CSS.escape(fid))&&document.activeElement===document.body){document.getElementById(fid).focus({preventScroll:true});}
  if(S.drawer)renderDrawer();
  refreshProfiles();
}
function chrome(){
  document.querySelectorAll('[data-tab]').forEach(a=>{if(a.dataset.tab===S.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  VIEWS.forEach(v=>{
    const b=document.querySelector(`[data-badge="${CSS.escape(v.id)}"]`);if(!b)return;
    let r=null;try{r=v.badge&&!isLoading()?v.badge():null;}catch(err){console.error(err);}
    b.hidden=!r;if(r){b.textContent=r.text;b.classList.toggle('hot',!!r.hot);b.title=r.title||'';}
  });
  $('#ro-chip').hidden=S.canWrite||S.status==='nodb';
  $('#new-wrap').hidden=!S.canWrite;
}
function notices(){
  const out=[];
  if(S.status==='nodb')out.push(`<div class="notice warn"><span><strong>Records can't load here.</strong> Open this CRM on claude.ai while signed in to see and add records.</span></div>`);
  else if(S.status==='slow')out.push(`<div class="notice warn"><span><strong>Can't reach your records yet.</strong> They'll appear here as soon as the connection returns.</span></div>`);
  else if(S.status==='error')out.push(`<div class="notice warn"><span><strong>Your records aren't available in this view.</strong> Reopen the CRM from claude.ai to keep working.</span></div>`);
  if(S.status==='ok'&&hasSamples()){
    out.push(`<div class="notice"><span><strong>You're looking at example records.</strong> Add your own deals and contacts, then clear the examples.</span>${S.canWrite?'<span class="spacer"></span><button class="btn btn-sm" type="button" data-act="clear-samples">Clear examples</button>':''}</div>`);
  }
  $('#notice').innerHTML=out.join('');
}

/* ---------- pipeline ---------- */
function kpis(list){
  const open=list.filter(isOpen);
  const won=list.filter(d=>d.stage==='won'&&!isChurned(d));
  const cut=Date.now()-90*864e5;
  const closed=list.filter(d=>(d.stage==='won'||d.stage==='lost')&&closedTime(d)>=cut);
  const won90=closed.filter(d=>d.stage==='won').length;
  const t=todayStr();
  const mine=a=>!S.mine||a.ownerId===me();
  const openTasks=tasks().filter(a=>!a.done&&a.dueAt&&mine(a));
  return {
    openCount:open.length,openVal:sum(open,d=>num(d.value)),openLocs:sum(open,pricedLocs),
    weighted:sum(open,d=>num(d.value)*stageOf(d).p),
    byStage:OPEN.map(id=>({id,v:sum(open.filter(d=>(STAGE[d.stage]?d.stage:'lead')===id),d=>num(d.value))})),
    wonArr:sum(won,d=>num(d.value)),
    winRate:closed.length?Math.round(won90/closed.length*100):null,
    overdue:openTasks.filter(a=>a.dueAt<t).length,today:openTasks.filter(a=>a.dueAt===t).length
  };
}
function viewPipeline(){
  const loading=isLoading();
  const scoped=all('deals').filter(d=>!S.mine||d.ownerId===me());
  const shown=scoped.filter(d=>matches(d.name,(company(d.companyId)||{}).name,contactName(contact(d.contactId))));
  const k=kpis(scoped);
  /* The plan's target is company-wide, so this tile ignores the My deals filter and counts only contracts starting by the target date. */
  const team=S.mine?kpis(all('deals')):k;
  const TARGET=planTarget();
  const tWon=all('deals').filter(d=>d.stage==='won'&&!isChurned(d)&&(d.closeDate||isoToYmd(d.closedAt)||'')<=TARGET.end);
  const tLocs=sum(tWon,pricedLocs);
  const dash=v=>loading?'—':v;
  const segs=k.byStage.filter(s=>s.v>0).map(s=>`<span style="flex-grow:${s.v};background:var(${STAGE[s.id].c})" title="${STAGE[s.id].name}: ${fmtMoney(s.v)}"></span>`).join('');
  const kp=`<section class="kpis" aria-label="Pipeline summary">
    <div class="kpi"><div class="kpi-label">Open pipeline · ARR</div><div class="kpi-value">${dash(fmtMoney(k.openVal))}</div>
      <div class="stackbar" role="img" aria-label="Open ARR by stage: ${esc(k.byStage.map(s=>STAGE[s.id].name+' '+fmtCompact(s.v)).join(', '))}">${segs}</div>
      <div class="kpi-sub">${dash(`${k.openCount} open deal${k.openCount===1?'':'s'} · ${k.openLocs} location${k.openLocs===1?'':'s'}`)}</div></div>
    <div class="kpi"><div class="kpi-label">Weighted forecast · ARR</div><div class="kpi-value">${dash(fmtMoney(k.weighted))}</div><div class="kpi-sub">Each deal's ARR × its stage probability</div></div>
    <div class="kpi"><div class="kpi-label">Signed ARR${S.mine?' · whole team':''}</div><div class="kpi-value">${dash(fmtMoney(team.wonArr))}</div>
      <div class="stackbar" role="img" aria-label="${tLocs} of ${TARGET.locations} locations signed toward the ${TARGET.label} goal">${tLocs?`<span style="flex-grow:${Math.min(tLocs,TARGET.locations)};background:var(--s-won)"></span>`:''}<span style="flex-grow:${Math.max(TARGET.locations-tLocs,0)};min-width:0"></span></div>
      <div class="kpi-sub">${loading?'—':`${tLocs} of ${TARGET.locations} locations signed · goal ${fmtCompact(TARGET.arr)} ARR by ${TARGET.label}${team.winRate!=null?` · ${team.winRate}% win rate (90 days)`:''}`}</div></div>
    <div class="kpi"><div class="kpi-label">Follow-ups</div><div class="kpi-value ${k.overdue?'bad':''}">${dash(k.overdue)} <span class="kpi-unit">overdue</span></div><div class="kpi-sub">${loading?'—':`${k.today} due today · <a class="link" href="#tasks">Open tasks</a>`}</div></div>
  </section>`;
  const meBtn=me()?`<div class="seg" role="group" aria-label="Filter deals"><button type="button" data-act="mine" data-v="0" aria-pressed="${!S.mine}">All deals</button><button type="button" data-act="mine" data-v="1" aria-pressed="${S.mine}">My deals</button></div>`:'';
  const tb=`<div class="toolbar"><h1 class="view-title">Pipeline</h1>${meBtn}<span class="spacer"></span>
    ${S.downloads?'<button class="btn btn-sm" type="button" data-act="export">Export CSV</button>':''}
    ${S.canWrite?'<button class="btn btn-sm" type="button" data-act="new" data-kind="deal">New deal</button>':''}</div>`;
  let emptyMsg='';
  if(!loading&&S.status==='ok'&&!all('deals').length){
    emptyMsg=`<div class="empty"><h2>Your pipeline is empty</h2><p>Deals appear here in columns by stage, from first lead to signed. Add a deal, then drag it right as it moves forward.</p>${S.canWrite?'<button class="btn btn-primary" type="button" data-act="new" data-kind="deal">Add your first deal</button>':''}</div>`;
  }else if(!loading&&S.q.trim()&&!shown.length){
    emptyMsg=`<div class="empty"><h2>No deals match “${esc(S.q.trim())}”</h2><p>Try a company or contact name, or clear the search.</p></div>`;
  }
  const cols=STAGES.map(s=>{
    let ds=shown.filter(d=>(STAGE[d.stage]?d.stage:'lead')===s.id);
    const total=sum(ds,d=>num(d.value));
    const closed=s.id==='won'||s.id==='lost';
    if(closed)ds.sort((a,b)=>(closedTime(b)||0)-(closedTime(a)||0));
    else ds.sort((a,b)=>(a.closeDate||'9999').localeCompare(b.closeDate||'9999'));
    const cap=closed?12:200;const extra=ds.length-cap;
    const body=loading?'<div class="col-empty">Loading…</div>':ds.length?ds.slice(0,cap).map(cardHTML).join('')+(extra>0?`<div class="col-more">+${extra} more</div>`:''):`<div class="col-empty">${S.canWrite?'Drop a deal here':'No deals'}</div>`;
    return `<section class="col" data-drop="${s.id}" style="--stage:var(${s.c})" aria-label="${s.name}">
      <header class="col-head"><span class="dot"></span><h2>${s.name}</h2><span class="col-count">${loading?'·':ds.length}</span><span class="col-p" title="Win probability">${Math.round(s.p*100)}%</span></header>
      <div class="col-sum"><span class="money">${loading?'—':fmtCompact(total)}</span>${loading?'':`<span class="wt">ARR${closed?'':` · ${fmtCompact(total*s.p)} weighted`}</span>`}</div>
      <div class="col-body">${body}</div>
      ${S.canWrite&&!closed?`<button class="btn btn-sm col-add" type="button" data-act="new" data-kind="deal" data-stage="${s.id}">+ Add deal</button>`:''}
    </section>`;
  }).join('');
  return kp+tb+emptyMsg+`<div class="board-scroll"><div class="board">${cols}</div></div>`;
}
function cardHTML(d){
  const co=company(d.companyId);const chips=[];const t=todayStr();
  let when='';
  if(isOpen(d)){
    if(d.closeDate&&d.closeDate<t)chips.push('<span class="chip chip-bad">Close date passed</span>');
    const idle=daysSince(lastTouch(d));if(idle!=null&&idle>=STALE_DAYS)chips.push(`<span class="chip chip-warn">${idle}d no activity</span>`);
    when=d.closeDate?'Closes '+fmtShort(d.closeDate):'No close date';
  }else{
    const ct=closedTime(d);when=isNaN(ct)?'':fmtShort(ymd(new Date(ct)));
  }
  const n=locs(d);
  return `<article class="card" id="card-${esc(d.id)}" data-open="deal" data-id="${esc(d.id)}" ${S.canWrite?'draggable="true"':''} tabindex="0">
    <div class="card-co">${esc(co?co.name:'No company')} · ${priced(d)?`${n} location${n===1?'':'s'}`:'locations not set'}</div>
    <h3 class="card-title">${esc(d.name||'Untitled deal')}</h3>
    ${chips.length?`<div class="card-chips">${chips.join('')}</div>`:''}
    <div class="card-meta"><span class="money">${fmtMoney(d.value)}</span><span class="when">${esc(when)}</span>${avatar(d.ownerId)}</div>
  </article>`;
}

/* ---------- tables ---------- */
function sortRows(rows,view,keys){
  const [k,dir]=S.sort[view];const f=keys[k]||keys.name;
  return rows.sort((a,b)=>{
    const x=f(a),y=f(b);
    const xe=x==null||x==='',ye=y==null||y==='';
    if(xe&&ye)return 0;if(xe)return 1;if(ye)return -1;
    return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),undefined,{sensitivity:'base'}))*dir;
  });
}
function th(view,key,label,cls){
  const [k,dir]=S.sort[view];const on=k===key;
  return `<th class="${cls||''}" aria-sort="${on?(dir>0?'ascending':'descending'):'none'}"><button type="button" data-act="sort" data-view="${view}" data-key="${key}">${label}<span aria-hidden="true">${on?(dir>0?'↑':'↓'):''}</span></button></th>`;
}
function viewToolbar(title,count,kind,label){
  return `<div class="toolbar"><h1 class="view-title">${title}</h1><span class="view-count">${count}</span><span class="spacer"></span>
    ${S.downloads?'<button class="btn btn-sm" type="button" data-act="export">Export CSV</button>':''}
    ${S.canWrite?`<button class="btn btn-sm" type="button" data-act="new" data-kind="${kind}">${label}</button>`:''}</div>`;
}
function emptyBlock(loading,anyAtAll,what,addKind,addLabel,desc){
  if(loading)return `<div class="empty"><p>Loading ${what}…</p></div>`;
  if(!anyAtAll)return `<div class="empty"><h2>No ${what} yet</h2><p>${desc}</p>${S.canWrite&&S.status==='ok'?`<button class="btn btn-primary" type="button" data-act="new" data-kind="${addKind}">${addLabel}</button>`:''}</div>`;
  return `<div class="empty"><h2>No ${what} match “${esc(S.q.trim())}”</h2><p>Try another name, email or tag.</p></div>`;
}
function viewContacts(){
  const loading=isLoading();
  const openDeals=c=>all('deals').filter(d=>d.contactId===c.id&&isOpen(d));

  rows=sortRows(rows,'contacts',{
    name:c=>(c.lastName||'')+' '+(c.firstName||''),company:c=>(company(c.companyId)||{}).name,

  });

      <td><div class="trunc">${co?esc(co.name):'<span class="muted">—</span>'}</div></td>
      <td><div class="trunc">${esc(c.email||'')}</div></td>
      <td class="mono" style="white-space:nowrap">${esc(c.phone||'')}</td>

      <td style="white-space:nowrap">${c.lastContactAt?`${esc(relTime(c.lastContactAt))}${ls!=null&&ls>=30?' <span class="chip chip-warn">cold</span>':''}`:'<span class="muted">Never</span>'}</td>
      <td>${avatar(c.ownerId)}</td></tr>`;

  return head+`<div class="table-wrap"><table><thead><tr>${th('contacts','name','Name')}${th('contacts','company','Company')}<th>Email</th><th>Phone</th>${th('contacts','value','Open ARR','num')}${th('contacts','last','Last contact')}${th('contacts','owner','Owner')}</tr></thead><tbody>${body}</tbody></table></div>`;
}

      <td class="num">${people||'<span class="muted">0</span>'}</td>
      <td class="num">${open.length?fmtMoney(sum(open,d=>num(d.value)))+` <span class="muted">(${open.length})</span>`:'<span class="muted">—</span>'}</td>
      <td class="num">${won.length?fmtMoney(sum(won,d=>num(d.value))):'<span class="muted">—</span>'}</td>
      <td>${avatar(c.ownerId)}</td></tr>`;
  }).join('');
  return head+`<div class="table-wrap"><table><thead><tr>${th('companies','name','Company')}${th('companies','industry','Industry')}<th>Size</th>${th('companies','people','Contacts','num')}${th('companies','open','Open ARR','num')}${th('companies','won','Signed ARR','num')}${th('companies','owner','Owner')}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- tasks ---------- */
function dueChip(a){
  if(a.done)return '<span class="chip chip-good">Done</span>';
  if(!a.dueAt)return '<span class="chip">No date</span>';
  const t=todayStr();
  if(a.dueAt<t)return `<span class="chip chip-bad">Overdue · ${esc(fmtDate(a.dueAt))}</span>`;
  if(a.dueAt===t)return '<span class="chip chip-warn">Due today</span>';
  if(a.dueAt===addDays(t,1))return '<span class="chip chip-accent">Tomorrow</span>';
  return `<span class="chip">${esc(fmtDate(a.dueAt))}</span>`;
}
function relLinks(a){
  const out=[];const d=deal(a.dealId),c=contact(a.contactId),co=company(a.companyId||(d&&d.companyId)||(c&&c.companyId));
  if(d)out.push(`<button class="link" type="button" data-act="open" data-kind="deal" data-id="${esc(d.id)}">${esc(d.name)}</button>`);
  if(c)out.push(`<button class="link" type="button" data-act="open" data-kind="contact" data-id="${esc(c.id)}">${esc(contactName(c))}</button>`);
  if(co&&!d)out.push(`<button class="link" type="button" data-act="open" data-kind="company" data-id="${esc(co.id)}">${esc(co.name)}</button>`);
  else if(co)out.push(`<span>${esc(co.name)}</span>`);
  return out.join('');
}
function viewTasks(){
  const loading=isLoading();const t=todayStr(),wk=addDays(t,7);
  const list=tasks().filter(a=>(!S.mine||a.ownerId===me())&&matches(a.subject,a.body,(deal(a.dealId)||{}).name,contactName(contact(a.contactId))));
  const open=list.filter(a=>!a.done).sort((a,b)=>(a.dueAt||'9999').localeCompare(b.dueAt||'9999'));
  const done=list.filter(a=>a.done).sort((a,b)=>String(b.doneAt||'').localeCompare(String(a.doneAt||'')));
  const groups=[
    ['Overdue',open.filter(a=>a.dueAt&&a.dueAt<t),'bad'],
    ['Today',open.filter(a=>a.dueAt===t)],
    ['Next 7 days',open.filter(a=>a.dueAt&&a.dueAt>t&&a.dueAt<=wk)],
    ['Later',open.filter(a=>a.dueAt&&a.dueAt>wk)],
    ['No due date',open.filter(a=>!a.dueAt)]
  ];
  const meBtn=me()?`<div class="seg" role="group" aria-label="Filter tasks"><button type="button" data-act="mine" data-v="0" aria-pressed="${!S.mine}">Everyone</button><button type="button" data-act="mine" data-v="1" aria-pressed="${S.mine}">Mine</button></div>`:'';
  const head=`<div class="toolbar"><h1 class="view-title">Tasks</h1><span class="view-count">${loading?'':open.length+' open'}</span>${meBtn}<span class="spacer"></span>
    ${S.downloads?'<button class="btn btn-sm" type="button" data-act="export">Export CSV</button>':''}
    ${S.canWrite?'<button class="btn btn-sm" type="button" data-act="new" data-kind="task">New task</button>':''}</div>`;
  if(loading)return head+'<div class="empty"><p>Loading tasks…</p></div>';
  if(!list.length)return head+(tasks().length?`<div class="empty"><h2>No tasks match</h2><p>Try another search${S.mine?', or show everyone’s tasks':''}.</p></div>`:`<div class="empty"><h2>No follow-ups scheduled</h2><p>Tasks keep deals moving: a call to return, a proposal to send. Add one here or from any deal or contact.</p>${S.canWrite&&S.status==='ok'?'<button class="btn btn-primary" type="button" data-act="new" data-kind="task">Add a task</button>':''}</div>`);
  const row=a=>`<li class="task-row ${a.done?'is-done':''}">
      <input type="checkbox" id="tk-${esc(a.id)}" data-toggle-task="${esc(a.id)}" ${a.done?'checked':''} ${S.canWrite?'':'disabled'} aria-label="Mark “${esc(a.subject)}” ${a.done?'not done':'done'}">
      <div style="min-width:0">${S.canWrite?`<button class="task-subj" type="button" data-act="edit" data-kind="task" data-id="${esc(a.id)}">${esc(a.subject||'Untitled task')}</button>`:`<span class="task-subj">${esc(a.subject||'Untitled task')}</span>`}
        <div class="task-rel">${relLinks(a)}</div></div>
      ${dueChip(a)}${avatar(a.ownerId)}</li>`;
  let html=groups.filter(g=>g[1].length).map(g=>`<section><h2 class="group-h ${g[2]||''}">${g[0]} <span class="n">${g[1].length}</span></h2><ul class="task-list">${g[1].map(row).join('')}</ul></section>`).join('');
  if(!open.length)html+=`<div class="empty" style="margin:0"><h2>All caught up</h2><p>No open follow-ups${S.mine?' assigned to you':''}.</p></div>`;
  if(done.length){
    const shown=S.showDone?done:done.slice(0,5);
    html+=`<section><h2 class="group-h">Completed <span class="n">${done.length}</span></h2><ul class="task-list">${shown.map(row).join('')}</ul>${done.length>5?`<p style="margin:8px 0 0"><button class="link" type="button" data-act="show-done">${S.showDone?'Show fewer':'Show all '+done.length+' completed'}</button></p>`:''}</section>`;
  }
  return head+`<div class="groups">${html}</div>`;
}

/* ---------- drawer ---------- */
function openDrawer(kind,id,push){
  if(push&&S.drawer&&!(S.drawer.kind===kind&&S.drawer.id===id))S.dstack.push(S.drawer);else if(!push)S.dstack=[];
  const was=!$('#drawer').hidden;
  S.drawer={kind,id};
  $('#drawer').hidden=false;$('#drawer-scrim').hidden=false;
  buildComposer();renderDrawer();
  $('#drawer-scroll').scrollTop=0;
  if(!was){S.lastFocus=document.activeElement;$('#drawer-close').focus();}
}
function closeDrawer(){
  S.drawer=null;S.dstack=[];
  $('#drawer').hidden=true;$('#drawer-scrim').hidden=true;
  if(S.lastFocus&&document.contains(S.lastFocus))S.lastFocus.focus({preventScroll:true});
}
function backDrawer(){
  const prev=S.dstack.pop();if(!prev)return;
  S.drawer=prev;buildComposer();renderDrawer();$('#drawer-scroll').scrollTop=0;
}
function renderDrawer(){
  const {kind,id}=S.drawer;const rec=S.data[COLL[kind]].get(id);
  if(!rec){if(allLoaded()){if(S.dstack.length)backDrawer();else closeDrawer();}return;}
  $('#drawer-back').hidden=!S.dstack.length;
  $('#drawer-kind').textContent=LABEL[kind]+(rec.sample?' · Example':'');
  $('#drawer-body').innerHTML=kind==='deal'?drDeal(rec):kind==='contact'?drContact(rec):drCompany(rec);
}
function openLink(kind,rec,label){
  if(!rec)return '<span class="muted">—</span>';
  return `<button class="link" type="button" data-act="open" data-kind="${kind}" data-id="${esc(rec.id)}">${esc(label)}</button>`;
}
function editButtons(kind,id,extra){
  if(!S.canWrite)return '';
  return `<div class="dr-actions"><button class="btn btn-sm" type="button" data-act="edit" data-kind="${kind}" data-id="${esc(id)}">Edit</button>${extra||''}<button class="btn btn-sm btn-danger" type="button" data-act="delete" data-kind="${kind}" data-id="${esc(id)}">Delete</button></div>`;
}
function stepper(d){
  const cur=OPEN.indexOf(d.stage);const closed=d.stage==='won'||d.stage==='lost';
  const steps=OPEN.map((sid,i)=>{
    const s=STAGE[sid];const on=closed||i<=cur;
    const c=d.stage==='won'?'var(--s-won)':d.stage==='lost'?'var(--s-lost)':`var(${s.c})`;
    const attrs=S.canWrite?`data-act="stage" data-id="${esc(d.id)}" data-stage="${sid}"`:'disabled';
    return `<button type="button" class="step ${on?'on':''} ${sid===d.stage?'cur':''}" style="--c:${c}" ${attrs} aria-pressed="${sid===d.stage}" title="Move to ${s.name}"><span class="step-bar"></span><span class="step-l">${s.name}</span><span class="step-p">${Math.round(s.p*100)}%</span></button>`;
  }).join('');
  let out='';
  if(d.stage==='won')out+='<span class="chip chip-good">Won</span>';
  if(d.stage==='lost')out+='<span class="chip">Lost</span>';
  if(S.canWrite){
    if(d.stage!=='won')out+=`<button class="btn btn-sm" type="button" data-act="stage" data-id="${esc(d.id)}" data-stage="won">Mark won</button>`;
    if(d.stage!=='lost')out+=`<button class="btn btn-sm" type="button" data-act="stage" data-id="${esc(d.id)}" data-stage="lost">Mark lost</button>`;
  }
  return `<div class="stage-box"><div class="stepper">${steps}</div>${out?`<div class="outcome">${out}</div>`:''}</div>`;
}
function drDeal(d){
  const st=stageOf(d);const co=company(d.companyId),ct=contact(d.contactId);const t=todayStr();
  const inStage=daysSince(d.stageChangedAt||d.createdAt);
  const closeChip=isOpen(d)&&d.closeDate&&d.closeDate<t?' <span class="chip chip-bad">Passed</span>':'';
  const idle=daysSince(lastTouch(d));
  const acts=all('activities').filter(a=>a.dealId===d.id);
  return `<div class="dr-eyebrow">${co?esc(co.name):'No company'}</div>
    <h2 class="dr-title">${esc(d.name||'Untitled deal')}</h2>
    ${stepper(d)}
    <dl class="facts">
      <dt>ARR</dt><dd class="mono">${fmtMoney(d.value)}</dd>
      <dt>Locations</dt>${priced(d)
        ?`<dd>${locs(d)} × <span class="mono">${fmtPrice(effPrice(d))}</span>/month${Math.abs(effPrice(d)-priceFor(d.closeDate))>0.005?`<span class="muted">list price ${fmtMoney(priceFor(d.closeDate))}</span>`:''}</dd>`
        :`<dd><span class="chip chip-warn">Not set</span><span class="muted">Edit the deal to price it per location.</span></dd>`}
      <dt>Setup fee</dt><dd><span class="mono">${fmtMoney(d.setupFee!=null&&d.setupFee!==''?d.setupFee:setupFee())}</span><span class="muted">one-time, not in ARR</span></dd>
      <dt>Weighted</dt><dd><span class="mono">${fmtMoney(num(d.value)*st.p)}</span><span class="muted">at ${Math.round(st.p*100)}%</span></dd>
      <dt>${isOpen(d)?'Expected close':'Closed'}</dt><dd>${isOpen(d)?(d.closeDate?esc(fmtDate(d.closeDate))+closeChip:'<span class="muted">Not set</span>'):esc(fmtDate(isoToYmd(d.closedAt)||d.closeDate)||'—')}</dd>
      ${d.stage==='won'?`<dt>Billing starts</dt><dd>${d.closeDate?esc(fmtDate(d.closeDate))+(d.closeDate>t?'<span class="muted">not billing yet</span>':''):'<span class="muted">Not set</span>'}</dd>`:''}
      <dt>Company</dt><dd>${openLink('company',co,co&&co.name)}</dd>
      <dt>Contact</dt><dd>${openLink('contact',ct,contactName(ct))}</dd>
      <dt>Owner</dt><dd>${person(d.ownerId)}</dd>
      ${isOpen(d)?`<dt>In stage</dt><dd>${inStage==null?'—':inStage+' day'+(inStage===1?'':'s')}${idle!=null&&idle>=STALE_DAYS?` <span class="chip chip-warn">${idle}d no activity</span>`:''}</dd>`:''}
    </dl>
    ${d.notes?`<div class="notes">${esc(d.notes)}</div>`:''}
    ${editButtons('deal',d.id)}
    <h3 class="dr-h">Activity</h3>${timeline(acts,'deal')}`;

function copyable(v){
  if(!v)return '<span class="muted">—</span>';
  return `<span class="copyable"><span>${esc(v)}</span><button class="copy-btn" type="button" data-act="copy" data-copy="${esc(v)}">Copy</button></span>`;

function miniDeals(ds){

}
function drContact(c){
  const co=company(c.companyId);

  return `<div class="dr-eyebrow">${esc(c.title||'')}${c.title&&co?' at ':''}${co?openLink('company',co,co.name):''}</div>

      <dt>Owner</dt><dd>${person(c.ownerId)}</dd>
      ${tags.length?`<dt>Tags</dt><dd>${tags.map(x=>`<span class="chip chip-accent">${esc(x)}</span>`).join('')}</dd>`:''}

function safeUrl(u){
  u=String(u||'').trim();if(!u)return '';
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:'';}catch(e){return '';}
}
function drCompany(c){
  const ds=all('deals').filter(d=>d.companyId===c.id);
  const people=all('contacts').filter(x=>x.companyId===c.id).sort((a,b)=>contactName(a).localeCompare(contactName(b)));
  const dIds=new Set(ds.map(d=>d.id)),pIds=new Set(people.map(p=>p.id));
  const acts=all('activities').filter(a=>a.companyId===c.id||dIds.has(a.dealId)||pIds.has(a.contactId));
  const open=ds.filter(isOpen),won=ds.filter(d=>d.stage==='won');
  const url=safeUrl(c.website);
  const add=S.canWrite?`<button class="btn btn-sm" type="button" data-act="new" data-kind="contact" data-company="${esc(c.id)}">Add contact</button><button class="btn btn-sm" type="button" data-act="new" data-kind="deal" data-company="${esc(c.id)}">New deal</button>`:'';
  return `<div class="dr-eyebrow">${esc([c.industry,c.size?c.size+' employees':''].filter(Boolean).join(' · '))}</div>
    <h2 class="dr-title">${esc(c.name||'Unnamed company')}</h2>
    <dl class="facts">
      <dt>Open ARR</dt><dd class="mono">${fmtMoney(sum(open,d=>num(d.value)))} <span class="muted">${open.length} open</span></dd>
      <dt>Signed ARR</dt><dd class="mono">${fmtMoney(sum(won,d=>num(d.value)))}</dd>
      <dt>Website</dt><dd>${url?`<a class="link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(c.website)}</a>`:'<span class="muted">—</span>'}</dd>
      <dt>Phone</dt><dd>${copyable(c.phone)}</dd>
      <dt>Address</dt><dd>${c.address?esc(c.address):'<span class="muted">—</span>'}</dd>
      <dt>Owner</dt><dd>${person(c.ownerId)}</dd>
    </dl>
    ${c.notes?`<div class="notes">${esc(c.notes)}</div>`:''}
    ${editButtons('company',c.id,add)}
    <h3 class="dr-h">Contacts</h3>${people.length?`<ul class="mini">${people.map(p=>`<li><button class="mini-row" type="button" data-act="open" data-kind="contact" data-id="${esc(p.id)}"><span class="av av-sm">${esc(initials(contactName(p)))}</span><span class="mini-name">${esc(contactName(p))}</span><span class="muted" style="font-size:12.5px">${esc(p.title||'')}</span></button></li>`).join('')}</ul>`:'<p class="mini-empty">No contacts yet.</p>'}
    <h3 class="dr-h">Deals</h3>${miniDeals(ds)}
    <h3 class="dr-h">Activity</h3>${timeline(acts,'company')}`;
}
function timeline(acts,ctx){
  if(!acts.length)return `<p class="mini-empty">Nothing logged yet.${S.canWrite?' Use the box below to add a note, call, email, meeting or task.':''}</p>`;
  acts=acts.slice().sort((a,b)=>{
    const ao=a.type==='task'&&!a.done,bo=b.type==='task'&&!b.done;
    if(ao!==bo)return ao?-1:1;
    if(ao&&bo)return (a.dueAt||'9999').localeCompare(b.dueAt||'9999');
    return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
  });
  return `<ul class="tl">${acts.map(a=>{
    const isTask=a.type==='task';const who=a.createdBy?personName(a.createdBy):'';
    let rel='';
    if(ctx==='company'||ctx==='contact'){const d=deal(a.dealId);if(d&&ctx!=='deal')rel=`<div class="tl-rel">on ${openLink('deal',d,d.name)}</div>`;}
    if(ctx==='deal'||ctx==='company'){const c=contact(a.contactId);if(c&&ctx==='company'&&!rel)rel=`<div class="tl-rel">with ${openLink('contact',c,contactName(c))}</div>`;}
    const main=isTask
      ?`<label class="tl-task"><input type="checkbox" id="tl-${esc(a.id)}" data-toggle-task="${esc(a.id)}" ${a.done?'checked':''} ${S.canWrite?'':'disabled'}><span>${esc(a.subject||'Untitled task')}</span></label><div class="tl-meta">${dueChip(a)}${a.ownerId?`<span class="chip">${esc(personName(a.ownerId))}</span>`:''}</div>`
      :`<p class="tl-body">${esc(a.body||a.subject||'')}</p>`;
    return `<li class="tl-item ${isTask&&a.done?'is-done':''}">
      <span class="tl-ico ${isTask?'t-task':''}">${ICON[a.type]||ICON.note}</span>
      <div style="min-width:0"><div class="tl-head"><span class="tl-type">${ACT[a.type]||'Note'}</span><span class="tl-time">${esc(relTime(a.createdAt))}${who&&a.createdBy?' · '+esc(who):''}</span></div>${main}${rel}</div>
      ${S.canWrite&&a.type!=='stage'?`<button class="icon-btn" type="button" data-act="del-activity" data-id="${esc(a.id)}" aria-label="Delete this ${esc((ACT[a.type]||'note').toLowerCase())}" title="Delete">×</button>`:'<span></span>'}
    </li>`;}).join('')}</ul>`;
}

/* ---------- composer ---------- */
const CT=[['note','Note','Add a note…','Save note'],['call','Call','What was discussed on the call?','Log call'],['email','Email','Summarize the email…','Log email'],['meeting','Meeting','Who attended, what was decided?','Log meeting'],['task','Task','What needs to happen next?','Add task']];
function buildComposer(){
  const box=$('#drawer-composer');
  if(!S.canWrite||!S.drawer){box.innerHTML='';return;}
  S.ctype='note';
  box.innerHTML=`<form class="composer" id="composer" novalidate>
    <div class="seg" role="group" aria-label="Activity type">${CT.map(c=>`<button type="button" data-ctype="${c[0]}" aria-pressed="${c[0]==='note'}">${c[1]}</button>`).join('')}</div>
    <textarea class="input" id="c-body" rows="2" placeholder="${CT[0][2]}" aria-label="Activity details"></textarea>
    <div class="composer-foot"><input class="input" type="date" id="c-due" aria-label="Due date" hidden><span class="spacer"></span><button class="btn btn-primary btn-sm" type="submit" id="c-save">${CT[0][3]}</button></div>
  </form>`;
  const f=$('#composer');
  f.querySelectorAll('[data-ctype]').forEach(b=>b.addEventListener('click',()=>{
    S.ctype=b.dataset.ctype;const c=CT.find(x=>x[0]===S.ctype);
    f.querySelectorAll('[data-ctype]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#c-body').placeholder=c[2];$('#c-save').textContent=c[3];
    const due=$('#c-due');due.hidden=S.ctype!=='task';if(S.ctype==='task'&&!due.value)due.value=addDays(todayStr(),1);
    $('#c-body').focus();
  }));
  $('#c-body').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();f.requestSubmit();}});
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=$('#c-save');if(btn.disabled)return;
    const text=$('#c-body').value.trim();if(!text){$('#c-body').focus();return;}
    const {kind,id}=S.drawer;const rec=S.data[COLL[kind]].get(id);if(!rec)return;
    const links={dealId:null,contactId:null,companyId:null};
    if(kind==='deal'){links.dealId=id;links.contactId=rec.contactId||null;links.companyId=rec.companyId||null;}
    if(kind==='contact'){links.contactId=id;links.companyId=rec.companyId||null;}
    if(kind==='company'){links.companyId=id;}
    const now=iso();const type=S.ctype;
    const a=Object.assign({type,subject:'',body:text,ownerId:me(),createdBy:me(),createdAt:now},links);
    if(type==='task'){a.subject=text.split('\n')[0].slice(0,160);a.body=text.includes('\n')?text:'';a.dueAt=$('#c-due').value||null;a.done=false;a.doneAt=null;}
    btn.disabled=true;
    const ok=await create('activities',a);
    if(ok){
      $('#c-body').value='';
      if(type!=='task'){
        if(links.dealId)await patch('deals',links.dealId,{lastActivityAt:now});
        if(links.contactId&&type!=='note')await patch('contacts',links.contactId,{lastContactAt:now});
      }
      toast(type==='task'?'Task added':ACT[type]+' logged');
    }
    btn.disabled=false;
  });
}

function wireOwner(){

    if(my!==seq)return;

    if(me()&&(!ql||norm(S.me.name).includes(ql)||'you'.startsWith(ql)||'me'===ql))opts.push({id:me(),name:S.me.name||'You',av:S.me.avatarUrl,you:true});

    list.hidden=false;inp.setAttribute('aria-expanded','true');

function formErr(msg,focusId){const el=$('#form-err');el.textContent=msg;el.hidden=false;if(focusId){const f=document.getElementById(focusId);if(f)f.focus();}return null;}
async function resolveCompany(){
  const v=val('f-company');if(v!=='__new')return {id:v||null};
  const n=val('f-newco');if(!n)return {err:true,msg:'Enter the new company’s name, or pick an existing one.'};

  return cid?{id:cid}:{err:true,msg:''};
}
const SAVE={
  async deal(id,old){
    const name=val('f-name');if(!name)return formErr('Give the deal a name.','f-name');
    const locsRaw=val('f-locs');const locations=Math.round(Number(locsRaw));
    if(!locsRaw||!isFinite(locations)||locations<1)return formErr('Enter how many locations, 1 or more.','f-locs');
    const stage=val('f-stage')||'lead';
    const closeDate=val('f-close')||(stage==='won'?todayStr():null);
    const value=val('f-value')?parseMoney(val('f-value')):autoArr(locations,closeDate);
    if(value===null)return formErr('Enter ARR as a number, like 4788.','f-value');
    const setupFee=parseMoney(val('f-setup'));if(setupFee===null)return formErr('Enter the setup fee as a number, like 750.','f-setup');
    const co=await resolveCompany();if(co.err)return co.msg?formErr(co.msg,'f-newco'):null;
    const now=iso();
    const rec={name,companyId:co.id,contactId:val('f-contact')||null,locations,monthlyPrice:Math.round(value/(locations*12)*100)/100,listPrice:priceFor(closeDate),value,setupFee,stage,closeDate,ownerId:val('f-owner-id')||null,notes:val('f-notes'),updatedAt:now};
    const closed=stage==='won'||stage==='lost';
    if(!id){
      Object.assign(rec,{createdAt:now,createdBy:me(),stageChangedAt:now,lastActivityAt:now,closedAt:closed?now:null});
      const nid=await create('deals',rec);if(nid)toast('Deal created');return nid;
    }
    if(old.stage!==stage){
      rec.stageChangedAt=now;rec.closedAt=closed?now:null;
      if(stage==='won')rec.expectedCloseDate=old.closeDate||null;
      else if(old.stage==='won')rec.expectedCloseDate=null;
    }
    const ok=await patch('deals',id,rec);
    if(ok&&old.stage!==stage)await create('activities',{type:'stage',subject:'Moved to '+STAGE[stage].name,body:'',dealId:id,contactId:rec.contactId,companyId:rec.companyId,ownerId:me(),createdBy:me(),createdAt:now});
    if(ok)toast('Deal saved');return ok?id:null;
  },
  async contact(id){
    const firstName=val('f-first'),lastName=val('f-last'),email=val('f-email');
    if(!firstName&&!lastName&&!email)return formErr('Add a name or an email address.','f-first');
    if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return formErr('That email address looks incomplete.','f-email');
    const co=await resolveCompany();if(co.err)return co.msg?formErr(co.msg,'f-newco'):null;
    const now=iso();
    const rec={firstName,lastName,title:val('f-title'),companyId:co.id,email,phone:val('f-phone'),tags:val('f-tags').split(',').map(s=>s.trim()).filter(Boolean).slice(0,12),ownerId:val('f-owner-id')||null,notes:val('f-notes'),updatedAt:now};
    if(!id){rec.createdAt=now;rec.createdBy=me();rec.lastContactAt=null;const nid=await create('contacts',rec);if(nid)toast('Contact added');return nid;}
    const ok=await patch('contacts',id,rec);if(ok)toast('Contact saved');return ok?id:null;
  },
  async company(id){
    const name=val('f-name');if(!name)return formErr('Give the company a name.','f-name');
    const now=iso();
    const rec={name,industry:val('f-industry'),size:val('f-size'),website:val('f-website'),phone:val('f-phone'),address:val('f-address'),ownerId:val('f-owner-id')||null,notes:val('f-notes'),updatedAt:now};
    if(!id){rec.createdAt=now;rec.createdBy=me();const nid=await create('companies',rec);if(nid)toast('Company added');return nid;}
    const ok=await patch('companies',id,rec);if(ok)toast('Company saved');return ok?id:null;
  },
  async task(id,old){
    const subject=val('f-subject');if(!subject)return formErr('Describe the task.','f-subject');
    const dealId=val('f-deal')||null,contactId=val('f-contact')||null;
    const d=deal(dealId),c=contact(contactId);
    const rec={subject,body:val('f-body'),dueAt:val('f-due')||null,dealId,contactId:contactId||(d&&d.contactId)||null,companyId:(d&&d.companyId)||(c&&c.companyId)||null,ownerId:val('f-owner-id')||null};
    if(!id){Object.assign(rec,{type:'task',done:false,doneAt:null,createdBy:me(),createdAt:iso()});const nid=await create('activities',rec);if(nid)toast('Task added');return nid;}
    const done=!!($('#f-done')&&$('#f-done').checked);rec.done=done;if(done!==!!old.done)rec.doneAt=done?iso():null;
    const ok=await patch('activities',id,rec);if(ok)toast('Task saved');return ok?id:null;
  }
};

    company:'Its contacts, deals and activity stay, without a company attached. This can’t be undone.',

function confirmClearSamples(){

/* ---------- export ---------- */
function toCSV(rows){
  return rows.map(r=>r.map(v=>{
    if(typeof v==='number')return String(v);
    let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;
    return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(',')).join('\r\n');
}
function csvFor(view){
  if(view==='contacts')return {name:'contacts',rows:[['First name','Last name','Title','Company','Email','Phone','Tags','Last contact','Owner']].concat(all('contacts').map(c=>[c.firstName||'',c.lastName||'',c.title||'',(company(c.companyId)||{}).name||'',c.email||'',c.phone||'',(c.tags||[]).join('; '),isoToYmd(c.lastContactAt),c.ownerId?personName(c.ownerId):'']))};
  if(view==='companies')return {name:'companies',rows:[['Company','Industry','Employees','Website','Phone','Address','Contacts','Open ARR','Signed ARR','Owner']].concat(all('companies').map(c=>{const ds=all('deals').filter(d=>d.companyId===c.id);return [c.name||'',c.industry||'',c.size||'',c.website||'',c.phone||'',c.address||'',all('contacts').filter(x=>x.companyId===c.id).length,sum(ds.filter(isOpen),d=>num(d.value)),sum(ds.filter(d=>d.stage==='won'),d=>num(d.value)),c.ownerId?personName(c.ownerId):''];}))};
  if(view==='tasks')return {name:'tasks',rows:[['Task','Due','Done','Deal','Contact','Company','Owner','Details']].concat(tasks().map(a=>[a.subject||'',a.dueAt||'',a.done?'Yes':'No',(deal(a.dealId)||{}).name||'',contactName(contact(a.contactId)),(company(a.companyId)||{}).name||'',a.ownerId?personName(a.ownerId):'',a.body||'']))};
  return {name:'deals',rows:[['Deal','Company','Contact','Stage','Locations','Price per location per month','List price per location per month','ARR','Setup fee (one-time)','Probability','Weighted ARR','Expected close','Closed','Owner','Created']].concat(all('deals').map(d=>{const s=stageOf(d);return [d.name||'',(company(d.companyId)||{}).name||'',contactName(contact(d.contactId)),s.name,priced(d)?locs(d):'',priced(d)?effPrice(d):'',priceFor(d.closeDate),num(d.value),d.setupFee!=null&&d.setupFee!==''?num(d.setupFee):setupFee(),s.p,Math.round(num(d.value)*s.p),d.closeDate||'',isoToYmd(d.closedAt),d.ownerId?personName(d.ownerId):'',isoToYmd(d.createdAt)];}))};
}
async function exportCSV(){
  if(!S.downloads)return;
  const v=VIEW_BY_ID[S.view];let out=null;
  try{out=v&&v.csv?v.csv():csvFor(S.view);}catch(err){console.error(err);}
  if(!out||!Array.isArray(out.rows)){toast('This tab has nothing to export.','bad');return;}
  const {name,rows}=out;
  try{await S.downloads.save({filename:`dealbook-${name}-${todayStr()}.csv`,data:toCSV(rows)});toast('CSV exported');}
  catch(e){const c=e&&e.code;if(c==='declined')return;toast(c==='rate_limited'?'A save prompt is already open.':'This export couldn’t be saved here.','bad');}
}

let profSig='';let profBusy=false;
async function refreshProfiles(){
  if(!S.user||profBusy)return;
  const ids=new Set();if(me())ids.add(me());
  COLS.forEach(c=>S.data[c].forEach(r=>{if(r.ownerId)ids.add(r.ownerId);if(r.createdBy)ids.add(r.createdBy);}));
  const list=[...ids];if(!list.length)return;
  profBusy=true;
  try{
    const ps=await S.user.profiles(list);
    S.profiles=ps||{};
    const sig=list.map(id=>id+':'+((ps[id]&&ps[id].name)||'')+':'+((ps[id]&&ps[id].avatarUrl)||'').length).join('|');
    if(sig!==profSig){profSig=sig;scheduleRender();}
  }catch(e){}finally{profBusy=false;}
}
